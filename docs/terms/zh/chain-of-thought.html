 thought like this: here are two sets of beliefs that contradict one another; they cannot both be true, so one of them must be false; but if one is false the other may be false also, so there may be no true belief.", "title": "Critical Innocence and Straight Reading", "year": 1985, "date": "1985-01-01", "url": "https://doi.org/10.2307/468986", "authors": "Peter Caws", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E9", "text": "This article presents this chain of thought and explains the essential role of special and general relativity in the GPS.", "title": "Relativistic effects in the global positioning system", "year": 1988, "date": "1988-01-01", "url": "https://openalex.org/W293809360", "authors": "Neil Ashby", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S1"}, {"id": "E10", "text": "A narratological examination of the Gospel of Mark reveals further links in the Lohmeyer-Lightfoot-Marxsen chain of thought, al­ though at times correctives are suggested. 1.", "title": "ruimtes d ie Markusevangelie: 'n Kontinuering van d ie Lohmeyer- Lightfoot-Marxse n", "year": 1988, "date": "1988-01-01", "url": "https://openalex.org/W2340920152", "authors": "Ernest Van Eck", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E11", "text": "On one hand, the language of lyric poetry, even in its self-enclosed non-referentiality, gives rise to a chain of thought by which the poet is required to accept his finite, self-consciously fragmented condition as the basis for his art, which means he must reconceive his work in terms of mimetic rather than logical or structural considerations. “Die Gestalt erledigt das Problem” (P4 144).", "title": "Death and the fools", "year": 1988, "date": "1988-06-02", "url": "https://doi.org/10.1017/cbo9780511735660.005", "authors": "Benjamin K. Bennett", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E12", "text": "Thus shifts in argument. were found to be more difficult to comprehend than a continuous chain of thought.", "title": "Redundancy and the cohesion doze", "year": 1990, "date": "1990-02-01", "url": "https://doi.org/10.1111/j.1467-9817.1990.tb00320.x", "authors": "Marsha Bensoussan", "fromTitle": false, "field": "Psychology", "inSet": 0, "sense": "S1"}, {"id": "E13", "text": "The achievements of today are the cumulative results of unknown numbers of workers providing an unbroken chain of thought through time.", "title": "Geographers: Biobibliographical Studies, 1977-2000", "year": 2000, "date": "2000-04-01", "url": "https://doi.org/10.1111/j.1931-0846.2000.tb00335.x", "authors": "Patrick Hamilton Armstrong et al.", "fromTitle": false, "field": "Social Sciences", "inSet": 0, "sense": "S1"}, {"id": "E14", "text": "A piece of advice for the taxonomists amongst the readers of this book, I recommend you refer to Harris (1995) to further understand his concepts and chain of thought for the true shrikes.", "title": "Shrikes and Bush-Shrikes: Including Wood-Shrikes, Helmet-Shrikes, Flycatcher-Shrikes, Philentomas, Batises and Wattle-Eyes T. Harris K. Franklin", "year": 2003, "date": "2003-01-01", "url": "https://doi.org/10.1093/auk/120.1.239", "authors": "Reuven Yosef", "fromTitle": false, "field": "Environmental Science", "inSet": 0, "sense": "S1"}, {"id": "E15", "text": "To do the office work well, firstly, we should define the task, straighten out the work chain of thought, and carry out the work creatively; secondly, we should grasp the major contradictions, stress the main points and enhance the work level; thirdly, we should improve the quality of the staff in order to meet the work needs under the new circumstances.", "title": "The Thought on Enhancing the Office Work of the Colleges and Universities under the New Circumstances", "year": 2003, "date": "2003-01-01", "url": "https://openalex.org/W2359639092", "authors": "Guo Peng", "fromTitle": false, "field": "Business, Management and Accounting", "inSet": 0, "sense": "S1"}, {"id": "E16", "text": "We introduced the various conclusions involved in our conceptual framework in detail in Chapter 3, Chapter 7, and Chapter 10 to enable readers to see the chain of thought in the same sequence in which it was developed.", "title": "Memory and Whole-Brain Work: Draft of a Theory Based on EEG Oscillations", "year": 2004, "date": "2004-06-23", "url": "https://doi.org/10.1201/9780203298732-21", "authors": "Erol Basar", "fromTitle": false, "field": "Neuroscience", "inSet": 0, "sense": "S1"}, {"id": "E17", "text": "Chain of Thought in Dreams?'2", "title": "Artists and the dream in nineteenth-century Paris: Towards a prehistory of surrealism STEFANIE HERAEUS (transl. Deborah Laurie Cohen)", "year": 2004, "date": "2004-08-02", "url": "https://doi.org/10.4324/9780203646977-12", "authors": "Stefanie Heraeus", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E18", "text": "He interrupts his chain of thought briefly to talk about a 15 year-old with melanoma on whom he is scheduled to operate in the morning: “Melanoma is hitting younger and younger people,” he said. “We really have to keep up the educational efforts.” Biggest Challenge: ASCO's Big Growth His biggest challenge, he said, is managing “the stunning growth” of an organization that has added 2,000 new members each year for the past five years. “We have to…", "title": "Varied Roles for ASCO EVP Charles M. Balch, MD", "year": 2005, "date": "2005-09-25", "url": "https://doi.org/10.1097/01.cot.0000294692.38669.18", "authors": "Charlene Laino", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S1"}, {"id": "E19", "text": "One of the most prominent stylistic means applied by Woolf is her ‘train of thought’, linking one reflection to another like wagons in a railway convoy or like loops in a chain (therefore also sometimes referred to as ‘chain of thought’ in dictionaries).", "title": "Chained Thoughts Broken by Chains of Thought : An Analysis of the Narrative Style Used in Virginia Woolf's A Room of One's Own", "year": 2006, "date": "2006-01-01", "url": "https://openalex.org/W582236113", "authors": "Ellen Johansson", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E20", "text": "Yet in spite of this arguable \"missing link,\" we can re-construct some of Tolkien's chain of thought from the extant materials.", "title": "The Homecoming of Beorhtnoth: Philology and the Literary Muse", "year": 2007, "date": "2007-01-01", "url": "https://doi.org/10.1353/tks.2007.0021", "authors": "Thomas M. Honegger", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E21", "text": "An important link in that chain of thought is the work of Jean-Baptiste Say. 1 Austrians have recognized Say’s contributions to economics in general and his link to the Austrian School of thought in particular, 2 particularly his work in the areas of methodology, entrepreneurship, monetary theory, and the theory of value. 3 Say is particularly famous for his Law of Markets, arguing that the problem that limits wealth is not underconsumption (com…", "title": "Jean-Baptiste Say, The Father of Austrian Public Finance: Views on Taxation", "year": 2007, "date": "2007-06-14", "url": "https://doi.org/10.1007/s12113-007-9004-4", "authors": "Mark Brandly", "fromTitle": false, "field": "Economics, Econometrics and Finance", "inSet": 0, "sense": "S1"}, {"id": "E22", "text": "We explore how generating a chain of thought -- a series of intermediate reasoning steps -- significantly improves the ability of large language models to perform complex reasoning.", "title": "Chain-Of-Thought Prompting Elicits Reasoning in Large Language Models", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.52202/068431-1800", "authors": "Jason Wei et al.", "fromTitle": false, "field": "Computer Science", "inSet": 132, "sense": "S2"}, {"id": "E23", "text": "Notably, chain of thought (CoT) prompting, a recent technique for eliciting complex multi-step reasoning through step-by-step answer examples, achieved the state-of-the-art performances in arithmetics and symbolic reasoning, difficult system-2 tasks that do not follow the standard scaling laws for LLMs.", "title": "Large Language Models Are Zero-Shot Reasoners", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.52202/068431-1613", "authors": "Takeshi Kojima et al.", "fromTitle": false, "field": "Computer Science", "inSet": 62, "sense": "S2"}, {"id": "E24", "text": "When answering a question, humans utilize the information available across different modalities to synthesize a consistent and complete chain of thought (CoT).", "title": "Learn to Explain: Multimodal Reasoning Via Thought Chains for Science Question Answering", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.52202/068431-0182", "authors": "Pan Lu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 16, "sense": "S3"}, {"id": "E25", "text": "Chain-of-thought prompting combined with pre-trained large language models has achieved encouraging results on complex reasoning tasks.", "title": "Self-Consistency Improves Chain of Thought Reasoning in Language Models", "year": 2022, "date": "2022-03-21", "url": "https://doi.org/10.48550/arxiv.2203.11171", "authors": "Xuezhi Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 55, "sense": "S2"}, {"id": "E26", "text": "UL2 20B also works well with chain-of-thought prompting and reasoning, making it an appealing choice for research into reasoning at a small to medium scale of 20B parameters.", "title": "UL2: Unifying Language Learning Paradigms", "year": 2022, "date": "2022-05-10", "url": "https://doi.org/10.48550/arxiv.2205.05131", "authors": "Yi Tay et al.", "fromTitle": false, "field": "Computer Science", "inSet": 14, "sense": "S2"}, {"id": "E27", "text": "Chain-of-thought prompting has demonstrated remarkable performance on various natural language reasoning tasks.", "title": "Least-to-Most Prompting Enables Complex Reasoning in Large Language Models", "year": 2022, "date": "2022-05-21", "url": "https://doi.org/10.48550/arxiv.2205.10625", "authors": "Denny Zhou et al.", "fromTitle": false, "field": "Computer Science", "inSet": 34, "sense": "S2"}, {"id": "E28", "text": "The latest GPT-3 language model pretrained on text automatically solves only 18.8% of these university questions using zero-shot learning and 30.8% using few-shot learning and the most recent chain of thought prompting.", "title": "A neural network solves, explains, and generates university math problems by program synthesis and few-shot learning at human level", "year": 2022, "date": "2022-08-02", "url": "https://doi.org/10.1073/pnas.2123433119", "authors": "Iddo Drori et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S2"}, {"id": "E29", "text": "Large language models (LLMs) have shown remarkable reasoning capabilities given chain-of-thought prompts (examples with intermediate reasoning steps).", "title": "Language Models Are Greedy Reasoners: A Systematic Formal Analysis of Chain-of-Thought", "year": 2022, "date": "2022-10-03", "url": "https://doi.org/10.48550/arxiv.2210.01240", "authors": "Abulhair Saparov et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S2"}, {"id": "E30", "text": "We find that the ability to solve MGSM problems via chain-of-thought prompting emerges with increasing model scale, and that models have strikingly strong multilingual reasoning abilities, even in underrepresented languages such as Bengali and Swahili.", "title": "Language Models are Multilingual Chain-of-Thought Reasoners", "year": 2022, "date": "2022-10-06", "url": "https://doi.org/10.48550/arxiv.2210.03057", "authors": "Freda Shi et al.", "fromTitle": false, "field": "Computer Science", "inSet": 7, "sense": "S2"}, {"id": "E31", "text": "Providing these steps for prompting demonstrations is called chain-of-thought (CoT) prompting.", "title": "Automatic Chain of Thought Prompting in Large Language Models", "year": 2022, "date": "2022-10-07", "url": "https://doi.org/10.48550/arxiv.2210.03493", "authors": "Zhuosheng Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 19, "sense": "S2"}, {"id": "E32", "text": "We find that applying chain-of-thought (CoT) prompting to BBH tasks enables PaLM to surpass the average human-rater performance on 10 of the 23 tasks, and Codex (code-davinci-002) to surpass the average human-rater performance on 17 of the 23 tasks.", "title": "Challenging BIG-Bench Tasks and Whether Chain-of-Thought Can Solve Them", "year": 2022, "date": "2022-10-17", "url": "https://doi.org/10.48550/arxiv.2210.09261", "authors": "Mirac Süzgün et al.", "fromTitle": false, "field": "Computer Science", "inSet": 24, "sense": "S2"}, {"id": "E33", "text": "In this paper we explore instruction finetuning with a particular focus on (1) scaling the number of tasks, (2) scaling the model size, and (3) finetuning on chain-of-thought data.", "title": "Scaling Instruction-Finetuned Language Models", "year": 2022, "date": "2022-10-20", "url": "https://doi.org/10.48550/arxiv.2210.11416", "authors": "Hyung Won Chung et al.", "fromTitle": false, "field": "Computer Science", "inSet": 30, "sense": "S3"}, {"id": "E34", "text": "Both the SL and RL methods can leverage chain-of-thought style reasoning to improve the human-judged performance and transparency of AI decision making.", "title": "Constitutional AI: Harmlessness from AI Feedback", "year": 2022, "date": "2022-12-15", "url": "https://doi.org/10.48550/arxiv.2212.08073", "authors": "Bai, Yuntao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 11, "sense": "S3"}, {"id": "E35", "text": "To surmount these challenges, we introduce a new framework for language model inference, Tree of Thoughts (ToT), which generalizes over the popular Chain of Thought approach to prompting language models, and enables exploration over coherent units of text (thoughts) that serve as intermediate steps toward problem solving.", "title": "Tree of Thoughts: Deliberate Problem Solving with Large Language Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-0517", "authors": "Shunyu Yao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 24, "sense": "S2"}, {"id": "E36", "text": "Large Language Models (LLMs) can achieve strong performance on many tasks by producing step-by-step reasoning before giving a final output, often referred to as chain-of-thought reasoning (CoT).", "title": "Language Models Don't Always Say What They Think: Unfaithful Explanations in Chain-of-Thought Prompting", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-3275", "authors": "Miles Turpin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 9, "sense": "S3"}, {"id": "E37", "text": "We investigate the ability of language models to perform compositional reasoning tasks where the overall solution depends on correctly composing the answers to sub-problems.We measure how often models can correctly answer all sub-problems but not generate the overall solution, a ratio we call the compositionality gap.We evaluate this ratio by asking multi-hop questions with answers that require composing multiple facts unlikely to have been obse…", "title": "Measuring and Narrowing the Compositionality Gap in Language Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.findings-emnlp.378", "authors": "Ofir Press et al.", "fromTitle": false, "field": "Computer Science", "inSet": 9, "sense": "unclear"}, {"id": "E38", "text": "Interleaving Retrieval with Chain-of-Thought Reasoning for Knowledge-Intensive Multi-Step Questions", "title": "Interleaving Retrieval with Chain-of-Thought Reasoning for Knowledge-Intensive Multi-Step Questions", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.acl-long.557", "authors": "Harsh K. Trivedi et al.", "fromTitle": true, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E39", "text": "Large language models (LLMs) have shown remarkable reasoning capabilities, particularly with chain-of-thought (CoT) prompting.However, LLMs sometimes still struggle with problems that are easy for humans, such as generating action plans to achieve given goals in an environment, or performing complex math or logical reasoning.The deficiency stems from the key fact that LLMs lack an internal world model to predict the world state (e.g., environmen…", "title": "Reasoning with Language Model is Planning with World Model", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.emnlp-main.507", "authors": "Shibo Hao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 9, "sense": "S2"}, {"id": "E40", "text": "Challenging BIG-Bench Tasks and Whether Chain-of-Thought Can Solve Them", "title": "Challenging BIG-Bench Tasks and Whether Chain-of-Thought Can Solve Them", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.findings-acl.824", "authors": "Mirac Süzgün et al.", "fromTitle": true, "field": "Computer Science", "inSet": 10, "sense": "S2"}, {"id": "E41", "text": "Large language models (LLMs) have been applied in various applications due to their astonishing capabilities.With advancements in technologies such as chain-of-thought (CoT) prompting and in-context learning (ICL), the prompts fed to LLMs are becoming increasingly lengthy, even exceeding tens of thousands of tokens.To accelerate model inference and reduce cost, this paper presents LLMLingua, a coarse-to-fine prompt compression method that involv…", "title": "LLMLingua: Compressing Prompts for Accelerated Inference of Large Language Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.emnlp-main.825", "authors": "Huiqiang Jiang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S2"}, {"id": "E42", "text": "We evaluate various settings, including zero-shot, few-shot, and multimodal chain-of-thought prompting, on a wide range of tasks without any gradient updates or finetuning.", "title": "Language Is Not All You Need: Aligning Perception with Language Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-3155", "authors": "Shaohan Huang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S2"}, {"id": "E43", "text": "Faithful Chain-of-Thought Reasoning", "title": "Faithful Chain-of-Thought Reasoning", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.ijcnlp-main.20", "authors": "Qing Lyu et al.", "fromTitle": true, "field": "Computer Science", "inSet": 9, "sense": "S3"}, {"id": "E44", "text": "Recently, with the chain of thought (CoT) prompting, large language models (LLMs), e.g., GPT-3, have shown strong reasoning ability in several natural language processing tasks such as arithmetic, commonsense, and logical reasoning.However, LLMs with CoT require multi-step prompting and multi-token prediction, which is highly sensitive to individual mistakes and vulnerable to error accumulation.The above issues make the LLMs need the ability to …", "title": "Large Language Models are Better Reasoners with Self-Verification", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.findings-emnlp.167", "authors": "Yixuan Weng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S2"}, {"id": "E45", "text": "Furthermore, we demonstrate RCI prompting's effectiveness in enhancing LLMs' reasoning abilities on a suite of natural language reasoning tasks, outperforming chain of thought (CoT) prompting with external feedback.", "title": "Language Models can Solve Computer Tasks", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-1723", "authors": "Geunwoo Kim et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S2"}, {"id": "E46", "text": "Towards Understanding Chain-of-Thought Prompting: An Empirical Study of What Matters", "title": "Towards Understanding Chain-of-Thought Prompting: An Empirical Study of What Matters", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.acl-long.153", "authors": "Boshi Wang et al.", "fromTitle": true, "field": "Computer Science", "inSet": 9, "sense": "S2"}, {"id": "E47", "text": "Specifically, we generate a sequence of sub-goals with the \"Chain of Thoughts\" mode for effective embodied planning.", "title": "EmbodiedGPT: Vision-Language Pre-Training via Embodied Chain of Thought", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-1090", "authors": "Yao Mu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S3"}, {"id": "E48", "text": "Recent studies have discovered that Chain-of-Thought prompting (CoT) can dramatically improve the performance of Large Language Models (LLMs), particularly when dealing with complex tasks involving mathematics or reasoning.", "title": "Towards Revealing the Mystery behind Chain of Thought: A Theoretical Perspective", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-3100", "authors": "Guhao Feng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 7, "sense": "S2"}, {"id": "E49", "text": "We evaluate multiple LLMs on our dataset, and we introduce and evaluate a bespoke chain-of-thought prompting strategy, CausalCoT.", "title": "CLadder: Assessing Causal Reasoning in Language Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-1353", "authors": "Zhijing Jin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E50", "text": "Warning: This paper contains several toxic and offensive statements.Generating a Chain of Thought (CoT) has been shown to consistently improve large language model (LLM) performance on a wide range of NLP tasks.However, prior work has mainly focused on logical reasoning tasks (e.g.arithmetic, commonsense QA); it remains unclear whether improvements hold for more diverse types of reasoning, especially in socially situated contexts.Concretely, we …", "title": "On Second Thought, Let’s Not Think Step by Step! Bias and Toxicity in Zero-Shot Reasoning", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.acl-long.244", "authors": "Omar Shaikh et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E51", "text": "Step-by-step reasoning approaches like chain of thought (CoT) have proved to be very effective in inducing reasoning capabilities in large language models.However, the success of the CoT approach is fundamentally tied to the model size, and billion parameter-scale models are often needed to get CoT to work.In this paper, we propose a knowledge distillation approach that leverages the step-by-step CoT reasoning capabilities of larger models and d…", "title": "Distilling Reasoning Capabilities into Smaller Language Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.findings-acl.441", "authors": "Kumar Shridhar et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E52", "text": "Symbolic Chain-of-Thought Distillation: Small Models Can Also “Think” Step-by-Step", "title": "Symbolic Chain-of-Thought Distillation: Small Models Can Also “Think” Step-by-Step", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.acl-long.150", "authors": "Liunian Harold Li et al.", "fromTitle": true, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E53", "text": "Large Language Models (LLMs) significantly benefit from Chain-of-Thought (CoT) prompting in performing various reasoning tasks.", "title": "Deductive Verification of Chain-of-Thought Reasoning", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-1580", "authors": "Zhan Ling et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S2"}, {"id": "E54", "text": "Recently, large language models (LLMs) have made remarkable strides in such multi-step reasoning on the language modality solely by leveraging the chain of thought (CoT) to mimic human thinking.", "title": "DDCoT: Duty-Distinct Chain-of-Thought Prompting for Multimodal Reasoning in Language Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-0228", "authors": "Zheng Ge et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S3"}, {"id": "E55", "text": "To address this issue, we propose a novel post-processing approach, rethinking with retrieval (RR), which retrieves relevant external knowledge based on the decomposed reasoning steps obtained from the chain-of-thought (CoT) prompting.", "title": "Rethinking with Retrieval: Faithful Large Language Model Inference", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.48550/arxiv.2301.00303", "authors": "Hangfeng He et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S2"}, {"id": "E56", "text": "Large language models (LLMs) have been widely applied in various fields due to their excellent capability for memorizing knowledge and chain of thought (CoT).When these language models are applied in the field of psychological counseling, they often rush to provide universal advice.However, when users seek psychological support, they need to gain empathy, trust, understanding and comfort, rather than just reasonable advice.To this end, we constr…", "title": "SoulChat: Improving LLMs’ Empathy, Listening, and Comfort Abilities through Fine-tuning with Multi-turn Empathy Conversations", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.findings-emnlp.83", "authors": "Yirong Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E57", "text": "Large language models (LLMs) have shown superior performance without task-specific finetuning.Despite the success, the knowledge stored in the parameters of LLMs could still be incomplete and difficult to update due to the computational costs.As complementary, retrieval-based methods can offer nonparametric world knowledge and improve the performance on tasks such as question answering.However, we find that the retrieved knowledge does not alway…", "title": "Self-Knowledge Guided Retrieval Augmentation for Large Language Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.findings-emnlp.691", "authors": "Yile Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "unclear"}, {"id": "E58", "text": "We find task balancing and enrichment techniques are overlooked but critical to effective instruction tuning, and in particular, training with mixed prompt settings (zero-shot, few-shot, and chain-of-thought) actually yields stronger (2%+) performance in all settings.", "title": "The Flan Collection: Designing Data and Methods for Effective Instruction Tuning", "year": 2023, "date": "2023-01-31", "url": "https://doi.org/10.48550/arxiv.2301.13688", "authors": "Shayne Longpre et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S2"}, {"id": "E59", "text": "Large language models (LLMs) have shown impressive performance on complex reasoning by leveraging chain-of-thought (CoT) prompting to generate intermediate reasoning chains as the rationale to infer the answer.", "title": "Multimodal Chain-of-Thought Reasoning in Language Models", "year": 2023, "date": "2023-02-02", "url": "https://doi.org/10.48550/arxiv.2302.00923", "authors": "Zhuosheng Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 12, "sense": "S2"}, {"id": "E60", "text": "Large language models (LLMs) can perform complex reasoning in few- and zero-shot settings by generating intermediate chain of thought (CoT) reasoning steps.", "title": "ART: Automatic multi-step reasoning and tool-use for large language models", "year": 2023, "date": "2023-03-16", "url": "https://doi.org/10.48550/arxiv.2303.09014", "authors": "Bhargavi Paranjape et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E61", "text": "To showcase its capabilities in GEC, we design zero-shot chain-of-thought (CoT) and few-shot CoT settings using in-context learning for ChatGPT.", "title": "Is ChatGPT a Highly Fluent Grammatical Error Correction System? A Comprehensive Evaluation", "year": 2023, "date": "2023-04-04", "url": "https://doi.org/10.48550/arxiv.2304.01746", "authors": "Fang, Tao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E62", "text": "The performance of Large Language Models (LLMs) in reasoning tasks depends heavily on prompt design, with Chain-of-Thought (CoT) and self-consistency being critical methods that enhance this ability.", "title": "Progressive-Hint Prompting Improves Reasoning in Large Language Models", "year": 2023, "date": "2023-04-19", "url": "https://doi.org/10.48550/arxiv.2304.09797", "authors": "Chuanyang Zheng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E63", "text": "Relation extraction (RE) is the core NLP task of inferring semantic relationships between entities from text.Standard supervised RE techniques entail training modules to tag tokens comprising entity spans and then predict the relationship between them.Recent work has instead treated the problem as a sequence-tosequence task, linearizing relations between entities as target strings to be generated conditioned on the input.Here we push the limits …", "title": "Revisiting Relation Extraction in the era of Large Language Models", "year": 2023, "date": "2023-07-01", "url": "https://doi.org/10.18653/v1/2023.acl-long.868", "authors": "Somin Wadhwa et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "unclear"}, {"id": "E64", "text": "Large language models (LLMs) perform better when they produce step-by-step, \"Chain-of-Thought\" (CoT) reasoning before answering a question, but it is unclear if the stated reasoning is a faithful explanation of the model's actual reasoning (i.e., its process for answering the question).", "title": "Measuring Faithfulness in Chain-of-Thought Reasoning", "year": 2023, "date": "2023-07-17", "url": "https://doi.org/10.48550/arxiv.2307.13702", "authors": "Tamera Lanham et al.", "fromTitle": false, "field": "Computer Science", "inSet": 11, "sense": "S3"}, {"id": "E65", "text": "We further show that incorporating chain of thought reasoning allows RT-2 to perform multi-stage semantic reasoning, for example figuring out which object to pick up for use as an improvised hammer (a rock), or which type of drink is best suited for someone who is tired (an energy drink).", "title": "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control", "year": 2023, "date": "2023-07-28", "url": "https://doi.org/10.48550/arxiv.2307.15818", "authors": "Anthony Brohan et al.", "fromTitle": false, "field": "Engineering", "inSet": 5, "sense": "S3"}, {"id": "E66", "text": "Popular prompt strategies like Chain-of-Thought Prompting can dramatically improve the reasoning abilities of Large Language Models (LLMs) in various domains.", "title": "Promptbreeder: Self-Referential Self-Improvement Via Prompt Evolution", "year": 2023, "date": "2023-09-28", "url": "https://doi.org/10.48550/arxiv.2309.16797", "authors": "Chrisantha Fernando et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S2"}, {"id": "E67", "text": "It elucidates the distinct mechanisms underpinning these technologies, such as Reinforcement Learning from Human Feedback (RLFH), including few-shot learning and chain-of-thought reasoning, which differentiates them from traditional, rule-based AI systems.", "title": "Leveraging Generative AI and Large Language Models: A Comprehensive Roadmap for Healthcare Integration", "year": 2023, "date": "2023-10-20", "url": "https://doi.org/10.3390/healthcare11202776", "authors": "Ping Yu et al.", "fromTitle": false, "field": "Medicine", "inSet": 1, "sense": "S3"}, {"id": "E68", "text": "The immense scale of the recent large language models (LLM) allows many interesting properties, such as, instruction- and chain-of-thought-based fine-tuning, that has significantly improved zero- and few-shot performance in many natural language processing (NLP) tasks.", "title": "Text-to-Audio Generation using Instruction Guided Latent Diffusion Model", "year": 2023, "date": "2023-10-26", "url": "https://doi.org/10.1145/3581783.3612348", "authors": "Deepanway Ghosal et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E69", "text": "Self-consistency with chain-of-thought prompting (CoT) has demonstrated remarkable performance gains on various challenging tasks, by utilizing multiple reasoning paths sampled from large language models (LLMs).", "title": "Universal Self-Consistency for Large Language Model Generation", "year": 2023, "date": "2023-11-29", "url": "https://doi.org/10.48550/arxiv.2311.17311", "authors": "Xinyun Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E70", "text": "Our framework comprises a core decomposer agent for Text-to-SQL generation with few-shot chain-of-thought reasoning, accompanied by two auxiliary agents that utilize external tools or models to acquire smaller sub-databases and refine erroneous SQL queries.", "title": "MAC-SQL: A Multi-Agent Collaborative Framework for Text-to-SQL", "year": 2023, "date": "2023-12-18", "url": "https://doi.org/10.48550/arxiv.2312.11242", "authors": "Bing Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E71", "text": "Additionally, we found that models utilizing Chain of Thought (CoT) reasoning achieved better performance on MMLU-Pro compared to direct answering, which is in stark contrast to the findings on the original MMLU, indicating that MMLU-Pro includes more complex reasoning questions.", "title": "MMLU-Pro: A More Robust and Challenging Multi-Task Language Understanding Benchmark", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.52202/079017-3018", "authors": "Yubo Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S3"}, {"id": "E72", "text": "Visual CoT: Advancing Multi-Modal Language Models with a Comprehensive Dataset and Benchmark for Chain-of-Thought Reasoning", "title": "Visual CoT: Advancing Multi-Modal Language Models with a Comprehensive Dataset and Benchmark for Chain-of-Thought Reasoning", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.52202/079017-0275", "authors": "Hao Shao et al.", "fromTitle": true, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E73", "text": "Reinforced ICL uses model-generated chain-of-thought rationales in place of human examples.", "title": "Many-Shot In-Context Learning", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.52202/079017-2447", "authors": "Rishabh Agarwal et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E74", "text": "Current chain-of-thought and tool-use paradigms only use text as intermediate reasoning steps.", "title": "Visual Sketchpad: Sketching as a Visual Chain of Thought for Multimodal Language Models", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.52202/079017-4423", "authors": "Xingyu Fu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E75", "text": "In this work we develop an iterative approach that optimizes the preference between competing generated Chain-of-Thought (CoT) candidates by optimizing for winning vs. losing reasoning steps that lead to the correct answer.", "title": "Iterative Reasoning Preference Optimization", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.52202/079017-3702", "authors": "Richard Yuanzhe Pang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 7, "sense": "S3"}, {"id": "E76", "text": "The increasing scale of large language models (LLMs) brings emergent abilities to various complex tasks requiring reasoning, such as arithmetic and commonsense reasoning.It is known that the effective design of taskspecific prompts is critical for LLMs' ability to produce high-quality answers.In particular, an effective approach for complex questionand-answering tasks is example-based prompting with chain-of-thought (CoT) reasoning, which signif…", "title": "Active Prompting with Chain-of-Thought for Large Language Models", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.18653/v1/2024.acl-long.73", "authors": "Shizhe Diao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S2"}, {"id": "E77", "text": "Navigate through Enigmatic Labyrinth A Survey of Chain of Thought Reasoning: Advances, Frontiers and Future", "title": "Navigate through Enigmatic Labyrinth A Survey of Chain of Thought Reasoning: Advances, Frontiers and Future", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.18653/v1/2024.acl-long.65", "authors": "Zheng Chu et al.", "fromTitle": true, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E78", "text": "In enhancing the reasoning capabilities of large language models (LLMs), prior research primarily focuses on specific prompting techniques such as few-shot or zero-shot chain-of-thought (CoT) prompting.", "title": "Chain-of-Thought Reasoning Without Prompting", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.52202/079017-2123", "authors": "Xuezhi Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E79", "text": "While the recent Chain-of-Thought (CoT) technique enhances the reasoning ability of large language models (LLMs) with the theory of mind, it might still struggle in handling logical reasoning that relies much on symbolic expressions and rigid deducing rules.To strengthen the logical reasoning capability of LLMs, we propose a novel Symbolic Chain-of-Thought, namely SymbCoT, a fully LLM-based framework that integrates symbolic expressions and logi…", "title": "Faithful Logical Reasoning via Symbolic Chain-of-Thought", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.18653/v1/2024.acl-long.720", "authors": "Jundong Xu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S2"}, {"id": "E80", "text": "Retrieval-augmented language model (RALM) represents a significant advancement in mitigating factual hallucination by leveraging external knowledge sources.However, the reliability of the retrieved information is not always guaranteed, and the retrieval of irrelevant data can mislead the response generation.Moreover, standard RALMs frequently neglect their intrinsic knowledge due to the interference from retrieved information.In instances where …", "title": "Chain-of-Note: Enhancing Robustness in Retrieval-Augmented Language Models", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.18653/v1/2024.emnlp-main.813", "authors": "Wenhao Yu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "unclear"}, {"id": "E81", "text": "Chain of Thought (CoT) is significant in improving the reasoning abilities of large language models (LLMs).However, the correlation between the effectiveness of CoT and the length of reasoning steps in prompts remains largely unknown.To shed light on this, we have conducted several empirical experiments to explore the relations.Specifically, we design experiments that expand and compress the rationale reasoning steps within CoT demonstrations wh…", "title": "The Impact of Reasoning Step Length on Large Language Models", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.18653/v1/2024.findings-acl.108", "authors": "Mingyu Jin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 7, "sense": "S2"}, {"id": "E82", "text": "The scene graph encodes the relationships between objects, groups and rooms with a LLM-friendly structure, for which we design a hierarchical chain-of-thought prompt to help LLM reason the goal location according to scene context by traversing the nodes and edges.", "title": "SG-Nav: Online 3D Scene Graph Prompting for LLM-based Zero-shot Object Navigation", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.52202/079017-0171", "authors": "Hang Yin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E83", "text": "In addition, code-pretraining greatly benefits strategic reasoning, while advanced reasoning methods such as Chain-of-Thought (CoT) and Tree-of-Thought (ToT) do not always help.", "title": "GTBench: Uncovering the Strategic Reasoning Capabilities of LLMs via Game-Theoretic Evaluations", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.52202/079017-0885", "authors": "Jinhao Duan et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E84", "text": "The best setup, GPT-4 with chain of thought (CoT), achieves a pass@1 of 75% and 81% on input and output prediction, respectively.", "title": "CRUXEval: A Benchmark for Code Reasoning, Understanding and Execution", "year": 2024, "date": "2024-01-05", "url": "https://doi.org/10.48550/arxiv.2401.03065", "authors": "Gu, Alex et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E85", "text": "Chain-of-Thought and its similar approaches incorporate the reasoning chain in the form of textual context, but it is still an open question how to effectively leverage tabular data in the reasoning chain.", "title": "Chain-of-Table: Evolving Tables in the Reasoning Chain for Table Understanding", "year": 2024, "date": "2024-01-09", "url": "https://doi.org/10.48550/arxiv.2401.04398", "authors": "Zilong Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E86", "text": "In this paper, we propose a brand new training-free text-to-image generation/editing framework, namely Recaption, Plan and Generate (RPG), harnessing the powerful chain-of-thought reasoning ability of multimodal LLMs to enhance the compositionality of text-to-image diffusion models.", "title": "Mastering Text-to-Image Diffusion: Recaptioning, Planning, and Generating with Multimodal LLMs", "year": 2024, "date": "2024-01-22", "url": "https://doi.org/10.48550/arxiv.2401.11708", "authors": "Ling Yang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E87", "text": "In this paper, we introduce core concepts, advanced techniques like Chain-of-Thought and Reflection, and the principles behind building LLM-based agents.", "title": "Prompt Design and Engineering: Introduction and Advanced Methods", "year": 2024, "date": "2024-01-24", "url": "https://doi.org/10.48550/arxiv.2401.14423", "authors": "Xavier Amatriain", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E88", "text": "AdbGPT leverages few-shot learning and chain-of-thought reasoning to elicit human knowledge and logical reasoning from LLMs to accomplish the bug replay in a manner similar to a developer.", "title": "Prompting Is All You Need: Automated Android Bug Replay with Large Language Models", "year": 2024, "date": "2024-02-06", "url": "https://doi.org/10.1145/3597503.3608137", "authors": "Sidong Feng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E89", "text": "Instructing the model to generate a sequence of intermediate steps, a.k.a., a chain of thought (CoT), is a highly effective method to improve the accuracy of large language models (LLMs) on arithmetics and symbolic reasoning tasks.", "title": "Chain of Thought Empowers Transformers to Solve Inherently Serial Problems", "year": 2024, "date": "2024-02-20", "url": "https://doi.org/10.48550/arxiv.2402.12875", "authors": "Zhiyuan Li et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E90", "text": "Applying large language models and chain-of-thought for automatic scoring", "title": "Applying large language models and chain-of-thought for automatic scoring", "year": 2024, "date": "2024-02-27", "url": "https://doi.org/10.1016/j.caeai.2024.100213", "authors": "Gyeong-Geon Lee et al.", "fromTitle": true, "field": "Social Sciences", "inSet": 0, "sense": "S2"}, {"id": "E91", "text": "One such strategy is prompt engineering, like the chain-of-thought approach, which directs LLMs towards more accurate responses by breaking down the problem into intermediate steps or reasoning sequences.", "title": "Integrating Retrieval-Augmented Generation with Large Language Models in Nephrology: Advancing Practical Applications", "year": 2024, "date": "2024-03-08", "url": "https://doi.org/10.3390/medicina60030445", "authors": "Jing Miao et al.", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S2"}, {"id": "E92", "text": "This is partly explained by a drop in GPT-4’s amenity to follow chain-of-thought prompting.", "title": "How Is ChatGPT’s Behavior Changing Over Time?", "year": 2024, "date": "2024-03-12", "url": "https://doi.org/10.1162/99608f92.5317da47", "authors": "Lingjiao Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E93", "text": "This coupled with RAFT's chain-of-thought-style response helps improve the model's ability to reason.", "title": "RAFT: Adapting Language Model to Domain Specific RAG", "year": 2024, "date": "2024-03-15", "url": "https://doi.org/10.48550/arxiv.2403.10131", "authors": "Tianjun Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E94", "text": "We introduce Graph of Thoughts (GoT): a framework that advances prompting capabilities in large language models (LLMs) beyond those offered by paradigms such as Chain-of-Thought or Tree of Thoughts (ToT).", "title": "Graph of Thoughts: Solving Elaborate Problems with Large Language Models", "year": 2024, "date": "2024-03-24", "url": "https://doi.org/10.1609/aaai.v38i16.29720", "authors": "Maciej Besta et al.", "fromTitle": false, "field": "Computer Science", "inSet": 10, "sense": "S2"}, {"id": "E95", "text": "We also consider (1) Chain-of-Thought (CoT) summarization, where the LLM is prompted to summarize the domain and propose a strategy in words before synthesizing the program; and (2) automated debugging, where the program is validated with respect to the training tasks, and in case of errors, the LLM is re-prompted with four types of feedback.", "title": "Generalized Planning in PDDL Domains with Pretrained Large Language Models", "year": 2024, "date": "2024-03-24", "url": "https://doi.org/10.1609/aaai.v38i18.30006", "authors": "Tom Silver et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E96", "text": "VoT inherits the Chain-of-Thought (CoT) core, breaking down a complex task into simpler and manageable sub-problems, and addressing them step-by-step from a low-level pixel perception to high-level cognitive interpretation.", "title": "Video-of-Thought: Step-by-Step Video Reasoning from Perception to Cognition", "year": 2024, "date": "2024-05-07", "url": "https://doi.org/10.48550/arxiv.2501.03230", "authors": "Hao Fei et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E97", "text": "When leveraging language models for reasoning tasks, generating explicit chain-of-thought (CoT) steps often proves essential for achieving high accuracy in final outputs.", "title": "From Explicit CoT to Implicit CoT: Learning to Internalize CoT Step by Step", "year": 2024, "date": "2024-05-23", "url": "https://doi.org/10.48550/arxiv.2405.14838", "authors": "Yuntian Deng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S3"}, {"id": "E98", "text": "We conduct a series of experiments showing that state-of-the-art LLMs are able to understand and induce false beliefs in other agents, that their performance in complex deception scenarios can be amplified utilizing chain-of-thought reasoning, and that eliciting Machiavellianism in LLMs can trigger misaligned deceptive behavior.", "title": "Deception abilities emerged in large language models", "year": 2024, "date": "2024-06-04", "url": "https://doi.org/10.1073/pnas.2317967121", "authors": "Thilo Hagendorff", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E99", "text": "This algorithm swiftly identifies the first error in the Chain of Thought (CoT) with binary search and balances the positive and negative examples, thereby ensuring both efficiency and quality.", "title": "Improve Mathematical Reasoning in Language Models by Automated Process Supervision", "year": 2024, "date": "2024-06-05", "url": "https://doi.org/10.48550/arxiv.2406.06592", "authors": "Liangchen Luo et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E100", "text": "Finally, we demonstrate that this VLM unlocks novel downstream applications in chain-of thought spatial reasoning and robotics due to its quantitative estimation capability.", "title": "SpatialVLM: Endowing Vision-Language Models with Spatial Reasoning Capabilities", "year": 2024, "date": "2024-06-16", "url": "https://doi.org/10.1109/cvpr52733.2024.01370", "authors": "Boyuan Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E101", "text": "To overcome this, inspired by chain-of-thought methods, we propose Compositional Chain-of-Thought (CCoT), a novel zero-shot Chain-of-Thought prompting method that utilizes SG representations in order to extract compositional knowledge from an LMM.", "title": "Compositional Chain-of-Thought Prompting for Large Multimodal Models", "year": 2024, "date": "2024-06-16", "url": "https://doi.org/10.1109/cvpr52733.2024.01367", "authors": "Chancharik Mitra et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S2"}, {"id": "E102", "text": "Naive use of \"chain-of-thought\" (CoT) style prompting is significantly less effective with standard VLAs because of the relatively simple training examples that are available to them.", "title": "Robotic Control via Embodied Chain-of-Thought Reasoning", "year": 2024, "date": "2024-07-11", "url": "https://doi.org/10.48550/arxiv.2407.08693", "authors": "Michał Zawalski et al.", "fromTitle": false, "field": "Engineering", "inSet": 3, "sense": "S2"}, {"id": "E103", "text": "Chain-of-Thought, Self-Reflection, Toolformer).", "title": "Automated Design of Agentic Systems", "year": 2024, "date": "2024-08-15", "url": "https://doi.org/10.48550/arxiv.2408.08435", "authors": "Shengran Hu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E104", "text": "Compared to standard verifiers, such generative verifiers (GenRM) can benefit from several advantages of LLMs: they integrate seamlessly with instruction tuning, enable chain-of-thought reasoning, and can utilize additional test-time compute via majority voting for better verification.", "title": "Generative Verifiers: Reward Modeling as Next-Token Prediction", "year": 2024, "date": "2024-08-27", "url": "https://doi.org/10.48550/arxiv.2408.15240", "authors": "Lunjun Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E105", "text": "Qwen2.5-Math-Instruct supports both Chinese and English, and possess advanced mathematical reasoning capabilities, including Chain-of-Thought (CoT) and Tool-Integrated Reasoning (TIR).", "title": "Qwen2.5-Math Technical Report: Toward Mathematical Expert Model via Self-Improvement", "year": 2024, "date": "2024-09-18", "url": "https://doi.org/10.48550/arxiv.2409.12122", "authors": "Yang, An et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E106", "text": "Chain-of-thought (CoT) via prompting is the de facto method for eliciting reasoning capabilities from large language models (LLMs).", "title": "To CoT or not to CoT? Chain-of-thought helps mainly on math and symbolic reasoning", "year": 2024, "date": "2024-09-18", "url": "https://doi.org/10.48550/arxiv.2409.12183", "authors": "Zayne Sprague et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S2"}, {"id": "E107", "text": "We continue with multimodal hallucination and extended techniques, including multimodal in-context learning, multimodal chain of thought and LLM-aided visual reasoning.", "title": "A survey on multimodal large language models", "year": 2024, "date": "2024-11-11", "url": "https://doi.org/10.1093/nsr/nwae403", "authors": "Shukang Yin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E108", "text": "Although previous research has explored aspects like rephrasing prompt contexts, using various prompting techniques (like in-context learning and chain-of-thought), and ordering few-shot examples, our understanding of LLM sensitivity to prompt templates remains limited.", "title": "Does Prompt Formatting Have Any Impact on LLM Performance?", "year": 2024, "date": "2024-11-15", "url": "https://doi.org/10.48550/arxiv.2411.10541", "authors": "Jia He et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E109", "text": "However, these models suffer from distribution shifts, which limit their multimodal reasoning, particularly in the Chain-of-Thought (CoT) performance.", "title": "Enhancing the Reasoning Ability of Multimodal Large Language Models via Mixed Preference Optimization", "year": 2024, "date": "2024-11-15", "url": "https://doi.org/10.48550/arxiv.2411.10442", "authors": "Wei‐Yun Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E110", "text": "Large language models (LLMs) are typically constrained to reason in the language space, where they express the reasoning process through a chain-of-thought (CoT) to solve complex problems.", "title": "Training Large Language Models to Reason in a Continuous Latent Space", "year": 2024, "date": "2024-12-09", "url": "https://doi.org/10.48550/arxiv.2412.06769", "authors": "Hao, Shibo et al.", "fromTitle": false, "field": "Computer Science", "inSet": 12, "sense": "S3"}, {"id": "E111", "text": "The o1 model series is trained with large-scale reinforcement learning to reason using chain of thought.", "title": "OpenAI o1 System Card", "year": 2024, "date": "2024-12-21", "url": "https://doi.org/10.48550/arxiv.2412.16720", "authors": "OpenAI et al.", "fromTitle": false, "field": "Computer Science", "inSet": 15, "sense": "S4"}, {"id": "E112", "text": "These models employ extended chain-of-thought (CoT) processes, exploring multiple strategies to enhance problem-solving capabilities.", "title": "Do NOT Think That Much for 2+3=? On the Overthinking of o1-Like LLMs", "year": 2024, "date": "2024-12-30", "url": "https://doi.org/10.48550/arxiv.2412.21187", "authors": "Xingyu Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S4"}, {"id": "E113", "text": "By examining token entropy patterns in Chain-of-Thought (CoT) reasoning, we observe that only a small fraction of tokens exhibit high entropy, and these tokens act as critical forks that steer the model toward diverse reasoning pathways.", "title": "Beyond the 80/20 Rule: High-Entropy Minority Tokens Drive Effective Reinforcement Learning for LLM Reasoning", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.52202/085713-3850", "authors": "Shenzhi Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E114", "text": "Reasoning is critical for large language models (LLMs) to excel in a wide range of tasks.While methods like Chain-of-Thought (CoT) reasoning and enhance LLM performance by decomposing problems into intermediate steps, they also incur significant overhead in token usage, leading to increased costs.We find that the reasoning process of current LLMs is unnecessarily lengthy and it can be compressed by including a reasonable token budget in the prom…", "title": "Token-Budget-Aware LLM Reasoning", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.18653/v1/2025.findings-acl.1274", "authors": "Tingxu Han et al.", "fromTitle": false, "field": "Computer Science", "inSet": 9, "sense": "S3"}, {"id": "E115", "text": "Chain-of-Thought (CoT) has been proven effective in enhancing the reasoning capabilities of large language models (LLMs).Recent advancements, such as OpenAI's o1 and DeepSeek-R1, suggest that scaling up the length of CoT sequences during inference could further boost LLM reasoning performance.However, due to the autoregressive nature of LLM decoding, longer CoT outputs lead to a linear increase in inference latency, adversely affecting user expe…", "title": "TokenSkip: Controllable Chain-of-Thought Compression in LLMs", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.18653/v1/2025.emnlp-main.165", "authors": "Heming Xia et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S4"}, {"id": "E116", "text": "Chain-of-Thought (CoT) reasoning enhances Large Language Models (LLMs) by encouraging step-by-step reasoning in natural language.However, leveraging a latent continuous space for reasoning may offer benefits in terms of both efficiency and robustness.Prior implicit CoT methods attempt to bypass language completely by reasoning in continuous space but have consistently underperformed compared to the standard explicit CoT approach.We introduce COD…", "title": "CODI: Compressing Chain-of-Thought into Continuous Space via Self-Distillation", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.18653/v1/2025.emnlp-main.36", "authors": "Zhenyi Shen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E117", "text": "For training, we employ supervised fine-tuning to equip the model with dual thinking modes: fast thinking (trajectory-only) and slow thinking (enhanced with chain-of-thought reasoning).", "title": "AutoVLA: A Vision-Language-Action Model for End-to-End Autonomous Driving with Adaptive Reasoning and Reinforcement Fine-Tuning", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.52202/085713-0942", "authors": "Zewei Zhou et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S3"}, {"id": "E118", "text": "Our framework consists of: (1) an annotation infrastructure that seamlessly captures human computer-use demonstrations; (2) AgentNet, the first large-scale computer-use task dataset spanning 3 operating systems and 200+ applications and websites; (3) a scalable pipeline that transforms demonstrations into state-action pairs with reflective long Chain-of-Thought reasoning that sustain robust performance gains as data scales.", "title": "OpenCUA: Open Foundations for Computer-Use Agents", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.52202/085713-4669", "authors": "Xinyuan Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S4"}, {"id": "E119", "text": "Through extensive experiments on various reasoning tasks, we demonstrate that self-certainty (1) scales effectively with increasing sample size N, akin to reward models but without the computational overhead; (2) complements chain-of-thought, improving reasoning performance beyond greedy decoding; and (3) generalizes to open-ended tasks where traditional self-consistency methods fall short.", "title": "Scalable Best-of-N Selection for Large Language Models via Self-Certainty", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.52202/085713-0663", "authors": "Zhewei Kang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E120", "text": "Existing methods enhance Vision-Language Models (VLMs) through Chain-of-Thought (CoT) supervised fine-tuning using meticulously annotated data.", "title": "Reason-RFT: Reinforcement Fine-Tuning for Visual Reasoning of Vision Language Models", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.52202/085713-0204", "authors": "Huajie Tan et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E121", "text": "Chain-of-Thought significantly enhances a model's reasoning capability, but it also comes with a considerable increase in inference costs due to long chains.With the observation that the reasoning path can be easily compressed under easy tasks but struggles on hard tasks, we explore the feasibility of elastically controlling the length of reasoning paths with only one model, thereby reducing the inference overhead of reasoning models dynamically…", "title": "CoT-Valve: Length-Compressible Chain-of-Thought Tuning", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.18653/v1/2025.acl-long.300", "authors": "Xinyin Ma et al.", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S4"}, {"id": "E122", "text": "To further foster research in this area, we annotate every question with a Chain-of-Thought (CoT) rationale to promote future advancements in audio reasoning.", "title": "MMAR: A Challenging Benchmark for Deep Reasoning in Speech, Audio, Music, and Their Mix", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.52202/085713-2252", "authors": "Ziyang Ma et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E123", "text": "Chain-of-Thought (CoT) reasoning enables Large Language Models (LLMs) to solve complex reasoning tasks by generating intermediate reasoning steps.However, most existing approaches focus on hard token decoding, which constrains reasoning within the discrete vocabulary space and may not always be optimal.While recent efforts explore continuousspace reasoning, they often require full-model fine-tuning and suffer from catastrophic forgetting, limiti…", "title": "SoftCoT: Soft Chain-of-Thought for Efficient Reasoning with LLMs", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.18653/v1/2025.acl-long.1137", "authors": "Yaogeng Xu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E124", "text": "Improve Vision Language Model Chain-of-thought Reasoning", "title": "Improve Vision Language Model Chain-of-thought Reasoning", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.18653/v1/2025.acl-long.82", "authors": "Ruohong Zhang et al.", "fromTitle": true, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E125", "text": "In particular, we provide some insights into the CoT (Chain of Thought) and PoT (Plan of Thought) abilities within LLMs, focusing on how pre-training data influences their emergence.", "title": "A Survey on Large Language Models with some Insights on their Capabilities and Limitations", "year": 2025, "date": "2025-01-03", "url": "https://doi.org/10.48550/arxiv.2501.04040", "authors": "Andrea Matarazzo et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E126", "text": "Chain-of-Thought (CoT) prompting has proven highly effective for enhancing complex reasoning in Large Language Models (LLMs) and Multimodal Large Language Models (MLLMs).", "title": "Imagine while Reasoning in Space: Multimodal Visualization-of-Thought", "year": 2025, "date": "2025-01-13", "url": "https://doi.org/10.48550/arxiv.2501.07542", "authors": "Chengzu Li et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E127", "text": "Demystifying Long Chain-of-Thought Reasoning in LLMs", "title": "Demystifying Long Chain-of-Thought Reasoning in LLMs", "year": 2025, "date": "2025-02-05", "url": "https://doi.org/10.48550/arxiv.2502.03373", "authors": "Edward Yeo et al.", "fromTitle": true, "field": "Computer Science", "inSet": 5, "sense": "S4"}, {"id": "E128", "text": "Large Language Models (LLMs) employ Chain-of-Thought (CoT) reasoning to deconstruct complex problems.", "title": "When More is Less: Understanding Chain-of-Thought Length in LLMs", "year": 2025, "date": "2025-02-11", "url": "https://doi.org/10.48550/arxiv.2502.07266", "authors": "Wu, Yuyang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E129", "text": "Large Language Models (LLMs) have demonstrated remarkable performance in solving complex reasoning tasks through mechanisms like Chain-of-Thought (CoT) prompting, which emphasizes verbose, step-by-step reasoning.", "title": "Chain of Draft: Thinking Faster by Writing Less", "year": 2025, "date": "2025-02-25", "url": "https://doi.org/10.48550/arxiv.2502.18600", "authors": "Silei Xu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S2"}, {"id": "E130", "text": "Top-performing models such as Gemini-2.5 Pro exceeded 97% accuracy when augmented with chain-of-thought prompting (base: 87.6%), while medical-specialized models like MedGemma ranged from 28.6-61.9% despite explicit training on medical corpora.", "title": "Medical Hallucination in Foundation Models and Their Impact on Healthcare", "year": 2025, "date": "2025-03-03", "url": "https://doi.org/10.1101/2025.02.28.25323115", "authors": "Yubin Kim et al.", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S2"}, {"id": "E131", "text": "This disentangled representation, combined with the Qwen2.5 LLM and a chain-of-thought (CoT) generation approach, enables both coarse-grained control (e.g., gender, speaking style) and fine-grained adjustments (e.g., precise pitch values, speaking rate).", "title": "Spark-TTS: An Efficient LLM-Based Text-to-Speech Model with Single-Stream Decoupled Speech Tokens", "year": 2025, "date": "2025-03-03", "url": "https://doi.org/10.48550/arxiv.2503.01710", "authors": "Xinsheng Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E132", "text": "Reasoning language models have shown an uncanny ability to improve performance at test-time by ``thinking longer''-that is, by generating longer chain-of-thought sequences and hence using more compute.", "title": "L1: Controlling How Long A Reasoning Model Thinks With Reinforcement Learning", "year": 2025, "date": "2025-03-06", "url": "https://doi.org/10.48550/arxiv.2503.04697", "authors": "Pranjal Aggarwal et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S4"}, {"id": "E133", "text": "Recent studies indicate that when faced with explicit biases in prompts, models often omit mentioning these biases in their Chain-of-Thought (CoT) output, revealing that verbalized reasoning can give an incorrect picture of how models arrive at conclusions (unfaithfulness).", "title": "Chain-of-Thought Reasoning In The Wild Is Not Always Faithful", "year": 2025, "date": "2025-03-11", "url": "https://doi.org/10.48550/arxiv.2503.08679", "authors": "Iván Arcuschin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E134", "text": "This paper proposes a novel strategy called Navigational Chain-of-Thought (NavCoT), where we fulfill parameter-efficient in-domain training to enable self-guided navigational decision, leading to a significant mitigation of the domain gap in a cost-effective manner.", "title": "NavCoT: Boosting LLM-Based Vision-and-Language Navigation via Learning Disentangled Reasoning", "year": 2025, "date": "2025-03-26", "url": "https://doi.org/10.1109/tpami.2025.3554559", "authors": "Bingqian Lin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E135", "text": "Recent Large Reasoning Models (LRMs), such as DeepSeek-R1 and OpenAI o1, have demonstrated strong performance gains by scaling up the length of Chain-of-Thought (CoT) reasoning during inference.", "title": "A Survey of Efficient Reasoning for Large Reasoning Models: Language, Multimodality, and Beyond", "year": 2025, "date": "2025-03-27", "url": "https://doi.org/10.48550/arxiv.2503.21614", "authors": "Xiaoye Qu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S4"}, {"id": "E136", "text": "This research delves into long chain-of-thought (long-CoT) reasoning using a value-based reinforcement learning framework.", "title": "VAPO: Efficient and Reliable Reinforcement Learning for Advanced Reasoning Tasks", "year": 2025, "date": "2025-04-07", "url": "https://doi.org/10.48550/arxiv.2504.05118", "authors": "Yue Yu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S4"}, {"id": "E137", "text": "Developed through long chain-of-thought (CoT) supervised fine-tuning (SFT) and reinforcement learning (RL), the latest model exhibits strong long-horizon reasoning capabilities (64.0 on MMMU, 46.3 on MMMU-Pro, 56.9 on MathVision, 80.1 on MathVista, 65.2 on VideoMMMU) while obtaining robust general abilities.", "title": "Kimi-VL Technical Report", "year": 2025, "date": "2025-04-10", "url": "https://doi.org/10.48550/arxiv.2504.07491", "authors": "Kimi Team et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S4"}, {"id": "E138", "text": "Recent advances in large reasoning language models (LRLMs) rely on test-time scaling, which extends long chain-of-thought (CoT) generation to solve complex tasks.", "title": "Dynamic Early Exit in Reasoning Models", "year": 2025, "date": "2025-04-22", "url": "https://doi.org/10.48550/arxiv.2504.15895", "authors": "Chenxu Yang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S4"}, {"id": "E139", "text": "Then, we explore the effectiveness of five prompting techniques (zero-shot, few-shot, chain-of-thought, critique, and expert) in adapting LLMs to code summarization tasks.", "title": "Source Code Summarization in the Era of Large Language Models", "year": 2025, "date": "2025-04-26", "url": "https://doi.org/10.1109/icse55347.2025.00034", "authors": "Weisong Sun et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E140", "text": "The proofs of resolved subgoals are synthesized into a chain-of-thought process, combined with DeepSeek-V3's step-by-step reasoning, to create an initial cold start for reinforcement learning.", "title": "DeepSeek-Prover-V2: Advancing Formal Mathematical Reasoning via Reinforcement Learning for Subgoal Decomposition", "year": 2025, "date": "2025-04-30", "url": "https://doi.org/10.48550/arxiv.2504.21801", "authors": "Z. Z. Ren et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E141", "text": "Inspired by recent advances of long chain-of-thought on reasoning-intensive tasks, we hypothesize and validate that integrating reasoning into reward modeling significantly enhances RM's interpretability and performance.", "title": "RM-R1: Reward Modeling as Reasoning", "year": 2025, "date": "2025-05-05", "url": "https://doi.org/10.48550/arxiv.2505.02387", "authors": "Xiusi Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S4"}, {"id": "E142", "text": "Our framework mitigates risks such as prompt injection, agent misalignment, and insecure code risks through three powerful guardrails: PromptGuard 2, a universal jailbreak detector that demonstrates clear state of the art performance; Agent Alignment Checks, a chain-of-thought auditor that inspects agent reasoning for prompt injection and goal misalignment, which, while still experimental, shows stronger efficacy at preventing indirect injection…", "title": "LlamaFirewall: An open source guardrail system for building secure AI agents", "year": 2025, "date": "2025-05-06", "url": "https://doi.org/10.48550/arxiv.2505.03574", "authors": "Sahana Chennabasappa et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E143", "text": "Both foundational and advanced prompt engineering methodologies-including techniques such as self-consistency, chain of thought, and generated knowledge, which can significantly enhance the performance of models-are explored in this paper.", "title": "Unleashing the potential of prompt engineering for large language models", "year": 2025, "date": "2025-05-08", "url": "https://doi.org/10.1016/j.patter.2025.101260", "authors": "B.‐C. CHEN et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E144", "text": "Chain-of-thought (CoT) offers a potential boon for AI safety as it allows monitoring a model's CoT to try to understand its intentions and reasoning processes.", "title": "Reasoning Models Don't Always Say What They Think", "year": 2025, "date": "2025-05-08", "url": "https://doi.org/10.48550/arxiv.2505.05410", "authors": "Yanda Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E145", "text": "We also show how GPT-4's behaviour can be modulated by providing additional information about its opponent and by using a 'social chain-of-thought' strategy.", "title": "Playing repeated games with large language models", "year": 2025, "date": "2025-05-08", "url": "https://doi.org/10.1038/s41562-025-02172-y", "authors": "Elif Akata et al.", "fromTitle": false, "field": "Decision Sciences", "inSet": 0, "sense": "S2"}, {"id": "E146", "text": "Chain-of-thought reasoning has significantly improved the performance of Large Language Models (LLMs) across various domains.", "title": "Pixel Reasoner: Incentivizing Pixel-Space Reasoning with Curiosity-Driven Reinforcement Learning", "year": 2025, "date": "2025-05-21", "url": "https://doi.org/10.48550/arxiv.2505.15966", "authors": "Haozhe Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E147", "text": "We identify the importance of incorporating high-quality reasoning data with long Chain-of-Thought into pre-training stages, and the benefits of mixed RL despite challenges in simultaneous multi-domain optimization.", "title": "MiMo-VL Technical Report", "year": 2025, "date": "2025-06-04", "url": "https://doi.org/10.48550/arxiv.2506.03569", "authors": "Core Team et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S4"}, {"id": "E148", "text": "Notably, prevailing linguistic reasoning techniques (e.g., chain-of-thought, self-consistency, tree-of-thoughts) fail to improve performance, whereas explicitly generating cognitive maps during question-answering enhances MLLMs’ spatial distance ability.", "title": "Thinking in Space: How Multimodal Large Language Models See, Remember, and Recall Spaces", "year": 2025, "date": "2025-06-10", "url": "https://doi.org/10.1109/cvpr52734.2025.00994", "authors": "Jihan Yang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S2"}, {"id": "E149", "text": "In this paper, we introduce a method that incorporates explicit visual chain-of-thought (CoT) reasoning into vision-language-action models (VLAs) by predicting future image frames autoregressively as visual goals before generating a short action sequence to achieve these goals.", "title": "CoT-VLA: Visual Chain-of-Thought Reasoning for Vision-Language-Action Models", "year": 2025, "date": "2025-06-10", "url": "https://doi.org/10.1109/cvpr52734.2025.00166", "authors": "Qingqing Zhao et al.", "fromTitle": false, "field": "Engineering", "inSet": 2, "sense": "S3"}, {"id": "E150", "text": "We also explore the model’s reasoning capabilities and potential applications of the chain-of-thought mechanism.", "title": "OmniGen: Unified Image Generation", "year": 2025, "date": "2025-06-10", "url": "https://doi.org/10.1109/cvpr52734.2025.01241", "authors": "Shitao Xiao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E151", "text": "Large Language Models (LLMs) demonstrate enhanced capabilities and reliability by reasoning more, evolving from Chain-of-Thought prompting to product-level solutions like OpenAI o1.", "title": "Insight-V: Exploring Long-Chain Visual Reasoning with Multimodal Large Language Models", "year": 2025, "date": "2025-06-10", "url": "https://doi.org/10.1109/cvpr52734.2025.00847", "authors": "Yuhao Dong et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S4"}, {"id": "E152", "text": "Current large language models (LLMs) primarily employ Chain-of-Thought (CoT) techniques, which suffer from brittle task decomposition, extensive data requirements, and high latency.", "title": "Hierarchical Reasoning Model", "year": 2025, "date": "2025-06-26", "url": "https://doi.org/10.48550/arxiv.2506.21734", "authors": "Wang, Guan et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E153", "text": "Each sample includes a database, SQL query, natural language question, and chain-of-thought (CoT) solution.", "title": "OmniSQL: Synthesizing High-Quality Text-to-SQL Data at Scale", "year": 2025, "date": "2025-07-01", "url": "https://doi.org/10.14778/3749646.3749723", "authors": "Haoyang Li et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E154", "text": "Chain of Thought Monitorability: A New and Fragile Opportunity for AI Safety", "title": "Chain of Thought Monitorability: A New and Fragile Opportunity for AI Safety", "year": 2025, "date": "2025-07-15", "url": "https://doi.org/10.48550/arxiv.2507.11473", "authors": "Tomek Korbak et al.", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E155", "text": "Recent breakthroughs, exemplified by large language models (LLMs) 1,2 and chain-of-thought (CoT) prompting 3 , have achieved considerable success on foundational reasoning tasks.", "title": "DeepSeek-R1 incentivizes reasoning in LLMs through reinforcement learning", "year": 2025, "date": "2025-09-17", "url": "https://doi.org/10.1038/s41586-025-09422-z", "authors": "Daya Guo et al.", "fromTitle": false, "field": "Computer Science", "inSet": 30, "sense": "S2"}, {"id": "E156", "text": "Notably, structured prompt strategies such as chain-of-thought (CoT) prompting significantly reduce hallucinations in prompt-sensitive scenarios, though intrinsic model limitations persist in some cases.", "title": "Survey and analysis of hallucinations in large language models: attribution to prompting strategies or model behavior", "year": 2025, "date": "2025-09-30", "url": "https://doi.org/10.3389/frai.2025.1622292", "authors": "Dang Anh-Hoang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E157", "text": "Recent studies generally enhance MLLMs' reasoning capabilities via supervised fine-tuning on high-quality chain-of-thought reasoning data, which often leads models to merely imitate successful reasoning paths without understanding what the wrong reasoning paths are.", "title": "R1-VL: Learning to Reason with Multimodal Large Language Models via Step-Wise Group Relative Policy Optimization", "year": 2025, "date": "2025-10-19", "url": "https://doi.org/10.1109/iccv51701.2025.00181", "authors": "Jingyi Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E158", "tex
