t": "However, a new in-context learning approach, Chain-of-thought, has demonstrated strong multi-step reasoning abilities on these benchmarks.", "title": "Multi-Step Reasoning with Large Language Models, a Survey", "year": 2025, "date": "2025-11-05", "url": "https://doi.org/10.1145/3774896", "authors": "Aske Plaat et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E159", "text": "These challenges limit the effectiveness of conventional supervised fine-tuning (SFT) and Chain-of-Thought (CoT) strategies that work well in general domains.", "title": "Med-R1: Reinforcement Learning for Generalizable Medical Reasoning in Vision-Language Models", "year": 2026, "date": "2026-02-03", "url": "https://doi.org/10.1109/tmi.2026.3661001", "authors": "Yuxiang Lai et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E160", "text": "A central factor in their success lies in the application of long chain-of-thought (Long CoT) characteristics, which enhance reasoning abilities and enable the solution of intricate problems.", "title": "Towards reasoning era: a survey of long chain-of-thought for reasoning large language models", "year": 2026, "date": "2026-05-12", "url": "https://doi.org/10.1007/s11432-025-4665-8", "authors": "Qiguang Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S4"}], "total": 12091, "model": "claude-opus-5-5", "generated": "2026-11-17", "lang": "zh", "meaning": "", "focus": "本时间线追踪“思维链”在大语言模型中的含义：让模型在给出答案前生成一系列中间推理步骤，最初是一种提示技术，后来也指模型训练和输出中的推理过程。", "otherSenses": [{"label": "日常用语：思路", "meaning": "普通英语中的“一连串想法、思路或论证脉络”，与人工智能无关。", "evidence": [{"id": "E3", "text": "What has started our chain of thought is the following: I have often observed that a small group or clique can run an organization once it gets into office.", "title": "THE SECRETARY'S OFFICE", "year": 1953, "date": "1953-09-28", "url": "https://doi.org/10.1021/cen-v031n039.p4028", "authors": "ALDEN H. EMERY", "fromTitle": false, "field": "Business, Management and Accounting", "inSet": 0, "sense": "S1"}, {"id": "E4", "text": "The latter are said to be the product of free will, which is omnipotent enough to create the first link in a chain of thought or conduct.", "title": "SOME OBSERVATIONS ON THE RELATIONSHIP BETWEEN PSYCHIATRY AND THE LAW", "year": 1956, "date": "1956-03-01", "url": "https://doi.org/10.1001/archneurpsyc.1956.02330210077008", "authors": "THOMAS S. SZASZ", "fromTitle": false, "field": "Psychology", "inSet": 0, "sense": "S1"}, {"id": "E5", "text": "The chain of thought from physical system to presentation of results in the analog computer simulation of an orbiting spacecraft", "title": "The chain of thought from physical system to presentation of results in the analog computer simulation of an orbiting spacecraft", "year": 1962, "date": "1962-01-01", "url": "https://openalex.org/W3189085351", "authors": "J D Cavanagh", "fromTitle": true, "field": "Engineering", "inSet": 0, "sense": "S1"}, {"id": "E6", "text": "Where then do ceramics slot into this chain of thought?", "title": "Ceramics take to the Air", "year": 1975, "date": "1975-01-01", "url": "https://doi.org/10.1108/eb035214", "authors": "E.R. Danks", "fromTitle": false, "field": "Materials Science", "inSet": 0, "sense": "S1"}, {"id": "E7", "text": "Most people would agree that moralising interruptions disrupt the reader's chain of thought and weaken his hold on the world which the narrator is creating.", "title": "Judgement and Atmosphere in Epic", "year": 1976, "date": "1976-01-01", "url": "https://doi.org/10.1017/s0048671x00004276", "authors": "David M. Gaunt", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E8", "text": "But just knowing that an alternative set of beliefs exists and is held, let us say, by infidels may start a chain of thought like this: here are two sets of beliefs that contradict one another; they cannot both be true, so one of them must be false; but if one is false the other may be false also, so there may be no true belief.", "title": "Critical Innocence and Straight Reading", "year": 1985, "date": "1985-01-01", "url": "https://doi.org/10.2307/468986", "authors": "Peter Caws", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E9", "text": "This article presents this chain of thought and explains the essential role of special and general relativity in the GPS.", "title": "Relativistic effects in the global positioning system", "year": 1988, "date": "1988-01-01", "url": "https://openalex.org/W293809360", "authors": "Neil Ashby", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S1"}, {"id": "E10", "text": "A narratological examination of the Gospel of Mark reveals further links in the Lohmeyer-Lightfoot-Marxsen chain of thought, al­ though at times correctives are suggested. 1.", "title": "ruimtes d ie Markusevangelie: 'n Kontinuering van d ie Lohmeyer- Lightfoot-Marxse n", "year": 1988, "date": "1988-01-01", "url": "https://openalex.org/W2340920152", "authors": "Ernest Van Eck", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E11", "text": "On one hand, the language of lyric poetry, even in its self-enclosed non-referentiality, gives rise to a chain of thought by which the poet is required to accept his finite, self-consciously fragmented condition as the basis for his art, which means he must reconceive his work in terms of mimetic rather than logical or structural considerations. “Die Gestalt erledigt das Problem” (P4 144).", "title": "Death and the fools", "year": 1988, "date": "1988-06-02", "url": "https://doi.org/10.1017/cbo9780511735660.005", "authors": "Benjamin K. Bennett", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E12", "text": "Thus shifts in argument. were found to be more difficult to comprehend than a continuous chain of thought.", "title": "Redundancy and the cohesion doze", "year": 1990, "date": "1990-02-01", "url": "https://doi.org/10.1111/j.1467-9817.1990.tb00320.x", "authors": "Marsha Bensoussan", "fromTitle": false, "field": "Psychology", "inSet": 0, "sense": "S1"}, {"id": "E13", "text": "The achievements of today are the cumulative results of unknown numbers of workers providing an unbroken chain of thought through time.", "title": "Geographers: Biobibliographical Studies, 1977-2000", "year": 2000, "date": "2000-04-01", "url": "https://doi.org/10.1111/j.1931-0846.2000.tb00335.x", "authors": "Patrick Hamilton Armstrong et al.", "fromTitle": false, "field": "Social Sciences", "inSet": 0, "sense": "S1"}, {"id": "E14", "text": "A piece of advice for the taxonomists amongst the readers of this book, I recommend you refer to Harris (1995) to further understand his concepts and chain of thought for the true shrikes.", "title": "Shrikes and Bush-Shrikes: Including Wood-Shrikes, Helmet-Shrikes, Flycatcher-Shrikes, Philentomas, Batises and Wattle-Eyes T. Harris K. Franklin", "year": 2003, "date": "2003-01-01", "url": "https://doi.org/10.1093/auk/120.1.239", "authors": "Reuven Yosef", "fromTitle": false, "field": "Environmental Science", "inSet": 0, "sense": "S1"}, {"id": "E15", "text": "To do the office work well, firstly, we should define the task, straighten out the work chain of thought, and carry out the work creatively; secondly, we should grasp the major contradictions, stress the main points and enhance the work level; thirdly, we should improve the quality of the staff in order to meet the work needs under the new circumstances.", "title": "The Thought on Enhancing the Office Work of the Colleges and Universities under the New Circumstances", "year": 2003, "date": "2003-01-01", "url": "https://openalex.org/W2359639092", "authors": "Guo Peng", "fromTitle": false, "field": "Business, Management and Accounting", "inSet": 0, "sense": "S1"}, {"id": "E16", "text": "We introduced the various conclusions involved in our conceptual framework in detail in Chapter 3, Chapter 7, and Chapter 10 to enable readers to see the chain of thought in the same sequence in which it was developed.", "title": "Memory and Whole-Brain Work: Draft of a Theory Based on EEG Oscillations", "year": 2004, "date": "2004-06-23", "url": "https://doi.org/10.1201/9780203298732-21", "authors": "Erol Basar", "fromTitle": false, "field": "Neuroscience", "inSet": 0, "sense": "S1"}, {"id": "E17", "text": "Chain of Thought in Dreams?'2", "title": "Artists and the dream in nineteenth-century Paris: Towards a prehistory of surrealism STEFANIE HERAEUS (transl. Deborah Laurie Cohen)", "year": 2004, "date": "2004-08-02", "url": "https://doi.org/10.4324/9780203646977-12", "authors": "Stefanie Heraeus", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E18", "text": "He interrupts his chain of thought briefly to talk about a 15 year-old with melanoma on whom he is scheduled to operate in the morning: “Melanoma is hitting younger and younger people,” he said. “We really have to keep up the educational efforts.” Biggest Challenge: ASCO's Big Growth His biggest challenge, he said, is managing “the stunning growth” of an organization that has added 2,000 new members each year for the past five years. “We have to…", "title": "Varied Roles for ASCO EVP Charles M. Balch, MD", "year": 2005, "date": "2005-09-25", "url": "https://doi.org/10.1097/01.cot.0000294692.38669.18", "authors": "Charlene Laino", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S1"}, {"id": "E19", "text": "One of the most prominent stylistic means applied by Woolf is her ‘train of thought’, linking one reflection to another like wagons in a railway convoy or like loops in a chain (therefore also sometimes referred to as ‘chain of thought’ in dictionaries).", "title": "Chained Thoughts Broken by Chains of Thought : An Analysis of the Narrative Style Used in Virginia Woolf's A Room of One's Own", "year": 2006, "date": "2006-01-01", "url": "https://openalex.org/W582236113", "authors": "Ellen Johansson", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E20", "text": "Yet in spite of this arguable \"missing link,\" we can re-construct some of Tolkien's chain of thought from the extant materials.", "title": "The Homecoming of Beorhtnoth: Philology and the Literary Muse", "year": 2007, "date": "2007-01-01", "url": "https://doi.org/10.1353/tks.2007.0021", "authors": "Thomas M. Honegger", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E21", "text": "An important link in that chain of thought is the work of Jean-Baptiste Say. 1 Austrians have recognized Say’s contributions to economics in general and his link to the Austrian School of thought in particular, 2 particularly his work in the areas of methodology, entrepreneurship, monetary theory, and the theory of value. 3 Say is particularly famous for his Law of Markets, arguing that the problem that limits wealth is not underconsumption (com…", "title": "Jean-Baptiste Say, The Father of Austrian Public Finance: Views on Taxation", "year": 2007, "date": "2007-06-14", "url": "https://doi.org/10.1007/s12113-007-9004-4", "authors": "Mark Brandly", "fromTitle": false, "field": "Economics, Econometrics and Finance", "inSet": 0, "sense": "S1"}]}], "senses": [{"key": "S1", "label": "日常用语：思路", "definition": "普通英语中的“一连串想法、思路或论证脉络”，与人工智能无关。", "related": false}, {"key": "S2", "label": "思维链提示", "definition": "一种提示技术：在示例或指令中引导大语言模型先写出中间推理步骤，再给出答案。", "related": true}, {"key": "S3", "label": "思维链推理过程", "definition": "模型生成的逐步推理文本或过程，可用作训练数据、蒸馏对象、监控对象，也可扩展到多模态和具身场景。", "related": true}, {"key": "S4", "label": "长思维链", "definition": "推理模型（如 o1、DeepSeek-R1）通过强化学习等训练获得的长推理序列，并在推理时扩展这一序列的长度以提升效果。", "related": true}], "evidenceCount": 160, "eras": [{"start": 2022, "end": 2022, "label": "提示技术的诞生", "meaning": "思维链指一种提示方法：在示例中给出中间推理步骤，从而引出大语言模型的多步推理能力，主要用于算术和符号推理。", "evidence": [{"id": "E22", "text": "We explore how generating a chain of thought -- a series of intermediate reasoning steps -- significantly improves the ability of large language models to perform complex reasoning.", "title": "Chain-Of-Thought Prompting Elicits Reasoning in Large Language Models", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.52202/068431-1800", "authors": "Jason Wei et al.", "fromTitle": false, "field": "Computer Science", "inSet": 132, "sense": "S2"}, {"id": "E23", "text": "Notably, chain of thought (CoT) prompting, a recent technique for eliciting complex multi-step reasoning through step-by-step answer examples, achieved the state-of-the-art performances in arithmetics and symbolic reasoning, difficult system-2 tasks that do not follow the standard scaling laws for LLMs.", "title": "Large Language Models Are Zero-Shot Reasoners", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.52202/068431-1613", "authors": "Takeshi Kojima et al.", "fromTitle": false, "field": "Computer Science", "inSet": 62, "sense": "S2"}, {"id": "E25", "text": "Chain-of-thought prompting combined with pre-trained large language models has achieved encouraging results on complex reasoning tasks.", "title": "Self-Consistency Improves Chain of Thought Reasoning in Language Models", "year": 2022, "date": "2022-03-21", "url": "https://doi.org/10.48550/arxiv.2203.11171", "authors": "Xuezhi Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 55, "sense": "S2"}, {"id": "E27", "text": "Chain-of-thought prompting has demonstrated remarkable performance on various natural language reasoning tasks.", "title": "Least-to-Most Prompting Enables Complex Reasoning in Large Language Models", "year": 2022, "date": "2022-05-21", "url": "https://doi.org/10.48550/arxiv.2205.10625", "authors": "Denny Zhou et al.", "fromTitle": false, "field": "Computer Science", "inSet": 34, "sense": "S2"}, {"id": "E29", "text": "Large language models (LLMs) have shown remarkable reasoning capabilities given chain-of-thought prompts (examples with intermediate reasoning steps).", "title": "Language Models Are Greedy Reasoners: A Systematic Formal Analysis of Chain-of-Thought", "year": 2022, "date": "2022-10-03", "url": "https://doi.org/10.48550/arxiv.2210.01240", "authors": "Abulhair Saparov et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S2"}, {"id": "E31", "text": "Providing these steps for prompting demonstrations is called chain-of-thought (CoT) prompting.", "title": "Automatic Chain of Thought Prompting in Large Language Models", "year": 2022, "date": "2022-10-07", "url": "https://doi.org/10.48550/arxiv.2210.03493", "authors": "Zhuosheng Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 19, "sense": "S2"}, {"id": "E32", "text": "We find that applying chain-of-thought (CoT) prompting to BBH tasks enables PaLM to surpass the average human-rater performance on 10 of the 23 tasks, and Codex (code-davinci-002) to surpass the average human-rater performance on 17 of the 23 tasks.", "title": "Challenging BIG-Bench Tasks and Whether Chain-of-Thought Can Solve Them", "year": 2022, "date": "2022-10-17", "url": "https://doi.org/10.48550/arxiv.2210.09261", "authors": "Mirac Süzgün et al.", "fromTitle": false, "field": "Computer Science", "inSet": 24, "sense": "S2"}]}, {"start": 2023, "end": 2024, "label": "扩展、训练与质疑", "meaning": "思维链从单纯的提示技巧扩展为可用于微调、蒸馏、多模态、机器人和检索的推理过程，同时其忠实性和适用范围开始受到质疑。", "evidence": [{"id": "E33", "text": "In this paper we explore instruction finetuning with a particular focus on (1) scaling the number of tasks, (2) scaling the model size, and (3) finetuning on chain-of-thought data.", "title": "Scaling Instruction-Finetuned Language Models", "year": 2022, "date": "2022-10-20", "url": "https://doi.org/10.48550/arxiv.2210.11416", "authors": "Hyung Won Chung et al.", "fromTitle": false, "field": "Computer Science", "inSet": 30, "sense": "S3"}, {"id": "E35", "text": "To surmount these challenges, we introduce a new framework for language model inference, Tree of Thoughts (ToT), which generalizes over the popular Chain of Thought approach to prompting language models, and enables exploration over coherent units of text (thoughts) that serve as intermediate steps toward problem solving.", "title": "Tree of Thoughts: Deliberate Problem Solving with Large Language Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-0517", "authors": "Shunyu Yao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 24, "sense": "S2"}, {"id": "E36", "text": "Large Language Models (LLMs) can achieve strong performance on many tasks by producing step-by-step reasoning before giving a final output, often referred to as chain-of-thought reasoning (CoT).", "title": "Language Models Don't Always Say What They Think: Unfaithful Explanations in Chain-of-Thought Prompting", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-3275", "authors": "Miles Turpin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 9, "sense": "S3"}, {"id": "E51", "text": "Step-by-step reasoning approaches like chain of thought (CoT) have proved to be very effective in inducing reasoning capabilities in large language models.However, the success of the CoT approach is fundamentally tied to the model size, and billion parameter-scale models are often needed to get CoT to work.In this paper, we propose a knowledge distillation approach that leverages the step-by-step CoT reasoning capabilities of larger models and d…", "title": "Distilling Reasoning Capabilities into Smaller Language Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.findings-acl.441", "authors": "Kumar Shridhar et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E59", "text": "Large language models (LLMs) have shown impressive performance on complex reasoning by leveraging chain-of-thought (CoT) prompting to generate intermediate reasoning chains as the rationale to infer the answer.", "title": "Multimodal Chain-of-Thought Reasoning in Language Models", "year": 2023, "date": "2023-02-02", "url": "https://doi.org/10.48550/arxiv.2302.00923", "authors": "Zhuosheng Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 12, "sense": "S2"}, {"id": "E64", "text": "Large language models (LLMs) perform better when they produce step-by-step, \"Chain-of-Thought\" (CoT) reasoning before answering a question, but it is unclear if the stated reasoning is a faithful explanation of the model's actual reasoning (i.e., its process for answering the question).", "title": "Measuring Faithfulness in Chain-of-Thought Reasoning", "year": 2023, "date": "2023-07-17", "url": "https://doi.org/10.48550/arxiv.2307.13702", "authors": "Tamera Lanham et al.", "fromTitle": false, "field": "Computer Science", "inSet": 11, "sense": "S3"}, {"id": "E65", "text": "We further show that incorporating chain of thought reasoning allows RT-2 to perform multi-stage semantic reasoning, for example figuring out which object to pick up for use as an improvised hammer (a rock), or which type of drink is best suited for someone who is tired (an energy drink).", "title": "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control", "year": 2023, "date": "2023-07-28", "url": "https://doi.org/10.48550/arxiv.2307.15818", "authors": "Anthony Brohan et al.", "fromTitle": false, "field": "Engineering", "inSet": 5, "sense": "S3"}, {"id": "E72", "text": "Visual CoT: Advancing Multi-Modal Language Models with a Comprehensive Dataset and Benchmark for Chain-of-Thought Reasoning", "title": "Visual CoT: Advancing Multi-Modal Language Models with a Comprehensive Dataset and Benchmark for Chain-of-Thought Reasoning", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.52202/079017-0275", "authors": "Hao Shao et al.", "fromTitle": true, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E106", "text": "Chain-of-thought (CoT) via prompting is the de facto method for eliciting reasoning capabilities from large language models (LLMs).", "title": "To CoT or not to CoT? Chain-of-thought helps mainly on math and symbolic reasoning", "year": 2024, "date": "2024-09-18", "url": "https://doi.org/10.48550/arxiv.2409.12183", "authors": "Zayne Sprague et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S2"}]}, {"start": 2025, "end": 2026, "label": "推理模型的长思维链", "meaning": "思维链主要指推理模型经强化学习训练后生成的长推理序列，研究重点转向长度扩展、压缩效率以及安全监控。", "evidence": [{"id": "E111", "text": "The o1 model series is trained with large-scale reinforcement learning to reason using chain of thought.", "title": "OpenAI o1 System Card", "year": 2024, "date": "2024-12-21", "url": "https://doi.org/10.48550/arxiv.2412.16720", "authors": "OpenAI et al.", "fromTitle": false, "field": "Computer Science", "inSet": 15, "sense": "S4"}, {"id": "E115", "text": "Chain-of-Thought (CoT) has been proven effective in enhancing the reasoning capabilities of large language models (LLMs).Recent advancements, such as OpenAI's o1 and DeepSeek-R1, suggest that scaling up the length of CoT sequences during inference could further boost LLM reasoning performance.However, due to the autoregressive nature of LLM decoding, longer CoT outputs lead to a linear increase in inference latency, adversely affecting user expe…", "title": "TokenSkip: Controllable Chain-of-Thought Compression in LLMs", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.18653/v1/2025.emnlp-main.165", "authors": "Heming Xia et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S4"}, {"id": "E127", "text": "Demystifying Long Chain-of-Thought Reasoning in LLMs", "title": "Demystifying Long Chain-of-Thought Reasoning in LLMs", "year": 2025, "date": "2025-02-05", "url": "https://doi.org/10.48550/arxiv.2502.03373", "authors": "Edward Yeo et al.", "fromTitle": true, "field": "Computer Science", "inSet": 5, "sense": "S4"}, {"id": "E132", "text": "Reasoning language models have shown an uncanny ability to improve performance at test-time by ``thinking longer''-that is, by generating longer chain-of-thought sequences and hence using more compute.", "title": "L1: Controlling How Long A Reasoning Model Thinks With Reinforcement Learning", "year": 2025, "date": "2025-03-06", "url": "https://doi.org/10.48550/arxiv.2503.04697", "authors": "Pranjal Aggarwal et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S4"}, {"id": "E135", "text": "Recent Large Reasoning Models (LRMs), such as DeepSeek-R1 and OpenAI o1, have demonstrated strong performance gains by scaling up the length of Chain-of-Thought (CoT) reasoning during inference.", "title": "A Survey of Efficient Reasoning for Large Reasoning Models: Language, Multimodality, and Beyond", "year": 2025, "date": "2025-03-27", "url": "https://doi.org/10.48550/arxiv.2503.21614", "authors": "Xiaoye Qu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S4"}, {"id": "E136", "text": "This research delves into long chain-of-thought (long-CoT) reasoning using a value-based reinforcement learning framework.", "title": "VAPO: Efficient and Reliable Reinforcement Learning for Advanced Reasoning Tasks", "year": 2025, "date": "2025-04-07", "url": "https://doi.org/10.48550/arxiv.2504.05118", "authors": "Yue Yu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S4"}, {"id": "E144", "text": "Chain-of-thought (CoT) offers a potential boon for AI safety as it allows monitoring a model's CoT to try to understand its intentions and reasoning processes.", "title": "Reasoning Models Don't Always Say What They Think", "year": 2025, "date": "2025-05-08", "url": "https://doi.org/10.48550/arxiv.2505.05410", "authors": "Yanda Chen et al.", "fromTitle": false, ersal Self-Consistency for Large Language Model Generation", "year": 2023, "date": "2023-11-29", "url": "https://doi.org/10.48550/arxiv.2311.17311", "authors": "Xinyun Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}], "checks": {"inSense": true, "coinage": false}, "shift": ""}, {"year": 2022, "kind": "redefined", "title": "Scaling Instruction-Finetuned Language Models", "why": "思维链开始被用作微调数据，从一种提示手段扩展为一种训练资源。", "url": "https://doi.org/10.48550/arxiv.2210.11416", "date": "2022-10-20", "workTitle": "Scaling Instruction-Finetuned Language Models", "authors": "Hyung Won Chung et al.", "link": "in-sample", "evidence": [{"id": "E33", "text": "In this paper we explore instruction finetuning with a particular focus on (1) scaling the number of tasks, (2) scaling the model size, and (3) finetuning on chain-of-thought data.", "title": "Scaling Instruction-Finetuned Language Models", "year": 2022, "date": "2022-10-20", "url": "https://doi.org/10.48550/arxiv.2210.11416", "authors": "Hyung Won Chung et al.", "fromTitle": false, "field": "Computer Science", "inSet": 30, "sense": "S3"}, {"id": "E58", "text": "We find task balancing and enrichment techniques are overlooked but critical to effective instruction tuning, and in particular, training with mixed prompt settings (zero-shot, few-shot, and chain-of-thought) actually yields stronger (2%+) performance in all settings.", "title": "The Flan Collection: Designing Data and Methods for Effective Instruction Tuning", "year": 2023, "date": "2023-01-31", "url": "https://doi.org/10.48550/arxiv.2301.13688", "authors": "Shayne Longpre et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S2"}], "checks": {"inSense": true, "coinage": false}, "shift": "broadening"}, {"year": 2023, "kind": "redefined", "title": "Tree of Thoughts: Deliberate Problem Solving with Large Language Models", "why": "思维树把线性的思维链推广为可探索的树状结构，催生了一系列“X-of-Thought”变体。", "url": "https://doi.org/10.52202/075280-0517", "date": "2023-01-01", "workTitle": "Tree of Thoughts: Deliberate Problem Solving with Large Language Models", "authors": "Shunyu Yao et al.", "link": "in-sample", "evidence": [{"id": "E35", "text": "To surmount these challenges, we introduce a new framework for language model inference, Tree of Thoughts (ToT), which generalizes over the popular Chain of Thought approach to prompting language models, and enables exploration over coherent units of text (thoughts) that serve as intermediate steps toward problem solving.", "title": "Tree of Thoughts: Deliberate Problem Solving with Large Language Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-0517", "authors": "Shunyu Yao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 24, "sense": "S2"}, {"id": "E94", "text": "We introduce Graph of Thoughts (GoT): a framework that advances prompting capabilities in large language models (LLMs) beyond those offered by paradigms such as Chain-of-Thought or Tree of Thoughts (ToT).", "title": "Graph of Thoughts: Solving Elaborate Problems with Large Language Models", "year": 2024, "date": "2024-03-24", "url": "https://doi.org/10.1609/aaai.v38i16.29720", "authors": "Maciej Besta et al.", "fromTitle": false, "field": "Computer Science", "inSet": 10, "sense": "S2"}], "checks": {"inSense": true, "coinage": false}, "shift": "broadening"}, {"year": 2023, "kind": "critique", "title": "Language Models Don't Always Say What They Think: Unfaithful Explanations in Chain-of-Thought Prompting", "why": "该研究质疑思维链是否忠实反映模型的真实推理过程。", "url": "https://doi.org/10.52202/075280-3275", "date": "2023-01-01", "workTitle": "Language Models Don't Always Say What They Think: Unfaithful Explanations in Chain-of-Thought Prompting", "authors": "Miles Turpin et al.", "link": "in-sample", "evidence": [{"id": "E36", "text": "Large Language Models (LLMs) can achieve strong performance on many tasks by producing step-by-step reasoning before giving a final output, often referred to as chain-of-thought reasoning (CoT).", "title": "Language Models Don't Always Say What They Think: Unfaithful Explanations in Chain-of-Thought Prompting", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-3275", "authors": "Miles Turpin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 9, "sense": "S3"}, {"id": "E64", "text": "Large language models (LLMs) perform better when they produce step-by-step, \"Chain-of-Thought\" (CoT) reasoning before answering a question, but it is unclear if the stated reasoning is a faithful explanation of the model's actual reasoning (i.e., its process for answering the question).", "title": "Measuring Faithfulness in Chain-of-Thought Reasoning", "year": 2023, "date": "2023-07-17", "url": "https://doi.org/10.48550/arxiv.2307.13702", "authors": "Tamera Lanham et al.", "fromTitle": false, "field": "Computer Science", "inSet": 11, "sense": "S3"}, {"id": "E133", "text": "Recent studies indicate that when faced with explicit biases in prompts, models often omit mentioning these biases in their Chain-of-Thought (CoT) output, revealing that verbalized reasoning can give an incorrect picture of how models arrive at conclusions (unfaithfulness).", "title": "Chain-of-Thought Reasoning In The Wild Is Not Always Faithful", "year": 2025, "date": "2025-03-11", "url": "https://doi.org/10.48550/arxiv.2503.08679", "authors": "Iván Arcuschin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}], "checks": {"inSense": true, "coinage": false}, "shift": ""}, {"year": 2023, "kind": "applied", "title": "Multimodal Chain-of-Thought Reasoning in Language Models", "why": "思维链被引入多模态模型，并进一步延伸到视觉和机器人控制领域。", "url": "https://doi.org/10.48550/arxiv.2302.00923", "date": "2023-02-02", "workTitle": "Multimodal Chain-of-Thought Reasoning in Language Models", "authors": "Zhuosheng Zhang et al.", "link": "in-sample", "evidence": [{"id": "E59", "text": "Large language models (LLMs) have shown impressive performance on complex reasoning by leveraging chain-of-thought (CoT) prompting to generate intermediate reasoning chains as the rationale to infer the answer.", "title": "Multimodal Chain-of-Thought Reasoning in Language Models", "year": 2023, "date": "2023-02-02", "url": "https://doi.org/10.48550/arxiv.2302.00923", "authors": "Zhuosheng Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 12, "sense": "S2"}, {"id": "E65", "text": "We further show that incorporating chain of thought reasoning allows RT-2 to perform multi-stage semantic reasoning, for example figuring out which object to pick up for use as an improvised hammer (a rock), or which type of drink is best suited for someone who is tired (an energy drink).", "title": "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control", "year": 2023, "date": "2023-07-28", "url": "https://doi.org/10.48550/arxiv.2307.15818", "authors": "Anthony Brohan et al.", "fromTitle": false, "field": "Engineering", "inSet": 5, "sense": "S3"}, {"id": "E72", "text": "Visual CoT: Advancing Multi-Modal Language Models with a Comprehensive Dataset and Benchmark for Chain-of-Thought Reasoning", "title": "Visual CoT: Advancing Multi-Modal Language Models with a Comprehensive Dataset and Benchmark for Chain-of-Thought Reasoning", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.52202/079017-0275", "authors": "Hao Shao et al.", "fromTitle": true, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E149", "text": "In this paper, we introduce a method that incorporates explicit visual chain-of-thought (CoT) reasoning into vision-language-action models (VLAs) by predicting future image frames autoregressively as visual goals before generating a short action sequence to achieve these goals.", "title": "CoT-VLA: Visual Chain-of-Thought Reasoning for Vision-Language-Action Models", "year": 2025, "date": "2025-06-10", "url": "https://doi.org/10.1109/cvpr52734.2025.00166", "authors": "Qingqing Zhao et al.", "fromTitle": false, "field": "Engineering", "inSet": 2, "sense": "S3"}], "checks": {"inSense": true, "coinage": false}, "shift": "new field"}, {"year": 2024, "kind": "critique", "title": "To CoT or not to CoT? Chain-of-thought helps mainly on math and symbolic reasoning", "why": "该文指出思维链主要在数学和符号推理任务上有效，限定了它的适用范围。", "url": "https://doi.org/10.48550/arxiv.2409.12183", "date": "2024-09-18", "workTitle": "To CoT or not to CoT? Chain-of-thought helps mainly on math and symbolic reasoning", "authors": "Zayne Sprague et al.", "link": "in-sample", "evidence": [{"id": "E106", "text": "Chain-of-thought (CoT) via prompting is the de facto method for eliciting reasoning capabilities from large language models (LLMs).", "title": "To CoT or not to CoT? Chain-of-thought helps mainly on math and symbolic reasoning", "year": 2024, "date": "2024-09-18", "url": "https://doi.org/10.48550/arxiv.2409.12183", "authors": "Zayne Sprague et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S2"}, {"id": "E83", "text": "In addition, code-pretraining greatly benefits strategic reasoning, while advanced reasoning methods such as Chain-of-Thought (CoT) and Tree-of-Thought (ToT) do not always help.", "title": "GTBench: Uncovering the Strategic Reasoning Capabilities of LLMs via Game-Theoretic Evaluations", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.52202/079017-0885", "authors": "Jinhao Duan et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E148", "text": "Notably, prevailing linguistic reasoning techniques (e.g., chain-of-thought, self-consistency, tree-of-thoughts) fail to improve performance, whereas explicitly generating cognitive maps during question-answering enhances MLLMs’ spatial distance ability.", "title": "Thinking in Space: How Multimodal Large Language Models See, Remember, and Recall Spaces", "year": 2025, "date": "2025-06-10", "url": nforcement learning", "why": "DeepSeek-R1 与 o1 一起使“扩展长思维链”成为推理模型的主流范式。", "url": "https://doi.org/10.1038/s41586-025-09422-z", "date": "2025-09-17", "workTitle": "DeepSeek-R1 incentivizes reasoning in LLMs through reinforcement learning", "authors": "Daya Guo et al.", "link": "in-sample", "evidence": [{"id": "E155", "text": "Recent breakthroughs, exemplified by large language models (LLMs) 1,2 and chain-of-thought (CoT) prompting 3 , have achieved considerable success on foundational reasoning tasks.", "title": "DeepSeek-R1 incentivizes reasoning in LLMs through reinforcement learning", "year": 2025, "date": "2025-09-17", "url": "https://doi.org/10.1038/s41586-025-09422-z", "authors": "Daya Guo et al.", "fromTitle": false, "field": "Computer Science", "inSet": 30, "sense": "S2"}, {"id": "E115", "text": "Chain-of-Thought (CoT) has been proven effective in enhancing the reasoning capabilities of large language models (LLMs).Recent advancements, such as OpenAI's o1 and DeepSeek-R1, suggest that scaling up the length of CoT sequences during inference could further boost LLM reasoning performance.However, due to the autoregressive nature of LLM decoding, longer CoT outputs lead to a linear increase in inference latency, adversely affecting user expe…", "title": "TokenSkip: Controllable Chain-of-Thought Compression in LLMs", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.18653/v1/2025.emnlp-main.165", "authors": "Heming Xia et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S4"}, {"id": "E135", "text": "Recent Large Reasoning Models (LRMs), such as DeepSeek-R1 and OpenAI o1, have demonstrated strong performance gains by scaling up the length of Chain-of-Thought (CoT) reasoning during inference.", "title": "A Survey of Efficient Reasoning for Large Reasoning Models: Language, Multimodality, and Beyond", "year": 2025, "date": "2025-03-27", "url": "https://doi.org/10.48550/arxiv.2503.21614", "authors": "Xiaoye Qu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S4"}, {"id": "E160", "text": "A central factor in their success lies in the application of long chain-of-thought (Long CoT) characteristics, which enhance reasoning abilities and enable the solution of intricate problems.", "title": "Towards reasoning era: a survey of long chain-of-thought for reasoning large language models", "year": 2026, "date": "2026-05-12", "url": "https://doi.org/10.1007/s11432-025-4665-8", "authors": "Qiguang Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S4"}], "checks": {"inSense": true, "coinage": false}, "shift": ""}, {"year": 2025, "kind": "applied", "title": "Chain of Thought Monitorability: A New and Fragile Opportunity for AI Safety", "why": "思维链被视为 AI 安全中监控模型意图的手段，进入安全研究领域。", "url": "https://doi.org/10.48550/arxiv.2507.11473", "date": "2025-07-15", "workTitle": "Chain of Thought Monitorability: A New and Fragile Opportunity for AI Safety", "authors": "Tomek Korbak et al.", "link": "in-sample", "evidence": [{"id": "E154", "text": "Chain of Thought Monitorability: A New and Fragile Opportunity for AI Safety", "title": "Chain of Thought Monitorability: A New and Fragile Opportunity for AI Safety", "year": 2025, "date": "2025-07-15", "url": "https://doi.org/10.48550/arxiv.2507.11473", "authors": "Tomek Korbak et al.", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E144", "text": "Chain-of-thought (CoT) offers a potential boon for AI safety as it allows monitoring a model's CoT to try to understand its intentions and reasoning processes.", "title": "Reasoning Models Don't Always Say What They Think", "year": 2025, "date": "2025-05-08", "url": "https://doi.org/10.48550/arxiv.2505.05410", "authors": "Yanda Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E142", "text": "Our framework mitigates risks such as prompt injection, agent misalignment, and insecure code risks through three powerful guardrails: PromptGuard 2, a universal jailbreak detector that demonstrates clear state of the art performance; Agent Alignment Checks, a chain-of-thought auditor that inspects agent reasoning for prompt injection and goal misalignment, which, while still experimental, shows stronger efficacy at preventing indirect injection…", "title": "LlamaFirewall: An open source guardrail system for building secure AI agents", "year": 2025, "date": "2025-05-06", "url": "https://doi.org/10.48550/arxiv.2505.03574", "authors": "Sahana Chennabasappa et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}], "checks": {"inSense": true, "coinage": false}, "shift": "new field"}], "totalsAsOf": "2026-11-17", "kindChecks": {"ancestor": [2, 4], "origin": [5, 5], "popularized": [6, 13], "redefined": [12, 17], "applied": [24, 24], "critique": [10, 12], "coined": [2, 2]}}</script>

    if (o && e) out.push(esc(L.olderUse(o.n, e.label, e.date)) + ` <a href="${esc(rerun(o.year))}">${esc(L.onlySince(o.year))}</a>`);
    if (bad.length) {
      const w = bad[0];
      out.push(esc(L.misdated(bad.length)) + ' ' + esc(L.misdatedEg(w.year, w.cites, w.why)) + ' ' + link(w.url, w.title));
    }
    return out;
  }

  // --- renderer ---------------------------------------------------------------------

  function renderTimeline(D, root, labels) {
    root = root || document;
    const L = Object.assign({}, LABELS_EN, labels || {});
    const css = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
    const el = (tag, attrs = {}, parent) => {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    };
    const kindName = k => (L.kinds && L.kinds[k]) || k;
    const part = name => root.querySelector(`[data-part="${name}"]`);
    const chart = part('chart'), detail = part('detail');
    chart.textContent = '';
    const KIND_OK = k => (KINDS.includes(k) ? k : 'origin');
    const phrases = [D.term, ...(D.aliases || [])].filter(p => p && p.trim());
    const termSrc = '(' + phrases.map(p => p.split(/[\s-]+/).filter(Boolean).map(reEsc).join('[\\s-]+')).join('|') + ')';
    const termRe = new RegExp(termSrc, 'igu'), termTest = new RegExp(termSrc, 'iu');
    const termWords = new Set(phrases.flatMap(p => p.toLowerCase().split(/[\s-]+/)).flatMap(w => [w, w + 's', w.replace(/s$/, '')]));
    // Split the raw text first, then escape each piece, so entities are never cut.
    const mark = s => String(s ?? '').split(termRe).map((p, i) => (i % 2 ? `<mark>${esc(p)}</mark>` : esc(p))).join('');
    const quotes = Array.isArray(D.quotes) ? D.quotes : [];
    const senses = Array.isArray(D.senses) ? D.senses : [];
    const related = new Set(senses.filter(s => s.related).map(s => s.key));
    const sensesOn = senses.length > 0 && quotes.some(q => q.sense);
    const totals = new Map(D.totals || []);
    // Totals fetched in an earlier year than this data: their last year was not over yet,
    // so its share would be too high. Leave those years out of the share view.
    const asofY = /^\d{4}/.test(D.totalsAsOf || '') ? +D.totalsAsOf.slice(0, 4) : 0;
    if (asofY && /^\d{4}/.test(D.generated || '') && +D.generated.slice(0, 4) > asofY) for (const y of [...totals.keys()]) if (y >= asofY) totals.delete(y);
    const missingTot = totals.size ? D.counts.filter(([y, c]) => c > 0 && !totals.get(y)).map(([y]) => y) : [];
    const genDate = /^\d{4}-\d{2}-\d{2}$/.test(D.generated || '') ? D.generated : null;
    const prov = n => (D.model ? L.provModel(D.model, n, D.generated || '') : L.provCounted);

    // View state: bar height (papers or share) and scale (auto, linear, log), kept in the URL.
    const params = new URLSearchParams(global.location ? global.location.search : '');
    const view = { y: params.get('y') === 'share' && totals.size ? 'share' : 'papers', scale: ['linear', 'log'].includes(params.get('scale')) ? params.get('scale') : 'auto' };
    let msLaid = [], selected = -1, logOn = false;

    // Colour of a quote tick: by meaning when the model tagged quotes, else by field.
    const colorKey = (() => {
      if (sensesOn) {
        const map = new Map();
        senses.filter(s => s.related).forEach((s, i) => map.set(s.key, PALETTE[i % PALETTE.length]));
        const items = senses.filter(s => s.related && quotes.some(q => q.sense === s.key)).map(s => [s.label, map.get(s.key)]);
        if (quotes.some(q => q.sense && q.sense !== 'unclear' && !related.has(q.sense))) items.push([L.otherMeanings, OTHER]);
        if (quotes.some(q => !q.sense || q.sense === 'unclear')) items.push([L.unclear, GREY]);
        return { of: q => (related.has(q.sense) ? map.get(q.sense) : q.sense && q.sense !== 'unclear' ? OTHER : GREY), items, title: L.laneBySense };
      }
      const byField = new Map();
      for (const q of quotes) if (q.field) byField.set(q.field, (byField.get(q.field) || 0) + 1);
      const top = [...byField].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([f]) => f);
      const map = new Map(top.map((f, i) => [f, PALETTE[i]]));
      const items = top.map(f => [f, map.get(f)]);
      if (quotes.some(q => q.field && !map.has(q.field))) items.push([L.otherFields, OTHER]);
      if (quotes.some(q => !q.field)) items.push([L.fieldUnknown, GREY]);
      return { of: q => (!q.field ? GREY : map.get(q.field) || OTHER), items, title: L.laneByField };
    })();

    function build() {
      chart.textContent = '';
      const counts = new Map(D.counts);
      const years = [...counts.keys(), ...D.milestones.map(m => m.year), ...D.eras.flatMap(e => [e.start, e.end])].filter(Boolean);
      if (!years.length) return;
      const nowYear = Math.max(...years), minYear = Math.max(Math.min(...years), nowYear - 600);
      const avail = Math.max(320, chart.parentElement.clientWidth || 900);
      const compact = avail < 600;  // phones: numbered dots, cards listed below
      const left = 26, labelRoom = compact ? 40 : 150, width = Math.max(compact ? 340 : 600, avail);
      const share = view.y === 'share';
      // Slots along the axis: one per year, or one per quarter for the years that
      // data.quarters covers (young terms; not in the share view, which is yearly).
      const qByYear = new Map();
      if (!share) for (const [k, c] of D.quarters || []) {
        const m = /^(\d{4})-Q([1-4])$/.exec(k);
        if (m) (qByYear.get(+m[1]) || qByYear.set(+m[1], []).get(+m[1])).push([+m[2], c]);
      }
      const msT = D.milestones.map(m => timeOf(m.year, m.date, 0.02));
      const slots = [];
      for (let y = minYear; y <= nowYear; y++) {
        const qs = qByYear.get(y);
        if (qs) qs.sort((p, q) => p[0] - q[0]).forEach(([q, c]) => slots.push({ y, q, t0: y + (q - 1) / 4, t1: y + q / 4, c }));
        else slots.push({ y, q: 0, t0: y, t1: y + 1, c: counts.get(y) || 0 });
      }
      // Bar value: papers, or papers per all OpenAlex works that year.
      // Years with papers but no shipped total (newer than the snapshot) get no bar; the legend says so.
      for (const s of slots) s.v = share ? (totals.get(s.y) ? s.c / totals.get(s.y) : 0) : s.c;
      // The period the data was fetched in is not over yet.
      if (genDate) {
        const gy = +genDate.slice(0, 4), gq = Math.ceil(+genDate.slice(5, 7) / 3);
        for (const s of slots) s.partial = s.y === gy && (!s.q || s.q === gq);
      }
      // Each slot gets width by how much happens in it: milestone slots and busy slots
      // are wide, quiet ones thin. A century of rare use stays a short strip.
      const peakC = Math.max(1, ...slots.map(s => s.c));
      const hasMs = s => msT.some(t => t >= s.t0 && t < s.t1);
      const raw = s => (hasMs(s) ? (compact ? 18 : 30) : 0) + 34 * Math.sqrt(s.c / peakC) + (s.q ? 12 : s.c / peakC > 0.002 ? 6 : 2);
      const total = slots.reduce((a, s) => a + raw(s), 0);
      const scale = Math.max(0.4, Math.min(2.2, (width - left - labelRoom) / total));
      let acc = left;
      for (const s of slots) { s.x0 = acc; acc += raw(s) * scale; s.x1 = acc; s.xc = (s.x0 + s.x1) / 2; }
      const X = t => {
        const s = slots.find(s => t >= s.t0 && t < s.t1) || (t < slots[0].t0 ? slots[0] : slots[slots.length - 1]);
        const f = Math.max(0, Math.min(1, (t - s.t0) / (s.t1 - s.t0)));
        return s.x0 + f * (s.x1 - s.x0);
      };
      const fine = slots.some(s => s.q);

      // Lay out milestone labels in lanes so they do not overlap. Phones show numbers.
      const lanes = [], laneH = compact ? 26 : 36, axisPad = 26;
      msLaid = D.milestones.map((m, i) => {
        const label = compact ? String(i + 1) : m.title.length > 34 ? m.title.slice(0, 33) + '…' : m.title;
        const text = compact ? label : `${m.year} · ${label}`;
        const w = [...text].reduce((s, c) => s + (/[A-Z]/.test(c) ? 8 : 6.3), 0) + 22, x = X(msT[i]);
        // A label that would run past the right edge goes on the left of its dot, so the
        // chart fits the card instead of scrolling for one label.
        const flip = !compact && x + w + 24 > width && x - w > left;
        let lane = 0;
        while ((lanes[lane] ?? -1e9) > (flip ? x - w : x) - 6) lane++;
        lanes[lane] = flip ? x + 10 : x + w;
        return { ...m, kind: KIND_OK(m.kind), i, label, text, x, lane, flip };
      });
      const nLanes = Math.max(1, lanes.length);
      const W = Math.max(width, ...lanes.map(r => r + 24), acc + 20);
      const eraH = D.eras.length ? 44 : 0, top = eraH + 10;
      const axisY = top + nLanes * laneH + axisPad, barH = 70;
      const tickY = axisY + barH + 26, laneY = tickY + (fine ? 26 : 12), hasLane = quotes.length > 0;
      const H = laneY + (hasLane ? 22 : 0) + 8;
      const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': L.timelineOf(D.term) });
      const defs = el('defs', {}, svg);
      const pat = el('pattern', { id: 'idl-hatch', width: 5, height: 5, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
      el('rect', { width: 5, height: 5, fill: css('bar'), opacity: 0.35 }, pat);
      el('line', { x1: 0, y1: 0, x2: 0, y2: 5, stroke: css('bar'), 'stroke-width': 2.5 }, pat);

      // Era bands; labels alternate between two rows and are cut to fit.
      D.eras.forEach((e, k) => {
        const xa = X(e.start), xb = X(e.end + 1 - 1e-6), row = k % 2;
        el('rect', { x: xa, y: row * 16, width: Math.max(4, xb - xa), height: axisY - row * 16, fill: css(k % 2 ? 'era2' : 'era1'), rx: 6 }, svg);
        const next = D.eras[k + 2], room = (next ? X(next.start) : W) - xa - 12;
        const maxChars = Math.max(compact ? 4 : 8, Math.floor(room / 6.6));
        const label = e.label.length > maxChars ? e.label.slice(0, maxChars - 1) + '…' : e.label;
        const t = el('text', { x: xa + 8, y: 15 + row * 16, 'font-weight': 600, 'font-size': 11 }, svg);
        t.textContent = label;
        el('title', {}, t).textContent = `${e.start}–${e.end}: ${e.label}`;
      });

      // Takeoff and bursts, computed from the yearly counts (shares when totals exist).
      const ta = (D.counts || []).length ? mainRun(D.counts).ta : null, bs = bursts(D.counts, D.totals);
      for (const [a, b] of bs) {
        const xa = X(a), xb = X(b + 1 - 1e-6);
        const r = el('rect', { x: xa, y: axisY + 2, width: Math.max(3, xb - xa), height: barH + 8, fill: css('critique'), opacity: 0.08, rx: 3 }, svg);
        el('title', {}, r).textContent = `${L.burst} ${a === b ? a : a + '–' + b}. ${L.takeoffTip}`;
      }

      // Bars hang below the axis. Linear or log height; log by default when the
      // values span more than 50x, so the early years are not flattened to nothing.
      const vals = slots.map(s => s.v).filter(v => v > 0);
      const vmax = Math.max(...vals, 1e-12), vmin = Math.min(...vals, vmax);
      logOn = view.scale === 'log' || (view.scale === 'auto' && vmax / vmin > 50);
      const lmin = Math.log(vmin) - 0.4, lmax = Math.log(vmax);
      const hOf = v => (v <= 0 ? 0 : Math.max(1.5, logOn ? ((Math.log(v) - lmin) / (lmax - lmin || 1)) * barH : (v / vmax) * barH));
      for (const s of slots) {
        if (!s.v) continue;
        const wd = s.x1 - s.x0;
        const r = el('rect', { x: s.xc - wd * 0.34, y: axisY + 6, width: Math.max(1.5, wd * 0.68), height: hOf(s.v), fill: s.partial ? 'url(#idl-hatch)' : css('bar'), rx: 2 }, svg);
        let tip = share ? L.shareOf(s.y, s.v) : s.q ? L.quarterPapers(s.y, s.q, s.c) : L.yearPapers(s.y, s.c);
        if (s.partial) tip += ' · ' + L.partial(genDate);
        el('title', {}, r).textContent = tip;
      }
      el('line', { x1: left - 10, x2: W - 20, y1: axisY, y2: axisY, stroke: css('line'), 'stroke-width': 2 }, svg);
      if (ta) {
        // At the start of the takeoff year, in the gap between bars, and through the whole
        // chart so it reads as "everything right of this line came after takeoff".
        const x = X(ta);
        el('line', { x1: x, x2: x, y1: Math.max(0, top - 6), y2: axisY + barH + 6, stroke: css('popularized'), 'stroke-width': 1.5, 'stroke-dasharray': '4 3', opacity: 0.9 }, svg);
        el('path', { d: `M${x - 5},${axisY - 1} L${x + 5},${axisY - 1} L${x},${axisY - 9} Z`, fill: css('popularized') }, svg);
        const t = el('text', { x: x + 4, y: axisY + barH + 12, class: 'muted', 'font-size': 10 }, svg);
        t.textContent = L.takeoff(ta);
        el('title', {}, t).textContent = L.takeoffTip;
      }
      // Quarter years: Q labels per slot, the year centred underneath.
      for (const [y] of qByYear) {
        const qs = slots.filter(s => s.y === y && s.q);
        if (!qs.length) continue;
        qs.forEach(s => { if (s.x1 - s.x0 >= 16) el('text', { x: s.xc, y: tickY, 'text-anchor': 'middle', class: 'muted', 'font-size': 10.5 }, svg).textContent = 'Q' + s.q; });
        const yl = el('text', { x: (qs[0].x0 + qs[qs.length - 1].x1) / 2, y: tickY + 16, 'text-anchor': 'middle', class: 'muted', 'font-weight': 600 }, svg);
        yl.textContent = y;
        const und = new Map(D.undated || []).get(y);
        el('title', {}, yl).textContent = L.yearPapers(y, counts.get(y) || 0) + (und ? ' · ' + L.undated(und) : '');
      }
      // Year labels: never closer than 36px; the newest year always gets one.
      const yearSlots = slots.filter(s => !s.q && (s.c || D.milestones.some(m => m.year === s.y)));
      let last = qByYear.size ? Math.min(...slots.filter(s => s.q).map(s => s.x0)) + 18 : 1e9;
      yearSlots.sort((a, b) => b.y - a.y).forEach(s => {
        if (last - s.xc < 36) return;
        el('text', { x: s.xc, y: tickY, 'text-anchor': 'middle', class: 'muted' }, svg).textContent = s.y;
        last = s.xc;
      });
      const peak = slots.reduce((a, s) => (s.v > (a ? a.v : 0) ? s : a), null);
      if (peak) {
        const t = el('text', { x: peak.xc + (peak.x1 - peak.x0) * 0.4, y: axisY + 20, class: 'muted', 'font-size': 10.5 }, svg);
        t.textContent = share ? L.perMillion(peak.v) : L.papers(peak.c);
      }

      // Evidence lane: one tick per quoted sentence, at its month when known.
      if (hasLane) {
        for (const q of quotes) {
          if (!q.year) continue;
          const x = X(timeOf(q.year, q.date, 0.5));
          const g = el('g', { class: 'qtick' }, svg);
          el('rect', { x: x - 1, y: laneY, width: 2, height: 12, fill: colorKey.of(q), rx: 1 }, g);
          el('rect', { x: x - 3, y: laneY - 2, width: 6, height: 16, fill: 'transparent' }, g);
          const txt = String(q.text || '');
          el('title', {}, g).textContent = `${q.year} · ${q.title}: ${txt.length > 220 ? txt.slice(0, 219) + '…' : txt}`;
          const u = safeUrl(q.url);
          if (u) { g.style.cursor = 'pointer'; g.addEventListener('click', () => global.open(u, '_blank', 'noopener')); }
        }
      }

      msLaid.forEach(m => {
        const y = axisY - axisPad - m.lane * laneH;
        const g = el('g', { class: 'ms', tabindex: 0, role: 'button', 'aria-label': `${m.year} ${kindName(m.kind)}: ${m.title}` }, svg);
        const hitW = m.text.length * 6.3 + (compact ? 24 : 70);
        el('rect', { x: m.flip ? m.x + 10 - hitW : m.x - 10, y: y - 12, width: hitW, height: 24, fill: 'transparent' }, g);
        el('line', { x1: m.x, x2: m.x, y1: y, y2: axisY, stroke: css(m.kind), 'stroke-width': 1.5, 'stroke-dasharray': m.link === 'unresolved' ? '3 3' : '' }, g);
        el('circle', { cx: m.x, cy: y, r: 7, fill: css(m.kind) }, g);
        const t = el('text', m.flip ? { x: m.x - 11, y: y + 4, 'text-anchor': 'end' } : { x: m.x + 11, y: y + 4 }, g);
        t.textContent = m.text;
        g.addEventListener('click', () => select(m.i, true));
        g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(m.i, true); } });
        m.g = g;
      });
      chart.appendChild(svg);
      renderList(compact);
      renderLegend();
      if (selected >= 0) msLaid.forEach(x => x.g && x.g.classList.toggle('sel', x.i === selected));
    }

    // Stable deep-link slug per milestone: #m-2025-coined (-2, -3 for repeats).
    const slugs = (() => {
      const seen = new Map();
      return D.milestones.map(m => {
        const base = `m-${m.year}-${String(m.kind).replace(/\s+/g, '-')}`, n = (seen.get(base) || 0) + 1;
        seen.set(base, n);
        return n > 1 ? `${base}-${n}` : base;
      });
    })();

    function select(i, fromUser) {
      const m = D.milestones[i];
      if (!m || !detail) return;
      selected = i;
      const kind = KIND_OK(m.kind);
      msLaid.forEach(x => x.g && x.g.classList.toggle('sel', x.i === i));
      root.querySelectorAll('.mslist button').forEach((b, k) => b.classList.toggle('sel', k === i));
      if (fromUser && global.history && global.location) {
        try { global.history.replaceState(null, '', global.location.pathname + global.location.search + '#' + slugs[i]); } catch (e) { /* file:// pages */ }
      }
      const url = safeUrl(m.url);
      const title = url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(m.title)}</a>` : esc(m.title);
      const status = {
        'in-sample': esc(L.inSample),
        'resolved': esc(L.resolved(m.workTitle || '')),
        'unresolved': esc(L.unresolved),
      }[m.link] || '';
      const quotesHtml = (m.evidence || []).map(e => {
        const eu = safeUrl(e.url);
        const src = eu ? `<a href="${esc(eu)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a>` : esc(e.title);
        return `<blockquote>${mark(e.text)}<cite>${e.fromTitle ? esc(L.titleOf) : ''}${src} · ${esc(e.authors)}, ${esc(e.year)}</cite></blockquote>`;
      }).join('');
      // Checkable claims for naming and earliest-use milestones; change type otherwise.
      let checks = '';
      if (kind === 'coined' || kind === 'origin') {
        const tick = v => (v === true ? '✓' : v === false ? '✗' : '?');
        const c = m.checks || {};
        const exact = (m.evidence || []).some(e => termTest.test(e.text || ''));
        const items = [[exact, L.checkExact]];
        if (c.inSense != null) items.push([c.inSense, L.checkSense]);
        if (c.coinage != null) items.push([c.coinage, L.checkCoin]);
        checks = `<ul class="checks">${items.map(([v, t]) => `<li class="${v === true ? 'ok' : v === false ? 'no' : ''}">${tick(v)} ${esc(t)}</li>`).join('')}</ul>`;
      } else if (m.shift) {
        checks = `<p class="shift">${esc(L.shiftOf(m.shift))}</p>`;
      }
      const caveat = kind === 'origin'
        ? `<p class="caveat">${esc(L.earliestCaveat)} <a href="${esc(ISSUES)}?template=feedback.yml&title=${encodeURIComponent('Earlier use of "' + D.term + '"')}&term=${encodeURIComponent(D.term)}" target="_blank" rel="noopener noreferrer">${esc(L.earlierUse)}</a></p>` : '';
      detail.innerHTML = `<div class="kind" style="color:var(--${kind})">${esc(m.year)} · ${esc(kindName(kind))}</div><h2>${title}</h2>` +
        `<p class="why">${esc(L.msg(m.why))}</p>${checks}${caveat}${quotesHtml}<div class="status">${status}</div><div class="prov">${esc(prov((m.evidence || []).length))}</div>`;
    }

    // Phones: the chart shows numbers; the milestones are listed under it.
    function renderList(compact) {
      const card = chart.closest('.card');
      if (!card) return;
      let list = card.querySelector('.mslist');
      if (!compact) { if (list) list.remove(); return; }
      if (!list) {
        list = document.createElement('ol');
        list.className = 'mslist';
        const lg = card.querySelector('[data-part="legend"]');
        card.insertBefore(list, lg ? lg.nextSibling : null);
      }
      list.innerHTML = D.milestones.map((m, i) => `<li><button type="button"${i === selected ? ' class="sel"' : ''}><b>${i + 1}</b> ${esc(m.year)} · ${esc(kindName(KIND_OK(m.kind)))} · ${esc(m.title)}</button></li>`).join('');
      list.querySelectorAll('button').forEach((b, i) => b.addEventListener('click', () => { select(i, true); if (detail.scrollIntoView) detail.scrollIntoView({ block: 'nearest' }); }));
    }

    // View controls (bar height and scale) above the chart.
    function renderBar() {
      const scroller = chart.closest('.scroller') || chart;
      const host = scroller.parentElement;
      if (!host) return;
      let bar = host.querySelector(':scope > .tlbar');
      if (!bar) { bar = document.createElement('div'); bar.className = 'tlbar'; host.insertBefore(bar, scroller); }
      const seg = (label, key, opts) => `<span class="tlseg" role="group" aria-label="${esc(label)}">${opts.map(([v, t, on]) =>
        `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${on}">${esc(t)}</button>`).join('')}</span>`;
      bar.innerHTML = (totals.size ? seg(L.yLabel, 'y', [['papers', L.yPapers, view.y === 'papers'], ['share', L.yShare, view.y === 'share']]) : '') +
        seg(L.scaleLabel, 'scale', [['linear', L.scaleLinear, !logOn], ['log', L.scaleLog, logOn]]);
      bar.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {

      const keep = decades.slice(0, 4), rest = decades.slice(4);

        const hi = Math.min(d + 9, cut - 1);
        out.push({ v: `${d}-${hi}`, label: hi === d + 9 ? T.decade(d) : d === hi ? `${d}` : `${d}–${hi}` });
      }
      if (rest.length) out.push({ v: `0-${rest[0] + 9}`, label: T.andEarlier(rest[0] + 9) });
    }
    if (quotes.some(q => !q.year)) out.push({ v: 'unknown', label: T.unknownYear });
    return out.map(b => ({ ...b, n: n(b.v) })).filter(b => b.n);
  }

  // Same colours as the timeline: related meanings in order, other meanings and
  // unlabelled passages in two greys.
  const PALETTE = ['#4c6ef5', '#e8590c', '#2b8a3e', '#ae3ec9', '#c92a2a', '#1098ad', '#f59f00', '#5c7cfa'];
  function senseColors(senses) {
    const m = new Map((senses || []).filter(s => s.related).map((s, i) => [s.key, PALETTE[i % PALETTE.length]]));
    return key => (key === 'untagged' ? '#adb5bd' : m.get(key) || '#868e96');
  }

  function citationText(q, lang = 'en') {
    const T = TEXT[lang] || TEXT.en;
    const source = safeUrl(q.review?.checkedUrl) || safeUrl(q.url);
    return `${q.fromTitle ? T.titleOnly : T.source}:\n“${q.text}”\n\n${q.title || ''}\n${q.authors || T.unknownAuthor} · ${q.year || T.unknownYear}\n${source || T.noLink}${q.warning ? '\n' + T[q.warning] : ''}`;
  }

  function highlight(text, terms) {
    const parts = terms.filter(t => typeof t === 'string' && t.trim()).map(t => t.trim().split(/[\s-]+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('[\\s-]+'));
    if (!parts.length) return esc(text);
    return String(text).split(new RegExp(`((?:${parts.join('|')})(?:e?s)?)`,'igu')).map((part,i) => i%2 ? `<mark>${esc(part)}</mark>` : esc(part)).join('');
  }

  function quoteCard(q, { lang = 'en', terms = [], label = '', featured = false } = {}) {
    const T = TEXT[lang] || TEXT.en, url = safeUrl(q.review?.checkedUrl) || q.url;
    const note = localized(q.review?.note, lang);
    return `<article class="source-card${featured ? ' featured-source' : ''}" id="${featured ? 'q-' : 'sample-'}${esc(q.id)}">
      <div class="source-top"><span class="source-label">${esc(localized(q.review?.label,lang) || label)}</span><span class="source-year">${esc(q.year || T.unknownYear)}</span></div>
      <p class="source-type">${esc(q.fromTitle ? T.titleOnly : T.source)}${q.review ? ` <span>· ${esc(T.checked)} ${esc(q.review.checked)}</span>` : ''}</p>
      <blockquote>${highlight(q.text, terms)}</blockquote>
      ${note ? `<p class="reading-note"><b>${esc(T.note)}</b> ${esc(note)}</p>` : ''}
      <div class="source-citation"><h4>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(q.title || '')}</a>` : esc(q.title || '')}</h4><p>${esc(q.authors || T.unknownAuthor)} · ${esc(q.year || T.unknownYear)}</p></div>
      ${q.warning ? `<p class="source-warning">${esc(T[q.warning])}</p>` : ''}
      <div class="source-actions">${url ? `<a class="paper-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(T.open)}</a>` : `<span class="muted">${esc(T.noLink)}</span>`}<button type="button" data-copy="${esc(q.id)}">${esc(T.copy)}</button><a class="passage-link" href="#q-${esc(q.id)}" data-passage="${esc(q.id)}" aria-label="${esc(T.link)}">#</a></div>
      <div class="copy-status" role="status" aria-live="polite"></div>
    </article>`;
  }

  function quoteRow(q, { lang = 'en', terms = [], sense = '', color = '' } = {}) {
    const T = TEXT[lang] || TEXT.en, url = safeUrl(q.review?.checkedUrl) || safeUrl(q.url);
    const title = esc(q.title || '');
    return `<article class="quote-row" id="sample-${esc(q.id)}">
      <div class="qr-year">${esc(q.year || '—')}</div>
      <div class="qr-body"><blockquote>${highlight(q.text, terms)}</blockquote>
      <p class="qr-cite">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${title}</a>` : title} <span>· ${esc(q.authors || T.unknownAuthor)}</span></p>
      <div class="qr-foot">${sense ? `<span class="qr-tag" title="${esc(T.suggestedMeaning)}">${color ? `<i style="background:${esc(color)}"></i>` : ''}${esc(sense)}</span>` : ''}${q.fromTitle ? `<span class="qr-tag plain">${esc(T.titleOnly)}</span>` : ''}${q.warning ? `<span class="qr-warn">${esc(T[q.warning])}</span>` : ''}
      <span class="qr-actions"><button type="button" data-copy="${esc(q.id)}">${esc(T.copy)}</button><a href="#q-${esc(q.id)}" data-passage="${esc(q.id)}" aria-label="${esc(T.link)}" title="${esc(T.link)}">#</a></span></div>
      <div class="copy-status" role="status" aria-live="polite"></div></div>
    </article>`;
  }

  // opts.pending: a model is still reading; opts.applyHash: false for the built-in example;
  // opts.showRoots: scroll to the roots section after a roots lookup.
  function renderReadingBrief(d, root, lang = 'en', opts = {}) {
    lang = lang === 'zh' ? 'zh' : 'en';
    const T = TEXT[lang], model = readingModel(d), host = root.querySelector('[data-part="reading"]');
    if (!host) return;
    const terms = [d.term, ...(d.aliases || [])];
    const senseMap = new Map((d.senses || []).map(s => [s.key, s.label]));
    const card = (q, featured, index) => quoteCard(q, {lang, terms, featured,
      label: featured ? [T.earlier,T.different,T.recent][index] : q.sense ? `${T.suggestedMeaning}: ${senseMap.get(q.sense) || T.untagged}` : T.untagged});
    const colorOf = senseColors(d.senses);
    const present = new Set(model.quotes.map(senseKey));
    const order = [...(d.senses || []).filter(s => s.related), ...(d.senses || []).filter(s => !s.related)].map(s => s.key);
    // Meanings this timeline follows get their own chip; meanings that only share the
    // words go together under "Other meanings".
    const related = new Set((d.senses || []).filter(s => s.related).map(s => s.key));
    const others = new Set([...present].filter(k => k !== 'untagged' && !related.has(k)));
    const senseKeys = [...order.filter(k => related.has(k) && present.has(k)), ...(others.size ? ['other'] : []), ...(present.has('untagged') ? ['untagged'] : [])];
    const buckets = yearBuckets(model.quotes, T);
    const chip = (v, label, n, color, tip) => `<button type="button" class="fchip" data-v="${esc(v)}"${tip ? ` title="${esc(tip)}"` : ''}>${color ? `<i style="background:${esc(color)}"></i>` : ''}${esc(label)}<span class="n">${n}</span></button>`;
    host.innerHTML = `<div class="brief-meta"><span>${esc(T.scope)}</span><span>${esc(T.saved)} ${esc(d.generated || '—')}</span></div>
      <section class="timeline-main" aria-label="${esc(T.timelineTitle)}">${d.summary ? `<p class="timeline-summary">${esc(d.summary)}</p>` : ''}<p class="headline" data-part="headline"></p>
      <div class="senses" data-part="senses"></div><div class="card"><div class="hint">${esc(T.originalHint)}</div><div class="scroller"><div data-part="chart"></div></div><div class="legend" data-part="legend"></div><div class="detail" data-part="detail" aria-live="polite"></div></div>
      <div class="eras" data-part="eras"></div><div class="roots" data-part="roots"></div></section>
      <div class="reading-layout"><section class="reading-main"><div class="section-heading"><h3>${esc(T.start)}</h3><span>${esc(model.curated ? T.route : T.suggested)}</span></div><p class="section-intro">${esc(model.curated ? T.intro : T.auto)}</p>
      ${model.featured.map((q,i)=>card(q,true,i)).join('') || `<p class="empty-state">${esc(model.quotes.length ? T.noFeatured : T.noQuotes)}</p>`}</section>
      <aside class="reading-aside"><span class="eyebrow">${esc(T.question)}</span><p>${esc(localized(d.readingGuide?.question,lang) || T.defaultQuestion)}</p><a href="#evidence" data-browse>${esc(T.browse)} <span>↘</span></a><div class="aside-count">${esc(T.matches(model.quotes.length))}</div></aside></div>
      <details class="evidence-browser" id="evidence"><summary>${esc(T.browse)} <span>${model.quotes.length}</span></summary>
      <p>${esc(d.model ? T.meaningNote : opts.pending ? T.modelPending : T.noModel)}</p><div class="ev-filters">
      ${senseKeys.some(k=>k!=='untagged') ? `<div class="frow"><span class="flabel">${esc(T.meaningShort)}</span><div class="fchips" data-f="sense" role="group" aria-label="${esc(T.meaning)}">${chip('', T.all, model.quotes.length)}${senseKeys.map(k=>k === 'other' ? chip('other', T.otherMeanings, model.quotes.filter(q=>others.has(senseKey(q))).length, '#868e96', T.otherTip) : chip(k, senseMap.get(k) || T.untagged, model.quotes.filter(q=>senseKey(q)===k).length, colorOf(k))).join('')}</div></div>` : ''}
      ${buckets.length > 1 ? `<div class="frow"><span class="flabel">${esc(T.period)}</span><div class="fchips" data-f="year" role="group" aria-label="${esc(T.year)}">${chip('', T.all, model.quotes.length)}${buckets.map(b=>chip(b.v, b.label, b.n)).join('')}</div></div>` : ''}
      <div class="fbar"><p class="filter-status" role="status" aria-live="polite"></p><div class="sortseg" data-f="order" role="group" aria-label="${esc(T.sort)}"><button type="button" data-v="newest">${esc(T.newestShort)}</button><button type="button" data-v="oldest">${esc(T.oldestShort)}</button></div></div></div><div class="quote-results"></div><button type="button" class="load-more">${esc(T.more)}</button></details>
      <details class="method-panel"><summary>${esc(T.method)}</summary><p>${esc(T.methodText)}</p><p>${esc(d.model ? T.methodModel : opts.pending ? T.modelPending : T.noModel)}</p></details>`;
    const browser = host.querySelector('.evidence-browser'), list = host.querySelector('.quote-results'), more = host.querySelector('.load-more');
    let limit = 12;
    const state = { sense: '', year: '', order: 'newest' };
    function refresh() {
      host.querySelectorAll('[data-f]').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state[g.dataset.f]))));
      const filtered = filterQuotes(model.quotes,{...state,others});
      list.innerHTML = filtered.slice(0,limit).map(q=>quoteRow(q,{lang,terms,sense:q.sense && senseMap.has(q.sense) ? senseMap.get(q.sense) : '',color:colorOf(senseKey(q))})).join('') || `<p class="empty-state">${esc(T.none)}</p>`;
      host.querySelector('.filter-status').textContent = T.shown(Math.min(limit,filtered.length),filtered.length);
      more.hidden = filtered.length <= limit;
    }
    host.querySelector('.ev-filters').addEventListener('click', ev => {
      const b = ev.target.closest('[data-f] button'); if (!b) return;
      state[b.closest('[data-f]').dataset.f] = b.dataset.v; limit = 12; refresh();
    });
    more.addEventListener('click',()=>{limit+=12;refresh();});
    refresh();
    function reveal(id) {
      const q = model.quotes.find(q=>q.id===id);
      if (!q) return;
      let target = [...host.querySelectorAll('.featured-source')].find(el=>el.id===`q-${id}`);
      if (!target) {
        browser.open = true;
        Object.assign(state, { sense: '', year: '', order: 'newest' });
        limit = model.quotes.length; refresh();
        target = [...list.children].find(el=>el.id===`sample-${id}`);
      }
      target?.scrollIntoView({block:'center'});
      if (target) {target.tabIndex=-1;target.focus({preventScroll:true});}
    }
    host.onclick = async ev => {
      const button = ev.target.closest('[data-copy]'), passage = ev.target.closest('[data-passage]');
      if (ev.target.closest('[data-browse]')) { ev.preventDefault(); browser.open=true; browser.scrollIntoView({block:'start'}); }
      if (passage) {ev.preventDefault(); global.history.replaceState(null,'',`#q-${passage.dataset.passage}`);reveal(passage.dataset.passage);}
      if (!button) return;
      const q = model.quotes.find(q=>q.id===button.dataset.copy), status = button.closest('article').querySelector('.copy-status');
      if (!q) return;
      const text = citationText(q,lang);
      try {await global.navigator.clipboard.writeText(text);status.textContent=T.copied;}
      catch (_) {
        status.textContent=T.copyFail;
        const area=document.createElement('textarea');area.readOnly=true;area.value=text;area.setAttribute('aria-label',T.copy);
        status.appendChild(area);area.focus();area.select();
      }
    };
    // The timeline leads the page: where the term came from and how its meaning moved.
    // The source cards below are the evidence for it.
    const timeline=host.querySelector('.timeline-main');
    if (global.renderTimeline) {
      const I=global.IdealineI18n, labels=I ? Object.assign({kinds:I.KINDS[lang]},I.T[lang]) : {};
      global.renderTimeline(d,timeline,labels);
    }
    const hash=opts.applyHash === false ? '' : global.location?.hash || '';
    if (hash.startsWith('#q-')) reveal(hash.slice(3));
    if (opts.showRoots) setTimeout(() => host.querySelector('[data-part="roots"]')?.scrollIntoView({block:'start'}), 50);
  }

  function mountPage(d, lang) {
    let current = lang === 'zh' ? 'zh' : 'en';
    const render = () => {
      document.documentElement.lang=current==='zh'?'zh-CN':'en';
      document.querySelectorAll('[data-reading-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.readingLang===current)));
      const back=document.querySelector('[data-reading-back]');if(back)back.textContent=current==='zh'?'← 查找其他术语':'← Find another term';
      renderReadingBrief(d,document,current);
    };
    document.querySelectorAll('[data-reading-lang]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.readingLang;render();}));
    render();
  }
  function pageHtml(d, spec, lang = 'en') {
    lang = lang === 'zh' ? 'zh' : 'en';
    const values = {home:esc(spec.siteUrl), term:esc(d.term), en:String(lang==='en'), zh:String(lang==='zh'), back:lang==='zh'?'← 查找其他术语':'← Find another term'};
    const body=spec.pageShell.replace(/\{(\w+)\}/g,(_,key)=>values[key] || '');
    const noEnd=js=>js.replace(/<\/script/gi,'<\\/script');
    const libraries=[spec.i18nJs,spec.timelineJs,spec.readingJs].map(noEnd).join('\n');
    return `<!doctype html>\n<html lang="${lang==='zh'?'zh-CN':'en'}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(d.term)} · idealine</title><style>${spec.css}</style></head><body>${body}<script type="application/json" id="data">${JSON.stringify(d).replace(/</g,'\\u003c')}<\/script><script>${libraries}\nIdealineReading.mountPage(JSON.parse(document.getElementById('data').textContent),${JSON.stringify(lang)});<\/script></body></html>`;
  }
  const api={TEXT,safeUrl,readingModel,filterQuotes,citationText,highlight,quoteCard,quoteRow,renderReadingBrief,mountPage,pageHtml};
  global.IdealineReading=api;
  if(typeof module!=='undefined' && module.exports)module.exports=api;
})(typeof window!=='undefined'?window:globalThis);

IdealineReading.mountPage(JSON.parse(document.getElementById('data').textContent), "zh");
</script>
</body></html>
