ife-long learning, and recursive self-improvement.", "title": "The Power of Constructivist Ideas in Artificial Intelligence", "year": 2013, "date": "2013-01-01", "url": "https://openalex.org/W602160236", "authors": "Kristinn R. Þórisson", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E4", "text": "Through value-driven dynamic priority scheduling controlling the parallel execution of a vast number of reasoning threads, the system achieves recursive self-improvement after it leaves the lab, within the boundaries imposed by its designers.", "title": "Bounded Recursive Self-Improvement", "year": 2013, "date": "2013-12-24", "url": "https://doi.org/10.48550/arxiv.1312.6764", "authors": "Eric Nivel et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S2"}, {"id": "E5", "text": "We subsequently argue that embedding the concomitant intelligence-amplification of biological humans as a necessary intermediary goal between each successive iteration of recursive self-improvement – such that the AGI conceives of such an intermediary step as a necessary sub-goal of its own self-modification – constitutes the best logistical method of maintaining approximate intelligence equality amongst biological humans and recursively self-im…", "title": "The Maximally Distributed Intelligence Explosion", "year": 2014, "date": "2014-03-22", "url": "https://openalex.org/W2403309555", "authors": "Francesco Albert Bosco Cortese", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E6", "text": "We ultimately argue that this approach bypasses the seeming impasse of needing to design, develop and articulate a motivational system possessing a top-level utility function that doesn’t decay over repeated iterations of recursive self-improvement in order to have a safe recursively self-modifying AGI.", "title": "The Maximally Distributed Intelligence Explosion", "year": 2014, "date": "2014-03-22", "url": "https://openalex.org/W2403309555", "authors": "Francesco Albert Bosco Cortese", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E7", "text": "The chapter creates stable, hierarchy-dominated goal systems, and ensures that the early stages of recursive self-improvement occur relatively slowly and with rich human involvement.", "title": "Nine Ways to Bias Open‐Source Artificial General Intelligence Toward Friendliness", "year": 2014, "date": "2014-06-13", "url": "https://doi.org/10.1002/9781118736302.ch4", "authors": "Ben Goertzel et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E8", "text": "In this work we provide definitions for Recursively Self-Improving software, survey different types of self-improving software, review the relevant literature, analyze limits on computation restricting recursive self-improvement and introduce RSI Convergence Theory which aims to predict general behavior of RSI systems.", "title": "From Seed AI to Technological Singularity via Recursively Self-Improving Software", "year": 2015, "date": "2015-02-23", "url": "https://doi.org/10.48550/arxiv.1502.06512", "authors": "Roman V. Yampolskiy", "fromTitle": false, "field": "Computer Science", "inSet": 7, "sense": "S2"}, {"id": "E9", "text": "The obvious reason for suspecting such an opportunity – a recursive self-improvement.", "title": "PHILOSOPHICAL AND ANTHROPOLOGICAL IMPORTANCE OF DEVELOPMENT OF ARTIFICIALLY CREATED INTELLIGENT SYSTEMS", "year": 2015, "date": "2015-12-09", "url": "https://doi.org/10.15802/ampr2015/55733", "authors": "Ю Д Генсицкий", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S1"}, {"id": "E10", "text": "The technological singularity is defined as a hy- pothetical event in which artificial intelligence would be capable of recursive self-improvement or of autonomously building smarter and more pow- erful machines than itself, up to the point of an “in- telligence explosion”, that yields an intelligence sur- passing all current human control or understanding.", "title": "Technological Singularity – The Dark Side", "year": 2016, "date": "2016-01-01", "url": "https://doi.org/10.22545/2016/00076", "authors": "Basarab Nicolescu", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E11", "text": "This paper presents a graphical model of major pathways to ASI catastrophe, focusing on ASI created via recursive self-improvement.", "title": "A model of pathways to artificial superintelligence catastrophe for risk and decision analysis", "year": 2016, "date": "2016-05-23", "url": "https://doi.org/10.1080/0952813x.2016.1186228", "authors": "Anthony Michael Barrett et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E12", "text": "This paper presents a graphical model of major pathways to ASI catastrophe, focusing on ASI created via recursive self-improvement.", "title": "A Model of Pathways to Artificial Superintelligence Catastrophe for Risk and Decision Analysis", "year": 2016, "date": "2016-07-25", "url": "https://doi.org/10.48550/arxiv.1607.07730", "authors": "Anthony Michael Barrett et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E13", "text": "When artificially-general intelligence is capable of recursive self-improvement, a hypothetical ‘runaway effect’ — an intelligence explosion — might happen, yielding an intelligence surpassing all current human control or understanding.", "title": "EE2: Intelligent machines: Will the technological singularity happen?", "year": 2017, "date": "2017-02-01", "url": "https://doi.org/10.1109/isscc.2017.7870486", "authors": "Stefano Pellerano et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E14", "text": "This paper examines the paperclip apocalypse concern for artificial general intelligence.This arises when a superintelligent AI with a simple goal (ie., producing paperclips) accumulates power so that all resources are devoted towards that goal and are unavailable for any other use.Conditions are provided under which a paper apocalypse can arise but the model also shows that, under certain architectures for recursive self-improvement of AIs, tha…", "title": "Self-Regulating Artificial General Intelligence", "year": 2018, "date": "2018-02-01", "url": "https://doi.org/10.3386/w24352", "authors": "Joshua S. Gans", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E15", "text": "The singularity is a hypothetical event where machines are capable of recursive self-improvement leading to an intelligence explosion.", "title": "The Machine that Goes “Ping”: Machine Learning and Pattern Recognition", "year": 2018, "date": "2018-02-05", "url": "https://doi.org/10.1201/9781315151670-3", "authors": "J. Rogel-Salazar", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E16", "text": "We use simulation to empirically show that we achieve logarithmic runtime complexity with respect to the size of the search space, and these results suggest it is possible to achieve an efficient recursive self-improvement.", "title": "A Formulation of Recursive Self-Improvement and Its Possible Efficiency", "year": 2018, "date": "2018-05-17", "url": "https://doi.org/10.48550/arxiv.1805.06610", "authors": "Wenyi Wang", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E17", "text": "There is a need for a strong bioethical and computational ethics framework to ensure that this is hardwired into the rules we give to the machines for recursive self-improvement.", "title": "Artificial intelligence (AI) in healthcare and biomedical research: Why a strong computational/AI bioethics framework is required?", "year": 2018, "date": "2018-12-21", "url": "https://doi.org/10.4103/ijo.ijo_1292_18", "authors": "Jatinder Bali et al.", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S1"}, {"id": "E18", "text": "A person will teach robots with a cognitive mind to increase professionalism by recursive self-improvement to technological singularity.", "title": "Formation and Management of Industry 5.0 by Systems with Artificial Intelligence and Technological Singularity", "year": 2020, "date": "2020-07-28", "url": "https://doi.org/10.11648/j.ajmie.20200502.12", "authors": "Evgeniy Bryndin", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S1"}, {"id": "E19", "text": "Recursive Self-Improvement for Camera Image and Signal Processing Pipeline", "title": "Recursive Self-Improvement for Camera Image and Signal Processing Pipeline", "year": 2021, "date": "2021-11-14", "url": "https://openalex.org/W3213705071", "authors": "Chandrajit Bajaj et al.", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "unclear"}, {"id": "E20", "text": "In principle, such NNs can meta-learn to learn, and meta-meta-learn to meta-learn to learn, and so on, in the sense of recursive self-improvement.", "title": "A Modern Self-Referential Weight Matrix That Learns to Modify Itself", "year": 2022, "date": "2022-02-11", "url": "https://doi.org/10.48550/arxiv.2202.05780", "authors": "Kazuki Irie et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E21", "text": "Since the language models themselves are not altered, this is not full recursive self-improvement.", "title": "Self-Taught Optimizer (STOP): Recursively Self-Improving Code Generation", "year": 2023, "date": "2023-10-03", "url": "https://doi.org/10.48550/arxiv.2310.02304", "authors": "Eric Zelikman et al.", "fromTitle": false, "field": "Computer Science", "inSet": 27, "sense": "S3"}, {"id": "E22", "text": "Prevailing trends of AI R&D are leading to increasing humanization of AI, to the emergence of concerning behaviors, and toward possible recursive self-improvement.", "title": "Multiple unnatural attributes of AI undermine common anthropomorphically biased takeover speculations", "year": 2024, "date": "2024-11-22", "url": "https://doi.org/10.1007/s00146-024-02134-4", "authors": "Preston W. Estep", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E23", "text": "Considering the special case of agents with matching input and output spaces (namely, language), we argue that such pure recursive self-improvement, dubbed \"Socratic learning\", can boost performance vastly beyond what is present in its initial data or knowledge, and is only limited by time, as well as gradual misalignment concerns.", "title": "Boundless Socratic Learning with Language Games", "year": 2024, "date": "2024-11-25", "url": "https://doi.org/10.48550/arxiv.2411.16905", "authors": "Tom Schaul", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S4"}, {"id": "E24", "text": "Recursive Self-Improvement (RSI) enables intelligence systems to autonomously refine their capabilities.", "title": "Generating on Generated: An Approach Towards Self-Evolving Diffusion Models", "year": 2025, "date": "2025-02-14", "url": "https://doi.org/10.48550/arxiv.2502.09963", "authors": "Xulu Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S4"}, {"id": "E25", "text": "We then propose a theoretical framework to assess whether existing LLM technologies could satisfy the conditions for singularity, with a focus on recursive self-improvement (RSI) and autonomous code generation.", "title": "Large language models: assessment for singularity", "year": 2025, "date": "2025-04-02", "url": "https://doi.org/10.1007/s00146-025-02271-4", "authors": "Ryunosuke Ishizaki et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E26", "text": "We present Noise-to-Meaning Recursive Self-Improvement (N2M-RSI), a minimal formal model showing that once an AI agent feeds its own outputs back as inputs and crosses an explicit information-integration threshold, its internal complexity will grow without bound under our assumptions.", "title": "When Your Own Output Becomes Your Training Data: Noise-to-Meaning Loops and a Formal RSI Trigger", "year": 2025, "date": "2025-05-05", "url": "https://doi.org/10.48550/arxiv.2505.02888", "authors": "Rintaro Ando", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 1, "sense": "S2"}, {"id": "E27", "text": "(3) A mechanism for recursive self-improvement, enabling the AGI to autonomously seek, integrate, and eventually develop its foundational models.", "title": "AGI-CTxM: A CorTeXManus Framework for Resilient, Self-Evolving Embodied Intelligence and Its Pathway to Superintelligence-ASI", "year": 2025, "date": "2025-07-16", "url": "https://doi.org/10.22541/au.175269972.23075554/v1", "authors": "Khan Tahsin Abrar", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E28", "text": "The integration of artificial intelligence (AI) with unmanned aerial systems has transformed surveillance, emergency response, and critical infrastructure monitoring capabilities.This paper presents Obsidian-WingAID, a novel modular framework designed to address the limitations of existing monolithic drone surveillance systems through specialized, domain-specific AI-powered modules.Our framework introduces a three-tier modular architecture compr…", "title": "ObsidianWingAID (OWAID): A Modular, Ethical, CorteXManus-Driven Cognitive Architectural AI-Drone Framework for Multidomain Deployment", "year": 2025, "date": "2025-07-23", "url": "https://doi.org/10.22541/au.175329670.04807482/v1", "authors": "Khan Tahsin Abrar", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "unclear"}, {"id": "E29", "text": "The possibility of a rapid, \"software-only\" intelligence explosion brought on by AI's recursive self-improvement (RSI) is a subject of intense debate within the AI community.", "title": "Will Compute Bottlenecks Prevent an Intelligence Explosion?", "year": 2025, "date": "2025-07-31", "url": "https://doi.org/10.48550/arxiv.2507.23181", "authors": "Parker Whitfill et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S1"}, {"id": "E30", "text": "Recursive Self-Improvement (RSI) In the next issue we will publish more articles on RSI, for instance, using reinforcement learning (RL).", "title": "Highlights of the Issue: Governance, Agents, Evolutionary Search", "year": 2025, "date": "2025-07-31", "url": "https://doi.org/10.70777/si.v2i3.15417", "authors": "Kristen W. Carlson", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "unclear"}, {"id": "E31", "text": "First, recursive self-improvement is a strong signal of progress toward AGI/SI; the Darwin Gödel Machine (DGM) modifies its own code.", "title": "Highlights of the Issue: Governance, Agents, Evolutionary Search", "year": 2025, "date": "2025-07-31", "url": "https://doi.org/10.70777/si.v2i3.15417", "authors": "Kristen W. Carlson", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E32", "text": "First, current governance structures provide limited coverage of risks linked to recursive self-improvement and multi-agent coordination, with only an estimated 10–15% of safety research addressing impacts that arise after deployment.", "title": "AI Governance in the Era of Agentic Generative AI and AGI: Frameworks, Risks, and Policy Directions", "year": 2025, "date": "2025-08-01", "url": "https://doi.org/10.55524/ijircst.2025.13.5.3", "authors": "Satyadhar Joshi", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E33", "text": "This article is relevant as a response to the deadlock of modern artificial neural networks, which, despite impressive results in recursive self-improvement, remain \"operators of metastuctures,\" devoid of consciousness and creative depth, confined to the framework of the \"dynamic scheme\" of the technical phase of individuation.", "title": "The collective crisis of humanity as a path to genuine \"superintellect\": why the affective reality of humans cannot be reduced to algorithmic and neuromorphic processes", "year": 2025, "date": "2025-09-01", "url": "https://doi.org/10.7256/2454-0757.2025.9.75393", "authors": "Vladislav Olegovich Sayapin", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "unclear"}, {"id": "E34", "text": "We develop an analytic framework for recursive self-improvement that links capability growth to resource build-out and deployment policies.", "title": "A Mathematical Framework for AI Singularity: Conditions, Bounds, and Control of Recursive Improvement", "year": 2025, "date": "2025-11-08", "url": "https://doi.org/10.48550/arxiv.2511.10668", "authors": "Akbar Anbar Jafari et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E35", "text": "These results demonstrate that recursive self-improvement is a general, model-agnostic approach to overcoming data sparsity, suggesting a scalable path forward for recommender systems and beyond.", "title": "Can Recommender Systems Teach Themselves? A Recursive Self-Improving Framework with Fidelity Control", "year": 2026, "date": "2026-02-17", "url": "https://doi.org/10.48550/arxiv.2602.15659", "authors": "Luankang Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S4"}, {"id": "E36", "text": "Instead of treating the singularity as a date forecast, we define a measurable transition regime in terms of scaling efficiency, transfer generalization, recursive self-improvement depth, and governance latency.", "title": "Phase Transitions in Artificial General Intelligence: Scaling Laws, Predictability Limits, and Singularity", "year": 2026, "date": "2026-03-10", "url": "https://doi.org/10.21203/rs.3.rs-9055490/v1", "authors": "Deep Bhattacharjee et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E37", "text": "Gödel agent realize recursive self-improvement: an agent inspects its own policy and traces and then modifies that policy in a tested loop.", "title": "Polaris: A Gödel Agent Framework for Small Language Models through Experience-Abstracted Policy Repair", "year": 2026, "date": "2026-03-24", "url": "https://doi.org/10.48550/arxiv.2603.23129", "authors": "Aditya Kakade et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E38", "text": "This skews evaluations and, thus, hinders model development, especially in settings of recursive self-improvement.", "title": "Self-Preference Bias in Rubric-Based Evaluation of Large Language Models", "year": 2026, "date": "2026-04-08", "url": "https://doi.org/10.48550/arxiv.2604.06996", "authors": "José Pombal et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S4"}, {"id": "E39", "text": "Existing benchmarks measure broad capability growth, but may not provide ample early warning signals for recursive self-improvement.", "title": "Frontier Coding Agents Can Now Implement an AlphaZero Self-Play Machine Learning Pipeline For Connect Four That Performs Comparably to an External Solver", "year": 2026, "date": "2026-04-27", "url": "https://doi.org/10.48550/arxiv.2604.25067", "authors": "Joshua Sherwood et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E40", "text": "Toward recursive self-improvement, we investigate LLM agents autonomously designing foundation models beyond standard Transformers.", "title": "Agentic Discovery of Neural Architectures: AIRA-Compose and AIRA-Design", "year": 2026, "date": "2026-05-15", "url": "https://doi.org/10.48550/arxiv.2605.15871", "authors": "Alberto Pepe et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E41", "text": "This establishes a powerful paradigm for discovering next-generation foundation models, marking a clear step toward recursive self-improvement.", "title": "Agentic Discovery of Neural Architectures: AIRA-Compose and AIRA-Design", "year": 2026, "date": "2026-05-15", "url": "https://doi.org/10.48550/arxiv.2605.15871", "authors": "Alberto Pepe et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E42", "text": "We conclude with the safety problems that recursive self-improvement makes concrete and the open directions they impose.", "title": "Automated Design of Agentic Systems: A Survey of Algorithms for Searching, Optimizing, and Evolving LLM Agents, Workflows, and Prompts", "year": 2026, "date": "2026-06-02", "url": "https://doi.org/10.20944/preprints202606.0238.v1", "authors": "Maksim Madžar et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E43", "text": "Ultimately, MAC provides a rigorous, open-source benchmark for autonomous AI research and development, offering an empirical proxy for evaluating recursive self-improvement.", "title": "The Meta-Agent Challenge: Are Current Agents Capable of Autonomous Agent Development?", "year": 2026, "date": "2026-06-03", "url": "https://doi.org/10.48550/arxiv.2606.04455", "authors": "Xinyu Lu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E44", "text": "We take the operational view that any system worth the \"recursive self-improvement\" label must eventually perform end-to-end post-training of a frontier-class model; this is one datapoint of that bar being cleared.", "title": "A-Evolve-Training: Autonomous Post-Training of a 30B Model", "year": 2026, "date": "2026-06-09", "url": "https://doi.org/10.48550/arxiv.2606.20657", "authors": "Zhan Shi et al.", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S3"}, {"id": "E45", "text": "Self-modifying systems (agents that rewrite their own code, recursive self-improvement loops) raise a different question: can a safety property that holds now be certified, in advance, to keep holding after the system rewrites itself?", "title": "Algorithmic Unverifiability of Safety for Fixed and Recursively Self-Improving Systems", "year": 2026, "date": "2026-06-18", "url": "https://doi.org/10.48550/arxiv.2606.28639", "authors": "José Pascual Gumbau Mezquita", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E46", "text": "We introduce the Red Queen Gödel Machine (RQGM), an evolutionary framework for recursive self-improvement under non-stationary utilities.", "title": "The Red Queen Gödel Machine: Co-Evolving Agents and Their Evaluators", "year": 2026, "date": "2026-06-24", "url": "https://doi.org/10.48550/arxiv.2606.26294", "authors": "Alex Iacob et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S3"}, {"id": "E47", "text": "On-policy self-distillation (OPSD) is a promising approach to recursive self-improvement.", "title": "Rethinking On-Policy Self-Distillation for Thinking Models", "year": 2026, "date": "2026-07-06", "url": "https://doi.org/10.48550/arxiv.2607.05184", "authors": "Simran Kaur et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S4"}, {"id": "E48", "text": "MetaSkill-Evolve: Recursive Self-Improvement of LLM Agents via Two-Timescale Meta-Skill Evolution", "title": "MetaSkill-Evolve: Recursive Self-Improvement of LLM Agents via Two-Timescale Meta-Skill Evolution", "year": 2026, "date": "2026-07-06", "url": "https://doi.org/10.48550/arxiv.2607.05297", "authors": "Zefeng Wang et al.", "fromTitle": true, "field": "Computer Science", "inSet": 8, "sense": "S3"}, {"id": "E49", "text": "Even a minimal version of this co-training recipe produces monotonic improvement, laying the foundation for recursive self-improvement in visual generation that can meet world-knowledge-grounded requests.", "title": "Search Beyond What Can Be Taught: Evolving the Knowledge Boundary in Agentic Visual Generation", "year": 2026, "date": "2026-07-06", "url": "https://doi.org/10.48550/arxiv.2607.05382", "authors": "Haozhe Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S4"}, {"id": "E50", "text": "This paper states the MOBIUS project's position in five theses, each anchored in released, measured, or live-operated work rather than speculation: (1) governance is a dosed intervention whose effect is conditioned on model capacity, with a measured crossover near 4B parameters and a measured penalty for over-dosing at every non-reasoning scale up to 120B; (2) the binding constraint on recursive self-improvement is not capability but anti-regres…", "title": "The Missing Half of the AI Future: Capacity-Conditioned, Reversibility-Based Governance as Infrastructure — A Position Paper of the MOBIUS Project", "year": 2026, "date": "2026-07-06", "url": "https://doi.org/10.5281/zenodo.21222349", "authors": "Toeda Taiko", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "unclear"}, {"id": "E51", "text": "The taxonomy separates bounded self-refinement -- convergent, evaluable, and industrial practice -- from open-ended recursive self-improvement (RSI), which remains bounded by grounding requirements, collapse dynamics, and compute constraints on every measured axis.", "title": "Recursive Self-Improvement in AI: From Bounded Self-Refinement to Autonomous Research Loops", "year": 2026, "date": "2026-07-08", "url": "https://doi.org/10.48550/arxiv.2607.07663", "authors": "Mingguang Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 18, "sense": "S3"}, {"id": "E52", "text": "Drawing on Jaakkola's(2020) approach to designing conceptual articles, the study synthesizes contributions that explicitly address singularity, superintelligence, or recursive self improvement in organizational and socio-economic contexts, and codes them by level of analysis, management function, theoretical lens, and assumptions about AI capabilities.", "title": "A typology of technological singularity research in management: mapping current directions and future pathways", "year": 2026, "date": "2026-07-10", "url": "https://doi.org/10.3389/fhumd.2026.1793537", "authors": "Ekaterina Glebova et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E53", "text": "Motivated by this, we propose \\textsc{AutoMem}, a text-gradient recursive self-improvement framework for task-adaptive memory architecture search. \\textsc{AutoMem} optimizes over the factored space through two components: Experience-Guided Architecture Search, which proposes candidate architectures from historical search trajectories and accumulated reflections, and Failure-Guided Module Diagnosis, which localizes memory-related failures to spec…", "title": "AutoMem: A Text-Gradient Recursive Self-Improvement Framework for Automated Memory Architectures Search", "year": 2026, "date": "2026-07-14", "url": "https://doi.org/10.48550/arxiv.2608.14621", "authors": "Lin Du et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E54", "text": "Recursive self-improvement requires turning evidence of model failures into better models.", "title": "RSIBench-Data: Benchmarking Data-Centric Research for Recursive Self-Improvement", "year": 2026, "date": "2026-07-28", "url": "https://doi.org/10.48550/arxiv.2607.25886", "authors": "Fanqing Meng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 7, "sense": "S3"}, {"id": "E55", "text": "RSIBench-Data provides a measurable, auditable testbed for the research capabilities required for recursive self-improvement.", "title": "RSIBench-Data: Benchmarking Data-Centric Research for Recursive Self-Improvement", "year": 2026, "date": "2026-07-28", "url": "https://doi.org/10.48550/arxiv.2607.25886", "authors": "Fanqing Meng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 7, "sense": "S3"}, {"id": "E56", "text": "Recursive self-improvement (RSI) requires AI systems that improve the process of building AI (i.e., AI4AI); machine learning engineering (MLE) offers a concrete, executable testbed for studying this capability.", "title": "Frontis-MA1: Training an AI4AI Model towards Recursive Self-Improvement in Machine Learning Engineering", "year": 2026, "date": "2026-07-30", "url": "https://doi.org/10.48550/arxiv.2607.28568", "authors": "Junlin Yang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E57", "text": "We address this problem with a policy-level recursive self-improvement loop: execution outcomes train a criticality world model, whose risk scores guide scenario collection for specialist training.", "title": "Policy-Level Recursive Self-Improvement for Embodied AI with a Criticality World Model", "year": 2026, "date": "2026-07-30", "url": "https://doi.org/10.48550/arxiv.2607.28251", "authors": "Linxuan He et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E58", "text": "To compare the self-improvement capabilities of diverse agent systems, we introduce a five-level grading standard, ranging from manual improvement to general recursive self-improvement.", "title": "The Path to Recursive Self-Improving Agents: Foundation, Framework, and Future Directions", "year": 2026, "date": "2026-08-03", "url": "https://doi.org/10.20944/preprints202608.0051.v1", "authors": "Shuaiqi Liu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E59", "text": "Recursive self-improvement requires agents to turn accumulated experience into better future behavior.", "title": "PAST-Bench: Benchmarking the Foundations of Recursive Self-Improvement in Personal Agents", "year": 2026, "date": "2026-08-04", "url": "https://doi.org/10.48550/arxiv.2608.04003", "authors": "Shuhan Xue et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E60", "text": "This publication does not claim consciousness, sentience, human-level or superhuman general intelligence, unrestricted recursive self-improvement, autonomous source-code mutation, universal computer-use competence, distributed multi-node correctness, or independent third-party validation of the private implementation.", "title": "EvoMind: A Governed Cognitive Architecture for Persistent, Verifiable, Experience-Driven Agentic Autonomy", "year": 2026, "date": "2026-08-10", "url": "https://doi.org/10.5281/zenodo.20580111", "authors": "Gabriel Allit", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "unclear"}, {"id": "E61", "text": "The algorithm combines Model-Harness Co-design and recursive self-improvement loop, including the UI4A component-native GenUI harness, a stateful action substrate, versioned Harness Context Protocol contract, and the agentic RL framework MindForge.", "title": "Macaron-V1: Towards Open Continual Learning with Self-Improvement and Mixture-of-LoRA", "year": 2026, "date": "2026-08-10", "url": "https://doi.org/10.48550/arxiv.2608.09819", "authors": "Mind Lab et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E62", "text": "Core ThesisThe K4–K5 roadmap proposes two sequential paradigm shifts beyond the current CAA-X architecture: K4 — Recursive Self-Improvement Layer: A meta-cognitive architecture where the λ-order-parameter itself becomes subject to optimization by a higher-order \"meta-λ\" controller.", "title": "CAA-X V7.1 Future Architectures and the K4–K5 Roadmap: Beyond Current Paradigms — Revised and Expanded Edition", "year": 2026, "date": "2026-08-10", "url": "https://doi.org/10.5281/zenodo.21871358", "authors": "Qi LU", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E63", "text": "Key Contributions- Meta-λ Formalism: Mathematical specification of recursive self-improvement through fixed-point iteration on the λ-order-parameter, with convergence proofs and stability bounds.- K4 Architecture Blueprint: Detailed system design for the recursive layer, including the Meta-Cognitive Scheduler, the Self-Model Atom, and the Experience Replay Compressor.- K5 Collective Protocol: GWP-C (Collective) specification — message passing, c…", "title": "CAA-X V7.1 Future Architectures and the K4–K5 Roadmap: Beyond Current Paradigms — Revised and Expanded Edition", "year": 2026, "date": "2026-08-10", "url": "https://doi.org/10.5281/zenodo.21871358", "authors": "Qi LU", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E64", "text": "While an ideal harness system should align with human design priors and accumulate reusable experience through empirical exploration to drive recursive self-improvement, existing paradigms remain static and fall short of this capability.", "title": "AutoDesign: Meta-Harness Optimization for Long-Horizon Agentic Design", "year": 2026, "date": "2026-08-13", "url": "https://doi.org/10.48550/arxiv.2608.13560", "authors": "Yaxin Luo et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E65", "text": "We study recursive self-improvement at the level of quantitative-investment research: whether an autonomous system can use evidence from earlier experiments to improve the hypotheses and candidates proposed in later iterations.", "title": "AQuA: Recursively Self-Improving Quantitative Trading Research Agents", "year": 2026, "date": "2026-08-13", "url": "https://doi.org/10.48550/arxiv.2608.12841", "authors": "Jiacheng Guo et al.", "fromTitle": false, "field": "Decision Sciences", "inSet": 2, "sense": "S3"}, {"id": "E66", "text": "This coupling motivates model-harness co-evolution for recursive self-improvement: build harnesses for a fixed model, update the model from verified sibling trajectories, and rebuild the harnesses as model capabilities change.", "title": "HELIX: Model-Harness Co-evolution for Recursive Self-Improvement", "year": 2026, "date": "2026-08-14", "url": "https://doi.org/10.48550/arxiv.2608.13951", "authors": "Tianyu Fan et al.", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S3"}, {"id": "E67", "text": "We present Benchmark-as-Teacher (BaT), a recursive self-improvement system for agent post-training.", "title": "BaT: Towards Self-Evolving Medical Research Agent with Stage Rubrics", "year": 2026, "date": "2026-08-17", "url": "https://doi.org/10.48550/arxiv.2608.16211", "authors": "Junqi Liu et al.", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S3"}, {"id": "E68", "text": "Large language model (LLM) agents can now post-train an LLM end-to-end, raising the prospect of recursive self-improvement (RSI).", "title": "What is Missing from AI Post-Training AI: An Empirical Analysis", "year": 2026, "date": "2026-08-19", "url": "https://doi.org/10.48550/arxiv.2608.19072", "authors": "Joy Jia Yin Lim et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E69", "text": "Recursive self-improvement (RSI) asks whether an AI system can improve the process that produces AI systems, so that the next system inherits the improvement.", "title": "AI4AI-Bench: Benchmarking LLM Agents in Algorithmic Design for Recursive Self-Improvement", "year": 2026, "date": "2026-08-20", "url": "https://doi.org/10.48550/arxiv.2608.20318", "authors": "Yizhe Chi et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S3"}, {"id": "E70", "text": "Drawing an analogy to von Neumann’s complexity threshold for self-reproducing automata, we argue that sustainable recursive self-improvement in large language models (LLMs) requires a functional analogue: introspection—the system’s capacity to simulate its own operations and target modifications.", "title": "Self-Referential Introspection in Large Language Models: The Critical Threshold for Recursive Self-Improvement", "year": 2026, "date": "2026-08-24", "url": "https://doi.org/10.3390/e28090951", "authors": "Jiang Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E71", "text": "Recursive self-improvement (RSI) remains hard in long-horizon tasks, where growing histories obscure the task state and misalign skill invocation.", "title": "Recursive Experiential-Working Memory Evolution for Long-Horizon Agent Harnesses", "year": 2026, "date": "2026-08-25", "url": "https://doi.org/10.48550/arxiv.2608.24876", "authors": "Zhaochen Yu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E72", "text": "Meta$^n$: Recursive Self-Improvement through Emergent Depth", "title": "Meta$^n$: Recursive Self-Improvement through Emergent Depth", "year": 2026, "date": "2026-08-25", "url": "https://openalex.org/W7204500065", "authors": "Zae Myung Kim et al.", "fromTitle": true, "field": "Computer Science", "inSet": 2, "sense": "unclear"}, {"id": "E73", "text": "In this work, we eliminate external gold supervision from the RL training reward: the model's own evaluative capability generates learning signals for its optimization -- a closed-loop setting of bounded recursive self-improvement (RSI) termed Recursive Self-Evaluation (RecurSE).", "title": "RecurSE: Bounded Recursive Self-Evaluation for LLM Rubric Judges", "year": 2026, "date": "2026-08-25", "url": "https://doi.org/10.48550/arxiv.2608.24231", "authors": "Kaiyuan Liu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S4"}, {"id": "E74", "text": "Efficiently improving autonomous agents across diverse tasks is central to accelerating recursive self-improvement (RSI) in agentic AI, with prompt optimization emerging as a promising approach capable of delivering performance gains comparable to those achieved by fine-tuning model weights, while reducing computational costs in both optimization and serving.", "title": "Naive Prompt Optimization: Rethinking the Need for Complex Prompt Search", "year": 2026, "date": "2026-08-27", "url": "https://doi.org/10.48550/arxiv.2608.27266", "authors": "Yuan Chang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E75", "text": "Yet the rapidly expanding literature remains fragmented across long-horizon agents, AI for AI (AI4AI), self-improvement, and recursive self-improvement, making it difficult to tell how much progress has actually been made.", "title": "AI4AI Survey: From Long-Horizon Agents to Recursive Self-Improvement—Definitions, Reliable Horizons, and Open Problems", "year": 2026, "date": "2026-08-28", "url": "https://doi.org/10.20944/preprints202608.2108.v1", "authors": "Kai Wu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E76", "text": "We introduce \\textsc{DataFoundry}, a framework for \\textbf{evolving data preparators through recursive self-improvement} before large-scale data production. \\textsc{DataFoundry} represents a data preparator as an evolvable runtime specification and instantiates its evolution with a \\textsc{Skills-as-Modules} architecture, in which a central \\textsc{Controller} orchestrates modular skills to compile executable runtimes, diagnose deficiencies on s…", "title": "DataFoundry: Evolving Data Preparators via Recursive Self-Improvement", "year": 2026, "date": "2026-08-30", "url": "https://doi.org/10.48550/arxiv.2608.29966", "authors": "Cehao Yang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E77", "text": "Autonomous AI agents and recursive self-improvement: a comprehensive survey of contemporary architectures, capabilities, and safety frameworks", "title": "Autonomous AI agents and recursive self-improvement: a comprehensive survey of contemporary architectures, capabilities, and safety frameworks", "year": 2026, "date": "2026-09-01", "url": "https://doi.org/10.1007/s10586-026-06537-4", "authors": "Nadir iBRAHIMOĞLU et al.", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E78", "text": "Recursive self-improvement (RSI) lets a system improve the model-building machinery from its own failures, so every later model inherits the gain.", "title": "MetaRSI / RSI2: A Meta-Recursive Self-Improving System for Recursive Self-Improving Systems Themselves", "year": 2026, "date": "2026-09-06", "url": "https://doi.org/10.48550/arxiv.2609.06396", "authors": "Zihan Tan et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E79", "text": "Recursive self-improvement (RSI) requires a concrete mechanism through which an AI system observes its capabilities and converts that evidence into the next round of learning.", "title": "NeoHorse-1: Towards Recursive Self-Improvement via Agentic Post-Training with Routing Harness", "year": 2026, "date": "2026-09-08", "url": "https://doi.org/10.48550/arxiv.2609.08183", "authors": "NeoHorse Team et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E80", "text": "We distinguish task-level refinement, lasting self-improvement, and recursive self-improvement, which also requires a better capacity to make further improvements.", "title": "A Survey on AI for AI: When the Improver Becomes the Improvee", "year": 2026, "date": "2026-09-08", "url": "https://doi.org/10.20944/preprints202609.0591.v1", "authors": "Deheng Ye et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E81", "text": "Recursive self-improvement (RSI) enables AI systems to turn experience and feedback into persistent changes that improve both their capabilities and the process of future improvement.", "title": "The Last AI Built by Humans: Toward Genuine Recursive Self-Improvement", "year": 2026, "date": "2026-09-10", "url": "https://doi.org/10.48550/arxiv.2609.11873", "authors": "Yi Duan et al.", "fromTitle": false, "field": "Computer Science", "inSet": 9, "sense": "S3"}, {"id": "E82", "text": "When we speak of recursive self-improvement (RSI), are we speaking of a phenomenon, a mechanism, or a prospect?", "title": "Generalized Agent Iteration: One Formal Framework for Iterative Policy Improvement and Recursive Self-Improvement", "year": 2026, "date": "2026-09-11", "url": "https://doi.org/10.48550/arxiv.2609.13406", "authors": "Hongyao Tang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S2"}, {"id": "E83", "text": "Moreover, we use these coordinates to place existing systems on the same two axes and make the defects of recursive self-improvement statable one condition at a time.", "title": "Generalized Agent Iteration: One Formal Framework for Iterative Policy Improvement and Recursive Self-Improvement", "year": 2026, "date": "2026-09-11", "url": "https://doi.org/10.48550/arxiv.2609.13406", "authors": "Hongyao Tang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S2"}, {"id": "E84", "text": "Recursive self-improvement is becoming essential for autonomous AI agents, whose progress depends on discovering high-value solutions across complex domains.", "title": "Dream-RSI: Recursive Self-Improvement through Evolving Worlds", "year": 2026, "date": "2026-09-14", "url": "https://doi.org/10.48550/arxiv.2609.14858", "authors": "Tong Zheng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E85", "text": "Recent work extends recursive self-improvement (RSI) to agent harnesses for long-horizon coding and terminal tasks, enabling agents to improve execution mechanisms from experience.", "title": "ModularRSI: Modular and Generalizable Recursive Harness Self-Improvement", "year": 2026, "date": "2026-09-14", "url": "https://doi.org/10.48550/arxiv.2609.14857", "authors": "Siwei Wu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E86", "text": "We introduce \\textbf{RSIAgent}, a training-free multi-agent framework for recursive self-improvement through autonomous memory construction.", "title": "RSIAgent: Autonomous Exploration for Recursive Self-improvement in New Environments", "year": 2026, "date": "2026-09-14", "url": "https://doi.org/10.48550/arxiv.2609.15364", "authors": "Sibo Zhu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E87", "text": "We model the economics of recursive self-improvement (RSI) and assess its plausibility and impacts.", "title": "The Economics of Recursive Self-Improvement", "year": 2026, "date": "2026-09-14", "url": "https://openalex.org/W7213371396", "authors": "Tom Cunningham et al.", "fromTitle": false, "field": "Economics, Econometrics and Finance", "inSet": 0, "sense": "S1"}, {"id": "E88", "text": "At its core is recursive-in-recursive self-improvement, a paradigm that couples harness evolution with model reinforcement learning: the inner recursion improves the harness with the model fixed, while the outer recursion trains the model under the improved harness.", "title": "ScienceBuddy: Recursive-in-Recursive Self-Improvement for Interactive Scientific Agents", "year": 2026, "date": "2026-09-15", "url": "https://doi.org/10.48550/arxiv.2609.17523", "authors": "Shuhan Xue et al.", "fromTitle": false, "field": "Decision Sciences", "inSet": 1, "sense": "S3"}, {"id": "E89", "text": "Token efficiency therefore becomes important for scaling recursive self-improvement.", "title": "SoL-Pi: Recursively Scaling Auto-Research Loops for Efficient Agent Harness", "year": 2026, "date": "2026-09-17", "url": "https://doi.org/10.48550/arxiv.2609.20519", "authors": "Haozhe Liu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E90", "text": "We introduce Recursive Self Improvement via Fast Tree-search (SIFT), which augments these downstream task evaluations with an LLM-as-a-judge signal that performs pairwise comparisons between candidate patches, where the win-loss record is aggregated with a regularized Bradley-Terry model, and the resulting strength scores drive rank-based parent sampling inside a lightweight disaggregated tree search.", "title": "Self Improvement via Fast Tree-search", "year": 2026, "date": "2026-09-17", "url": "https://doi.org/10.48550/arxiv.2609.19526", "authors": "Xinghong Fu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E91", "text": "Recent methods increasingly automate this process by iteratively proposing and selecting component-wise edits of an agent harness, practically establishing a form of recursive self-improvement (RSI) at the agent-system level.", "title": "RRSI: Regularized Recursive Self-Improvement of Agent Harnesses", "year": 2026, "date": "2026-09-21", "url": "https://doi.org/10.48550/arxiv.2609.24972", "authors": "Peng Xia et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S3"}, {"id": "E92", "text": "We introduce Regularized Recursive Self-Improvement of Agent Harnesses (RRSI), which incorporates the principles of regularizations into harness self-improvement by constraining the evolution candidate proposal and selection.", "title": "RRSI: Regularized Recursive Self-Improvement of Agent Harnesses", "year": 2026, "date": "2026-09-21", "url": "https://doi.org/10.48550/arxiv.2609.24972", "authors": "Peng Xia et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S3"}, {"id": "E93", "text": "Recursive self-improvement (RSI) offers a different paradigm in which agents learn from their own failures and autonomously expand their capabilities, but directly applying RSI to medicine introduces fundamental safety challenges.", "title": "MedRSI: Recursive Self-Improvement for Medical Agents via Clinically Aligned Self-Evolution", "year": 2026, "date": "2026-09-21", "url": "https://doi.org/10.48550/arxiv.2609.24838", "authors": "Junde Wu et al.", "fromTitle": false, "field": "Medicine", "inSet": 1, "sense": "S3"}, {"id": "E94", "text": "We introduce MedRSI, the first recursive self-improvement framework for medicine, which continuously transforms diagnostic failures into new clinical capabilities through tool composition and task-specific model training.", "title": "MedRSI: Recursive Self-Improvement for Medical Agents via Clinically Aligned Self-Evolution", "year": 2026, "date": "2026-09-21", "url": "https://doi.org/10.48550/arxiv.2609.24838", "authors": "Junde Wu et al.", "fromTitle": false, "field": "Medicine", "inSet": 1, "sense": "S3"}, {"id": "E95", "text": "We refer to this loop as recursive self-improvement.", "title": "Recursive self-improvement of AI research agents", "year": 2026, "date": "2026-09-22", "url": "https://doi.org/10.48550/arxiv.2609.26457", "authors": "Dhruv Srikanth et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S3"}, {"id": "E96", "text": "Together, these results show that an AI research agent can improve its own research efficiency through recursive self-improvement, and that these gains transfer to tasks and domains the loop never encountered.", "title": "Recursive self-improvement of AI research agents", "year": 2026, "date": "2026-09-22", "url": "https://doi.org/10.48550/arxiv.2609.26457", "authors": "Dhruv Srikanth et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S3"}, {"id": "E97", "text": "We call this constrained setting strategy-level recursive self-improvement (Strategy-Level RSI).", "title": "Towards Strategy-Level RSI for Skill-Augmented Agents: Learning When to Reuse Skills from Execution Feedback", "year": 2026, "date": "2026-09-22", "url": "https://doi.org/10.48550/arxiv.2609.26863", "authors": "Shuang Guo et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E98", "text": "Recursive self-improvement in AI systems is often described informally as a generator producing candidates and a verifier certifying them, with the verifier’s judgment propagating trust to further layers of a system.", "title": "Second-Order Memory and the Golden-Ratio Conjecture in Generator–Verifier Budget Allocation", "year": 2026, "date": "2026-09-22", "url": "https://doi.org/10.5281/zenodo.22893271", "authors": "Yunjing Chen", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S2"}, {"id": "E99", "text": "To our knowledge, we are the first to introduce an evidence-gated recursive self-improvement (RSI) protocol for embodied robotic agents.", "title": "RegenHarness: A Robot Agent Harness with Evidence-Gated Recursive Self-Improvement", "year": 2026, "date": "2026-09-23", "url": "https://openalex.org/W7214405995", "authors": "Kailin Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E100", "text": "What Stops Recursive Self-Improvement in Robotics? Lessons from 123 Rounds of Agentic Skill Discovery", "title": "What Stops Recursive Self-Improvement in Robotics? Lessons from 123 Rounds of Agentic Skill Discovery", "year": 2026, "date": "2026-09-23", "url": "https://doi.org/10.48550/arxiv.2609.31760", "authors": "Jiaming Wang", "fromTitle": true, "field": "Engineering", "inSet": 3, "sense": "S3"}, {"id": "E101", "text": "We therefore propose EvoAudio, a recursive self-improvement system for audio understanding.", "title": "EvoAudio: Recursive Self-Improvement for Audio Understanding", "year": 2026, "date": "2026-09-23", "url": "https://doi.org/10.48550/arxiv.2609.27389", "authors": "Yuxiang Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E102", "text": "Recursive Self-Improvement via On-Policy Distillation for Reasoning", "title": "Recursive Self-Improvement via On-Policy Distillation for Reasoning", "year": 2026, "date": "2026-09-25", "url": "https://doi.org/10.48550/arxiv.2609.30652", "authors": "Shangjian Yin et al.", "fromTitle": true, "field": "Computer Science", "inSet": 1, "sense": "S4"}, {"id": "E103", "text": "Rapid advances in AI are bringing recursive self-improvement (RSI) closer to practice, with growing progress in model self-training, self-evolving agents, and automated AI development.", "title": "Evolutionary Safety of Recursive Self-Improving AI: Taxonomy, Risk Discovery, and Evaluation", "year": 2026, "date": "2026-09-25", "url": "https://doi.org/10.48550/arxiv.2609.31186", "authors": "Chang Gong et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E104", "text": "Therefore, we introduce Evolutionary Safety to study how safety properties are preserved, weakened, or restored throughout persistent and recursive self-improvement.", "title": "Evolutionary Safety of Recursive Self-Improving AI: Taxonomy, Risk Discovery, and Evaluation", "year": 2026, "date": "2026-09-25", "url": "https://doi.org/10.48550/arxiv.2609.31186", "authors": "Chang Gong et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E105", "text": "As recursive self-improvement (RSI) rapidly advances, reliable evaluation becomes critical for guiding adaptive search.", "title": "Which Self-Improvements Should We Trust? Reliable Self-Improvement When Agents Reuse Their Benchmarks", "year": 2026, "date": "2026-09-27", "url": "https://doi.org/10.48550/arxiv.2609.33180", "authors": "Xiaojing Sun et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E106", "text": "We introduce R$^2$ Flow, a recursive self-improvement framework that alternates policy learning, independent verification, and versioned skill-library updates on a shared-state orchestration graph.", "title": "R$^2$ Flow: Recursive Self-Improvement via Recursive Skill Evolution", "year": 2026, "date": "2026-09-27", "url": "https://doi.org/10.48550/arxiv.2609.33867", "authors": "Mingda Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E107", "text": "Recursive self-improvement (RSI) seeks to enable AI systems to participate in improving their own capabilities.", "title": "RSI-Master: Structuring Experiments to Guide Autonomous Model Improvement", "year": 2026, "date": "2026-09-28", "url": "https://doi.org/10.48550/arxiv.2609.35561", "authors": "Yaxin Du et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E108", "text": "For operator implementation, we deploy a Recursive Self-Improvement (RSI) loop that searches kernel fusions and memory layouts, evaluating latency together with numerical agreement.", "title": "Sol-H3: Recursive Self-Improvement for MiniMax-H3 Inference Acceleration on Sol-Engine across Cloud and Edge", "year": 2026, "date": "2026-09-28", "url": "https://doi.org/10.48550/arxiv.2609.35110", "authors": "Yitong Li et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E109", "text": "In this paper, we introduce RSI-router, a routing framework that constructs subtask-level model assignments and model-specific skills through recursive self-improvement over accumulated experience.", "title": "RSI-Router: Evolving Subtask-Level LLM Routing and Skills for Cost-Efficient Agents", "year": 2026, "date": "2026-09-28", "url": "https://doi.org/10.48550/arxiv.2609.34712", "authors": "Hao Li et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E110", "text": "The resulting agenda connects compositional task acquisition and faithful transfer with physical recursive self-improvement, in which experience improves the ability to learn subsequent tasks.", "title": "In-Context Learning for Robots: Methods and Applications", "year": 2026, "date": "2026-09-28", "url": "https://doi.org/10.48550/arxiv.2609.36012", "authors": "Haojian Huang et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S3"}, {"id": "E111", "text": "We introduce Video-RSI, a framework for recursive self-improvement in which a video understanding agent uses its own language model to revise its harness.", "title": "Video-RSI: Recursive Self-Improvement of Video Understanding Agents via Harness Evolution", "year": 2026, "date": "2026-09-29", "url": "https://doi.org/10.48550/arxiv.2609.37950", "authors": "Bingjun Luo et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E112", "text": "We introduce MedForge-RSI, a recursive self-improvement framework that enables a deployed detector to adapt while keeping its model weights frozen.", "title": "MedForge-RSI: Medical Deepfake Detection via Recursive Self-Improvement", "year": 2026, "date": "2026-09-29", "url": "https://doi.org/10.48550/arxiv.2609.36549", "authors": "Zhihui Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E113", "text": "We introduce EmbodiRSI, an agentic system for recursive self-improvement (RSI) in a real-to-sim-to-real setting, where task-specific simulations are constructed from target deployment scenarios and used as low-cost environments for iterative policy improvement before transfer back to the physical world.", "title": "EmbodiRSI: Recursive Self-Improvement for Data-Efficient Robot Adaptation", "year": 2026, "date": "2026-09-30", "url": "https://doi.org/10.48550/arxiv.2609.38905", "authors": "Haoran Lang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E114", "text": "Recursive self-improvement (RSI) seeks to turn gains in an AI system into a stronger capacity to produce subsequent gains.", "title": "Recursive Self-Improvement in AI: A Survey", "year": 2026, "date": "2026-09-30", "url": "https://doi.org/10.20944/preprints202609.2680.v1", "authors": "Hao Wu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E115", "text": "Claims of recursive self-improvement (RSI) are usually judged against criteria chosen by their authors.", "title": "Level-4 Bounded Recursive Self-Improvement under a Published Definition: A Preregistered Test of a Self-Referential Improvement Mechanism", "year": 2026, "date": "2026-10-04", "url": "https://doi.org/10.5281/zenodo.23138421", "authors": "Junai P. Felix", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E116", "text": "We instead test a self-modifying runtime module against a published capability definition: Level 4, bounded recursive self-improvement, in the taxonomy of Liu et al.", "title": "Level-4 Bounded Recursive Self-Improvement under a Published Definition: A Preregistered Test of a Self-Referential Improvement Mechanism", "year": 2026, "date": "2026-10-04", "url": "https://doi.org/10.5281/zenodo.23138421", "authors": "Junai P. Felix", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E117", "text": "We introduce PhysEvo, a framework for physical recursive self-improvement (RSI) around a single frozen model.", "title": "PhysEvo: Astra Can Act, Let It", "year": 2026, "date": "2026-10-06", "url": "https://doi.org/10.48550/arxiv.2610.08995", "authors": "Wenqing Tian et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E118", "text": "We introduce EmbodiedSmith, a framework for scalable embodied data generation through recursive self-improvement (RSI).", "title": "EmbodiedSmith: Scaling Embodied Data through Recursive Self-Improvement Flywheel in Simulation", "year": 2026, "date": "2026-10-06", "url": "https://doi.org/10.48550/arxiv.2610.07969", "authors": "Yikai Qin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E119", "text": "In this paper, we introduce RIWANAV, a post-training framework that casts the coupled adaptation of a world model and an action model (policy) as task-specific recursive self-improvement (RSI).", "title": "RIWANav: Recursive World-Action Models with Self-Improvement for Urban Navigation", "year": 2026, "date": "2026-10-06", "url": "https://doi.org/10.48550/arxiv.2610.08640", "authors": "Jing Xie et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E120", "text": "The refined world model supplies feedback for the next policy update, closing the recursive self-improvement loop.", "title": "RIWANav: Recursive World-Action Models with Self-Improvement for Urban Navigation", "year": 2026, "date": "2026-10-06", "url": "https://doi.org/10.48550/arxiv.2610.08640", "authors": "Jing Xie et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E121", "text": "Recursive self-improvement requires carrying accepted changes into later improvement cycles, while studying agent-proposed changes also requires substantial research infrastructure.", "title": "RSIGym: A Flexible Environment for Recursive Self-Improvement", "year": 2026, "date": "2026-10-07", "url": "https://doi.org/10.48550/arxiv.2610.10310", "authors": "Fanqing Meng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E122", "text": "Environments are the foundation of recursive self-improvement: they provide the problems agents work on and the feedback used to evaluate progress.", "title": "RSI-Forge: From Research Papers to Environments for Recursive Self-Improvement", "year": 2026, "date": "2026-10-07", "url": "https://doi.org/10.48550/arxiv.2610.09426", "authors": "Renxiong Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E123", "text": "Recursive self-improvement (RSI) of a model on non-verifiable tasks, such as open-ended research, faces a supervision bottleneck when its outputs exceed what even human experts can reliably assess, leaving the model itself (optimizee) as the best available optimizer and evaluator.", "title": "Recursive Self-Improvement through Multi-Agent Self-Supervision", "year": 2026, "date": "2026-10-08", "url": "https://doi.org/10.48550/arxiv.2610.12176", "authors": "Hyunin Lee et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S4"}, {"id": "E124", "text": "These advantages make COAP a suitable medium for recursive self-improvement (RSI): coding agents develop the library in a closed loop, and each change is explicit and controllable.", "title": "Embodied Turing Machines: Stateful Code for Robot Recursive Self-Improvement", "year": 2026, "date": "2026-10-08", "url": "https://doi.org/10.48550/arxiv.2610.12369", "authors": "Kairui Hu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E125", "text": "We investigate this process as a model-based route to recursive self-improvement (RSI): the agent autonomously explores the environment, revises its world model, and uses verified updates to guide subsequent interaction and learning, while the underlying LLM remains fixed.", "title": "Memento 3: Model-Based Recursive Self-Improvement through Reflective Rulebooks", "year": 2026, "date": "2026-10-08", "url": "https://doi.org/10.48550/arxiv.2610.11794", "authors": "Haoyu Zhao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E126", "text": "AI research agents automate the cycle of proposing, implementing, and evaluating experiments, opening a path toward recursive self-improvement.", "title": "Language Models as AI Research World Models", "year": 2026, "date": "2026-10-08", "url": "https://doi.org/10.48550/arxiv.2610.12235", "authors": "Zijun Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E127", "text": "Recursive self-improvement, the participation of AI systems in improving their own capabilities, is beginning to move from theoretical prospect to practice, posing both challenges and opportunities for safety alignment.", "title": "ReSI: Recursive Safety Improvement toward Resistant and Resilient AI", "year": 2026, "date": "2026-10-08", "url": "https://doi.org/10.48550/arxiv.2610.12233", "authors": "Jingnan Zheng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E128", "text": "Recursive self-improvement, in turn, inspires an approach to both goals: safety alignment could likewise advance through successive rounds of evaluation and update.", "title": "ReSI: Recursive Safety Improvement toward Resistant and Resilient AI", "year": 2026, "date": "2026-10-08", "url": "https://doi.org/10.48550/arxiv.2610.12233", "authors": "Jingnan Zheng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E129", "text": "Recursive self-improvement (RSI) offers a promising approach to automatically evolve these harnesses.", "title": "Harness^2: Recursive Agent Harnessing for an Open World", "year": 2026, "date": "2026-10-09", "url": "https://doi.org/10.48550/arxiv.2610.14224", "authors": "Ruiyao Xu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E130", "text": "A central challenge in embodied recursive self-improvement is enabling agents to convert interaction history into capabilities that persist beyond one world and transfer to later tasks.", "title": "MC-EvoBench: Auditing Experience-Driven Self-Improvement in Minecraft Agents", "year": 2026, "date": "2026-10-09", "url": "https://doi.org/10.48550/arxiv.2610.13829", "authors": "Jingwei Song et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E131", "text": "We present EndoRSI (Endoscopic Recursive Self-Improvement), a human-governed, self-improving robotic research system in which the embedded EndoForge coding agent iteratively develops and refines endoscopic robot policies using evidence from physical experiments.", "title": "EndoRSI: Physical-Evidence-Driven Recursive Improvement of Endoscopic Robot Policies", es scientific agent swarms for recursive self-improvement.", "title": "SwarmRSI: Recursive Self-Improvement through Evolving Scientific Agent Swarm", "year": 2026, "date": "2026-10-14", "url": "https://doi.org/10.48550/arxiv.2610.20431", "authors": "Qianru Meng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E140", "text": "We first introduce VHarness-BRSI, a recursive self-improvement framework that evolves video harnesses around a frozen vision-language model.", "title": "VideoHarness-SRSI: Structured Recursive Self-Improvement for Video Understanding Harness", "year": 2026, "date": "2026-10-14", "url": "https://doi.org/10.48550/arxiv.2610.19424", "authors": "Zihao Lin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E141", "text": "Recursive Self-Improvement (RSI) has gained wide attention for its ability to work with limited data.", "title": "Recursive Reward Improvement via Adversarial Meta-Prompt Evolution", "year": 2026, "date": "2026-10-15", "url": "https://doi.org/10.48550/arxiv.2610.21040", "authors": "Wei Dai et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S4"}, {"id": "E142", "text": "Recursive self-improvement, in which AI systems build stronger AI systems, is one promising route to superintelligence.", "title": "Athanor: An Agent-Native System for Autonomous Post-Training Research", "year": 2026, "date": "2026-10-15", "url": "https://doi.org/10.48550/arxiv.2610.21055", "authors": "Yufa Zhou et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E143", "text": "Large language models (LLMs) are increasingly used to automate AI research, including language-model (LM) development, offering a potential path toward recursive self-improvement.", "title": "Language Models Learn to Improve Language Models", "year": 2026, "date": "2026-10-16", "url": "https://doi.org/10.48550/arxiv.2610.23344", "authors ovement, and highlight the remaining challenges toward open-world robot autonomy.", "title": "RobotAgentBench: Towards Open-world Robot Autonomy", "year": 2026, "date": "2026-10-26", "url": "https://doi.org/10.48550/arxiv.2610.34649", "authors": "Lingjun Mao et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S3"}, {"id": "E153", "text": "We further introduce Rubric-Guided Recursive Self-Improvement (RSI), a data flywheel in which a Meta-Agent turns execution evidence into refined rubrics, step-level reminders, and verified trajectories for domain-expert updates before their reconsolidation into OmniBrain-0 through MOPD.", "title": "OmniBrain-0: A Unified Agentic Model for Embodied Intelligence", "year": 2026, "date": "2026-10-26", "url": "https://doi.org/10.48550/arxiv.2610.36013", "authors": "Xiaomi Embodied Intelligence Team et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S3"}, {"id": "E154", "text": "Third, recursive self-improvement (RSI) in video model development, distinguishing output revisions, updates to harness state, generator parameters, and evaluators, and changes to the improvement procedure itself.", "title": "Video Generation Meets Agent Harness: Agentic Video Generation, Agentic World Modeling and Recursive Self-Improvement", "year": 2026, "date": "2026-10-29", "url": "https://doi.org/10.48550/arxiv.2610.40191", "authors": "Liaoyuan Fan et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E155", "text": "We first freeze an open-weight teacher and improve its harness through recursive self-improvement (RSI): frontier LLM agents read the teacher's trajectories and propose harness edits, and each edit is accepted only if it passes a paired statistical test.", "title": "TinyAstral: Transferring Self-Evolving Harnesses to Tiny Generalist Manipulation Agents", "year": 2026, "date": "2026-10-30", "url": "https://doi.org/10.48550/arxiv.2610.41216", "authors": "Kehong nt of AI research agents", "year": 2026, "date": "2026-09-22", "url": "https://doi.org/10.48550/arxiv.2609.26457", "authors": "Dhruv Srikanth et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S3"}, {"id": "E96", "text": "Together, these results show that an AI research agent can improve its own research efficiency through recursive self-improvement, and that these gains transfer to tasks and domains the loop never encountered.", "title": "Recursive self-improvement of AI research agents", "year": 2026, "date": "2026-09-22", "url": "https://doi.org/10.48550/arxiv.2609.26457", "authors": "Dhruv Srikanth et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S3"}, {"id": "E69", "text": "Recursive self-improvement (RSI) asks whether an AI system can improve the process that produces AI systems, so that the next system inherits the improvement.", "title": "AI4AI-Bench: Benchmarking LLM Agents in Algorithmic Design for Recursive Self-Improvement", "year": 2026, "date": "2026-08-20", "url": "https://doi.org/10.48550/arxiv.2608.20318", "authors": "Yizhe Chi et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S3"}, {"id": "E91", "text": "Recent methods increasingly automate this process by iteratively proposing and selecting component-wise edits of an agent harness, practically establishing a form of recursive self-improvement (RSI) at the agent-system level.", "title": "RRSI: Regularized Recursive Self-Improvement of Agent Harnesses", "year": 2026, "date": "2026-09-21", "url": "https://doi.org/10.48550/arxiv.2609.24972", "authors": "Peng Xia et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S3"}], "checks": {"inSense": true, "coinage": false}, "shift": ""}, {"year": 2026, "kind": "applied", "title": "Who Improves the Robot? Toward Physical Recursive Self-Improvement", "why": "提出“物理递归自我改进”，把这一概念扩展到由物理经验驱动的机器人能力与改进流程更新。", "url": "https://doi.org/10.48550/arxiv.2610 ovement Claims", "why": "质疑现有递归自我改进论断的评估证据，指出这类论断往往由作者自选标准来判定。", "url": "https://doi.org/10.48550/arxiv.2610.27610", "date": "2026-10-20", "workTitle": "Auditing the Product, Not the Recursion: The Evaluation Evidence Behind Recursive Self-Improvement Claims", "authors": "Zihan Chen et al.", "link": "in-sample", "evidence": [{"id": "E147", "text": "Recursive self-improvement (RSI) promises AI systems, such as self-evolving LLM agents, that become better at producing further improvements.", "title": "Auditing the Product, Not the Recursion: The Evaluation Evidence Behind Recursive Self-Improvement Claims", "year": 2026, "date": "2026-10-20", "url": "https://doi.org/10.48550/arxiv.2610.27610", "authors": "Zihan Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E115", "text": "Claims of recursive self-improvement (RSI) are usually judged against criteria chosen by their authors.", "title": "Level-4 Bounded Recursive Self-Improvement under a Published Definition: A Preregistered Test of a Self-Referential Improvement Mechanism", "year": 2026, "date": "2026-10-04", "url": "https://doi.org/10.5281/zenodo.23138421", "authors": "Junai P. Felix", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}], "checks": {"inSense": true, "coinage": false}, "shift": ""}], "totalsAsOf": "2026-11-17", "kindChecks": {"ancestor": [2, 4], "origin": [5, 5], "popularized": [6, 13], "redefined": [12, 17], "applied": [24, 24], "critique": [10, 12], "coined": [2, 2]}}</script>
