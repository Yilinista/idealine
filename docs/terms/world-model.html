ors analyze the nation‐state as a worldwide institution constructed by worldwide cultural and associational processes, developing four main topics: (1) properties of nation‐states that result from their exogenously driven construction, including isomorphism, decoupling, and expansive structuration; (2) processes by which rationalistic world culture affects national states; (3) characteristics of world society that enhance the impact of w…", "title": "World Society and the Nation‐State", "year": 1997, "date": "1997-07-01", "url": "https://doi.org/10.1086/231174", "authors": "John W. Meyer et al.", "fromTitle": false, "field": "Social Sciences", "inSet": 1, "sense": "S7"}, {"id": "E45", "text": "Automatic finite element mesh generation techniques have become commonly used tools for the analysis of complex, real-world models.", "title": "An Approach to Combined Laplacian and Optimization-Based Smoothing for Triangular, Quadrilateral, and Quad-Dominant Meshes.", "year": 1998, "date": "1998-01-01", "url": "https://openalex.org/W12947790", "authors": "Scott A. Canann et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S8"}, {"id": "E46", "text": "The job of the sensing system is to translate raw sensor input (usually sonar or vision data) into a world model.", "title": "On Three-Layer Architectures", "year": 1998, "date": "1998-05-01", "url": "https://openalex.org/W211918120", "authors": "Erann Gat", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E47", "text": "With even crude redshift information (say from broadband colors), it should be possible to constrain the cosmological world model.", "title": "Weak Lensing and Cosmology", "year": 1998, "date": "1998-05-01", "url": "https://doi.org/10.1086/305515", "authors": "N. Kaiser", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E48", "text": "In the present paper the gauge-invariant formalism is developed for perturbations of the brane world model in which our universe is realized as a boundary of a higher dimensional spacetime.", "title": "Brane world cosmology: Gauge-invariant formalism for perturbation", "year": 2000, "date": "2000-08-23", "url": "https://doi.org/10.1103/physrevd.62.064022", "authors": "Hideo Kodama et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 6, "sense": "S9"}, {"id": "E49", "text": "This point is illustrated by a comparison of anomaly driven inflation in four dimensions and in a Randall-Sundrum brane-world model.", "title": "Trace anomaly driven inflation", "year": 2001, "date": "2001-03-05", "url": "https://doi.org/10.1103/physrevd.63.083504", "authors": "Stephen William Hawking et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 4, "sense": "S9"}, {"id": "E50", "text": "The near-uniform light-curve and spectral evolution of SNe Ia can be used as accurate cosmic clocks to demonstrate the time dilation as predicted from expanding world models.", "title": "Cosmological Implications from Observations of Type Ia Supernovae", "year": 2001, "date": "2001-09-01", "url": "https://doi.org/10.1146/annurev.astro.39.1.67", "authors": "BRUNO LEIBUNDGUT", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E51", "text": "Given this prior uncertainty over possible environments, the optimal-learning agent must collect and use information in an intelligent way, balancing greedy exploitation of certainty-equivalent world models with exploratory actions aimed at discerning the true state of nature.", "title": "Optimal learning: computational procedures for bayes-adaptive markov decision processes", "year": 2002, "date": "2002-01-01", "url": "https://openalex.org/W1497039698", "authors": "Michael O. Duff et al.", "fromTitle": false, "field": "Decision Sciences", "inSet": 1, "sense": "S1"}, {"id": "E52", "text": "We use gigaparticle N -body simulations to study galaxy cluster populations in Hubble volumes of ΛCDM (Ω m = 0.3, Ω Λ = 0.7) and τCDM (Ω m = 1) world models.", "title": "Galaxy Clusters in Hubble Volume Simulations: Cosmological Constraints from Sky Survey Populations", "year": 2002, "date": "2002-07-01", "url": "https://doi.org/10.1086/340551", "authors": "AUGUST E. EVRARD et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E53", "text": "The VFH method uses a two-dimensional Cartesian histogram grid as a world model.", "title": "Real-time obstacle avoidance for fast mobile robots in cluttered environments", "year": 2002, "date": "2002-12-04", "url": "https://doi.org/10.1109/robot.1990.126042", "authors": "J. Borenstein et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S2"}, {"id": "E54", "text": "The junction conditions are applied to simple brane world models, and are compared to the many contradictory results in the literature.", "title": "Generalized Israel junction conditions for a Gauss-Bonnet brane world", "year": 2003, "date": "2003-01-28", "url": "https://doi.org/10.1103/physrevd.67.024030", "authors": "Stephen C. Davis", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S9"}, {"id": "E55", "text": "We begin our review with the simplest consistent brane world model: a single brane embedded in a five-dimensional anti-de Sitter spacetime.", "title": "Cosmology and brane worlds: a review", "year": 2003, "date": "2003-04-15", "url": "https://doi.org/10.1088/0264-9381/20/9/202", "authors": "Philippe Brax et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 3, "sense": "S9"}, {"id": "E56", "text": "We consider the instability of the Friedmann world model to second order in perturbations.", "title": "Second-order perturbations of the Friedmann world model", "year": 2004, "date": "2004-05-14", "url": "https://doi.org/10.1103/physrevd.69.104011", "authors": "Hyerim Noh et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E57", "text": "At 3.6 and 4.5 μm, the galaxy counts follow the expectations of a Euclidean world model down to ∼16 mag and drop below the Euclidean curve for fainter magnitudes.", "title": "Number Counts at 3 μm \u003c λ \u003c 10 μm from the Spitzer Space Telescope", "year": 2004, "date": "2004-09-01", "url": "https://doi.org/10.1086/422585", "authors": "Giovanni G. Fazio et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E58", "text": "Cosmological perturbations are briefly discussed as well as early universe scenarios such as the cyclic model and the born-again brane world model.", "title": "Brane world cosmology", "year": 2004, "date": "2004-11-03", "url": "https://doi.org/10.1088/0034-4885/67/12/r02", "authors": "Philippe Brax et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 1, "sense": "S9"}, {"id": "E59", "text": "We also present a SARSA based extension of GPTD, termed GPSARSA, that allows the selection of actions and the gradual improvement of policies without requiring a world-model.", "title": "Reinforcement learning with Gaussian processes", "year": 2005, "date": "2005-01-01", "url": "https://doi.org/10.1145/1102351.1102377", "authors": "Yaakov Engel et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E60", "text": "The DGP brane-world model provides an alternative to the standard LCDM cosmology, in which the late universe accelerates due to a modification of gravity rather than vacuum energy.", "title": "Structure formation in the Dvali–Gabadadze–Porrati cosmological model", "year": 2006, "date": "2006-01-18", "url": "https://doi.org/10.1088/1475-7516/2006/01/016", "authors": "Kazuya Koyama et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 1, "sense": "S9"}, {"id": "E61", "text": "CONCLUSION: The developed world model of personal ownership of a phone may not be appropriate to the developing world in which shared mobile telephone use is important.", "title": "Can the ubiquitous power of mobile phones be used to improve health outcomes in developing countries?", "year": 2006, "date": "2006-05-23", "url": "https://doi.org/10.1186/1744-8603-2-9", "authors": "Warren Allan Kaplan", "fromTitle": false, "field": "Health Professions", "inSet": 0, "sense": "S10"}, {"id": "E62", "text": "Using some sort of adaptive predictive world model, they improve their ability to answer questions such as what happens if I do this or that?", "title": "Developmental robotics, optimal artificial curiosity, creativity, music, and the fine arts", "year": 2006, "date": "2006-06-01", "url": "https://doi.org/10.1080/09540090600768658", "authors": "Jürgen Schmidhuber", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S1"}, {"id": "E63", "text": "Wormhole solutions are considered in the Einstein minimally coupled theory and in the brane world model.", "title": "Gravitational lensing by wormholes", "year": 2006, "date": "2006-07-20", "url": "https://doi.org/10.1103/physrevd.74.024020", "authors": "Kamal Kanti Nandi et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S9"}, {"id": "E64", "text": "Finally, the authors consider the relevance of small-world models for understanding the emergence of complex behaviors and the resilience of brain systems to pathological attack by disease or aberrant development.", "title": "Small-World Brain Networks", "year": 2006, "date": "2006-11-01", "url": "https://doi.org/10.1177/1073858406293182", "authors": "Danielle S. Bassett et al.", "fromTitle": false, "field": "Neuroscience", "inSet": 0, "sense": "S10"}, {"id": "E65", "text": "The broad aim of the competition was to create better understanding between researchers and practitioners by allowing emerging techniques to be developed and tested on real-world models of timetabling problems.", "title": "Setting the Research Agenda in Automated Timetabling: The Second International Timetabling Competition", "year": 2009, "date": "2009-05-19", "url": "https://doi.org/10.1287/ijoc.1090.0320", "authors": "Barry McCollum et al.", "fromTitle": false, "field": "Decision Sciences", "inSet": 0, "sense": "S8"}, {"id": "E66", "text": "The inclusion of brane thickness can realize a variety of possible brane world models.", "title": "Thick brane solutions", "year": 2010, "date": "2010-05-20", "url": "https://doi.org/10.1088/0034-4885/73/6/066901", "authors": "Джунушалиев Владимир Джумакадырович et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S9"}, {"id": "E67", "text": "Brane-world models offer a phenomenological way to test some of the novel predictions and corrections to general relativity that are implied by M theory.", "title": "Brane-World Gravity", "year": 2010, "date": "2010-09-14", "url": "https://doi.org/10.12942/lrr-2010-5", "authors": "Roy Maartens et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S9"}, {"id": "E68", "text": "This global reform wave—across countries and domains of sexual activity—followed from the reconstitution of world models of society around individuals rather than corporate bodies.", "title": "Worldwide Trends in the Criminal Regulation of Sex, 1945 to 2005", "year": 2010, "date": "2010-12-01", "url": "https://doi.org/10.1177/0003122410388493", "authors": "David John Frank et al.", "fromTitle": false, "field": "Social Sciences", "inSet": 0, "sense": "S7"}, {"id": "E69", "text": "Perturbations of black holes, initially considered in the context of possible observations of astrophysical effects, have been studied for the past 10 years in string theory, brane-world models, and quantum gravity.", "title": "Quasinormal modes of black holes: From astrophysics to string theory", "year": 2011, "date": "2011-07-11", "url": "https://doi.org/10.1103/revmodphys.83.793", "authors": "R. A. Konoplya et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S9"}, {"id": "E70", "text": "Preface 1) Introduction -Getting Connected -Networks as Information Maps -Leaders and Followers -Networks as Conduits -The Point of View 2) Basic Network Concepts, Part I: Individual Members of Networks -Introduction -What Is a Network? -Sociological Questions about Relationships Connections Propinquity Homophily Individual-Level Homophily Homophily and Collectivities -Dyads and Mutuality -Balance and Triads -Where We Are Now 3) Basic Network Co…", "title": "Understanding Social Networks: Theories, Concepts, and Findings", "year": 2011, "date": "2011-12-05", "url": "https://openalex.org/W581043525", "authors": "Charles Kadushin", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "unclear"}, {"id": "E71", "text": "The first RNA World models were based on the concept of an RNA replicase - a ribozyme that was a good enough RNA polymerase that it could catalyze its own replication.", "title": "The eightfold path to non-enzymatic RNA replication", "year": 2012, "date": "2012-02-03", "url": "https://doi.org/10.1186/1759-2208-3-2", "authors": "Jack W. Szostak", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S10"}, {"id": "E72", "text": "In this paper we provide an overview of a new framework for robot perception, real-world modelling, and navigation that uses a stochastic tesselated representation of spatial information called the Occupancy Grid.", "title": "Occupancy Grids: A Stochastic Spatial Representation for Active Robot Perception", "year": 2013, "date": "2013-03-27", "url": "https://doi.org/10.48550/arxiv.1304.1098", "authors": "Alberto Elfes", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "unclear"}, {"id": "E73", "text": "A more complicated capture-fraction analysis with a real-world model is presented to demonstrate the types of analyses that can be performed using Python and FloPy.", "title": "Scripting MODFLOW Model Development Using Python and FloPy", "year": 2016, "date": "2016-03-30", "url": "https://doi.org/10.1111/gwat.12413", "authors": "Mark Bakker et al.", "fromTitle": false, "field": "Environmental Science", "inSet": 0, "sense": "S8"}, {"id": "E74", "text": "Via analysis of both geometric (e.g., triangle aspect ratios, manifoldness) and contextual (e.g., licenses, tags, classes) characteristics, we demonstrate that this dataset represents a more concise summary of real-world models used for 3D printing compared to existing datasets.", "title": "Thingi10K: A Dataset of 10,000 3D-Printing Models", "year": 2016, "date": "2016-05-16", "url": "https://doi.org/10.48550/arxiv.1605.04797", "authors": "Qingnan Zhou et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S8"}, {"id": "E75", "text": "Empirical studies are performed on various real world models and datasets, on which our method is competitive with existing state-of-the-art methods.", "title": "Stein Variational Gradient Descent: A General Purpose Bayesian Inference Algorithm", "year": 2016, "date": "2016-08-16", "url": "https://doi.org/10.48550/arxiv.1608.04471", "authors": "Qiang Liu et al.", "fromTitle": false, "field": "Mathematics", "inSet": 0, "sense": "S8"}, {"id": "E76", "text": "A seemingly distinct challenge is that, cognitively, theories of RL have largely involved procedural and semantic memory, the way in which knowledge about action values or world models extracted gradually from many experiences can drive choice.", "title": "Reinforcement Learning and Episodic Memory in Humans and Animals: An Integrative Framework", "year": 2016, "date": "2016-09-12", "url": "https://doi.org/10.1146/annurev-psych-122414-033625", "authors": "Samuel Joseph Gershman et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E77", "text": "Our experiments shows our approach compares favorably with various baselines that have been developed for dealing with simulation to real world model discrepancy, including output error control and Gaussian dynamics adaptation.", "title": "Transfer from Simulation to Real World through Learning Deep Inverse Dynamics Model", "year": 2016, "date": "2016-10-11", "url": "https://doi.org/10.48550/arxiv.1610.03518", "authors": "Paul F. Christiano et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "unclear"}, {"id": "E78", "text": "Training a task-completion dialogue agent via reinforcement learning (RL) is costly because it requires many interactions with real users.One common alternative is to use a user simulator.However, a user simulator usually lacks the language complexity of human interlocutors and the biases in its design may tend to degrade the agent.To address these issues, we present Deep Dyna-Q, which to our knowledge is the first deep RL framework that integra…", "title": "Deep Dyna-Q: Integrating Planning for Task-Completion Dialogue Policy Learning", "year": 2018, "date": "2018-01-01", "url": "https://doi.org/10.18653/v1/p18-1203", "authors": "Baolin Peng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "unclear"}, {"id": "E79", "text": "Our world model can be trained quickly in an unsupervised manner to learn a compressed spatial and temporal representation of the environment.", "title": "World Models", "year": 2018, "date": "2018-03-27", "url": "https://doi.org/10.5281/zenodo.1207631", "authors": "David Ha et al.", "fromTitle": false, "field": "Computer Science", "inSet": 24, "sense": "S1"}, {"id": "E80", "text": "Second, we carefully separate the system under test and driver, in order to correctly represent the open world model of typical stream processing deployments and can, therefore, measure system performance under realistic conditions.", "title": "Benchmarking Distributed Stream Data Processing Systems", "year": 2018, "date": "2018-04-01", "url": "https://doi.org/10.1109/icde.2018.00169", "authors": "Jeyhun Karimov et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S10"}, {"id": "E81", "text": "Along with six real-world models, we benchmark Google's Cloud TPU v2/v3, NVIDIA's V100 GPU, and an Intel Skylake CPU platform.", "title": "Benchmarking TPU, GPU, and CPU Platforms for Deep Learning", "year": 2019, "date": "2019-07-24", "url": "https://doi.org/10.48550/arxiv.1907.10701", "authors": "Yu Emma Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S8"}, {"id": "E82", "text": "Learned world models summarize an agent's experience to facilitate learning complex behaviors.", "title": "Dream to Control: Learning Behaviors by Latent Imagination", "year": 2019, "date": "2019-12-03", "url": "https://doi.org/10.48550/arxiv.1912.01603", "authors": "Danijar Hafner et al.", "fromTitle": false, "field": "Computer Science", "inSet": 21, "sense": "S1"}, {"id": "E83", "text": "Planning to Explore via Self-Supervised World Models", "title": "Planning to Explore via Self-Supervised World Models", "year": 2020, "date": "2020-05-12", "url": "https://doi.org/10.48550/arxiv.2005.05960", "authors": "R. Sekar et al.", "fromTitle": true, "field": "Computer Science", "inSet": 6, "sense": "S1"}, {"id": "E84", "text": "World models facilitate such generalization and allow learning behaviors from imagined outcomes to increase sample-efficiency.", "title": "Mastering Atari with Discrete World Models", "year": 2020, "date": "2020-10-05", "url": "https://doi.org/10.48550/arxiv.2010.02193", "authors": "Danijar Hafner et al.", "fromTitle": false, "field": "Computer Science", "inSet": 14, "sense": "S1"}, {"id": "E85", "text": "Abstract We discuss holographic models of extremal and non-extremal black holes in contact with a bath in d dimensions, based on a brane world model introduced in [1].", "title": "Quantum extremal islands made easy. Part II. Black holes on the brane", "year": 2020, "date": "2020-12-01", "url": "https://doi.org/10.1007/jhep12(2020)025", "authors": "Hong Zhe Chen et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S9"}, {"id": "E86", "text": "Deep learning, reinforcement learning, and world models", "title": "Deep learning, reinforcement learning, and world models", "year": 2022, "date": "2022-04-19", "url": "https://doi.org/10.1016/j.neunet.2022.03.037", "authors": "Yutaka Matsuo et al.", "fromTitle": true, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E87", "text": "We show that a baseline model based on multi-context imitation learning performs poorly on CALVIN, suggesting that there is significant room for developing innovative agents that learn to relate human language to their world models with this benchmark.", "title": "CALVIN: A Benchmark for Language-Conditioned Policy Learning for Long-Horizon Robot Manipulation Tasks", "year": 2022, "date": "2022-06-03", "url": "https://doi.org/10.1109/lra.2022.3180108", "authors": "Oier Mees et al.", "fromTitle": false, "field": "Engineering", "inSet": 3, "sense": "S1"}, {"id": "E88", "text": "The Dreamer algorithm has recently shown great promise for learning from small amounts of interaction by planning within a learned world model, outperforming pure reinforcement learning in video games.", "title": "DayDreamer: World Models for Physical Robot Learning", "year": 2022, "date": "2022-06-28", "url": "https://doi.org/10.48550/arxiv.2206.14176", "authors": "Philipp Wu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S1"}, {"id": "E89", "text": "To enable systematic exploration of the reasoning ability of LLMs, we present a new synthetic question-answering dataset called PrOntoQA, where each example is generated from a synthetic world model represented in first-order logic.", "title": "Language Models Are Greedy Reasoners: A Systematic Formal Analysis of Chain-of-Thought", "year": 2022, "date": "2022-10-03", "url": "https://doi.org/10.48550/arxiv.2210.01240", "authors": "Abulhair Saparov et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E90", "text": "Large language models (LLMs) have shown remarkable reasoning capabilities, particularly with chain-of-thought (CoT) prompting.However, LLMs sometimes still struggle with problems that are easy for humans, such as generating action plans to achieve given goals in an environment, or performing complex math or logical reasoning.The deficiency stems from the key fact that LLMs lack an internal world model to predict the world state (e.g., environmen…", "title": "Reasoning with Language Model is Planning with World Model", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.emnlp-main.507", "authors": "Shibo Hao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S4"}, {"id": "E91", "text": "The world model and the policy can be combined in a search algorithm, such as Monte Carlo Tree Search (MCTS), to scale up task planning.", "title": "Large Language Models as Commonsense Knowledge for Large-Scale Task Planning", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-1387", "authors": "Zirui Zhao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E92", "text": "\"opponent's colour\" may be a simple yet powerful way to interpret the model's internal state.This precise understanding of the internal representations allows us to control the model's behaviour with simple vector arithmetic.Linear representations enable significant interpretability progress, which we demonstrate with further exploration of how the world model is computed.", "title": "Emergent Linear Representations in World Models of Self-Supervised Sequence Models", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.blackboxnlp-1.2", "authors": "Neel Nanda et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S4"}, {"id": "E93", "text": "Leveraging Pre-trained Large Language Models to Construct and Utilize World Models for Model-based Task Planning", "title": "Leveraging Pre-trained Large Language Models to Construct and Utilize World Models for Model-based Task Planning", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-3459", "authors": "Lin Guan et al.", "fromTitle": true, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E94", "text": "To address this challenge, we introduce GAIA-1 ('Generative AI for Autonomy'), a generative world model that leverages video, text, and action inputs to generate realistic driving scenarios while offering fine-grained control over ego-vehicle behavior and scene features.", "title": "GAIA-1: A Generative World Model for Autonomous Driving", "year": 2023, "date": "2023-09-29", "url": "https://doi.org/10.48550/arxiv.2309.17080", "authors": "Anthony Hu et al.", "fromTitle": false, "field": "Engineering", "inSet": 24, "sense": "S3"}, {"id": "E95", "text": "While further investigation is needed, our results suggest modern LLMs learn rich spatiotemporal representations of the real world and possess basic ingredients of a world model.", "title": "Language Models Represent Space and Time", "year": 2023, "date": "2023-10-03", "url": "https://doi.org/10.48550/arxiv.2310.02207", "authors": "Wes Gurnee et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S4"}, {"id": "E96", "text": "TD-MPC is a model-based reinforcement learning (RL) algorithm that performs local trajectory optimization in the latent space of a learned implicit (decoder-free) world model.", "title": "TD-MPC2: Scalable, Robust World Models for Continuous Control", "year": 2023, "date": "2023-10-25", "url": "https://doi.org/10.48550/arxiv.2310.16828", "authors": "Nicklas Hansen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S1"}, {"id": "E97", "text": "Grounded SAM: Assembling Open-World Models for Diverse Visual Tasks", "title": "Grounded SAM: Assembling Open-World Models for Diverse Visual Tasks", "year": 2024, "date": "2024-01-25", "url": "https://doi.org/10.48550/arxiv.2401.14159", "authors": "Tianhe Ren et al.", "fromTitle": true, "field": "Computer Science", "inSet": 3, "sense": "S10"}, {"id": "E98", "text": "World Model on Million-Length Video And Language With Blockwise RingAttention", "title": "World Model on Million-Length Video And Language With Blockwise RingAttention", "year": 2024, "date": "2024-02-13", "url": "https://doi.org/10.48550/arxiv.2402.08268", "authors": "Hao Liu et al.", "fromTitle": true, "field": "Computer Science", "inSet": 6, "sense": "S3"}, {"id": "E99", "text": "At 11B parameters, Genie can be considered a foundation world model.", "title": "Genie: Generative Interactive Environments", "year": 2024, "date": "2024-02-23", "url": "https://doi.org/10.48550/arxiv.2402.15391", "authors": "Jake Bruce et al.", "fromTitle": false, "field": "Computer Science", "inSet": 21, "sense": "S3"}, {"id": "E100", "text": "In contrast, human beings are endowed with world models that depict imagination about future scenarios to plan actions accordingly.", "title": "3D-VLA: A 3D Vision-Language-Action Generative World Model", "year": 2024, "date": "2024-03-14", "url": "https://doi.org/10.48550/arxiv.2403.09631", "authors": "Haoyu Zhen et al.", "fromTitle": false, "field": "Engineering", "inSet": 6, "sense": "S3"}, {"id": "E101", "text": "This is heavily limiting in decision-making, where we seek a powerful world model to synthesize plans of unseen combinations of objects and actions in order to solve previously unseen tasks in new environments.", "title": "RoboDreamer: Learning Compositional World Models for Robot Imagination", "year": 2024, "date": "2024-04-18", "url": "https://doi.org/10.48550/arxiv.2404.12377", "authors": "Siyuan Zhou et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S1"}, {"id": "E102", "text": "Results show that TorchDynamo is able to capture graphs more robustly than prior approaches while adding minimal overhead, and TorchInductor is able to provide a 2.27× inference and 1.41× training geometric mean speedup on an NVIDIA A100 GPU across 180+ real-world models, which outperforms six other compilers.", "title": "PyTorch 2: Faster Machine Learning Through Dynamic Python Bytecode Transformation and Graph Compilation", "year": 2024, "date": "2024-04-22", "url": "https://doi.org/10.1145/3620665.3640366", "authors": "Jason Ansel et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S8"}, {"id": "E103", "text": "To this end, we propose Drive-Wm, the first driving world model compatible with existing end-to-end planning models.", "title": "Driving Into the Future: Multiview Visual Forecasting and Planning with World Model for Autonomous Driving", "year": 2024, "date": "2024-06-16", "url": "https://doi.org/10.1109/cvpr52733.2024.01397", "authors": "Yuqi Wang et al.", "fromTitle": false, "field": "Engineering", "inSet": 10, "sense": "S3"}, {"id": "E104", "text": "We hope this inspires and stimulates future research at the intersection of Embod-ied AI, conversational agents, and world models.", "title": "OpenEQA: Embodied Question Answering in the Era of Foundation Models", "year": 2024, "date": "2024-06-16", "url": "https://doi.org/10.1109/cvpr52733.2024.01560", "authors": "Arjun Majumdar et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S1"}, {"id": "E105", "text": "OccWorld: Learning a 3D Occupancy World Model for Autonomous Driving", "title": "OccWorld: Learning a 3D Occupancy World Model for Autonomous Driving", "year": 2024, "date": "2024-10-25", "url": "https://doi.org/10.1007/978-3-031-72624-8_4", "authors": "Wenzhao Zheng et al.", "fromTitle": true, "field": "Engineering", "inSet": 6, "sense": "S3"}, {"id": "E106", "text": "However, such predictive models, often called world models, remains challenging to learn and are typically developed for task-specific solutions with online policy learning.", "title": "DINO-WM: World Models on Pre-trained Visual Features enable Zero-shot Planning", "year": 2024, "date": "2024-11-07", "url": "https://doi.org/10.48550/arxiv.2411.04983", "authors": "Gaoyue Zhou et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S1"}, {"id": "E107", "text": "DriveDreamer: Towards Real-World-Drive World Models for Autonomous Driving", "title": "DriveDreamer: Towards Real-World-Drive World Models for Autonomous Driving", "year": 2024, "date": "2024-11-26", "url": "https://doi.org/10.1007/978-3-031-73195-2_4", "authors": "Xiaofeng Wang et al.", "fromTitle": true, "field": "Engineering", "inSet": 15, "sense": "S3"}, {"id": "E108", "text": "FSDrive first operates as a world model, generating a unified future frame that combines a predicted background with explicit, physically-plausible priors like future lane dividers and 3D object boxes.", "title": "FutureSightDrive: Thinking Visually with Spatio-Temporal CoT for Autonomous Driving", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.52202/085713-2257", "authors": "Shuang Zeng et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S3"}, {"id": "E109", "text": "Video generation models have rapidly progressed, positioning themselves as video world models capable of supporting decision-making applications like robotics and autonomous driving.", "title": "WorldModelBench: Judging Video Generation Models As World Models", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.52202/085713-1834", "authors": "Dacheng Li et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E110", "text": "Emerging world models autoregressively generate video frames in response to actions, such as camera movements and text prompts, among other control signals.", "title": "Video World Models with Long-term Spatial Memory", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.52202/085713-1651", "authors": "Tong Wu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E111", "text": "Agent self-improvement, where agents autonomously train their underlying Large Language Model (LLM) on self-sampled trajectories, shows promising results but often stagnates in web environments due to limited exploration and under-utilization of pretrained web knowledge.To improve the performance of self-improvement, we propose a novel framework that introduces a co-evolving World Model LLM.This world model predicts the next observation based on…", "title": "WebEvolver: Enhancing Web Agent Self-Improvement with Co-evolving World Model", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.18653/v1/2025.emnlp-main.454", "authors": "Tianqing Fang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E112", "text": "It needs a digital twin of itself, the policy model, and a digital twin of the world, the world model.", "title": "Cosmos World Foundation Model Platform for Physical AI", "year": 2025, "date": "2025-01-07", "url": "https://doi.org/10.48550/arxiv.2501.03575", "authors": "NVIDIA et al.", "fromTitle": false, "field": "Computer Science", "inSet": 17, "sense": "S3"}, {"id": "E113", "text": "We introduce GAIA-2, Generative AI for Autonomy, a latent diffusion world model that unifies these capabilities within a single generative framework.", "title": "GAIA-2: A Controllable Multi-View Generative World Model for Autonomous Driving", "year": 2025, "date": "2025-03-26", "url": "https://doi.org/10.48550/arxiv.2503.20523", "authors": "Lloyd E. Russell et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E114", "text": "Specifically, at each timestep, the LLM is prompted to forecast the navigational chain-of-thought by: 1) acting as a world model to imagine the next observation according to the instruction, 2) selecting the candidate observation that best aligns with the imagination, and 3) determining the action based on the reasoning from the prior steps.", "title": "NavCoT: Boosting LLM-Based Vision-and-Language Navigation via Learning Disentangled Reasoning", "year": 2025, "date": "2025-03-26", "url": "https://doi.org/10.1109/tpami.2025.3554559", "authors": "Bingqian Lin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S4"}, {"id": "E115", "text": "To achieve real \"world models\" through video generation, the next frontier lies in intrinsic faithfulness to ensure that generated videos adhere to physical laws, commonsense reasoning, anatomical correctness, and compositional integrity.", "title": "VBench-2.0: Advancing Video Generation Benchmark Suite for Intrinsic Faithfulness", "year": 2025, "date": "2025-03-27", "url": "https://doi.org/10.48550/arxiv.2503.21755", "authors": "Dian Zheng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E116", "text": "Mastering diverse control tasks through world models", "title": "Mastering diverse control tasks through world models", "year": 2025, "date": "2025-04-02", "url": "https://doi.org/10.1038/s41586-025-08744-2", "authors": "Danijar Hafner et al.", "fromTitle": true, "field": "Computer Science", "inSet": 14, "sense": "S1"}, {"id": "E117", "text": "World models have demonstrated superiority in autonomous driving, particularly in the generation of multi-view driving videos.", "title": "DriveDreamer-2: LLM-Enhanced World Models for Diverse Driving Video Generation", "year": 2025, "date": "2025-04-11", "url": "https://doi.org/10.1609/aaai.v39i10.33130", "authors": "Guosheng Zhao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 7, "sense": "S3"}, {"id": "E118", "text": "World modeling is a crucial task for enabling intelligent agents to effectively interact with humans and operate in dynamic environments.", "title": "MineWorld: a Real-Time and Open-Source Interactive World Model on Minecraft", "year": 2025, "date": "2025-04-11", "url": "https://doi.org/10.48550/arxiv.2504.08388", "authors": "Guo, Junliang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E119", "text": "To this end, we introduce SocioVerse, an LLM-agent-driven world model for social simulation.", "title": "SocioVerse: A World Model for Social Simulation Powered by LLM Agents and A Pool of 10 Million Real-World Users", "year": 2025, "date": "2025-04-14", "url": "https://doi.org/10.48550/arxiv.2504.10157", "authors": "Xinnong Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E120", "text": "This paper presents an effective approach for learning novel 4D embodied world models, which predict the dynamic evolution of 3D scenes over time in response to an embodied agent's actions, providing both spatial and temporal consistency.", "title": "TesserAct: Learning 4D Embodied World Models", "year": 2025, "date": "2025-04-29", "url": "https://doi.org/10.48550/arxiv.2504.20995", "authors": "Haoyu Zhen et al.", "fromTitle": false, "field": "Engineering", "inSet": 3, "sense": "S3"}, {"id": "E121", "text": "We introduce DreamGen, a simple yet highly effective 4-stage pipeline for training robot policies that generalize across behaviors and environments through neural trajectories - synthetic robot data generated from video world models.", "title": "DreamGen: Unlocking Generalization in Robot Learning through Video World Models", "year": 2025, "date": "2025-05-19", "url": "https://doi.org/10.48550/arxiv.2505.12705", "authors": "Joel Jang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 7, "sense": "S3"}, {"id": "E122", "text": "We probe models to express how they think in space both linguistically and visually and find that while spatial reasoning capabilities remain the primary bottleneck for MLLMs to reach higher benchmark performance, local world models and spatial awareness do emerge within these models.", "title": "Thinking in Space: How Multimodal Large Language Models See, Remember, and Recall Spaces", "year": 2025, "date": "2025-06-10", "url": "https://doi.org/10.1109/cvpr52734.2025.00994", "authors": "Jihan Yang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S4"}, {"id": "E123", "text": "We introduce a Navigation World Model (NWM), a controllable video generation model that predicts future visual observations based on past observations and navigation actions.", "title": "Navigation World Models", "year": 2025, "date": "2025-06-10", "url": "https://doi.org/10.1109/cvpr52734.2025.01472", "authors": "Amir Bar et al.", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S3"}, {"id": "E124", "text": "Our results showcase emergent behaviors, such as realistic physics, suggesting the potential of motion prompts for probing video models and interacting with future generative world models.", "title": "Motion Prompting: Controlling Video Generation with Motion Trajectories", "year": 2025, "date": "2025-06-10", "url": "https://doi.org/10.1109/cvpr52734.2025.00010", "authors": "Daniel Geng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E125", "text": "Recent advancements in autonomous-driving world models have demonstrated the potential to generate diverse driving videos.", "title": "DriveDreamer4D: World Models Are Effective Data Machines for 4D Driving Scene Representation", "year": 2025, "date": "2025-06-10", "url": "https://doi.org/10.1109/cvpr52734.2025.01122", "authors": "Guosheng Zhao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E126", "text": "Recent works have demonstrated that integrating world model knowledge alleviates these issues.", "title": "ReconDreamer: Crafting World Models for Driving Scene Reconstruction via Online Restoration", "year": 2025, "date": "2025-06-10", "url": "https://doi.org/10.1109/cvpr52734.2025.00153", "authors": "Chaojun Ni et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S3"}, {"id": "E127", "text": "Finally, we show how self-supervised learning can be applied to robotic planning tasks by post-training a latent action-conditioned world model, V-JEPA 2-AC, using less than 62 hours of unlabeled robot videos from the Droid dataset.", "title": "V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning", "year": 2025, "date": "2025-06-11", "url": "https://doi.org/10.48550/arxiv.2506.09985", "authors": "Assran, Mido et al.", "fromTitle": false, "field": "Computer Science", "inSet": 9, "sense": "S1"}, {"id": "E128", "text": "Imitation learning has emerged as a promising approach towards building generalist robots.However, scaling imitation learning for large robot foundation models remains challenging due to its reliance on high-quality expert demonstrations.Meanwhile, large amounts of video data depicting a wide range of environments and diverse behaviors are readily available.This data provides a rich source of information about real-world dynamics and agent-envir…", "title": "Unified World Models: Coupling Video and Action Diffusion for Pretraining on Large Robotic Datasets", "year": 2025, "date": "2025-06-21", "url": "https://doi.org/10.15607/rss.2025.xxi.015", "authors": "Chuning Zhu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 7, "sense": "S3"}, {"id": "E129", "text": "The concept of world models has garnered significant attention due to advancements in multimodal large language models such as GPT-4 and video generation models such as Sora, which are central to the pursuit of artificial general intelligence.", "title": "Understanding World or Predicting Future? A Comprehensive Survey of World Models", "year": 2025, "date": "2025-06-27", "url": "https://doi.org/10.1145/3746449", "authors": "Jingtao Ding et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S1"}, {"id": "E130", "text": "Recently, the emergence of multimodal large models (MLMs) and World models (WMs) have attracted significant attention due to their remarkable perception, interaction, and reasoning capabilities, making them a promising architecture for embodied agents.", "title": "Aligning Cyber Space With Physical World: A Comprehensive Survey on Embodied AI", "year": 2025, "date": "2025-07-28", "url": "https://doi.org/10.1109/tmech.2025.3574943", "authors": "Yang Liu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E131", "text": "To address this gap, we propose CityGPT, a systematic framework designed to enhance LLMs' understanding of urban space and improve their ability to solve the related urban tasks by integrating a city-scale 'world model' into the model.", "title": "CityGPT: Empowering Urban Spatial Cognition of Large Language Models", "year": 2025, "date": "2025-08-01", "url": "https://doi.org/10.1145/3711896.3736878", "authors": "Jie Feng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S4"}, {"id": "E132", "text": "It comprises a world model that generates theories to explain data and a question-answering inference machine.", "title": "Superintelligent Agents Pose Catastrophic Risks: Can Scientist AI Offer a Safer Path?", "year": 2025, "date": "2025-08-15", "url": "https://doi.org/10.70777/si.v2i5.15569", "authors": "Yoshua Bengio et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E133", "text": "Recent advances in interactive video generations have demonstrated diffusion model's potential as world models by capturing complex physical dynamics and interactive behaviors.", "title": "Matrix-game 2.0: An open-source, real-time, and streaming interactive world model", "year": 2025, "date": "2025-08-18", "url": "https://doi.org/10.48550/arxiv.2508.13009", "authors": "He, Xianglong et al.", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S3"}, {"id": "E134", "text": "MCP-Universe: Benchmarking Large Language Models with Real-World Model Context Protocol Servers", "title": "MCP-Universe: Benchmarking Large Language Models with Real-World Model Context Protocol Servers", "year": 2025, "date": "2025-08-20", "url": "https://doi.org/10.48550/arxiv.2508.14704", "authors": "Luo, Ziyang et al.", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "S8"}, {"id": "E135", "text": "AriGraph: Learning Knowledge Graph World Models with Episodic Memory for LLM Agents", "title": "AriGraph: Learning Knowledge Graph World Models with Episodic Memory for LLM Agents", "year": 2025, "date": "2025-09-01", "url": "https://doi.org/10.24963/ijcai.2025/2", "authors": "Petr Anokhin et al.", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E136", "text": "World models learn general knowledge from videos and simulate experience for training behaviors in imagination, offering a path towards intelligent agents.", "title": "Training Agents Inside of Scalable World Models", "year": 2025, "date": "2025-09-29", "url": "https://doi.org/10.48550/arxiv.2509.24527", "authors": "Danijar Hafner et al.", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S1"}, {"id": "E137", "text": "World models offer a promising, scalable alternative by enabling policies to rollout within imagination space.", "title": "Ctrl-World: A Controllable Generative World Model for Robot Manipulation", "year": 2025, "date": "2025-10-11", "url": "https://doi.org/10.48550/arxiv.2510.10125", "authors": "Yanjiang Guo et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E138", "text": "To remedy this, we propose \\textbf{DriveVLA-W0}, a training paradigm that employs world modeling to predict future images.", "title": "DriveVLA-W0: World Models Amplify Data Scaling Law in Autonomous Driving", "year": 2025, "date": "2025-10-14", "url": "https://doi.org/10.48550/arxiv.2510.12796", "authors": "Yingyan Li et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S3"}, {"id": "E139", "text": "This goal can be achieved by employing a world model to capture environmental dynamics and predict future states.", "title": "End-to-End Driving with Online Trajectory Evaluation via BEV World Model", "year": 2025, "date": "2025-10-19", "url": "https://doi.org/10.1109/iccv51701.2025.02519", "authors": "Yingyan Li et al.", "fromTitle": false, "field": "Engineering", "inSet": 1, "sense": "S1"}, {"id": "E140", "text": "World models allow autonomous agents to plan and explore by predicting the visual outcomes of different actions.", "title": "IRASim: A Fine-Grained World Model for Robot Manipulation", "year": 2025, "date": "2025-10-19", "url": "https://doi.org/10.1109/iccv51701.2025.00917", "authors": "Fangqi Zhu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S3"}, {"id": "E141", "text": "Diffusion models have demonstrated exceptional visual quality in video generation, making them promising for autonomous driving world modeling.", "title": "Epona: Autoregressive Diffusion World Model for Autonomous Driving", "year": 2025, "date": "2025-10-19", "url": "https://doi.org/10.1109/iccv51701.2025.02527", "authors": "Kaiwen Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E142", "text": "A critical research challenge arises: constructing an informative driving world model to enable perception annotation-free, end-to-end planning via self-supervised learning.", "title": "World4Drive: End-to-End Autonomous Driving via Intention-Aware Physical Latent World Model", "year": 2025, "date": "2025-10-19", "url": "https://doi.org/10.1109/iccv51701.2025.02659", "authors": "Yupeng Zheng et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S1"}, {"id": "E143", "text": "World model-based searching and planning are widely recognized as a promising path toward human-level physical intelligence.", "title": "DrivingGPT: Unifying Driving World Modeling and Planning with Multi-Modal Autoregressive Transformers", "year": 2025, "date": "2025-10-19", "url": "https://doi.org/10.1109/iccv51701.2025.02496", "authors": "Yuntao Chen et al.", "fromTitle": false, "field": "Engineering", "inSet": 3, "sense": "S1"}, {"id": "E144", "text": "This paper proposes Aether, a unified framework that enables geometry-aware reasoning in world models by jointly optimizing three core capabilities: (1) 4D dynamic reconstruction, (2) action-conditioned video prediction, and (3) goal-conditioned visual planning.", "title": "AETHER: Geometric-Aware Unified World Modeling", "year": 2025, "date": "2025-10-19", "url": "https://doi.org/10.1109/iccv51701.2025.00799", "authors": "Haoyi Zhu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E145", "text": "A truly interactive world model requires three key ingredients: real-time long-horizon streaming, consistent spatial memory, and precise user control.", "title": "RELIC: Interactive Video World Model with Long-Horizon Memory", "year": 2025, "date": "2025-12-03", "url": "https://doi.org/10.48550/arxiv.2512.04040", "authors": "Yicong Hong et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E146", "text": "While a general embodied agent must function as a unified system, current methods are built on isolated models for understanding, world modeling, and control.", "title": "Motus: A Unified Latent Action World Model", "year": 2025, "date": "2025-12-15", "url": "https://doi.org/10.48550/arxiv.2512.13030", "authors": "Bi, Hongzhe et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S1"}, {"id": "E147", "text": "Building upon this foundation, the tutorial develops an LAM-based Agentic AI system for intelligent communications, elaborating on its core components—including agents, world models, planners, knowledge bases, tools, and memory modules— as well as their interaction mechanisms.", "title": "From Large AI Models to Agentic AI: A Tutorial on Future Intelligent Communications", "year": 2026, "date": "2026-01-01", "url": "https://doi.org/10.1109/jsac.2026.3660010", "authors": "Feibo Jiang et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S1"}, {"id": "E148", "text": "We introduce PointWorld, a large pre-trained 3D world model that unifies state and action in a shared 3D space as 3D point flows: given one or few RGB-D images and a sequence of low-level robot action commands, PointWorld forecasts per-pixel displacements in 3D that respond to the given actions.", "title": "PointWorld: Scaling 3D World Models for In-The-Wild Robotic Manipulation", "year": 2026, "date": "2026-01-07", "url": "https://doi.org/10.48550/arxiv.2601.03782", "authors": "Wenlong Huang et al.", "fromTitle": false, "field": "Engineering", "inSet": 1, "sense": "S3"}, {"id": "E149", "text": "Finally, we open-source a gold subset of 220 tasks and provide a public automated grading service at evals.openai.com to facilitate future research in understanding real-world model capabilities.", "title": "GDPVAL: Evaluating AI Model Performance on Real-World Economically Valuable Tasks", "year": 2026, "date": "2026-01-21", "url": "https://doi.org/10.70777/si.v2i4.17197", "authors": "Tejal Patwardhan et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S8"}, {"id": "E150", "text": "Furthermore, given policy rollout data, Cosmos Policy can learn from experience to refine its world model and value function and leverage model-based planning to achieve even higher success rates in challenging tasks.", "title": "Cosmos Policy: Fine-Tuning Video Models for Visuomotor Control and Planning", "year": 2026, "date": "2026-01-22", "url": "https://doi.org/10.48550/arxiv.2601.16163", "authors": "Moo Jin Kim et al.", "fromTitle": false, "field": "Engineering", "inSet": 4, "sense": "S1"}, {"id": "E151", "text": "Positioned as a top-tier world model, LingBot-World offers the following features.", "title": "Advancing Open-source World Models", "year": 2026, "date": "2026-01-28", "url": "https://doi.org/10.48550/arxiv.2601.20540", "authors": "Robbyant Team et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E152", "text": "As an endeavor towards this end, we introduce DreamDojo, a foundation world model that learns diverse interactions and dexterous controls from 44k hours of egocentric human videos.", "title": "DreamDojo: A Generalist Robot World Model from Large-Scale Human Videos", "year": 2026, "date": "2026-02-06", "url": "https://doi.org/10.48550/arxiv.2602.06949", "authors": "Shenyuan Gao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E153", "text": "These advances have led to a passionate scientific debate: Do video models learn \"world models\" that discover laws of physics—or, alternatively, are they merely sophisticated pixel predictors that achieve visual realism without understanding the physical principles of reality?", "title": "Do generative video models understand physical principles?", "year": 2026, "date": "2026-03-06", "url": "https://doi.org/10.1109/wacv61042.2026.00099", "authors": "Saman Motamed et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S3"}, {"id": "E154", "text": "Joint Embedding Predictive Architectures (JEPAs) offer a compelling framework for learning world models in compact latent spaces, yet existing methods remain fragile, relying on complex multi-term losses, exponential moving averages, pre-trained encoders, or auxiliary supervision to avoid representation collapse.", "title": "LeWorldModel: Stable End-to-End Joint-Embedding Predictive Architecture from Pixels", "year": 2026, "date": "2026-03-13", "url": "https://doi.org/10.48550/arxiv.2603.19312", "authors": "Lucas Maes et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E155", "text": "Building generalist embodied agents requires integrating perception, language understanding, and action, which are core capabilities addressed by Vision-Language-Action (VLA) approaches based on multimodal foundation models, including recent advances in vision-language models and world models.", "title": "StarVLA: A Lego-like Codebase for Vision-Language-Action Model Developing", "year": 2026, "date": "2026-04-06", "url": "https://doi.org/10.48550/arxiv.2604.05014", "authors": "StarVLA Community", "fromTitle": false, "field": "Engineering", "inSet": 1, "sense": "S1"}, {"id": "E156", "text": "With the advancement of interactive video generation, diffusion models have increasingly demonstrated their potential as world models.", "title": "Matrix-Game 3.0: Real-Time and Streaming Interactive World Model with Long-Horizon Memory", "year": 2026, "date": "2026-04-10", "url": "https://doi.org/10.48550/arxiv.2604.08995", "authors": "Zile Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E157", "text": "We propose X-WAM, a Unified 4D World Model that unifies real-time robotic action execution and high-fidelity 4D world synthesis (video + 3D reconstruction) in a single framework, addressing the critical limitations of prior unified world models (e.g., UWM) that only model 2D pixel-space and fail to balance action efficiency and world modeling quality.", "title": "Unified 4D World Action Modeling from Video Priors with Asynchronous Denoising", "year": 2026, "date": "2026-04-29", "url": "https://doi.org/10.48550/arxiv.2604.26694", "authors": "Jun Guo et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S3"}, {"id": "E158", "text": "Experiments across six simulation benchmarks and diverse real-world tasks show that Being-H0.7 achieves state-of-the-art or comparable performance, combining the predictive benefits of world models with the efficiency and deployability of direct VLA policies.", "title": "Being-H0.7: A Latent World-Action Model from Egocentric Videos", "year": 2026, "date": "2026-04-30", "url": "https://doi.org/10.48550/arxiv.2605.00078", "authors": "Hao Luo et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S1"}, {"id": "E159", "text": "We introduce Cosmos 3, a family of omnimodal world models designed to jointly process and generate language, image, video, audio, and action sequences within a unified mixture-of-transformers architecture.", "title": "Cosmos 3: Omnimodal World Models for Physical AI", "year": 2026, "date": "2026-06-01", "url": "https://doi.org/10.48550/arxiv.2606.02800", "authors": "NVIDIA et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E160", "text": "Language Modeling Materializes a World Model of Protein Biology", "title": "Language Modeling Materializes a World Model of Protein Biology", "year": 2026, "date": "2026-06-04", "url": "https://doi.org/10.64898/2026.06.03.729735", "authors": "Salvatore Candido et al.", "fromTitle": true, "field": "Biochemistry, Genetics and Molecular Biology", "inSet": 0, "sense": "S4"}], "total": 12954, "model": "claude-opus-5-5", "generated": "2026-11-17", "lang": "en", "meaning": "", "focus": "This timeline follows 'world model' in AI: an agent's internal model of its environment. It began as a hand-built representation used for planning and robotics and became a learned, often generative, predictive model of how the world evolves under actions.", "otherSenses": [{"label": "Cosmological world model", "meaning": "A mathematical model of the universe as a whole in relativistic cosmology.", "evidence": [{"id": "E3", "text": "Relativistic Mechanics: I. The world-model, and the description of physical objects", "title": "Relativistic Mechanics: I. The world-model, and the description of physical objects", "year": 1940, "date": "1940-01-01", "url": "https://doi.org/10.1112/plms/s2-46.1.113", "authors": "A. G. Walker", "fromTitle": true, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E6", "text": "The energy spectrum and possible total intensity of gravitationally accelerated material are examined; it is shown that an expression can be obtained for the former which is consistent with cosmic-ray data, but because the world-model considered is not sufficiently sharply defined, no order of magnitude can be obtained for the latter.", "title": "A critical examination of the gravitational theory of the origin of cosmic rays", "year": 1950, "date": "1950-12-07", "url": "https://doi.org/10.1098/rspa.1950.0173", "authors": "P. J. D. Gething", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E7", "text": "Whitehead's relativity and philosophy of Nature requires an understanding of the development of the theory of relativity, the world- models of the relativistic cosmologies, and the attempts at a unified field theory.", "title": "The physical cosmology of Alfred North Whitehead", "year": 1951, "date": "1951-01-01", "url": "https://openalex.org/W2911426417", "authors": "W. Edward Cushen", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S5"}, {"id": "E8", "text": "A class of homogeneous expanding world-models, which includes Milne's uniformly expanding model as a particular case, is analysed by the methods of kinematic relativity, red-shifts being attributed in each case to the Doppler effect associated with mutual recession.", "title": "Expanding World-models Characterized by a Dimensionless Invariant", "year": 1951, "date": "1951-10-01", "url": "https://doi.org/10.1093/mnras/111.5.455", "authors": "Gerald J. Whitrow et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E9", "text": "In particular, a uniformly expanding homogeneous world-model is constructed which differs significantly both from Milne’s model and that of special relativity.", "title": "The application of the Whitehead theory of relativity to non-static, spherically symmetrical systems", "year": 1954, "date": "1954-03-23", "url": "https://doi.org/10.1098/rspa.1954.0092", "authors": "C. B. Rayner", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E10", "text": "A new criterion is obtained, independent of any partiular choice of world-model, for helping to decide between the recessional and non recessional hypotheses concerning the extragalactic red-shifts.", "title": "On the Interpretation of the Extragalactic Red-shifts", "year": 1954, "date": "1954-04-01", "url": "https://doi.org/10.1093/mnras/114.2.180", "authors": "Gerald J. Whitrow", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E11", "text": "As a result, we have been able to obtain two kinds of world-models in which a reasonable type of the equation of state is statisfied.", "title": "On a New Approach to the Construction of a Smoothed-out Model of the Universe", "year": 1955, "date": "1955-09-30", "url": "https://doi.org/10.1093/pasj/7.3.144", "authors": "Hidekazu Nariai", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E12", "text": "Visual Horizons in World Models", "title": "Visual Horizons in World Models", "year": 1956, "date": "1956-12-01", "url": "https://doi.org/10.1093/mnras/116.6.662", "authors": "Wolfgang Rindler", "fromTitle": true, "field": "Physics and Astronomy", "inSet": 0, "sense": "S5"}, {"id": "E13", "text": "In this paper the formula is derived by studying small perturbations of the density and velocity in an expanding Newtonian world-model.", "title": "Jeans' Formula for Gravitati ysics and Astronomy", "inSet": 1, "sense": "S9"}, {"id": "E63", "text": "Wormhole solutions are considered in the Einstein minimally coupled theory and in the brane world model.", "title": "Gravitational lensing by wormholes", "year": 2006, "date": "2006-07-20", "url": "https://doi.org/10.1103/physrevd.74.024020", "authors": "Kamal Kanti Nandi et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S9"}, {"id": "E66", "text": "The inclusion of brane thickness can realize a variety of possible brane world models.", "title": "Thick brane solutions", "year": 2010, "date": "2010-05-20", "url": "https://doi.org/10.1088/0034-4885/73/6/066901", "authors": "Джунушалиев Владимир Джумакадырович et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S9"}, {"id": "E67", "text": "Brane-world models offer a phenomenological way to test some of the novel predictions and corrections to general relativity that are implied by M theory.", "title": "Brane-World Gravity", "year": 2010, "date": "2010-09-14", "url": "https://doi.org/10.12942/lrr-2010-5", "authors": "Roy Maartens et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S9"}, {"id": "E69", "text": "Perturbations of black holes, initially considered in the context of possible observations of astrophysical effects, have been studied for the past 10 years in string theory, brane-world models, and quantum gravity.", "title": "Quasinormal modes of black holes: From astrophysics to string theory", "year": 2011, "date": "2011-07-11", "url": "https://doi.org/10.1103/revmodphys.83.793", "authors": "R. A. Konoplya et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S9"}, {"id": "E85", "text": "Abstract We discuss holographic models of extremal and non-extremal black holes in contact with a bath in d dimensions, based on a brane world model introduced in [1].", "title": "Quantum extremal islands made easy. Part II. Black holes on the brane", "year": 2020, "date": "2020-12-01", "url": "https://doi.org/10.1007/jhep12(2020)025", "authors": "Hong Zhe Chen et al.", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S9"}]}, {"label": "Other compound phrases", "meaning": "Accidental word sequences such as old world, developed world, open world, small-world, RNA World, or 'world' followed by the verb 'model'.", "evidence": [{"id": "E4", "text": "The indebtedness of our earliest American fiction to old world models has been made plain on numerous occasions.", "title": "Preciosité Crosses the Atlantic", "year": 1944, "date": "1944-03-01", "url": "https://doi.org/10.2307/458849", "authors": "Thomas P. Haviland", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S10"}, {"id": "E5", "text": "Most of those trying to lead a life of Christian perfection in the world model their spiritual life on one or other of the religious Orders, following its spirit and finding in the ideals of the religious family to which they have attached themselves, if only by ties of affection and reverence, an encouragement, an inspiration and a spiritual strength.", "title": "A Carmelite Lay Institute", "year": 1949, "date": "1949-09-01", "url": "https://doi.org/10.1017/s0269359300028470", "authors": "Unknown authors", "fromTitle": false, "field": "Arts and Humanities", "inSet": 0, "sense": "S10"}, {"id": "E61", "text": "CONCLUSION: The developed world model of personal ownership of a phone may not be appropriate to the developing world in which shared mobile telephone use is important.", "title": "Can the ubiquitous power of mobile phones be used to improve health outcomes in developing countries?", "year": 2006, "date": "2006-05-23", "url": "https://doi.org/10.1186/1744-8603-2-9", "authors": "Warren Allan Kaplan", "fromTitle": false, "field": "Health Professions", "inSet": 0, "sense": "S10"}, {"id": "E64", "text": "Finally, the authors consider the relevance of small-world models for understanding the emergence of complex behaviors and the resilience of brain systems to pathological attack by disease or aberrant development.", "title": "Small-World Brain Networks", "year": 2006, "date": "2006-11-01", "url": "https://doi.org/10.1177/1073858406293182", "authors": "Danielle S. Bassett et al.", "fromTitle": false, "field": "Neuroscience", "inSet": 0, "sense": "S10"}, {"id": "E71", "text": "The first RNA World models were based on the concept of an RNA replicase - a ribozyme that was a good enough RNA polymerase that it could catalyze its own replication.", "title": "The eightfold path to non-enzymatic RNA replication", "year": 2012, "date": "2012-02-03", "url": "https://doi.org/10.1186/1759-2208-3-2", "authors": "Jack W. Szostak", "fromTitle": false, "field": "Physics and Astronomy", "inSet": 0, "sense": "S10"}, {"id": "E80", "text": "Second, we carefully separate the system under test and driver, in order to correctly represent the open world model of typical stream processing deployments and can, therefore, measure system performance under realistic conditions.", "title": "Benchmarking Distributed Stream Data Processing Systems", "year": 2018, "date": "2018-04-01", "url": "https://doi.org/10.1109/icde.2018.00169", "authors": "Jeyhun Karimov et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S10"}, {"id": "E97", "text": "Grounded SAM: Assembling Open-World Models for Diverse Visual Tasks", "title": "Grounded SAM: Assembling Open-World Models for Diverse Visual Tasks", "year": 2024, "date": "2024-01-25", "url": "https://doi.org/10.48550/arxiv.2401.14159", "authors": "Tianhe Ren et al.", "fromTitle": true, "field": "Computer Science", "inSet": 3, "sense": "S10"}]}], "senses": [{"key": "S1", "label": "Learned predictive dynamics model", "definition": "A model learned from experience that predicts how the environment responds to actions, used for planning, exploration or training agents in imagination.", "related": true}, {"key": "S2", "label": "Engineered environment representation", "definition": "A hand-built or sensor-built symbolic, geometric or knowledge representation of the world kept by a planner, robot or AI system.", "related": true}, {"key": "S3", "label": "Generative video world model", "definition": "A large generative (often video or 4D) model that simulates future scenes conditioned on actions, presented as a foundation model or product for driving, robotics or games.", "related": true}, {"key": "S4", "label": "LLM internal world model", "definition": "The internal representation of world state that a language or sequence model is argued to contain or can be made to act as.", "related": true}, {"key": "S5", "label": "Cosmological world model", "definition": "A mathematical model of the universe as a whole in relativistic cosmology.", "related": false}, {"key": "S6", "label": "Global or exemplary model", "definition": "A model at global scale, or a country or practice held up as a model for the world to follow.", "related": false}, {"key": "S7", "label": "Sociological world models", "definition": "Globally institutionalized cultural templates of society, curricula or the state in world-society theory.", "related": false}, {"key": "S8", "label": "Real-world model", "definition": "A model drawn from real-world practice rather than a toy example (the phrase 'real-world model').", "related": false}, {"key": "S9", "label": "Brane-world model", "definition": "A cosmological model in which our universe is a brane in a higher-dimensional spacetime.", "related": false}, {"key": "S10", "label": "Other compound phrases", "definition": "Accidental word sequences such as old world, developed world, open world, small-world, RNA World, or 'world' followed by the verb 'model'.", "related": false}], "evidenceCount": 160, "eras": [{"start": 1983, "end": 1990, "label": "Symbolic planning and robotics", "meaning": "A world model was the hand-built or sensor-updated repr
