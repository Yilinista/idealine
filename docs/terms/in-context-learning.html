.qr-actions button,.qr-actions a{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:5px;text-decoration:none;font-size:.73rem;line-height:1.4}

@media(max-width:760px){.evidence-filters label{flex:1 1 140px}.evidence-filters select{max-width:none}.filter-status{flex-basis:100%;margin:0}}
@media(max-width:460px){.quote-row{grid-template-columns:1fr}.qr-year{padding:0 0 2px}.qr-actions{margin-left:0}}
.alt-row{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.alt-row .chip{margin:0;border-color:var(--accent);color:var(--accent)}

/* Settings: one light column. Provider is a row of buttons, the version a menu,
   rarely needed fields fold under "More options". */
.home .opts{max-width:none;margin:12px 0 0;padding:0;border:0;border-radius:0;background:transparent}
.home .opts[open]{padding:0}
.home .opts>summary{font-size:.8rem;color:var(--muted);padding:6px 0}
.home .opts>summary:hover{color:var(--fg)}
/* Settings as a list: label left, current value right, tap a row to edit it in place. */
.opts-body.slist{margin-top:8px;max-width:560px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.srow{margin:0;padding:0;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;font-size:inherit;color:var(--fg)}
.slist>.srow:first-child{border-top:0}
#keyrow>.srow{border-top:1px solid var(--line)}
.srow>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;font-size:.86rem}
.srow>summary::-webkit-details-marker{display:none}
.srow>summary:hover{background:color-mix(in srgb,var(--fg) 3%,transparent)}
.srow>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.srow>summary::after{content:"";flex:none;width:6px;height:6px;margin-left:2px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.srow[open]>summary::after{transform:rotate(45deg)}
.sl{flex:none;color:var(--fg)}
.sv{flex:1;min-width:0;text-align:right;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv.ok{color:var(--accent)}
.sv.link{color:var(--accent)}
.sedit{display:flex;flex-direction:column;gap:10px;padding:2px 16px 16px}
.opts .sedit .opts-hint,.home .opts .sedit .privacy{margin:0;font-size:.76rem;color:var(--muted);line-height:1.55}
.opts-hint{font-size:.74rem;font-weight:400;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.8rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink-soft);cursor:pointer}
.seg button:hover{border-color:var(--accent);color:var(--accent)}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opts input:not([type=checkbox]),.opts select{width:100%;height:36px;padding:0 11px;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
.opts input:not([type=checkbox]):focus,.opts select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.opts .select{display:block}
.opts .select select{padding-right:32px}
.keybox{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:3px}
.keybox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.opts .keybox input{border:0;height:30px;box-shadow:none;flex:1;min-width:0}
.opts .keybox input:focus{box-shadow:none}
.keybox button{font:inherit;font-size:.78rem;font-weight:600;height:30px;padding:0 14px;border:0;border-radius:6px;background:var(--accent);color:var(--on-accent);cursor:pointer;white-space:nowrap}
.keybox button:disabled{opacity:.55;cursor:wait}
.slink{font-size:.78rem;color:var(--accent);width:fit-content}
#keycheck{font-size:.78rem}
#keycheck:empty{display:none}
.oa-how{margin:0;padding-left:18px;font-size:.76rem;color:var(--muted);line-height:1.65}
.oa-how a{color:var(--accent)}
.opts label.sswitch,.sswitch{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);margin:0;cursor:pointer;font-size:.86rem}
.sswitch .sl{flex:1;display:flex;flex-direction:column;gap:2px}
.opts input.switch{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:24px;margin:0;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.opts input.switch::before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.opts input.switch:checked{background:var(--accent)}
.opts input.switch:checked::before{transform:translateX(16px)}
.opts input.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sfoot{display:flex;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--fg) 2%,transparent)}
.sfoot .linkbtn{font-size:.76rem}
@media(max-width:460px){.srow>summary,.opts label.sswitch{padding:12px 14px}.sedit{padding:2px 14px 14px}}

/* Evidence filters: meaning and period as chips with counts, order as a toggle. */
.ev-filters{max-width:780px;margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:start}
.flabel{font-size:.74rem;color:var(--muted);padding-top:6px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.78rem;line-height:1.4;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink-soft);cursor:pointer}
.fchip i,.qr-tag i{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.qr-tag i{margin-right:5px;vertical-align:1px}
.fchip .n{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.fchip:hover{border-color:var(--accent)}
.fchip[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-color:var(--accent);color:var(--fg)}
.fchip[aria-pressed=true] .n{color:var(--accent)}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.fbar .filter-status{margin:0}
.sortseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--panel)}
.sortseg button{font:inherit;font-size:.74rem;border:0;background:transparent;color:var(--muted);padding:3px 10px;border-radius:6px;cursor:pointer}
.sortseg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
@media(max-width:460px){.frow{grid-template-columns:1fr;gap:4px}.flabel{padding-top:0}}

/* Free result: say what a model key adds, with one button to the settings row. */
.upsell{display:flex;align-items:center;gap:14px;max-width:780px;margin:12px 0 0;padding:12px 14px;border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--accent) 6%,var(--panel))}

.upsell .btn{flex:none;white-space:nowrap}
@media(max-width:560px){.upsell{flex-direction:column;align-items:flex-start}}

/* One left inset (16px) for everything inside the timeline card. */
.card .mslist{padding:0 8px}
.card .detail{padding:18px 16px}
.mslist button{display:grid;grid-template-columns:1.6em minmax(0,1fr);align-items:baseline}

#tester-msg{font-size:.78rem}
#tester-msg:empty{display:none}
.slist>.srow[hidden]:first-child+.srow{border-top:0}

.timeline-main .headline{font-size:1.05rem;color:var(--fg);margin:0 0 6px}
.dnotes,.chart-key,.msfold{font-size:.82rem;color:var(--ink-soft);margin:4px 0 8px}
.dnotes>summary,.chart-key>summary,.msfold>summary,.more-panel>summary{cursor:pointer;color:var(--muted);width:fit-content}
.dnotes .dnote{margin:6px 0 0;line-height:1.5}

.card .chart-key,.card .msfold{padding:0 16px}
.card .chart-key .hint{padding:6px 0 0}
.card .detail:empty{display:none}
.story{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.story-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.sc-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sc-year{font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
.sc-line{margin:8px 0;font-size:.92rem;line-height:1.5;color:var(--fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sc-src{margin:0;font-size:.8rem;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.more-panel .brief-meta{padding:0;display:block}
@media(max-width:760px){.story{grid-template-columns:minmax(0,1fr)}}
