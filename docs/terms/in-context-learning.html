": "2025-11-28", "url": "https://doi.org/10.48550/arxiv.2511.23473", "authors": "Yiping Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E156", "text": "SDFT leverages in-context learning by using a demonstration-conditioned model as its own teacher, generating on-policy training signals that preserve prior capabilities while acquiring new skills.", "title": "Self-Distillation Enables Continual Learning", "year": 2026, "date": "2026-01-27", "url": "https://doi.org/10.48550/arxiv.2601.19897", "authors": "Idan Shenfeld et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E157", "text": "This goes far beyond long-context tasks that primarily test retrieval or reading comprehension, and in-context learning tasks, where models learn simple task patterns via instructions and demonstrations.", "title": "CL-bench: A Benchmark for Context Learning", "year": 2026, "date": "2026-02-03", "url": "https://doi.org/10.48550/arxiv.2602.03587", "authors": "Shihan Dou et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E158", "text": "Tabular foundation models, such as TabPFNv2 and TabICL, have recently dethroned gradient-boosted trees at the top of predictive benchmarks, demonstrating the value of in-context learning for tabular data.", "title": "TabICLv2: A better, faster, scalable, and open tabular foundation model", "year": 2026, "date": "2026-02-11", "url": "https://doi.org/10.48550/arxiv.2602.11139", "authors": "Jingang Qu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E159", "text": "Large language models (LLMs) can perform accurate classification with zero or few examples through in-context learning (ICL), allowing the model to observe query-relevant examples at inference time and eliminating the need for additional weight updates to generalize beyond its original training data.", "title": "Bayesian Optimization of Catalysis with In-Context Learning", "year": 2026, "date": "2026-04-14", "url": "https://doi.org/10.1021/acscentsci.5c02418", "authors": "Mayk Caldas Ramos et al.", "fromTitle": false, "field": "Materials Science", "inSet": 1, "sense": "S1"}, {"id": "E160", "text": "This survey systematically reviews recent advancements in LLM techniques across four key dimensions: (1) pre-training methodologies, which establish core model capabilities through large-scale self-supervised training, architectural innovations, and data curation strategies; (2) post-training techniques, including supervised fine-tuning and reinforcement learning, which adapt foundational models to downstream tasks and enhance their alignment an…", "title": "A Survey of Large Language Models", "year": 2026, "date": "2026-05-09", "url": "https://doi.org/10.1007/s11704-026-60308-3", "authors": "Wayne Xin Zhao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 10, "sense": "unclear"}], "total": 6281, "model": "claude-opus-5-5", "generated": "2026-11-17", "lang": "en", "meaning": "", "focus": "In machine learning, in-context learning (ICL) is a model's ability to perform a new task by conditioning on examples or instructions in its input prompt, with no parameter updates.", "otherSenses": [{"label": "L2 vocabulary context learning", "meaning": "Second-language learners acquiring word meanings from surrounding context.", "evidence": [{"id": "E1", "text": "The Comparative Effectiveness of Word Lists and Video-Graphic Cues on University Level ESL Students’ Vocabulary in Context Learning", "title": "The Comparative Effectiveness of Word Lists and Video-Graphic Cues on University Level ESL Students’ Vocabulary in Context Learning", "year": 1990, "date": "1990-01-01", "url": "https://doi.org/10.5070/b5.36657", "authors": "Raymond Devenney", "fromTitle": true, "field": "Psychology", "inSet": 0, "sense": "S4"}, {"id": "E2", "text": "Such faith in context learning has not always received experimental support, however, nor is it commonly shared by L2 learners.", "title": "Second Language Vocabulary Learning: The Role of Context versus Translations as a Function of Proficiency", "year": 1996, "date": "1996-01-01", "url": "https://doi.org/10.1111/j.1540-4781.1996.tb05468.x", "authors": "Peter Prince", "fromTitle": false, "field": "Psychology", "inSet": 0, "sense": "S4"}]}, {"label": "Educational in-context support", "meaning": "Learning support or constructivist learning embedded in authentic course or task contexts.", "evidence": [{"id": "E3", "text": "The study documented the design, implementation and evaluation - from both the students' and teacher's perspectives - of an in-context learning support program for first year students, using both quantitative and qualitative methodologies.The program was based on a theoretical framework which integrated cognitive, behavioural and social learning perspectives and focussed on increasing students' repertoire of learning strategies, promoting their …", "title": "Design, implementation and evaluation of an in-context learning support program for first year education students and its impact on educational outcomes.", "year": 1998, "date": "1998-01-01", "url": "https://openalex.org/W2295722042", "authors": "de la Harpe et al.", "fromTitle": false, "field": "Psychology", "inSet": 0, "sense": "S5"}, {"id": "E5", "text": "Helping future teachers to be effective learners: Providing in context learning support for first year teacher education students", "title": "Helping future teachers to be effective learners: Providing in context learning support for first year teacher education students", "year": 1999, "date": "1999-11-01", "url": "https://doi.org/10.14221/ajte.1999v24n2.3", "authors": "Barbara de la Harpe et al.", "fromTitle": true, "field": "Psychology", "inSet": 0, "sense": "S5"}, {"id": "E6", "text": "The first concentrates on the instructional design approach which focuses on the definition of specific s from surrounding context.", "related": false}, {"key": "S5", "label": "Educational in-context support", "definition": "Learning support or constructivist learning embedded in authentic course or task contexts.", "related": false}, {"key": "S6", "label": "Neuroscience context learning", "definition": "Animals learning associations with environmental contexts, linked to the hippocampus.", "related": false}], "evidenceCount": 160, "eras": [{"start": 2021, "end": 2021, "label": "GPT-3's surprising capability", "meaning": "ICL named the surprising ability of large language models like GPT-3 to learn a task from input-output examples in the prompt, framed as a form of few-shot or meta-learning.", "evidence": [{"id": "E7", "text": "We introduce MetaICL (Meta-training for In-Context Learning), a new meta-training framework for few-shot learning where a pretrained language model is tuned to do in-context learning on a large set of training tasks.", "title": "MetaICL: Learning to Learn In Context", "year": 2021, "date": "2021-10-29", "url": "https://doi.org/10.48550/arxiv.2110.15943", "authors": "Sewon Min et al.", "fromTitle": false, "field": "Computer Science", "inSet": 11, "sense": "S1"}, {"id": "E8", "text": "Large language models (LMs) such as GPT-3 have the surprising ability to do in-context learning, where the model learns to do a downstream task simply by conditioning on a prompt consisting of input-output examples.", "title": "An Explanation of In-context Learning as Implicit Bayesian Inference", "year": 2021, "date": "2021-11-03", "url": "https://doi.org/10.48550/arxiv.2111.02080", "authors": "Sang Michael Xie et al.", "fromTitle": false, "field": "Computer Science", "inSet": 25, "sense": "S1"}, {"id": "E9", "text": "For example, thanks to scaling, GPT-3 was able to achieve strong results on in-context learning tasks.", "title": "GLaM: Efficient Scaling of Language Models with Mixture-of-Experts", "year": 2021, "date": "2021-12-13", "url": "https://doi.org/10.48550/arxiv.2112.06905", "authors": "Nan Du et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S1"}]}, {"start": 2022, "end": 2022, "label": "Paradigm, selection and mechanism", "meaning": "ICL became a recognized NLP paradigm: researchers studied how to choose demonstrations, compared it with fine-tuning, and probed why transformers can do it (induction heads, gradient descent, function classes).", "evidence": [{"id": "E10", "text": "Large language models (LMs) are able to incontext learn-perform a new task via inference alone by conditioning on a few input-label pairs (demonstrations) and making predictions for new inputs.However, there has been little understanding of how the model learns and which aspects of the demonstrations contribute to end task performance.In this paper, we show that ground truth demonstrations are in fact not required-randomly replacing labels in th…", "title": "Rethinking the Role of Demonstrations: What Makes In-Context Learning Work?", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.18653/v1/2022.emnlp-main.759", "authors": "Sewon Min et al.", "fromTitle": false, "field": "Computer Science", "inSet": 41, "sense": "S1"}, {"id": "E11", "text": "Few-shot in-context learning (ICL) enables pre-trained language models to perform a previously-unseen task without any gradient-based training by feeding a small number of training examples as part of the input.", "title": "Few-Shot Parameter-Efficient Fine-Tuning is Better and Cheaper than In-Context Learning", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.52202/068431-0142", "authors": "Haokun Liu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S1"}, {"id": "E12", "text": "In-context learning is a recent paradigm in natural language understanding, where a large pretrained language model (LM) observes a test instance and a few training examples as its input, and directly decodes the output without any update to its parameters.However, performance has been shown to strongly depend on the selected training examples (termed prompts).In this work, we propose an efficient method for retrieving prompts for in-context lea…", "title": "Learning To Retrieve Prompts for In-Context Learning", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.18653/v1/2022.naacl-main.191", "authors": "Ohad Rubin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 28, "sense": "S1"}, {"id": "E13", "text": "In-context learning refers to the ability of a model to condition on a prompt sequence consisting of in-context examples (input-output pairs corresponding to some task) along with a new query input, and generate the corresponding output.", "title": "What Can Transformers Learn In-Context? a Case Study of Simple Function Classes", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.52202/068431-2217", "authors": "Shivam Garg et al.", "fromTitle": false, "field": "Computer Science", "inSet": 18, "sense": "S1"}, {"id": "E14", "text": "With a handful of demonstration examples, large-scale language models show strong capability to perform various tasks by in-context learning from these examples, without any finetuning.We demonstrate that in-context learning performance can be highly unstable across samples of examples, indicating the idiosyncrasies of how language models acquire information.We formulate example selection for in-context learning as a sequential decision problem,…", "title": "Active Example Selection for In-Context Learning", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.18653/v1/2022.emnlp-main.622", "authors": "Yiming Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 9, "sense": "S1"}, {"id": "E21", "text": "Large language models can perform in-context learning, where they learn a new task from a few task demonstrations, without any parameter updates.", "title": "Selective Annotation Makes Language Models Better Few-Shot Learners", "year": 2022, "date": "2022-09-05", "url": "https://doi.org/10.48550/arxiv.2209.01975", "authors": "Hongjin Su et al.", "fromTitle": false, "field": "Computer Science", "inSet": 9, "sense": "S1"}, {"id": "E22", "text": "In this work, we present preliminary and indirect evidence for a hypothesis that induction heads might constitute the mechanism for the majority of all \"in-context learning\" in large transformer models (i.e. decreasing loss at increasing token indices).", "title": "In-context Learning and Induction Heads", "year": 2022, "date": "2022-09-24", "url": "https://doi.org/10.48550/arxiv.2209.11895", "authors": "Catherine Olsson et al.", "fromTitle": false, "field": "Computer Science", "inSet": 17, "sense": "S1"}, {"id": "E25", "text": "Neural sequence models, especially transformers, exhibit a remarkable capacity for in-context learning.", "title": "What learning algorithm is in-context learning? Investigations with linear models", "year": 2022, "date": "2022-11-28", "url": "https://doi.org/10.48550/arxiv.2211.15661", "authors": "Ekin Akyürek et al.", "fromTitle": false, "field": "Computer Science", "inSet": 17, "sense": "S1"}, {"id": "E26", "text": "At present, the mechanisms of in-context learning in Transformers are not well understood and remain mostly an intuition.", "title": "Transformers learn in-context by gradient descent", "year": 2022, "date": "2022-12-15", "url": "https://doi.org/10.48550/arxiv.2212.07677", "authors": "Johannes von Oswald et al.", "fromTitle": false, "field": "Computer Science", "inSet": 17, "sense": "S1"}]}, {"start": 2023, "end": 2024, "label": "Survey and multimodal spread", "meaning": "ICL was surveyed as a new paradigm and extended beyond text to vision, speech, multimodal and tabular models, while mechanistic theory continued.", "evidence": [{"id": "E28", "text": "With the increasing capabilities of large language models (LLMs), in-context learning (ICL) has emerged as a new paradigm for natural language processing (NLP), where LLMs make predictions based on contexts augmented with a few examples.", "title": "A Survey on In-context Learning", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.48550/arxiv.2301.00234", "authors": "Qingxiu Dong et al.", "fromTitle": false, "field": "Computer Science", "inSet": 30, "sense": "S1"}, {"id": "E38", "text": "In-context learning (ICL) in Large Language Models (LLMs) has emerged as a powerful new learning paradigm.However, its underlying mechanism is still not well understood.In particular, it is challenging to map it to the \"standard\" machine learning framework, where one uses a training set S to find a best-fitting function f (x) in some hypothesis class.Here we make progress on this problem by showing that the functions learned by ICL often have a …", "title": "In-Context Learning Creates Task Vectors", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.findings-emnlp.624", "authors": "Roee Hendel et al.", "fromTitle": false, "field": "Computer Science", "inSet": 7, "sense": "S1"}, {"id": "E40", "text": "Large pretrained language models have shown surprising in-context learning (ICL) ability.With a few demonstration input-label pairs, they can predict the label for an unseen input without parameter updates.Despite the great success in performance, its working mechanism still remains an open question.In this paper, we explain language models as metaoptimizers and understand in-context learning as implicit finetuning.Theoretically, we figure out t…", "title": "Why Can GPT Learn In-Context? Language Models Secretly Perform Gradient Descent as Meta-Optimizers", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.findings-acl.247", "authors": "Damai Dai et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S1"}, {"id": "E52", "text": "In this paper, the main focus is on an emergent ability in large vision models, known as in-context learning, which allows inference on unseen tasks by conditioning on in-context examples (a.k.a.~prompt) without updating the model parameters.", "title": "What Makes Good Examples for Visual In-Context Learning?", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.52202/075280-0780", "authors": "Yuanhan Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S2"}, {"id": "E56", "text": "Vall-E emerges in-context learning capabilities and can be used to synthesize high-quality personalized speech with only a 3-second enrolled recording of an unseen speaker as an acoustic prompt.", "title": "Neural Codec Language Models are Zero-Shot Text to Speech Synthesizers", "year": 2023, "date": "2023-01-05", "url": "https://doi.org/10.48550/arxiv.2301.02111", "authors": "Chengyi Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S2"}, {"id": "E66", "text": "In-context learning, as a new paradigm in NLP, allows the model to rapidly adapt to various tasks with only a handful of prompts and examples.", "title": "Images Speak in Images: A Generalist Painter for In-Context Visual Learning", "year": 2023, "date": "2023-06-01", "url": "https://doi.org/10.1109/cvpr52729.2023.00660", "authors": "Xinlong Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S2"}, {"id": "E85", "text": "A Survey on In-context Learning", "title": "A Survey on In-context Learning", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.18653/v1/2024.emnlp-main.64", "authors": "Qingxiu Dong et al.", "fromTitle": true, "field": "Computer Science", "inSet": 7, "sense": "S1"}, {"id": "E87", "text": "In Large Visual Language Models (LVLMs), the efficacy of In-Context Learning (ICL) remains limited by challenges in cross-modal interactions and representation disparities.To overcome these challenges, we introduce a novel Visual In-Context Learning (VICL) method comprising Visual Demonstration Retrieval, Intent-Oriented Image Summarization, and Intent-Oriented Demonstration Composition.Our approach retrieves images via \"Retrieval & Rerank\" para…", "title": "Visual In-Context Learning for Large Vision-Language Models", "year": 2024, "date": "2024-01-01", "url": "https://doi.org/10.18653/v1/2024.findings-acl.940", "authors": "Yucheng Zhou et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E105", "text": "In this work, we demonstrate that the task-agnostic in-context learning capabilities of large multimodal models can be significantly enhanced by effective scaling-up.", "title": "Generative Multimodal Models are In-Context Learners", "year": 2024, "date": "2024-06-16", "url": "https://doi.org/10.1109/cvpr52733.2024.01365", "authors": "Quan Sun et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S2"}, {"id": "E113", "text": "We continue with multimodal hallucination and extended techniques, including multimodal in-context learning, multimodal chain of thought and LLM-aided visual reasoning.", "title": "A survey on multimodal large language models", "year": 2024, "date": "2024-11-11", "url": "https://doi.org/10.1093/nsr/nwae403", "authors": "Shukang Yin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}]}, {"start": 2025, "end": 2026, "label": "Standard prompting toolkit", "meaning": "ICL is routinely listed alongside chain-of-thought, RAG and fine-tuning as a basic strategy for applying LLMs across domains, and it underpins tabular foundation models.", "evidence": [{"id": "E128", "text": "To address these challenges, previous research explored in-context learning (ICL) and retrieval-augmented generation (RAG) as strategies to guide the LLM generative process with task-specific prompt examples.", "title": "Exploring Parameter-Efficient Fine-Tuning Techniques for Code Generation with Large Language Models", "year": 2025, "date": "2025-01-22", "url": "https://doi.org/10.1145/3714461", "authors": "Martin Weyssow et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E137", "text": "In particular, this work first introduces LLM fundamentals and compares different prompting techniques such as in-context learning, chain-of-thought, and self-refinement.", "title": "Large Language Models for Wireless Networks: An Overview from the Prompt Engineering Perspective", "year": 2025, "date": "2025-03-17", "url": "https://doi.org/10.1109/mwc.001.2400384", "authors": "Hao Zhou et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E142", "text": "In this paper, we evaluate GPT-4 using three prompt engineering strategies-basic prompting, in-context learning, and taskspecific prompting-and compare it against 17 fine-tuned models across three code-related tasks: code summarization, generation, and translation.", "title": "Prompt Engineering or Fine-Tuning: An Empirical Assessment of LLMs for Code", "year": 2025, "date": "2025-04-28", "url": "https://doi.org/10.1109/msr66628.2025.00082", "authors": "Jiho Shin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E147", "text": "Key methodological aspects-such as domain-specific data acquisition, large-scale pre-training, supervised fine-tuning, prompt engineering, and in-context learning-are explored in the context of healthcare use cases.", "title": "Large Language Models in Healthcare and Medical Applications: A Review", "year": 2025, "date": "2025-06-10", "url": "https://doi.org/10.3390/bioengineering12060631", "authors": "Subhankar Maity et al.", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S1"}, {"id": "E149", "text": "This paper reviews LLM based monitoring and diagnostics methodologies, categorizing them into in-context learning, fine tuning, retrieval augmented generation, multimodal learning, and time series approaches, analyzing advances in diagnostics and decision support.", "title": "Large Models for Machine Monitoring and Fault Diagnostics: Opportunities, Challenges and Future Direction", "year": 2025, "date": "2025-06-20", "url": "https://doi.org/10.37965/jdmd.2025.832", "authors": "Xuefeng Chen et al.", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S1"}, {"id": "E141", "text": "The size expansion comes with a distinct capability called in-context learning (ICL), which represents a special form of prompting and allows the models to be utilized through the presentation of demonstration examples without modifications to the model parameters.", "title": "Privacy Preserving Prompt Engineering: A Survey", "year": 2025, "date": "2025-04-18", "url": "https://doi.org/10.1145/3729219", "authors": "Kennedy Edemacu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E122", "text": "Since the seminal work of TabPFN, research on tabular foundation models (TFMs) based on in-context learning (ICL) has challenged long-standing paradigms in machine learning.", "title": "Mitra: Mixed Synthetic Priors for Enhancing Tabular Foundation Models", "year": 2025, "date": "2025-01-01", "url": "https://doi.org/10.52202/085713-0535", "authors": "Xiyuan Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E158", "text": "Tabular foundation models, such as TabPFNv2 and TabICL, have recently dethroned gradient-boosted trees at the top of predictive benchmarks, demonstrating the value of in-context learning for tabular data.", "title": "TabICLv2: A better, faster, scalable, and open tabular foundation model", "year": 2026, "date": "2026-02-11", "url": "https://doi.org/10.48550/arxiv.2602.11139", "authors": "Jingang Qu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E159", "text": "Large language models (LLMs) can perform accurate classification with zero or few examples through in-context learning (ICL), allowing the model to observe query-relevant examples at inference time and eliminating the need for additional weight updates to generalize beyond its original training data.", "title": "Bayesian Optimization of Catalysis with In-Context Learning", "year": 2026, "date": "2026-04-14", "url": "https://doi.org/10.1021/acscentsci.5c02418", "authors": "Mayk Caldas Ramos et al.", "fromTitle": false, "field": "Materials Science", "inSet": 1, "sense": "S1"}]}], "milestones": [{"year": 2021, "kind": "ancestor", "title": "Few-shot learning and meta-learning", "why": "ICL was framed as a few-shot learning ability, and models were meta-trained for it, tying it to the earlier meta-learning idea.", "url": "https://doi.org/10.1109/iccv48922.2021.00893", "date": "2021-10-01", "workTitle": "Meta-Baseline: Exploring Simple Meta-Learning for Few-Shot Learning", "authors": "Yinbo Chen et al.", "link": "resolved", "evidence": [{"id": "E7", "text": "We introduce MetaICL (Meta-training for In-Context Learning), a new meta-training framework for few-shot learning where a pretrained language model is tuned to do in-context learning on a large set of training tasks.", "title": "MetaICL: Learning to Learn In Context", "year": 2021, "date": "2021-10-29", "url": "https://doi.org/10.48550/arxiv.2110.15943", "authors": "Sewon Min et al.", "fromTitle": false, "field": "Computer Science", "inSet": 11, "sense": "S1"}, {"id": "E17", "text": "The goal of meta-learning is to learn to adapt to a new task with only a few labeled examples.Inspired by the recent progress in large language models, we propose in-context tuning (ICT), which recasts task adaptation and prediction as a simple sequence prediction problem: to form the input sequence, we concatenate the task instruction, labeled in-context examples, and the target input to predict; to metatrain the model to learn from in-context …", "title": "Meta-learning via Language Model In-context Tuning", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.18653/v1/2022.acl-long.53", "authors": "Yanda Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 9, "sense": "S3"}], "checks": {"inSense": false, "coinage": false}, "shift": ""}, {"year": 2021, "kind": "origin", "title": "An Explanation of In-context Learning as Implicit Bayesian Inference", "why": "This is the earliest evidence that defines ICL as GPT-3's ability to learn a task by conditioning on prompt examples.", "url": "https://doi.org/10.48550/arxiv.2111.02080", "date": "2021-11-03", "workTitle": "An Explanation of In-context Learning as Implicit Bayesian Inference", "authors": "Sang Michael Xie et al.", "link": "in-sample", "evidence": [{"id": "E8", "text": "Large language models (LMs) such as GPT-3 have the surprising ability to do in-context learning, where the model learns to do a downstream task simply by conditioning on a prompt consisting of input-output examples.", "title": "An Explanation of In-context Learning as Implicit Bayesian Inference", "year": 2021, "date": "2021-11-03", "url": "https://doi.org/10.48550/arxiv.2111.02080", "authors": "Sang Michael Xie et al.", "fromTitle": false, "field": "Computer Science", "inSet": 25, "sense": "S1"}, {"id": "E9", "text": "For example, thanks to scaling, GPT-3 was able to achieve strong results on in-context learning tasks.", "title": "GLaM: Efficient Scaling of Language Models with Mixture-of-Experts", "year": 2021, "date": "2021-12-13", "url": "https://doi.org/10.48550/arxiv.2112.06905", "authors": "Nan Du et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S1"}], "checks": {"inSense": true, "coinage": false}, "shift": ""}, {"year": 2022, "kind": "critique", "title": "Rethinking the Role of Demonstrations: What Makes In-Context Learning Work?", "why": "It showed that ground-truth labels in demonstrations are not required, challenging the assumption that ICL learns the input-label mapping.", "url": "https://doi.org/10.18653/v1/2022.emnlp-main.759", "date": "2022-01-01", "workTitle": "Rethinking the Role of Demonstrations: What Makes In-Context Learning Work?", "authors": "Sewon Min et al.", "link": "in-sample", "evidence": [{"id": "E10", "text": "Large language models (LMs) are able to incontext learn-perform a new task via inference alone by conditioning on a few input-label pairs (demonstrations) and making predictions for new inputs.However, there has been little understanding of how the model learns and which aspects of the demonstrations contribute to end task performance.In this paper, we show that ground truth demonstrations are in fact not required-randomly replacing labels in th…", "title": "Rethinking the Role of Demonstrations: What Makes In-Context Learning Work?", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.18653/v1/2022.emnlp-main.759", "authors": "Sewon Min et al.", "fromTitle": false, "field": "Computer Science", "inSet": 41, "sense": "S1"}], "checks": {"inSense": true, "coinage": false}, "shift": ""}, {"year": 2022, "kind": "critique", "title": "Few-Shot Parameter-Efficient Fine-Tuning is Better and Cheaper than In-Context Learning", "why": "It argued that parameter-efficient fine-tuning beats ICL on both accuracy and cost.", "url": "https://doi.org/10.52202/068431-0142", "date": "2022-01-01", "workTitle": "Few-Shot Parameter-Efficient Fine-Tuning is Better and Cheaper than In-Context Learning", "authors": "Haokun Liu et al.", "link": "in-sample", "evidence": [{"id": "E11", "text": "Few-shot in-context learning (ICL) enables pre-trained language models to perform a previously-unseen task without any gradient-based training by feeding a small number of training examples as part of the input.", "title": "Few-Shot Parameter-Efficient Fine-Tuning is Better and Cheaper than In-Context Learning", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.52202/068431-0142", "authors": "Haokun Liu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 8, "sense": "S1"}, {"id": "E47", "text": "Few-shot fine-tuning and in-context learning are two alternative strategies for task adaptation of pre-trained language models.Recently, in-context learning has gained popularity over fine-tuning due to its simplicity and improved out-of-domain generalization, and because extensive evidence shows that fine-tuned models pick up on spurious correlations.Unfortunately, previous comparisons of the two approaches were done using models of different s…", "title": "Few-shot Fine-tuning vs. In-context Learning: A Fair Comparison and Evaluation", "year": 2023, "date": "2023-01-01", "url": "https://doi.org/10.18653/v1/2023.findings-acl.779", "authors": "Marius Mosbach et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S1"}], "checks": {"inSense": true, "coinage": false}, "shift": ""}, {"year": 2022, "kind": "redefined", "title": "In-context Learning and Induction Heads", "why": "It recast ICL broadly as decreasing loss at later token positions and tied it to a specific attention mechanism.", "url": "https://doi.org/10.48550/arxiv.2209.11895", "date": "2022-09-24", "workTitle": "In-context Learning and Induction Heads", "authors": "Catherine Olsson et al.", "link": "in-sample", "evidence": [{"id": "E22", "text": "In this work, we present preliminary and indirect evidence for a hypothesis that induction heads might constitute the mechanism for the majority of all \"in-context learning\" in large transformer models (i.e. decreasing loss at increasing token indices).", "title": "In-context Learning and Induction Heads", "year": 2022, "date": "2022-09-24", "url": "https://doi.org/10.48550/arxiv.2209.11895", "authors": "Catherine Olsson et al.", "fromTitle": false, "field": "Computer Science", "inSet": 17, "sense": "S1"}], "checks": {"inSense": true, "coinage": false}, "shift": "broadening"}, {"year": 2022, "kind": "redefined", "title": "Transformers learn in-context by gradient descent", "why": "It reframed ICL as implicit learning algorithms, such as gradient descent, running inside transformers, a framing that later works followed.", "url": "https://doi.org/10.48550/arxiv.2212.07677", "date": "2022-12-15", "workTitle": "Transformers learn in-context by gradient descent", "authors": "Johannes von Oswald et al.", "link": "in-sample", "evidence": [{"id": "E26", "text": "At present, the mechanisms of in-context learning in Transformers are not well understood and remain mostly an intuition.", "title": "Transformers learn in-context by gradient descent", "year": 2022, "date": "2022-12-15", "url": "https://doi.org/10.48550/arxiv.2212.07677", "authors": "Johannes von Oswald et al.", "fromTitle": false, "field": "Computer Science", "inSet": 17, "sense": "S1"}, {"id": "E25", "text": "Neural sequence models, especially transformers, exhibit a remarkable capacity for in-context learning.", "title": "What learning algorithm is in-context learning? Investigations with linear models", "year": 2022, "date": "2022-11-28", "url": "https://doi.org/10.48550/arxiv.2211.15661", "authors": "Ekin Akyürek et al.", "fromTitle": false, "field": "Computer Science", "inSet": 17, "sense": "S1"}, {"id": "E13", "text": "In-context learning refers to the ability of a model to condition on a prompt sequence consisting of in-context examples (input-output pairs corresponding to some task) along with a new query input, and generate the corresponding output.", "title": "What Can Transformers Learn In-Context? a Case Study of Simple Function Classes", "year": 2022, "date": "2022-01-01", "url": "https://doi.org/10.52202/068431-2217", "authors": "Shivam Garg et al.", "fromTitle": false, "field": "Computer Science", "inSet": 18, "sense": "S1"}, {"id": "E40", "text": "Large pretrained language models have shown surprising in-context learning (ICL) ability.With a few demonstration input-label pairs, they can predict the label for an unseen input without parameter updates.Despite the great success in perf   const PALETTE = ['#4c6ef5', '#e8590c', '#2b8a3e', '#ae3ec9', '#c92a2a', '#1098ad', '#f59f00', '#5c7cfa'];
  const GREY = '#adb5bd', OTHER = '#868e96';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u) ? u : null);
  const reEsc = w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // --- pure helpers ---------------------------------------------------------------

  // Same onset rule as core.js: first year by which the term has 3 papers or 1% of all.
  function onsetYear(counts) {
    const total = counts.reduce((n, [, c]) => n + c, 0), need = Math.max(3, total * 0.01);
    let acc = 0;
    for (const [y, c] of [...counts].sort((a, b) => a[0] - b[0])) { acc += c; if (acc >= need) return y; }
    return null;
  }

  // Yearly series with missing years filled with 0, from `from` to `to`.
  function fill(counts, from, to) {
    const m = new Map(counts);
    const out = [];
    for (let y = from; y <= to; y++) out.push([y, m.get(y) || 0]);
    return out;
  }

  // Ke et al. (PNAS 2015) awakening time: the year before the peak that lies farthest
  // below the straight line from the first year to the peak. Null when the curve is
  // too short or too small to have a slow start worth naming.
  function awakening(counts) {
    if (!counts.length) return null;
    const peak = counts.reduce((a, b) => (b[1] > a[1] ? b : a));
    const first = Math.max(counts[0][0], peak[0] - 60);
    const s = fill(counts, first, peak[0]);
    if (peak[1] < 10 || s.length < 4) return null;
    const [t0, c0] = s[0], [tm, cm] = s[s.length - 1];
    let best = null, bestD = 0;
    for (const [t, c] of s) {
      const d = ((cm - c0) / (tm - t0)) * (t - t0) + c0 - c;  // how far below the line
      if (d > bestD) { bestD = d; best = t; }
    }
    return best != null && best > t0 && best < tm ? best : null;
  }

  // Takeoff year: from the awakening point, the first year clearly above the slow
  // start (more than twice its highest yearly count, and at least 3 papers). The
  // awakening point itself can be the last quiet year, before the term even exists.
  function takeoff(counts) {
    const ta = awakening(counts);
    if (ta == null) return null;
    const m = new Map(counts);
    const before = Math.max(0, ...counts.filter(([y]) => y < ta).map(([, c]) => c));
    const last = counts[counts.length - 1][0];
    for (let y = ta; y <= last; y++) if ((m.get(y) || 0) > Math.max(2 * before, 2)) return y;
    return null;
  }

  // Takeoff of the main run of use: skip stray records cut off from it by more than
  // three empty years (often misdated), the same rule the source cards use. The chart
  // and the headline both use this, so they name the same year.
  function mainRun(cs) {
    const on = onsetYear(cs);
    const nz = cs.filter(([, c]) => c > 0).map(([y]) => y);
    let first = nz[0];
    for (let i = 1; i < nz.length; i++) if (nz[i] - nz[i - 1] > 3 && on && nz[i] <= on) first = nz[i];
    const main = cs.filter(([y]) => y >= first);
    const ta0 = main.length >= 3 ? takeoff(main) : null;
    return { first, main, ta: ta0 && ta0 > first ? ta0 : null };
  }

  // Kleinberg (2002) two-state burst detection on yearly counts. With per-year totals
  // it uses the batched (binomial) form on shares; without, a Poisson form on counts.
  // Returns [[startYear, endYear], ...] for the runs spent in the burst state.
  function bursts(counts, totals, s = 2, gamma = 1) {
    if (counts.length < 3) return [];
    const series = fill(counts, counts[0][0], counts[counts.length - 1][0]);
    const tot = new Map(totals || []);
    const useTot = series.every(([y]) => tot.get(y) > 0);
    const n = series.length, R = series.reduce((a, [, r]) => a + r, 0);
    let cost;
    if (useTot) {
      const D = series.reduce((a, [y]) => a + tot.get(y), 0), p = [R / D, Math.min(0.9999, (s * R) / D)];
      cost = (i, y, r) => -(r * Math.log(p[i]) + (tot.get(y) - r) * Math.log(1 - p[i]));
    } else {
      const lam = [R / n, (s * R) / n];
      cost = (i, y, r) => lam[i] - r * Math.log(lam[i]);
    }
    const up = gamma * Math.log(n);
    let c = [0, up];
    const back = [];
    for (const [y, r] of series) {
      const stay0 = c[0], from1to0 = c[1], to1from0 = c[0] + up, stay1 = c[1];
      const n0 = Math.min(stay0, from1to0), n1 = Math.min(to1from0, stay1);
      back.push([stay0 <= from1to0 ? 0 : 1, to1from0 < stay1 ? 0 : 1]);
      c = [n0 + cost(0, y, r), n1 + cost(1, y, r)];
    }
    let st = c[0] <= c[1] ? 0 : 1;
    const states = new Array(n);
    for (let i = n - 1; i >= 0; i--) { states[i] = st; st = back[i][st]; }
    const out = [];
    states.forEach((v, i) => {
      if (!v) return;
      const y = series[i][0];
      if (out.length && out[out.length - 1][1] === y - 1) out[out.length - 1][1] = y; else out.push([y, y]);
    });
    return out.filter(([a, b]) => series.some(([y, r]) => y >= a && y <= b && r > 0));
  }

  // Jensen-Shannon distance (base 2, 0..1) between two {key: count} maps.
  function jsDistance(a, b) {
    const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
    const sa = Object.values(a).reduce((x, y) => x + y, 0), sb = Object.values(b).reduce((x, y) => x + y, 0);
    if (!sa || !sb) return null;
    let d = 0;
    for (const k of keys) {
      const p = (a[k] || 0) / sa, q = (b[k] || 0) / sb, m = (p + q) / 2;
      if (p) d += 0.5 * p * Math.log2(p / m);
      if (q) d += 0.5 * q * Math.log2(q / m);
    }
    return Math.sqrt(Math.max(0, d));
  }

  // SemEval-2020 Task 1 binary change rule for small samples: a sense is new when it
  // goes from at most k uses to at least n uses, faded the other way round.
  function senseChange(prev, cur, k = 2, n = 5) {
    const keys = new Set([...Object.keys(prev), ...Object.keys(cur)]);
    const gained = [], lost = [];
    for (const key of keys) {
      if ((prev[key] || 0) <= k && (cur[key] || 0) >= n) gained.push(key);
      if ((prev[key] || 0) >= n && (cur[key] || 0) <= k) lost.push(key);
    }
    return { gained, lost };
  }

  const STOP = new Set(('a about above after again against all also am an and any are as at be because been before being below between both but by can could did do does doing down during each few for from further had has have having here how however i if in into is it its itself just more most no nor not now of off on once only or other our out over own paper papers present propose proposed same she should so some such than that the their them then there these they this those through to too under until up use used uses using very via was we were what when where which while who whom why will with within without would you your study studies approach approaches based results show shows new also one two three may well like many much often recent including').split(' '));

  // Word counts of the quotes, without stop words, numbers, or the term's own words.
  function wordCounts(texts, termWords) {
    const m = new Map();
    for (const s of texts) {
      for (const w of String(s).toLowerCase().match(/\p{L}[\p{L}\p{N}-]{2,}/gu) || []) {
        if (STOP.has(w) || termWords.has(w)) continue;
        m.set(w, (m.get(w) || 0) + 1);
      }
    }
    return m;
  }

  function cosine(a, b) {
    let dot = 0, na = 0, nb = 0;
    for (const [k, v] of a) { na += v * v; if (b.has(k)) dot += v * b.get(k); }
    for (const v of b.values()) nb += v * v;
    return na && nb ? dot / Math.sqrt(na * nb) : 0;
  }

  // Time of a quote or milestone as a fractional year: its month when the date agrees
  // with its year and is not OpenAlex's 1 January stand-in for "year only".
  function timeOf(year, date, fallback) {
    const d = /^(\d{4})-(\d{2})/.exec(date || '');
    const yearOnly = /^\d{4}-01-01/.test(date || '');
    return d && +d[1] === year && !yearOnly ? year + (+d[2] - 0.5) / 12 : year + fallback;
  }

  // --- interface text ---------------------------------------------------------------

  // Pass a partial object as the third argument to translate it.
  const fmtShare = v => { const pm = v * 1e6; return pm >= 10 ? Math.round(pm).toLocaleString('en-US') : pm.toFixed(pm >= 1 ? 1 : 2); };
  const LABELS_EN = {
    kinds: { origin: 'earliest found' },
    msg: s => s,
    papers: n => `${n} papers`,
    yearPapers: (y, n) => `${y}: ${n} papers`,
    timelineOf: term => `Timeline of ${term}`,
    inSample: 'Linked paper uses the term itself.',
    resolved: title => `Named in the quotes; matched to “${title}” in OpenAlex. Check the match.`,
    unresolved: 'Named in the quotes but not found in OpenAlex, so there is no link.',
    titleOf: 'Title of ',
    legendDashed: 'dashed = no link found',
    legendBars: 'bars = papers per year',
    legendBarsQ: 'bars = papers per year; recent years by quarter',
    legendShare: 'bars = papers per million in all of OpenAlex that year',
    legendLog: 'log scale',
    legendPartial: 'hatched = period not over yet',
    noTotal: ys => `no full-year OpenAlex total for ${ys} yet, so no bar`,
    follows: 'This timeline follows:',
    otherSenses: n => `The same words also mean ${n === 1 ? 'one unrelated thing' : n + ' unrelated things'} in these papers. Left out of eras and milestones; the bars still count them.`,
    otherSensesShow: 'Show the other meanings',
    quotesN: n => `${n} quote${n === 1 ? '' : 's'}`,
    wrongSense: '',
    quarterPapers: (y, q, n) => `${y} Q${q}: ${n} papers`,
    undated: n => `${n} dated only by year, not in any quarter`,
    yLabel: 'Bars', yPapers: 'Papers', yShare: 'Share of all papers',
    scaleLabel: 'Scale', scaleLinear: 'Linear', scaleLog: 'Log',
    shareOf: (y, v) => `${y}: ${fmtShare(v)} per million papers in OpenAlex`,
    perMillion: v => `${fmtShare(v)} per million`,
    partial: d => `not over yet (data as of ${d})`,
    burst: 'burst', takeoff: y => `takeoff ${y}`,
    takeoffTip: 'Takeoff: the year the curve leaves its slow start (Ke et al. 2015). Burst: years of unusually high use (Kleinberg 2002). Both are computed from the counts.',
    headline: h => `First seen ${h.first}` + (h.ta ? ` · took off ${h.ta}` : '') + ` · ${h.peak.toLocaleString('en-US')} papers in ${h.peakYear}` + (h.partialPeak ? ' (so far)' : ''),
    notesN: n => `${n} note${n === 1 ? '' : 's'} on the data`,
    milestonesN: n => `All ${n} milestones`,
    laneBySense: 'ticks = quoted sentences, coloured by meaning',
    laneByField: 'ticks = quoted sentences, coloured by the paper’s field',
    fieldUnknown: 'field unknown', otherFields: 'other fields', unclear: 'meaning unclear', otherMeanings: 'other meanings',
    mixTitle: 'Meanings in this era',
    moved: v => `meaning moved ${v} since the previous era (0 = same mix, 1 = no overlap)`,
    newSense: l => `new: ${l}`, fadedSense: l => `faded: ${l}`,
    fewQuotes: n => `${n} tagged quote${n === 1 ? '' : 's'}: too few to compare`,
    fewPrevQuotes: n => `previous era has only ${n} tagged quote${n === 1 ? '' : 's'}: too few to compare`,
    mixNote: 'Meaning mixes count quoted sentences (titles and abstracts only); the labels come from the model and can be wrong.',
    words: 'Common words', newWords: 'new', simLatest: v => `similarity to the latest era: ${v}`,
    provCounted: 'Counted from OpenAlex; no model.',
    provModel: (model, n, date) => `Labelled by ${model} from ${n} quote${n === 1 ? '' : 's'} (${date}).`,
    earliestCaveat: 'Earliest paper found in OpenAlex (titles and abstracts only). Preprints, blogs and talks often come earlier.',
    earlierUse: 'Know an earlier use?',
    entityNote: (label, kind, date) => `${label} is ${kind === 'organization' ? 'an organization' : 'software'}, started ${date}: this timeline shows how papers write about it, not where an idea came from.`,
    hiddenNamed: (n, y, label, date) => `Left out: ${n.toLocaleString('en-US')} paper${n === 1 ? '' : 's'} dated before ${y}, well before ${label} existed (${date}); the dates are wrong, or the words mean something else.`,
    hiddenAsked: (n, y) => `Showing papers from ${y} on; ${n.toLocaleString('en-US')} earlier paper${n === 1 ? ' is' : 's are'} left out.`,
    olderUse: (n, label, date) => `${n.toLocaleString('en-US')} papers used these words before ${label} existed (${date}), in another sense; they are included.`,
    showAll: 'Show all years',
    onlySince: y => `Show only papers from ${y} on`,
    misdated: n => `Left out: ${n} early paper${n === 1 ? '' : 's'} with a wrong date (${n === 1 ? 'it cites or is copyrighted' : 'they cite or are copyrighted'} years later).`,
    misdatedEg: (y, c, why) => (why === 'copyright' ? `E.g. dated ${y}, but its text says © ${c}:` : `E.g. dated ${y}, cites a ${c} paper:`),
    checkExact: 'a quote has the exact phrase', checkSense: 'uses it in this meaning', checkCoin: 'presents the name as new',
    shiftOf: s => `kind of change: ${({ broadening: 'broader', narrowing: 'narrower', metaphor: 'metaphor', 'new field': 'new field' })[s] || s}`,
    checksNote: 'n/m = a separate AI check of 7 ready-made timelines agreed with that label type n of m times (not a check of this page)',
    checked: (ok, n) => `A separate AI check of the ready-made timelines agreed with this label ${ok} times out of ${n}.`,
    rootsTitle: 'Roots: what the papers using the term cite',
    rootsNote: (p, r) => `From the references of ${p} sampled papers that use the term (${r} cited works looked up). Peaks are publication years cited far more than their neighbours (reference publication year spectroscopy, Marx et al. 2014); each shows its most-cited work.`,
    rootsCites: n => `cited by ${n} of these papers`,
    rootsBtn: n => `Find roots (about ${n} OpenAlex requests)`,
  };

  // Notes under the headline (HTML, escaped here): the name the term stands for, records
  // left out, and a link to the narrower search when the words had an older meaning.
  function scopeNotes(D, L) {
    const out = [], e = D.entity, h = D.hiddenBefore, o = D.olderUse, bad = D.misdated || [];
    const link = (u, t) => (safeUrl(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>` : esc(t));
    if (e) out.push(esc(L.entityNote(e.label, e.kind, e.date)) + ' ' + link(e.url, 'Wikidata'));
    // Links rerun the search on the site (this page itself when it is the app).
    const app = global.document && global.document.getElementById && global.document.getElementById('trace-form');
    const base = app && global.location && /^https?:$/.test(global.location.protocol) ? global.location.origin + global.location.pathname : SITE;
    const rerun = since => `${base}?term=${encodeURIComponent(D.term)}` + ((D.aliases || []).length ? '&alias=' + encodeURIComponent(D.aliases.join(', ')) : '') +
      (D.meaning ? '&meaning=' + encodeURIComponent(D.meaning) : '') + `&since=${since}`;
    if (h) {
      out.push(esc(h.named && e ? L.hiddenNamed(h.n, h.year, e.label, e.date) : L.hiddenAsked(h.n, h.year)) + ` <a href="${esc(rerun('all'))}">${esc(L.showAll)}</a>`);
    }
    if (o && e) out.push(esc(L.olderUse(o.n, e.label, e.date)) + ` <a href="${esc(rerun(o.year))}">${esc(L.onlySince(o.year))}</a>`);
    if (bad.length) {
      const w = bad[0];
      out.push(esc(L.misdated(bad.length)) + ' ' + esc(L.misdatedEg(w.year, w.cites, w.why)) + ' ' + link(w.url, w.title));
    }
    return out;
  }

  // --- renderer ---------------------------------------------------------------------

  function renderTimeline(D, root, labels) {
    root = root || document;
    const L = Object.assign({}, LABELS_EN, labels || {});
    const css = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
    const el = (tag, attrs = {}, parent) => {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    };
    const kindName = k => (L.kinds && L.kinds[k]) || k;
    const part = name => root.querySelector(`[data-part="${name}"]`);
    const chart = part('chart'), detail = part('detail');
    chart.textContent = '';
    const KIND_OK = k => (KINDS.includes(k) ? k : 'origin');
    const phrases = [D.term, ...(D.aliases || [])].filter(p => p && p.trim());
    const termSrc = '(' + phrases.map(p => p.split(/[\s-]+/).filter(Boolean).map(reEsc).join('[\\s-]+')).join('|') + ')';
    const termRe = new RegExp(termSrc, 'igu'), termTest = new RegExp(termSrc, 'iu');
    const termWords = new Set(phrases.flatMap(p => p.toLowerCase().split(/[\s-]+/)).flatMap(w => [w, w + 's', w.replace(/s$/, '')]));
    // Split the raw text first, then escape each piece, so entities are never cut.
    const mark = s => String(s ?? '').split(termRe).map((p, i) => (i % 2 ? `<mark>${esc(p)}</mark>` : esc(p))).join('');
    const quotes = Array.isArray(D.quotes) ? D.quotes : [];
    const senses = Array.isArray(D.senses) ? D.senses : [];
    const related = new Set(senses.filter(s => s.related).map(s => s.key));
    const sensesOn = senses.length > 0 && quotes.some(q => q.sense);
    const totals = new Map(D.totals || []);
    // Totals fetched in an earlier year than this data: their last year was not over yet,
    // so its share would be too high. Leave those years out of the share view.
    const asofY = /^\d{4}/.test(D.totalsAsOf || '') ? +D.totalsAsOf.slice(0, 4) : 0;
    if (asofY && /^\d{4}/.test(D.generated || '') && +D.generated.slice(0, 4) > asofY) for (const y of [...totals.keys()]) if (y >= asofY) totals.delete(y);
    const missingTot = totals.size ? D.counts.filter(([y, c]) => c > 0 && !totals.get(y)).map(([y]) => y) : [];
    const genDate = /^\d{4}-\d{2}-\d{2}$/.test(D.generated || '') ? D.generated : null;
    const prov = n => (D.model ? L.provModel(D.model, n, D.generated || '') : L.provCounted);

    // View state: bar height (papers or share) and scale (auto, linear, log), kept in the URL.
    const params = new URLSearchParams(global.location ? global.location.search : '');
    const view = { y: params.get('y') === 'share' && totals.size ? 'share' : 'papers', scale: ['linear', 'log'].includes(params.get('scale')) ? params.get('scale') : 'auto' };
    let msLaid = [], selected = -1, logOn = false;

    // Colour of a quote tick: by meaning when the model tagged quotes, else by field.
    const colorKey = (() => {
      if (sensesOn) {
        const map = new Map();
        senses.filter(s => s.related).forEach((s, i) => map.set(s.key, PALETTE[i % PALETTE.length]));
        const items = senses.filter(s => s.related && quotes.some(q => q.sense === s.key)).map(s => [s.label, map.get(s.key)]);
        if (quotes.some(q => q.sense && q.sense !== 'unclear' && !related.has(q.sense))) items.push([L.otherMeanings, OTHER]);
        if (quotes.some(q => !q.sense || q.sense === 'unclear')) items.push([L.unclear, GREY]);
        return { of: q => (related.has(q.sense) ? map.get(q.sense) : q.sense && q.sense !== 'unclear' ? OTHER : GREY), items, title: L.laneBySense };
      }
      const byField = new Map();
      for (const q of quotes) if (q.field) byField.set(q.field, (byField.get(q.field) || 0) + 1);
      const top = [...byField].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([f]) => f);
      const map = new Map(top.map((f, i) => [f, PALETTE[i]]));
      const items = top.map(f => [f, map.get(f)]);
      if (quotes.some(q => q.field && !map.has(q.field))) items.push([L.otherFields, OTHER]);
      if (quotes.some(q => !q.field)) items.push([L.fieldUnknown, GREY]);
      return { of: q => (!q.field ? GREY : map.get(q.field) || OTHER), items, title: L.laneByField };
    })();

    function build() {
      chart.textContent = '';
      const counts = new Map(D.counts);
      const years = [...counts.keys(), ...D.milestones.map(m => m.year), ...D.eras.flatMap(e => [e.start, e.end])].filter(Boolean);
      if (!years.length) return;
      const nowYear = Math.max(...years), minYear = Math.max(Math.min(...years), nowYear - 600);
      const avail = Math.max(320, chart.parentElement.clientWidth || 900);
      const compact = avail < 600;  // phones: numbered dots, cards listed below
      const left = 26, labelRoom = compact ? 40 : 150, width = Math.max(compact ? 340 : 600, avail);
      const share = view.y === 'share';
      // Slots along the axis: one per year, or one per quarter for the years that
      // data.quarters covers (young terms; not in the share view, which is yearly).
      const qByYear = new Map();
      if (!share) for (const [k, c] of D.quarters || []) {
        const m = /^(\d{4})-Q([1-4])$/.exec(k);
        if (m) (qByYear.get(+m[1]) || qByYear.set(+m[1], []).get(+m[1])).push([+m[2], c]);
      }
      const msT = D.milestones.map(m => timeOf(m.year, m.date, 0.02));
      const slots = [];
      for (let y = minYear; y <= nowYear; y++) {
        const qs = qByYear.get(y);
        if (qs) qs.sort((p, q) => p[0] - q[0]).forEach(([q, c]) => slots.push({ y, q, t0: y + (q - 1) / 4, t1: y + q / 4, c }));
        else slots.push({ y, q: 0, t0: y, t1: y + 1, c: counts.get(y) || 0 });
      }
      // Bar value: papers, or papers per all OpenAlex works that year.
      // Years with papers but no shipped total (newer than the snapshot) get no bar; the legend says so.
      for (const s of slots) s.v = share ? (totals.get(s.y) ? s.c / totals.get(s.y) : 0) : s.c;
      // The period the data was fetched in is not over yet.
      if (genDate) {
        const gy = +genDate.slice(0, 4), gq = Math.ceil(+genDate.slice(5, 7) / 3);
        for (const s of slots) s.partial = s.y === gy && (!s.q || s.q === gq);
      }
      // Each slot gets width by how much happens in it: milestone slots and busy slots
      // are wide, quiet ones thin. A century of rare use stays a short strip.
      const peakC = Math.max(1, ...slots.map(s => s.c));
      const hasMs = s => msT.some(t => t >= s.t0 && t < s.t1);
      const raw = s => (hasMs(s) ? (compact ? 18 : 30) : 0) + 34 * Math.sqrt(s.c / peakC) + (s.q ? 12 : s.c / peakC > 0.002 ? 6 : 2);
      const total = slots.reduce((a, s) => a + raw(s), 0);
      const scale = Math.max(0.4, Math.min(2.2, (width - left - labelRoom) / total));
      let acc = left;
      for (const s of slots) { s.x0 = acc; acc += raw(s) * scale; s.x1 = acc; s.xc = (s.x0 + s.x1) / 2; }
      const X = t => {
        const s = slots.find(s => t >= s.t0 && t < s.t1) || (t < slots[0].t0 ? slots[0] : slots[slots.length - 1]);
        const f = Math.max(0, Math.min(1, (t - s.t0) / (s.t1 - s.t0)));
        return s.x0 + f * (s.x1 - s.x0);
      };
      const fine = slots.some(s => s.q);

      // Lay out milestone labels in lanes so they do not overlap. Phones show numbers.
      const lanes = [], laneH = compact ? 26 : 36, axisPad = 26;
      msLaid = D.milestones.map((m, i) => {
        const label = compact ? String(i + 1) : m.title.length > 34 ? m.title.slice(0, 33) + '…' : m.title;
        const text = compact ? label : `${m.year} · ${label}`;
        const w = [...text].reduce((s, c) => s + (/[A-Z]/.test(c) ? 8 : 6.3), 0) + 22, x = X(msT[i]);
        // A label that would run past the right edge goes on the left of its dot, so the
        // chart fits the card instead of scrolling for one label.
        const flip = !compact && x + w + 24 > width && x - w > left;
        let lane = 0;
        while ((lanes[lane] ?? -1e9) > (flip ? x - w : x) - 6) lane++;
        lanes[lane] = flip ? x + 10 : x + w;
        return { ...m, kind: KIND_OK(m.kind), i, label, text, x, lane, flip };
      });
      const nLanes = Math.max(1, lanes.length);
      const W = Math.max(width, ...lanes.map(r => r + 24), acc + 20);
      const eraH = D.eras.length ? 44 : 0, top = eraH + 10;
      const axisY = top + nLanes * laneH + axisPad, barH = 70;
      const tickY = axisY + barH + 26, laneY = tickY + (fine ? 26 : 12), hasLane = quotes.length > 0;
      const H = laneY + (hasLane ? 22 : 0) + 8;
      const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': L.timelineOf(D.term) });
      const defs = el('defs', {}, svg);
      const pat = el('pattern', { id: 'idl-hatch', width: 5, height: 5, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
      el('rect', { width: 5, height: 5, fill: css('bar'), opacity: 0.35 }, pat);
      el('line', { x1: 0, y1: 0, x2: 0, y2: 5, stroke: css('bar'), 'stroke-width': 2.5 }, pat);

      // Era bands; labels alternate between two rows and are cut to fit.
      D.eras.forEach((e, k) => {
        const xa = X(e.start), xb = X(e.end + 1 - 1e-6), row = k % 2;
        el('rect', { x: xa, y: row * 16, width: Math.max(4, xb - xa), height: axisY - row * 16, fill: css(k % 2 ? 'era2' : 'era1'), rx: 6 }, svg);
        const next = D.eras[k + 2], room = (next ? X(next.start) : W) - xa - 12;
        const maxChars = Math.max(compact ? 4 : 8, Math.floor(room / 6.6));
        const label = e.label.length > maxChars ? e.label.slice(0, maxChars - 1) + '…' : e.label;
        const t = el('text', { x: xa + 8, y: 15 + row * 16, 'font-weight': 600, 'font-size': 11 }, svg);
        t.textContent = label;
        el('title', {}, t).textContent = `${e.start}–${e.end}: ${e.label}`;
      });

      // Takeoff and bursts, computed from the yearly counts (shares when totals exist).
      const ta = (D.counts || []).length ? mainRun(D.counts).ta : null, bs = bursts(D.counts, D.totals);
      for (const [a, b] of bs) {
        const xa = X(a), xb = X(b + 1 - 1e-6);
        const r = el('rect', { x: xa, y: axisY + 2, width: Math.max(3, xb - xa), height: barH + 8, fill: css('critique'), opacity: 0.08, rx: 3 }, svg);
        el('title', {}, r).textContent = `${L.burst} ${a === b ? a : a + '–' + b}. ${L.takeoffTip}`;
      }

      // Bars hang below the axis. Linear or log height; log by default when the
      // values span more than 50x, so the early years are not flattened to nothing.
      const vals = slots.map(s => s.v).filter(v => v > 0);
      const vmax = Math.max(...vals, 1e-12), vmin = Math.min(...vals, vmax);
      logOn = view.scale === 'log' || (view.scale === 'auto' && vmax / vmin > 50);
      const lmin = Math.log(vmin) - 0.4, lmax = Math.log(vmax);
      const hOf = v => (v <= 0 ? 0 : Math.max(1.5, logOn ? ((Math.log(v) - lmin) / (lmax - lmin || 1)) * barH : (v / vmax) * barH));
      for (const s of slots) {
        if (!s.v) continue;
        const wd = s.x1 - s.x0;
        const r = el('rect', { x: s.xc - wd * 0.34, y: axisY + 6, width: Math.max(1.5, wd * 0.68), height: hOf(s.v), fill: s.partial ? 'url(#idl-hatch)' : css('bar'), rx: 2 }, svg);
        let tip = share ? L.shareOf(s.y, s.v) : s.q ? L.quarterPapers(s.y, s.q, s.c) : L.yearPapers(s.y, s.c);
        if (s.partial) tip += ' · ' + L.partial(genDate);
        el('title', {}, r).textContent = tip;
      }
      el('line', { x1: left - 10, x2: W - 20, y1: axisY, y2: axisY, stroke: css('line'), 'stroke-width': 2 }, svg);
      if (ta) {
        // At the start of the takeoff year, in the gap between bars, and through the whole
        // chart so it reads as "everything right of this line came after takeoff".
        const x = X(ta);
        el('line', { x1: x, x2: x, y1: Math.max(0, top - 6), y2: axisY + barH + 6, stroke: css('popularized'), 'stroke-width': 1.5, 'stroke-dasharray': '4 3', opacity: 0.9 }, svg);
        el('path', { d: `M${x - 5},${axisY - 1} L${x + 5},${axisY - 1} L${x},${axisY - 9} Z`, fill: css('popularized') }, svg);
        const t = el('text', { x: x + 4, y: axisY + barH + 12, class: 'muted', 'font-size': 10 }, svg);
        t.textContent = L.takeoff(ta);
        el('title', {}, t).textContent = L.takeoffTip;
      }
      // Quarter years: Q labels per slot, the year centred underneath.
      for (const [y] of qByYear) {
        const qs = slots.filter(s => s.y === y && s.q);
        if (!qs.length) continue;
        qs.forEach(s => { if (s.x1 - s.x0 >= 16) el('text', { x: s.xc, y: tickY, 'text-anchor': 'middle', class: 'muted', 'font-size': 10.5 }, svg).textContent = 'Q' + s.q; });
        const yl = el('text', { x: (qs[0].x0 + qs[qs.length - 1].x1) / 2, y: tickY + 16, 'text-anchor': 'middle', class: 'muted', 'font-weight': 600 }, svg);
        yl.textContent = y;
        const und = new Map(D.undated || []).get(y);
        el('title', {}, yl).textContent = L.yearPapers(y, counts.get(y) || 0) + (und ? ' · ' + L.undated(und) : '');
      }
      // Year labels: never closer than 36px; the newest year always gets one.
      const yearSlots = slots.filter(s => !s.q && (s.c || D.milestones.some(m => m.year === s.y)));
      let last = qByYear.size ? Math.min(...slots.filter(s => s.q).map(s => s.x0)) + 18 : 1e9;
      yearSlots.sort((a, b) => b.y - a.y).forEach(s => {
        if (last - s.xc < 36) return;
        el('text', { x: s.xc, y: tickY, 'text-anchor': 'middle', class: 'muted' }, svg).textContent = s.y;
        last = s.xc;
      });
      const peak = slots.reduce((a, s) => (s.v > (a ? a.v : 0) ? s : a), null);
      if (peak) {
        const t = el('text', { x: peak.xc + (peak.x1 - peak.x0) * 0.4, y: axisY + 20, class: 'muted', 'font-size': 10.5 }, svg);
        t.textContent = share ? L.perMillion(peak.v) : L.papers(peak.c);
      }

      // Evidence lane: one tick per quoted sentence, at its month when known.
      if (hasLane) {
        for (const q of quotes) {
          if (!q.year) continue;
          const x = X(timeOf(q.year, q.date, 0.5));
          const g = el('g', { class: 'qtick' }, svg);
          el('rect', { x: x - 1, y: laneY, width: 2, height: 12, fill: colorKey.of(q), rx: 1 }, g);
          el('rect', { x: x - 3, y: laneY - 2, width: 6, height: 16, fill: 'transparent' }, g);
          const txt = String(q.text || '');
          el('title', {}, g).textContent = `${q.year} · ${q.title}: ${txt.length > 220 ? txt.slice(0, 219) + '…' : txt}`;
          const u = safeUrl(q.url);
          if (u) { g.style.cursor = 'pointer'; g.addEventListener('click', () => global.open(u, '_blank', 'noopener')); }
        }
      }

      msLaid.forEach(m => {
        const y = axisY - axisPad - m.lane * laneH;
        const g = el('g', { class: 'ms', tabindex: 0, role: 'button', 'aria-label': `${m.year} ${kindName(m.kind)}: ${m.title}` }, svg);
        const hitW = m.text.length * 6.3 + (compact ? 24 : 70);
        el('rect', { x: m.flip ? m.x + 10 - hitW : m.x - 10, y: y - 12, width: hitW, height: 24, fill: 'transparent' }, g);
        el('line', { x1: m.x, x2: m.x, y1: y, y2: axisY, stroke: css(m.kind), 'stroke-width': 1.5, 'stroke-dasharray': m.link === 'unresolved' ? '3 3' : '' }, g);
        el('circle', { cx: m.x, cy: y, r: 7, fill: css(m.kind) }, g);
        const t = el('text', m.flip ? { x: m.x - 11, y: y + 4, 'text-anchor': 'end' } : { x: m.x + 11, y: y + 4 }, g);
        t.textContent = m.text;
        g.addEventListener('click', () => select(m.i, true));
        g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(m.i, true); } });
        m.g = g;
      });
      chart.appendChild(svg);
      renderList(compact);
      renderLegend();
      if (selected >= 0) msLaid.forEach(x => x.g && x.g.classList.toggle('sel', x.i === selected));
    }

    // Stable deep-link slug per milestone: #m-2025-coined (-2, -3 for repeats).
    const slugs = (() => {
      const seen = new Map();
      return D.milestones.map(m => {
        const base = `m-${m.year}-${String(m.kind).replace(/\s+/g, '-')}`, n = (seen.get(base) || 0) + 1;
        seen.set(base, n);
        return n > 1 ? `${base}-${n}` : base;
      });
    })();

    function select(i, fromUser) {
      const m = D.milestones[i];
      if (!m || !detail) return;
      selected = i;
      const kind = KIND_OK(m.kind);
      msLaid.forEach(x => x.g && x.g.classList.toggle('sel', x.i === i));
      root.querySelectorAll('.mslist button').forEach((b, k) => b.classList.toggle('sel', k === i));
      if (fromUser && global.history && global.location) {
        try { global.history.replaceState(null, '', global.location.pathname + global.location.search + '#' + slugs[i]); } catch (e) { /* file:// pages */ }
      }
      const url = safeUrl(m.url);
      const title = url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(m.title)}</a>` : esc(m.title);
      const status = {
        'in-sample': esc(L.inSample),
        'resolved': esc(L.resolved(m.workTitle || '')),
        'unresolved': esc(L.unresolved),
      }[m.link] || '';
      const quotesHtml = (m.evidence || []).map(e => {
        const eu = safeUrl(e.url);
        const src = eu ? `<a href="${esc(eu)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a>` : esc(e.title);
        return `<blockquote>${mark(e.text)}<cite>${e.fromTitle ? esc(L.titleOf) : ''}${src} · ${esc(e.authors)}, ${esc(e.year)}</cite></blockquote>`;
      }).join('');
      // Checkable claims for naming and earliest-use milestones; change type otherwise.
      let checks = '';
      if (kind === 'coined' || kind === 'origin') {
        const tick = v => (v === true ? '✓' : v === false ? '✗' : '?');
        const c = m.checks || {};
        const exact = (m.evidence || []).some(e => termTest.test(e.text || ''));
        const items = [[exact, L.checkExact]];
        if (c.inSense != null) items.push([c.inSense, L.checkSense]);
        if (c.coinage != null) items.push([c.coinage, L.checkCoin]);
        checks = `<ul class="checks">${items.map(([v, t]) => `<li class="${v === true ? 'ok' : v === false ? 'no' : ''}">${tick(v)} ${esc(t)}</li>`).join('')}</ul>`;
      } else if (m.shift) {
        checks = `<p class="shift">${esc(L.shiftOf(m.shift))}</p>`;
      }
      const caveat = kind === 'origin'
        ? `<p class="caveat">${esc(L.earliestCaveat)} <a href="${esc(ISSUES)}?template=feedback.yml&title=${encodeURIComponent('Earlier use of "' + D.term + '"')}&term=${encodeURIComponent(D.term)}" target="_blank" rel="noopener noreferrer">${esc(L.earlierUse)}</a></p>` : '';
      detail.innerHTML = `<div class="kind" style="color:var(--${kind})">${esc(m.year)} · ${esc(kindName(kind))}</div><h2>${title}</h2>` +
        `<p class="why">${esc(L.msg(m.why))}</p>${checks}${caveat}${quotesHtml}<div class="status">${status}</div><div class="prov">${esc(prov((m.evidence || []).length))}</div>`;
    }

    // Phones: the chart shows numbers; the milestones are listed under it.
    function renderList(compact) {
      const card = chart.closest('.card');
      if (!card) return;
      let fold = card.querySelector('.msfold');
      if (!compact) { if (fold) fold.remove(); return; }
      if (!fold) {
        fold = document.createElement('details');
        fold.className = 'msfold';
        fold.innerHTML = `<summary>${esc(L.milestonesN(D.milestones.length))}</summary><ol class="mslist"></ol>`;
        const key = card.querySelector('.chart-key');
        card.insertBefore(fold, key || null);
      }
      const list = fold.querySelector('.mslist');
      list.innerHTML = D.milestones.map((m, i) => `<li><button type="button"${i === selected ? ' class="sel"' : ''}><b>${i + 1}</b> ${esc(m.year)} · ${esc(kindName(KIND_OK(m.kind)))} · ${esc(m.title)}</button></li>`).join('');
      list.querySelectorAll('button').forEach((b, i) => b.addEventListener('click', () => { select(i, true); if (detail.scrollIntoView) detail.scrollIntoView({ block: 'nearest' }); }));
    }

    // View controls (bar height and scale) above the chart.
    function renderBar() {
      const scroller = chart.closest('.scroller') || chart;
      const host = scroller.parentElement;
      if (!host) return;
      let bar = host.querySelector(':scope > .tlbar');
      if (!bar) { bar = document.createElement('div'); bar.className = 'tlbar'; host.insertBefore(bar, scroller); }
      const seg = (label, key, opts) => `<span class="tlseg" role="group" aria-label="${esc(label)}">${opts.map(([v, t, on]) =>
        `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${on}">${esc(t)}</button>`).join('')}</span>`;
      bar.innerHTML = (totals.size ? seg(L.yLabel, 'y', [['papers', L.yPapers, view.y === 'papers'], ['share', L.yShare, view.y === 'share']]) : '') +
        seg(L.scaleLabel, 'scale', [['linear', L.scaleLinear, !logOn], ['log', L.scaleLog, logOn]]);
      bar.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        view[b.dataset.k] = b.dataset.v;
        if (global.history && global.location) {
          const u = new URL(global.location.href);
          u.searchParams.set('y', view.y); u.searchParams.set('scale', view.scale);
          try { global.history.replaceState(null, '', u); } catch (e) { /* file:// pages */ }
        }
        build();
        renderBar();
      }));
    }

    function renderLegend() {
      const legend = part('legend');
      if (!legend) return;
      const bars = view.y === 'share' ? L.legendShare : (D.quarters || []).length ? L.legendBarsQ : L.legendBars;
      legend.innerHTML = KINDS.filter(k => D.milestones.some(m => m.kind === k)).map(k => {
        const c = (D.kindChecks || L.checks || {})[k];
        return `<span${c ? ` title="${esc(L.checked(c[0], c[1]))}"` : ''}><i style="background:var(--${k})"></i>${esc(kindName(k))}${c ? ` <small>${esc(c[0] + '/' + c[1])}</small>` : ''}</span>`;
      }).join('') +
        (KINDS.some(k => D.milestones.some(m => m.kind === k) && (D.kindChecks || L.checks || {})[k]) ? `<span>${esc(L.checksNote)}</span>` : '') +
        `<span>${esc(L.legendDashed)}</span><span>${esc(bars + (logOn ? ' · ' + L.legendLog : ''))}</span>` +
        (genDate && D.counts.some(([y]) => y === +genDate.slice(0, 4)) ? `<span>${esc(L.legendPartial)}</span>` : '') +
        (view.y === 'share' && missingTot.length ? `<span>${esc(L.noTotal(missingTot.join(', ')))}</span>` : '') +
        (quotes.length ? `<div class="lanekey"><span>${esc(colorKey.title)}:</span>${colorKey.items.map(([t, c]) => `<span><i style="background:${c}"></i>${esc(t)}</span>`).join('')}</div>` : '');
    }

    // Headline: a data-only sentence about the curve (no model needed).
    const headline = part('headline');
    if (headline) {
      const cs = D.counts || [];
      if (cs.length && (D.total || cs.reduce((a, [, c]) => a + c, 0)) >= 20) {
        const { first, main, ta } = mainRun(cs);
        const pk = main.reduce((a, b) => (b[1] > a[1] ? b : a));
        const before = ta ? Math.max(...main.filter(([y]) => y < ta).map(([, c]) => c), 0) + 1 : 0;
        headline.textContent = L.headline({ first, ta, before, peak: pk[1], peakYear: pk[0], partialPeak: genDate && +genDate.slice(0, 4) === pk[0] });
      } else headline.textContent = '';
      // Names and left-out records: say what the counts leave out, and why.
      const notes = scopeNotes(D, L);
      // Folded under the headline: they matter for trust, but most readers skip them.
      const old = headline.nextElementSibling;
      if (old && old.classList.contains('dnotes')) old.remove();
      if (notes.length) headline.insertAdjacentHTML('afterend', `<details class="dnotes"><summary>${esc(L.notesN(notes.length))}</summary>${notes.map(n => `<p class="dnote">${n}</p>`).join('')}</details>`);
    }

    renderBar();
    build();
    renderBar();  // the scale buttons show the scale build() chose

    // Which meaning the timeline follows, and the unrelated meanings left out.
    const sensesEl = part('senses');
    if (sensesEl) {
      const other = D.otherSenses || [];
      sensesEl.innerHTML = D.focus && other.length
        ? `<p><b>${esc(L.follows)}</b> ${esc(D.focus)}</p><p>${esc(L.otherSenses(other.length))}</p>` +
          `<details><summary>${esc(L.otherSensesShow)}</summary><ul>${other.map(s => {
            const q = (s.evidence || [])[0];
            return `<li><b>${esc(s.label)}</b> · ${esc(s.meaning)} <span class="muted">(${esc(L.quotesN((s.evidence || []).length))})</span>` +
              (q ? `<q>${mark(q.text)} — ${esc(q.title)}, ${esc(q.year)}</q>` : '') + '</li>';
          }).join('')}</ul>${L.wrongSense && document.getElementById('meaning') ? `<p class="muted">${esc(L.wrongSense)}</p>` : ''}</details>`
        : '';
    }

    // Era cards: meaning, the mix of meanings among its quotes, and its common words.
    const eras = part('eras');
    if (eras) {
      const inFocus = q => !sensesOn || !q.sense || q.sense === 'unclear' || related.has(q.sense);
      // Older data has no full quote list: fall back to each era's own quotes.
      const eraQuotes = D.eras.map(e => (quotes.length ? quotes.filter(q => q.year >= e.start && q.year <= e.end) : e.evidence || []));
      const mixes = eraQuotes.map(qs => {
        const m = {};
        for (const q of qs) if (related.has(q.sense)) m[q.sense] = (m[q.sense] || 0) + 1;
        return m;
      });
      const words = eraQuotes.map(qs => wordCounts(qs.filter(inFocus).map(q => q.text), termWords));
      const latest = words[words.length - 1];
      const senseColor = new Map(senses.filter(s => s.related).map((s, i) => [s.key, PALETTE[i % PALETTE.length]]));
      const senseLabel = new Map(senses.map(s => [s.key, s.label]));
      eras.innerHTML = D.eras.map((e, k) => {
        let mixHtml = '';
        if (sensesOn) {
          const mix = mixes[k], n = Object.values(mix).reduce((a, b) => a + b, 0);
          if (n) {
            mixHtml = `<div class="mix" title="${esc(L.mixTitle)}">${Object.entries(mix).sort((a, b) => b[1] - a[1]).map(([key, c]) =>
              `<span style="width:${(100 * c) / n}%;background:${senseColor.get(key) || OTHER}" title="${esc(senseLabel.get(key) || key)}: ${c}"></span>`).join('')}</div>`;
          }
          if (k > 0) {
            const pn = Object.values(mixes[k - 1]).reduce((a, b) => a + b, 0);
            if (n < 8 || pn < 8) mixHtml += `<p class="muted small">${esc(n < 8 ? L.fewQuotes(n) : L.fewPrevQuotes(pn))}</p>`;
            else {
              const d = jsDistance(mixes[k - 1], mix), ch = senseChange(mixes[k - 1], mix);
              mixHtml += `<p class="muted small">${esc(L.moved(d.toFixed(2)))}</p>` +
                [...ch.gained.map(g => `<span class="badge new">${esc(L.newSense(senseLabel.get(g) || g))}</span>`),
                  ...ch.lost.map(g => `<span class="badge faded">${esc(L.fadedSense(senseLabel.get(g) || g))}</span>`)].join('');
            }
          }
        }
        const w = words[k], prev = k > 0 ? words[k - 1] : null;
        const topWords = [...w].filter(([, c]) => c >= 2).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([t]) => t);
        const fresh = prev ? topWords.filter(t => !prev.has(t)) : [];
        const nq = eraQuotes[k].filter(inFocus).length;
        const sim = k < D.eras.length - 1 && latest && latest.size ? cosine(w, latest) : null;
        const wordsHtml = topWords.length ? `<p class="words${nq < 5 ? ' thin' : ''}"><span class="muted">${esc(L.words)}:</span> ${topWords.map(t => (fresh.includes(t) ? `<strong class="nw" title="${esc(L.newWords)}">${esc(t)}</strong>` : esc(t))).join(', ')}` +
          (sim != null ? ` <span class="muted">· ${esc(L.simLatest(sim.toFixed(2)))}</span>` : '') + '</p>' : '';
        return `<div class="era"><b>${esc(e.start)}–${esc(e.end)}</b><h3>${esc(e.label)}</h3><p>${esc(e.meaning)}</p>${mixHtml}${wordsHtml}<div class="prov">${esc(prov((e.evidence || []).length))}</div></div>`;
      }).join('') + (sensesOn && D.eras.length ? `<p class="mixnote muted">${esc(L.mixNote)}</p>` : '');
    }

    // Roots: cited works by publication year, peaks marked, with their top work.
    const rootsEl = part('roots');
    if (rootsEl) {
