ah", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E21", "text": "Vibe Coding и искусственный интеллект: инструменты цифровой методической деятельности педагога", "title": "Vibe Coding и искусственный интеллект: инструменты цифровой методической деятельности педагога", "year": 2025, "date": "2025-01-01", "url": "https://openalex.org/W7119263641", "authors": "А. П. Байжанова et al.", "fromTitle": true, "field": "Social Sciences", "inSet": 0, "sense": "S1"}, {"id": "E22", "text": "ИНЖЕНЕРНЫЙ ПОДХОД К ИИ: ИСПОЛЬЗОВАНИЕ SPEC DRIVEN DEVELOPMENT ДЛЯ ВАЛИДАЦИИ VIBE CODING", "title": "ИНЖЕНЕРНЫЙ ПОДХОД К ИИ: ИСПОЛЬЗОВАНИЕ SPEC DRIVEN DEVELOPMENT ДЛЯ ВАЛИДАЦИИ VIBE CODING", "year": 2025, "date": "2025-01-01", "url": "https://openalex.org/W7123372587", "authors": "Елманов И. В.", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E23", "text": "Tools such as Cursor and Claude Code have popularized \"vibe coding\" (where developers steer development through high-level intent), commonly relying on context engineering and Retrieval-Augmented Generation (RAG) to ground generation in a codebase.", "title": "Code Digital Twin: A Knowledge Infrastructure for AI-Assisted Complex Software Development", "year": 2025, "date": "2025-03-11", "url": "https://doi.org/10.48550/arxiv.2503.07967", "authors": "Xin Peng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E24", "text": "To address these challenges, we introduce vibe coding, a novel AI-assisted, no-code development approach that enables educators to create interactive, customisable learning simulations without programming expertise.", "title": "From technology adopters to creators: Leveraging AI-assisted vibe coding to transform clinical teaching and learning", "year": 2025, "date": "2025-04-09", "url": "https://doi.org/10.1080/0142159x.2025.2488353", "authors": "Minyang Chow et al.", "fromTitle": false, "field": "Social Sciences", "inSet": 20, "sense": "S1"}, {"id": "E25", "text": "This papers reviews AI coding, and in particular the exploding interest in vibe coding, both in terms of main existing framework, advantages and challenges.", "title": "The Gotchas of AI Coding and Vibe Coding. It’s All About Support And Maintenance", "year": 2025, "date": "2025-05-07", "url": "https://doi.org/10.31219/osf.io/kjz9t_v1", "authors": "Stephane Herman Maes", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E26", "text": "Vibe coding-where high-level natural-language directives orchestrate end-to-end software creation-has emerged as a transformative paradigm in modern development.", "title": "A Review on Vibe Coding: Fundamentals, State-of-the-art, Challenges and Future Directions", "year": 2025, "date": "2025-05-09", "url": "https://doi.org/10.36227/techrxiv.174681482.27435614/v1", "authors": "Partha Pratim Ray", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S1"}, {"id": "E27", "text": "This paper addresses the emerging concept of \"vibe-coding\"—the translation of intuitive feelings or high-level intentions directly into software code.", "title": "Ensuring the Maintainability and Supportability of \"Vibe-Coded\" Software Systems: A Framework for Bridging Intuition and Engineering Rigor", "year": 2025, "date": "2025-05-09", "url": "https://doi.org/10.31219/osf.io/2nu8r_v1", "authors": "Stephane Herman Maes", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S4"}, {"id": "E28", "text": "This article examines the emergence of intuitive programming approaches colloquially termed \"vibe coding\" alongside traditional no-code and low code platforms, analyzing their combined potential to democratize software engineering practices.", "title": "Democratizing Software Engineering through Generative AI and Vibe Coding: The Evolution of No-Code Development", "year": 2025, "date": "2025-05-17", "url": "https://doi.org/10.32996/jcsts.2025.7.4.66", "authors": "Akhilesh Gadde", "fromTitle": false, "field": "Computer Science", "inSet": 14, "sense": "S1"}, {"id": "E29", "text": "This review presents a comprehensive analysis of two emerging paradigms in AI-assisted software development: vibe coding and agentic coding.", "title": "Vibe Coding vs. Agentic Coding: Fundamentals and Practical Implications of Agentic AI", "year": 2025, "date": "2025-05-26", "url": "https://doi.org/10.48550/arxiv.2505.19443", "authors": "Ranjan Sapkota et al.", "fromTitle": false, "field": "Computer Science", "inSet": 22, "sense": "S1"}, {"id": "E30", "text": "Vibe coding is a recent Generative AI innovation where a human operator provides conversational natural language description of a problem and an AI assistant writes the code to develop a solution.", "title": "Generative AI Vibe Coding for Prototyping Industrial Systems", "year": 2025, "date": "2025-06-20", "url": "https://doi.org/10.1109/isie62713.2025.11124737", "authors": "Daswin De Silva et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S1"}, {"id": "E31", "text": "We examine \"vibe coding\": an emerging programming paradigm where developers primarily write code by interacting with code-generating large language models rather than writing code directly.", "title": "Vibe coding: programming through conversation with artificial intelligence", "year": 2025, "date": "2025-06-29", "url": "https://doi.org/10.48550/arxiv.2506.23253", "authors": "Advait Sarkar et al.", "fromTitle": false, "field": "Computer Science", "inSet": 23, "sense": "S1"}, {"id": "E32", "text": "Vibe coding: a new paradigm for biomedical software development", "title": "Vibe coding: a new paradigm for biomedical software development", "year": 2025, "date": "2025-07-01", "url": "https://doi.org/10.1186/s13040-025-00462-9", "authors": "Jason H. Moore et al.", "fromTitle": true, "field": "Decision Sciences", "inSet": 9, "sense": "S1"}, {"id": "E33", "text": "AI: Teritorial yang Belum Terpetakan Dari Data Menuju Empati Berhikmat Cogito Ergo Sum, Simulo Ergo Existo Mendesain Ulang “Manusia” Dari Tekstual ke Visual: Memikirkan Kembali Proses Perancangan Arsitektur AI sebagai Alat Transformasi Pendidikan: Mewujudkan Pembelajaran Kritikal dan Inovatif di UK Petra Vibe Coding: Apakah Masih Perlu Belajar Pengkodean? AI - Akal Imitasi ataukah Auto Idiot Dilema Digital: AI, Stress, dan Perilaku Kerja Inovati…", "title": "AI: Teritorial yang Belum Terpetakan Dari Data Menuju Empati Berhikmat Cogito Ergo Sum, Simulo Ergo Existo Mendesain Ulang “Manusia” Dari Tekstual ke Visual: Memikirkan Kembali Proses Perancangan Arsitektur AI sebagai Alat Transformasi Pendidikan: Mewujudkan Pembelajaran Kritikal dan Inovatif di UK Petra Vibe Coding: Apakah Masih Perlu Belajar Pengkodean? AI - Akal Imitasi ataukah Auto Idiot Dilema Digital: AI, Stress, dan Perilaku Kerja Inovatif Guru di Indonesia Kisah Angin dan Matahari: Hasil Simulasi AI di Tangan Mahasiswa Ngobrol dengan AI: Cerita Mahasiswa Introduksi dalam Imajinasi Pemanfaatan AI dalam Mendukung Pembuatan Koleksi Fashion: Studi Kasus TheNewBlack.ai Saat AI Masuk Kelas: Pengalaman dari Mata Kuliah Technopreneurship Otak dan Mata Virtual: Kolaborasi AI dalam Perancangan Arsitektur Kota Visioner AI untuk Pembelajaran: Adaptasi Asesmen di Era AI Saat AI Menulis, Manusia Tetap Berpikir: Harmoni antara Akal Sehat dan Algoritma Artificial Intelligence dan Disabilitas: Pemanfaatannya dalam Desain Arsitektur Universal yang Ramah bagi Semua “Mantra” Prompt Peramal Masa Depan Mahasiswa Dialog Berbangsa: Belajar Bersama ChatGPT Bodoh Kali AI-ku Tepatkah Strategi Penilaianku?", "year": 2025, "date": "2025-07-17", "url": "https://openalex.org/W2310822250", "authors": "Toong Tjiek Liauw et al.", "fromTitle": true, "field": "Social Sciences", "inSet": 0, "sense": "S1"}, {"id": "E34", "text": "Vibe coding, which is structured, prompt-driven code generation with large language models (LLMs) embedded in reproducible workflows, offers one pragmatic response.", "title": "Academic Vibe Coding: Opportunities for Accelerating Research in an Era of Resource Constraint", "year": 2025, "date": "2025-08-01", "url": "https://doi.org/10.48550/arxiv.2508.00952", "authors": "Matthew Gordon Crowson et al.", "fromTitle": false, "field": "Decision Sciences", "inSet": 1, "sense": "S1"}, {"id": "E35", "text": "Recent advances in large language models (LLMs) and multi-agent systems have demonstrated remarkable capabilities in complex problem-solving tasks such as deep research, vibe coding, and mathematical reasoning.", "title": "Chain-of-Agents: End-to-End Agent Foundation Models via Multi-Agent Distillation and Agentic RL", "year": 2025, "date": "2025-08-06", "url": "https://doi.org/10.48550/arxiv.2508.13167", "authors": "Weizhen Li et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E36", "text": "The invention of Generative AI and Large Language Models has recently given rise to \"vibe coding\" as a new paradigm of software development in which developers use natural language to state their high-level intent rather than writing or even being aware of the computer code.", "title": "What is Vibe coding and when should you use it (or not)?", "year": 2025, "date": "2025-08-07", "url": "https://doi.org/10.36227/techrxiv.175459780.03758839/v1", "authors": "Marko Horvat", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S2"}, {"id": "E37", "text": "The main objective of the CAI framework is to accelerate the widespread adoption and effective use of artificial intelligence-based cybersecurity solutions, pathing the way to vibe-hacking, the cybersecurity analogon to vibe-coding.", "title": "CAI Fluency: A Framework for Cybersecurity AI Fluency", "year": 2025, "date": "2025-08-19", "url": "https://doi.org/10.48550/arxiv.2508.13588", "authors": "Víctor Mayoral-Vilches et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S5"}, {"id": "E38", "text": "Vibe coding is a conversational, AI-driven approach to software creation where developers guide large language models to generate code iteratively.", "title": "VIBECODING:A Mixed-MethodsCase Study on Conversational AIProgramming and ApplicationDevelopment", "year": 2025, "date": "2025-08-22", "url": "https://doi.org/10.71097/ijsat.v16.i3.7765", "authors": "Namish Hemdev", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E39", "text": "This mirrors \"Vibe Coding,\" where AI generates syntactically correct but functionally flawed code, except scientific stakes are immeasurably higher.", "title": "The Rise of \"Vibe Science\": How AI Threatens Scientific Rigor", "year": 2025, "date": "2025-08-24", "url": "https://doi.org/10.36227/techrxiv.175606229.90717623/v1", "authors": "Isabelle Rose et al.", "fromTitle": false, "field": "Social Sciences", "inSet": 1, "sense": "S5"}, {"id": "E40", "text": "This exploratory study examined the consistency of human-AI collaboration by analyzing three extensive \"vibe coding\" sessions between a human product lead and an AI software engineer.", "title": "Vibe Coding: Is Human Nature the Ghost in the Machine?", "year": 2025, "date": "2025-08-28", "url": "https://doi.org/10.48550/arxiv.2508.20918", "authors": "Cory P. Knobel et al.", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S1"}, {"id": "E41", "text": "This innovative practice article reports on the piloting of vibe coding (using natural language to create software applications with AI) for English as a Foreign Language (EFL) education.", "title": "A vibe coding learning design to enhance EFL students' talking to, through, and about AI", "year": 2025, "date": "2025-09-09", "url": "https://doi.org/10.48550/arxiv.2509.08854", "authors": "David James Woo et al.", "fromTitle": false, "field": "Arts and Humanities", "inSet": 1, "sense": "S1"}, {"id": "E42", "text": "Vibe coding, a term coined by Andrej Karpathy in February 2025, has quickly become a compelling and controversial natural language programming paradigm in AI-assisted software development.", "title": "Good Vibrations? A Qualitative Study of Co-Creation, Communication, Flow, and Trust in Vibe Coding", "year": 2025, "date": "2025-09-15", "url": "https://doi.org/10.48550/arxiv.2509.12491", "authors": "Veronica Pimenova et al.", "fromTitle": false, "field": "Computer Science", "inSet": 10, "sense": "S1"}, {"id": "E43", "text": "The emergence of large language models has introduced new opportunities in software development, particularly through a revolutionary paradigm known as vibe coding or \"coding by vibes\", in which developers express their software ideas in natural language and where the LLM generates the code.This paper investigates the potential of vibe coding to support novice programmers.The first author, without coding experience, attempted to create a 3D driv…", "title": "Vibe Coding in Practice: Building a Driving Simulator Without Expert Programming Skills", "year": 2025, "date": "2025-09-22", "url": "https://doi.org/10.1145/3744335.3758482", "authors": "Margarida Fortes-Ferreira et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S1"}, {"id": "E44", "text": "Two dominant paradigms have emerged in this space: Model-driven Engineering (MDE), leveraging Domain-specific Languages (DSLs) to abstract implementation and reduce the knowledge and expertise required, and LLM-based vibe coding, where developers interact with Large Language Models (LLMs) using natural language, allowing for rapid prototyping and code generation through conversations.", "title": "Toward efficient vibe coding: An LLM-based agent for low-code software development", "year": 2025, "date": "2025-09-24", "url": "https://doi.org/10.1016/j.cola.2025.101367", "authors": "Nikolaos Malamas et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E45", "text": "The system not only brings the Vibe Coding paradigm -- program development through natural language interaction with users -- to HPC programming, but also enables autonomous performance optimization with minimal user intervention through a sophisticated multi-agent design.", "title": "VibeCodeHPC: An Agent-Based Iterative Prompting Auto-Tuner for HPC Code Generation Using LLMs", "year": 2025, "date": "2025-09-26", "url": "https://doi.org/10.48550/arxiv.2510.00031", "authors": "Hayashi, Shun-ichiro et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E46", "text": "From vibe coding to vibe caring: what clinicians can learn", "title": "From vibe coding to vibe caring: what clinicians can learn", "year": 2025, "date": "2025-10-01", "url": "https://doi.org/10.1016/s0140-6736(25)01807-0", "authors": "Gwćnolć Abgrall et al.", "fromTitle": true, "field": "Medicine", "inSet": 1, "sense": "S5"}, {"id": "E47", "text": "Large Language Models (LLMs) have catalyzed vibe coding, where users leverage LLMs to generate and iteratively refine code through natural language interactions until it passes their vibe check.", "title": "SWE-IF: Aligning Code Evaluation with Human Preference", "year": 2025, "date": "2025-10-08", "url": "https://doi.org/10.48550/arxiv.2510.07315", "authors": "Zhong Ming et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E48", "text": "“Vibe coding” — the practice of developing software through iteratively conversing with a large language model (LLM) — has exploded in popularity within the last year.", "title": "Position: Vibe Coding Needs Vibe Reasoning: Improving Vibe Coding with Formal Verification", "year": 2025, "date": "2025-10-09", "url": "https://doi.org/10.1145/3759425.3763390", "authors": "Jacqueline Mitchell et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E49", "text": "This paper introduces vibe coding, an emerging AI-native programming paradigm in which a developer specifies high-level functional intent along with qualitative descriptors of the desired \"vibe\" (tone, style, or emotional resonance).", "title": "Vibe Coding: Toward an AI-Native Paradigm for Semantic and Intent-Driven Programming", "year": 2025, "date": "2025-10-09", "url": "https://doi.org/10.48550/arxiv.2510.17842", "authors": "Vinay Bamil", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S4"}, {"id": "E50", "text": "A trend of vibe coding has emerged in the world of technology – code generation by neural networks from natural language.", "title": "Technological Stages of Neural Network AI Generation of System Program Code Based on Modular Neuro Integration", "year": 2025, "date": "2025-10-09", "url": "https://doi.org/10.11648/j.ajesa.20251001.12", "authors": "Evgeniy Grigorievich Bryndin", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E51", "text": "The advancement of large language models (LLMs) has catalyzed a paradigm shift from code generation assistance to autonomous coding agents, enabling a novel development methodology termed \"Vibe Coding\" where developers validate AI-generated implementations through outcome observation rather than line-by-line code comprehension.", "title": "A Survey of Vibe Coding with Large Language Models", "year": 2025, "date": "2025-10-14", "url": "https://doi.org/10.48550/arxiv.2510.12399", "authors": "Ge, Yuyao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 10, "sense": "S2"}, {"id": "E52", "text": "We explore vibe coding as a rapid prototyping approach powered by generative AI.", "title": "Vibe Coding and the New Prototyping Playbook", "year": 2025, "date": "2025-10-21", "url": "https://doi.org/10.1109/ms.2025.3597032", "authors": "Markus Borg et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S1"}, {"id": "E53", "text": "The emergence of 'vibe coding' in 2025 has substantially lowered this barrier to entry.", "title": "How Can Clinicians Leverage Vibe Coding for Machine Learning and Deep Learning Research?", "year": 2025, "date": "2025-10-30", "url": "https://doi.org/10.3803/enm.2025.2675", "authors": "Yoonhwan Lee et al.", "fromTitle": false, "field": "Medicine", "inSet": 3, "sense": "S1"}, {"id": "E54", "text": "Vibe Coding is a clinician-led design framework that embeds expert reasoning and the cognitive ‘feel’ of clinical decision-making into interactive educational tools.", "title": "Vibe Coding in nephrology education: clinician-led, AI-assisted development of open-source interactive learning tools", "year": 2025, "date": "2025-11-06", "url": "https://doi.org/10.1080/0886022x.2025.2581933", "authors": "Francesco Pesce et al.", "fromTitle": false, "field": "Social Sciences", "inSet": 3, "sense": "S3"}, {"id": "E55", "text": "Vibe coding is an emerging approach to programming education in which students collaborate with AI assistants in a creative and immersive manner.", "title": "Vibe Coding in Education", "year": 2025, "date": "2025-11-13", "url": "https://doi.org/10.1109/iceta67772.2025.11280285", "authors": "Gábor Kusper et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S3"}, {"id": "E56", "text": "The widespread adoption of large language models (LLMs) in software development has given rise to vibe coding—a practice in which developers rely on conversational prompts to generate and refine code.", "title": "The Prompt–Refactor–Verify (PRV) Cycle: A Human-Centered Framework for AI-Assisted Programming", "year": 2025, "date": "2025-11-26", "url": "https://doi.org/10.1109/ciees66347.2025.11300239", "authors": "Nikolay Yanev et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E57", "text": "Vibe Coding offers an accessible entry point to create interactive digital applications through human-in-the-loop conversational prompts and AI-assisted workflows.", "title": "Empowering Health Professions Educators: Developing Educational Tools with AI-Assisted Vibe Coding", "year": 2025, "date": "2025-11-28", "url": "https://doi.org/10.1007/s40670-025-02596-1", "authors": "Olivia Ng et al.", "fromTitle": false, "field": "Medicine", "inSet": 1, "sense": "S1"}, {"id": "E58", "text": "Vibe coding is a new software development paradigm in which human engineers prompt a large language model (LLM) agent to complete complex coding tasks with little supervision.", "title": "Is Vibe Coding Safe? Benchmarking Vulnerability of Agent-Generated Code in Real-World Tasks", "year": 2025, "date": "2025-12-02", "url": "https://doi.org/10.48550/arxiv.2512.03262", "authors": "Songwen Zhao et al.", "fromTitle": false, "field": "Computer Science", "inSet": 6, "sense": "S1"}, {"id": "E59", "text": "Case studies from workshops include introductions to GenAI and “vibe coding”.", "title": "Designing with Generative AI: Towards Technical, Ethical, and Critical Pedagogies in Interaction Design", "year": 2025, "date": "2025-12-08", "url": "https://doi.org/10.1145/3757372.3771861", "authors": "James Smith-Harvey", "fromTitle": false, "field": "Engineering", "inSet": 0, "sense": "S1"}, {"id": "E60", "text": "Vibe Coding (VC) is a form of software development assisted by generative AI, in which developers describe the intended functionality or logic via natural language prompts, and the AI system generates the corresponding source code.", "title": "Vibe Coding in Practice: Flow, Technical Debt, and Guidelines for Sustainable Use", "year": 2025, "date": "2025-12-11", "url": "https://doi.org/10.48550/arxiv.2512.11922", "authors": "Muhammad Waseem et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S1"}, {"id": "E61", "text": "In the last column, we promised to return to one of the inevitable challenges that vibe coding leaves us with.", "title": "An Abstraction Is Worth a Thousand Vibes", "year": 2025, "date": "2025-12-29", "url": "https://doi.org/10.1109/ms.2025.3621786", "authors": "Jan-Philipp Steghöfer et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E62", "text": "Recent advances in large language models (LLMs) have introduced new paradigms in software development, including vibe coding, AI-assisted coding, and agentic coding, fundamentally reshaping how software is designed, implemented, and maintained.", "title": "Coding With AI: From a Reflection on Industrial Practices to Future Computer Science and Software Engineering Education", "year": 2025, "date": "2025-12-30", "url": "https://openalex.org/W7118051977", "authors": "Hung-Fu Chang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E63", "text": "SecureVibeBench: Benchmarking Secure Vibe Coding of AI Agents via Reconstructing Vulnerability-Introducing Scenarios", "title": "SecureVibeBench: Benchmarking Secure Vibe Coding of AI Agents via Reconstructing Vulnerability-Introducing Scenarios", "year": 2026, "date": "2026-01-01", "url": "https://doi.org/10.18653/v1/2026.acl-long.1107", "authors": "Junkai Chen et al.", "fromTitle": true, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E64", "text": "The rapid advancement of Large Language Models (LLMs) presents both challenges and opportunities for Natural Language Processing (NLP) education.This paper introduces \"Vibe Coding,\" a pedagogical approach that leverages LLMs as coding assistants while maintaining focus on conceptual understanding and critical thinking.We describe the implementation of this approach in a senior-level undergraduate NLP course, where students completed seven labs u…", "title": "From Code-Centric to Concept-Centric: Teaching NLP with LLM-Assisted \"Vibe Coding”", "year": 2026, "date": "2026-01-01", "url": "https://doi.org/10.18653/v1/2026.teachingnlp-1.3", "authors": "Hend Al-Khalifa", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E65", "text": "Vibe Coding in Software Development: A Multivocal Literature Review", "title": "Vibe Coding in Software Development: A Multivocal Literature Review", "year": 2026, "date": "2026-01-01", "url": "https://doi.org/10.2139/ssrn.7166558", "authors": "Shahbaz Siddeeq et al.", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E66", "text": "In emerging chat-based development practices such as vibe coding, prompts mediate the transformation of human intent into executable software.", "title": "Prompts Blend Requirements and Solutions: From Intent to Implementation", "year": 2026, "date": "2026-01-01", "url": "https://doi.org/10.4230/lipics.esem.2026.71", "authors": "Shalini Chakraborty et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E67", "text": "The integration of Large Language Models (LLMs) into software engineering education has driven the emergence of ``Vibe Coding,'' a paradigm where developers articulate high-level intent through natural language and delegate implementation to AI agents.", "title": "The Vibe-Check Protocol: Quantifying Cognitive Offloading in AI Programming", "year": 2026, "date": "2026-01-02", "url": "https://doi.org/10.48550/arxiv.2601.02410", "authors": "Aizierjiang Aiersilan", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E68", "text": "Here, I demonstrate that modern large language models (LLMs) and autonomous coding agents can dramatically lower this barrier through a process called \"vibe coding\", an iterative, conversational style of software creation where users describe goals in natural language and AI agents generate, test, and refine executable code in real time.", "title": "Vibe Coding Omics Data Analysis Applications", "year": 2026, "date": "2026-01-06", "url": "https://doi.org/10.1021/acs.jproteome.5c00984", "authors": "Jesse G. Meyer", "fromTitle": false, "field": "Decision Sciences", "inSet": 1, "sense": "S1"}, {"id": "E69", "text": "методология создания технического задания и генерация кода с использованием искусственного интеллекта (vibe-coding).", "title": "Automation of software development for psychiatry, psychotherapy and medical psychology: methodology for creating technical specifications and code generation using artificial intelligence (vibe-coding)", "year": 2026, "date": "2026-01-12", "url": "https://doi.org/10.26617/1810-3111-2025-4(129)-57-70", "authors": "D. S. Radionov et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E70", "text": "Unlike \"vibe coding\" (natural-language task programming), Logotic Programming operates at the level of semantic architecture: it shapes the probability landscape in which intelligence traverses, recognizes, and stabilizes \"what is real\" within a bounded semantic domain.", "title": "Logotic Programming: A Method for Encoding Conditions of Intelligibility for Machine and Human Intelligence", "year": 2026, "date": "2026-01-18", "url": "https://doi.org/10.5281/zenodo.18286049", "authors": "Talos Morrow et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E71", "text": "In vibe coding, an AI agent builds software by selecting and assembling open-source software (OSS), often without users directly reading documentation, reporting bugs, or otherwise engaging with maintainers.", "title": "Vibe Coding Kills Open Source", "year": 2026, "date": "2026-01-21", "url": "https://doi.org/10.48550/arxiv.2601.15494", "authors": "Miklós Koren et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E72", "text": "Vibe coding is an emerging software engineering approach that transitions development from manual code writing to expressing conversational intent.", "title": "Responsible Vibe Coding: Architecture, Opportunities, and Research Agenda", "year": 2026, "date": "2026-01-28", "url": "https://doi.org/10.1080/08874417.2026.2621186", "authors": "Ibrahim A. Elgendy et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S1"}, {"id": "E73", "text": "The proliferation of AI-assisted \"vibe coding\" enables rapid software development but introduces significant security risks, as Large Language Models (LLMs) prioritize functional correctness over security.", "title": "Constitutional Spec-Driven Development: Enforcing Security by Construction in AI-Assisted Code Generation", "year": 2026, "date": "2026-01-31", "url": "https://doi.org/10.48550/arxiv.2602.02584", "authors": "Srinivas Rao Marri", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E74", "text": "As Large Language Models increasingly automate complex, long-horizon tasks such as \\emph{vibe coding}, a supervision gap has emerged.", "title": "Steering LLMs via Scalable Interactive Oversight", "year": 2026, "date": "2026-02-04", "url": "https://doi.org/10.48550/arxiv.2602.04210", "authors": "Enyu Zhou et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E75", "text": "In this paper, inspired by the Vibe Coding, we introduce the \\textbf{Vibe AIGC}, a new paradigm for content generation via agentic orchestration, which represents the autonomous synthesis of hierarchical multi-agent workflows.", "title": "Vibe AIGC: A New Paradigm for Content Generation via Agentic Orchestration", "year": 2026, "date": "2026-02-04", "url": "https://doi.org/10.48550/arxiv.2602.04575", "authors": "Jiaheng Liu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S5"}, {"id": "E76", "text": "The recent introduction of “vibe coding” may further transform how students program, as it introduces a new way for students to create software projects with minimal oversight.", "title": "Exploring Student-AI Interactions in Vibe Coding", "year": 2026, "date": "2026-02-09", "url": "https://doi.org/10.1145/3786228.3786236", "authors": "Francis Geng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 10, "sense": "S1"}, {"id": "E77", "text": "Some journals, such as Journal of Educational Evaluation for Health Professions, make disclosure optional because AI-detection tools are unreliable and AI-assisted and human-written text are often intermingled.Discussion and conclusion: Natural language–based vibe-coding can also enhance peer review when prompts are designed to ensure reproducible analyses.", "title": "How editors perceive the use of generative artificial intelligence in writing academic papers: a narrative review", "year": 2026, "date": "2026-02-10", "url": "https://doi.org/10.5124/jkma.26.0008", "authors": "Sun Huh", "fromTitle": false, "field": "Social Sciences", "inSet": 0, "sense": "S1"}, {"id": "E78", "text": "Large language models (LLMs) are increasingly used for code generation in fast, informal development workflows, often referred to as vibe coding, where speed and convenience are prioritized, and security requirements are rarely made explicit.", "title": "GoodVibe: Security-by-Vibe for LLM-Based Code Generation", "year": 2026, "date": "2026-02-11", "url": "https://doi.org/10.48550/arxiv.2602.10778", "authors": "Maximilian Thang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E79", "text": "Modern AI is changing this process by enabling experts and non-experts alike to generate code without actually writing it, instead using natural language instructions or \"vibe coding\".", "title": "Why Human Guidance Matters in Collaborative Vibe Coding", "year": 2026, "date": "2026-02-11", "url": "https://doi.org/10.48550/arxiv.2602.10473", "authors": "Haoyu Hu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E80", "text": "This study explicates and explores the concept of “vibe coding,” or the use of AI platforms to teach relevant programming skills in a communication context.", "title": "Integrating Vibe Coding and Flow Theory: A Student-Centered Model for AI-Augmented Coding Education", "year": 2026, "date": "2026-02-14", "url": "https://doi.org/10.1177/10776958251407389", "authors": "Cindy Royal", "fromTitle": false, "field": "Computer Science", "inSet": 2, "sense": "S3"}, {"id": "E81", "text": "We present GLM-5, a next-generation foundation model designed to transition the paradigm of vibe coding to agentic engineering.", "title": "GLM-5: from Vibe Coding to Agentic Engineering", "year": 2026, "date": "2026-02-17", "url": "https://doi.org/10.48550/arxiv.2602.15763", "authors": "5 Team et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E82", "text": "Large Language Models (LLMs) are changing the coding paradigm, known as vibe coding, yet synthesizing algorithmically sophisticated and robust code still remains a critical challenge.", "title": "TAROT: Test-driven and Capability-adaptive Curriculum Reinforcement Fine-tuning for Code Generation with Large Language Models", "year": 2026, "date": "2026-02-17", "url": "https://doi.org/10.48550/arxiv.2602.15449", "authors": "C.Y. Park et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E83", "text": "This article examines the rise of “vibe coding” in 2025, highlighting its immediate impact on software creation, prototyping, and accessibility for nontechnical users.", "title": "Is Vibe Coding the Future of Software?", "year": 2026, "date": "2026-02-20", "url": "https://doi.org/10.1109/mc.2025.3634712", "authors": "Nir Kshetri et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E84", "text": "The recent introduction of vibe coding suggests a way to target the problem of the correctness of generated code by iterative testing and vibe coding feedback loops instead of direct code inspection.", "title": "Feedback-based Automated Verification in Vibe Coding of CAS Adaptation Built on Constraint Logic", "year": 2026, "date": "2026-02-20", "url": "https://doi.org/10.48550/arxiv.2602.18607", "authors": "Michal Töpfer et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E85", "text": "The democratization of Large Language Models has given rise to vibe coding, where novice programmers prioritize semantic intent over syntactic implementation.", "title": "Mitigating \"Epistemic Debt\" in Generative AI-Scaffolded Novice Programming using Metacognitive Scripts", "year": 2026, "date": "2026-02-22", "url": "https://doi.org/10.48550/arxiv.2602.20206", "authors": "Sreecharan Sankaranarayanan", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E86", "text": "While \"Intent-oriented programming\" (or \"Vibe Coding\") redefines software engineering, existing code agents remain tethered to static code snapshots.", "title": "Your Code Agent Can Grow Alongside You with Structured Memory", "year": 2026, "date": "2026-02-25", "url": "https://doi.org/10.48550/arxiv.2603.13258", "authors": "Yi-Xuan Deng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E87", "text": "We demonstrate its relevance across two user profiles: lay users engaged in vibe coding, who gain structural visibility otherwise masked by functional success; and professional developers, who gain richer contextual grounding for code review without increased overhead.", "title": "Beyond the 'Diff': Addressing Agentic Entropy in Agentic Software Development", "year": 2026, "date": "2026-03-03", "url": "https://doi.org/10.5281/zenodo.19700281", "authors": "Matteo Casserini et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E88", "text": "Code-generating tools are increasingly used in software development, yet experience reports on conversational \"vibe coding\" under production constraints remain limited.", "title": "Context Before Code: An Experience Report on Vibe Coding in Practice", "year": 2026, "date": "2026-03-10", "url": "https://doi.org/10.48550/arxiv.2603.11073", "authors": "Md Nasir Uddin Shuvo et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E89", "text": "In this paper, we interrogate the possibility of design homogenization in web vibe coding.", "title": "Interrogating Design Homogenization in Web Vibe Coding", "year": 2026, "date": "2026-03-13", "url": "https://doi.org/10.48550/arxiv.2603.13036", "authors": "Donghoon Shin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E90", "text": "Recent advances in large language models (LLMs) have given rise to vibe coding, a style of software development where developers rely on AI coding assistants to generate, modify, and refactor code using natural language instructions.", "title": "VibeContract: The Missing Quality Assurance Piece in Vibe Coding", "year": 2026, "date": "2026-03-16", "url": "https://doi.org/10.48550/arxiv.2603.15691", "authors": "Song Wang", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E91", "text": "Introduction: The emergence of Generative Artificial Intelligence has given rise to vibe-coding, a paradigm that allows educators without technical backgrounds to develop software using natural language.", "title": "Vibe-coding as a Teaching Competency in the Use of Artificial Intelligence for Medical Education: A Scoping Review", "year": 2026, "date": "2026-03-18", "url": "https://doi.org/10.6018/edumed.705121", "authors": "Josemaría Elizondo-García", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S1"}, {"id": "E92", "text": "Vibe-coding is merely the visible tip of an iceberg - the iceberg being a new cognitive ecology in which these two modes coexist as the necessary phases of problem-solving in the age of generative AI.", "title": "Navigational Thinking as an Emerging Paradigm of Computer Science in the Age of Generative AI", "year": 2026, "date": "2026-03-23", "url": "https://doi.org/10.48550/arxiv.2603.22133", "authors": "Ilya Levin", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E93", "text": "The emergence of Large Language Models (LLMs) has catalyzed a paradigm shift in programming, giving rise to \"vibe coding\", where users can build complete projects and even control computers using natural language instructions.", "title": "WebTestBench: Evaluating Computer-Use Agents towards End-to-End Automated Web Testing", "year": 2026, "date": "2026-03-26", "url": "https://doi.org/10.48550/arxiv.2603.25226", "authors": "Fanheng Kong et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E94", "text": "Inspired by the \"vibe coding\" movement in software engineering, it occupies a middle ground between traditional manual research and fully autonomous AI research systems.", "title": "A Visionary Look at Vibe Researching", "year": 2026, "date": "2026-04-01", "url": "https://doi.org/10.48550/arxiv.2604.00945", "authors": "Yebo Feng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S5"}, {"id": "E95", "text": "This paper’s contribution is not to re-validate that evidence, but to demonstrate that pedagogies once beyond the reach of resource-constrained educators are now meaningfully accessible through GenAI-enabled vibe coding.", "title": "Leveraging Generative AI Through Vibe Coding: A Case of Simulation-Based Curriculum Redesign in Management Education", "year": 2026, "date": "2026-04-02", "url": "https://doi.org/10.3390/educsci16040558", "authors": "Albert Munoz et al.", "fromTitle": false, "field": "Social Sciences", "inSet": 0, "sense": "S1"}, {"id": "E96", "text": "This claim has influenced developers to consider switching to Chinese for ``vibe coding'' to save on API costs.", "title": "Chinese Language Is Not More Efficient Than English in Vibe Coding: A Preliminary Study on Token Cost and Problem-Solving Rate", "year": 2026, "date": "2026-04-06", "url": "https://doi.org/10.48550/arxiv.2604.14210", "authors": "Simiao Ren et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E97", "text": "Vibe coding is the practice where coders rely on AI code generation tools through intuition and trial-and-error without necessarily understanding the underlying code.", "title": "Vibe Coding in Practice: Motivations, Challenges, and a Future Outlook – a Grey Literature Review", "year": 2026, "date": "2026-04-12", "url": "https://doi.org/10.1145/3786583.3786866", "authors": "Ahmed Fawzy et al.", "fromTitle": false, "field": "Computer Science", "inSet": 14, "sense": "S2"}, {"id": "E98", "text": "Emerging alongside generative AI and the broader trend of AI-assisted coding, the term “vibe coding” refers to creating software via natural language prompts rather than direct code authorship.", "title": "\"Can you feel the vibes?\": An exploration of novice programmer engagement with vibe coding", "year": 2026, "date": "2026-04-12", "url": "https://doi.org/10.1145/3786580.3786992", "authors": "Kiev Santos da Gama et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S1"}, {"id": "E99", "text": "Vibe coding transforms natural language commands into functional code through Artificial Intelligence (AI).", "title": "Dampak Tantangan dan Potensi Vibe Coding Berbasis AI dalam Lanskap Pendidikan Pemrograman: Tinjauan Literatur Sistematis", "year": 2026, "date": "2026-04-12", "url": "https://doi.org/10.65258/jutekom.v2.i2.52", "authors": "Akhmad Rezki Purnajaya", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E100", "text": "At the same time, we are witnessing the growing popularity of vibe coding approaches that rely on Large Language Models (LLMs) to transform natural language descriptions into running code at the expense of potential code vulnerabilities, scalability issues and maintainability concerns.", "title": "Vibe-driven model-based engineering", "year": 2026, "date": "2026-04-12", "url": "https://doi.org/10.48550/arxiv.2604.10645", "authors": "Jordi Cabot", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E101", "text": "Generative AI agents are reshaping human-computer interaction, shifting users from direct task execution to supervising machine-driven actions, especially the rise of “vibe coding” in programming.", "title": "Programmers Who Use Screen Readers in the Vibe Coding Era: Adaptation, Empowerment, and New Accessibility Landscape", "year": 2026, "date": "2026-04-13", "url": "https://doi.org/10.1145/3772318.3790726", "authors": "Nan Chen et al.", "fromTitle": false, "field": "Social Sciences", "inSet": 1, "sense": "S1"}, {"id": "E102", "text": "Many software development platforms now support LLM-driven programming, or “vibe coding”, a technique that allows one to specify programs in natural language and iterate from observed behavior, all without directly editing source code.", "title": "Computer Science Achievement and Writing Skills Predict Vibe Coding Proficiency", "year": 2026, "date": "2026-04-13", "url": "https://doi.org/10.1145/3772318.3791666", "authors": "Sverrir Thorgeirsson et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E103", "text": "Recent advances in generative AI have introduced a new programming paradigm—vibe coding, a natural language–driven mode of AI collaboration.", "title": "Exploring the Impacts and Challenges of Vibe Coding Paradigm to Children's Programming Learning and Practices", "year": 2026, "date": "2026-04-13", "url": "https://doi.org/10.1145/3772318.3790366", "authors": "Janice Jianing Si et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E104", "text": "A new generation of GenAI tools fueled by vibe coding practices promises to democratize software development, explicitly targeting users without programming backgrounds.", "title": "From Throw-Away to Takeaway: How GenAI and Vibe Coding Accelerate Prototyping Across Technical Skill Levels", "year": 2026, "date": "2026-04-13", "url": "https://doi.org/10.1145/3772318.3790757", "authors": "Charlotte Kobiella et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E105", "text": "Vibe Coding is conceptualised as a co-constituted form of programming through which humans and AI tools engage in the mutual shaping of a piece of code.", "title": "Vibe Coding Entanglements – Repositioning Boundaries of Intention, Authorship, and Responsibility in Programming with Generative AI", "year": 2026, "date": "2026-04-13", "url": "https://doi.org/10.1145/3772318.3791847", "authors": "Jakob Tholander et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E106", "text": "Recent advances in Generative AI Practices—from Generative Design to Vibe Coding—are reshaping who prototypes and how.", "title": "Generative Design and Vibe Coding: Rethinking The Design-Development Divide for UI Prototyping", "year": 2026, "date": "2026-04-13", "url": "https://doi.org/10.1145/3772363.3778802", "authors": "Xinqi Zhang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E107", "text": "Novice Developers Produce Larger Review Overhead for Project Maintainers while Vibe Coding", "title": "Novice Developers Produce Larger Review Overhead for Project Maintainers while Vibe Coding", "year": 2026, "date": "2026-04-13", "url": "https://doi.org/10.1145/3793302.3793597", "authors": "Syed Ammar Asdaque et al.", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E108", "text": "We conducted a 110-minute workshop with five clinical nurses designing an EMR interface, incorporating real-time “vibe coding”—LLM-assisted prototyping that transforms verbal descriptions into functional interfaces within minutes.", "title": "When Nurses Meet Vibe-Coding: Shifting from Problem Talk to Situated Specification in Participatory Design", "year": 2026, "date": "2026-04-13", "url": "https://doi.org/10.1145/3772363.3798470", "authors": "Junghwan Kim et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E109", "text": "The emergence of vibe coding, a paradigm where non-technical users instruct Large Language Models (LLMs) to generate executable codes via natural language, presents both significant opportunities and severe risks for the construction industry.", "title": "Is Vibe Coding the Future? An Empirical Assessment of LLM Generated Codes for Construction Safety", "year": 2026, "date": "2026-04-14", "url": "https://doi.org/10.48550/arxiv.2604.12311", "authors": "S M Jamil Uddin", "fromTitle": false, "field": "Social Sciences", "inSet": 0, "sense": "S1"}, {"id": "E110", "text": "Under the term Vibe Coding , we describe a practice-oriented mode of working in which functional prototypes and software artifacts primarily emerge through iterative, natural language conversation with an LLM.", "title": "Vibe Coding: intention instead of implementation", "year": 2026, "date": "2026-04-14", "url": "https://doi.org/10.1515/icom-2026-0018", "authors": "Christian Hohn et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E111", "text": "Vibe Coding in Radiology: Claude Code and ChatGPT Codex Leading to the Rise of the Radiologist-Developer", "title": "Vibe Coding in Radiology: Claude Code and ChatGPT Codex Leading to the Rise of the Radiologist-Developer", "year": 2026, "date": "2026-04-16", "url": "https://doi.org/10.1016/j.jacr.2026.04.008", "authors": "Kaustav Bera et al.", "fromTitle": true, "field": "Medicine", "inSet": 0, "sense": "S1"}, {"id": "E112", "text": "Remarkably, we observed the emergence of a new capability in omnimodal models: directly performing coding based on audio-visual instructions, which we call Audio-Visual Vibe Coding.", "title": "Qwen3.5-Omni Technical Report", "year": 2026, "date": "2026-04-17", "url": "https://doi.org/10.48550/arxiv.2604.15804", "authors": "Qwen Team", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E113", "text": "Large Language Models (LLMs) are poised to disrupt knowledge work, with the emergence of delegated work as a new interaction paradigm (e.g., vibe coding).", "title": "LLMs Corrupt Your Documents When You Delegate", "year": 2026, "date": "2026-04-17", "url": "https://doi.org/10.48550/arxiv.2604.15597", "authors": "Philippe Laban et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E114", "text": "The era of agentic AI: Should nurses and midwives learn about vibe coding and AI agents for better health and care?", "title": "The era of agentic AI: Should nurses and midwives learn about vibe coding and AI agents for better health and care?", "year": 2026, "date": "2026-04-17", "url": "https://doi.org/10.1016/j.nepr.2026.104837", "authors": "Siobhán O’Connor et al.", "fromTitle": true, "field": "Medicine", "inSet": 0, "sense": "S1"}, {"id": "E115", "text": "Vibe coding turns natural-language intent into working software, but code generation alone does not give humans and agents a shared account of what they are building.", "title": "Scaling Human-AI Coding Collaboration Requires a Governable Consensus Layer", "year": 2026, "date": "2026-04-20", "url": "https://doi.org/10.48550/arxiv.2604.17883", "authors": "Tianfu Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E116", "text": "We find that coding patterns are bimodal: in 41% of sessions, agents author virtually all committed code (\"vibe coding\"), while in 25%, humans write all code themselves.", "title": "SWE-chat: Coding Agent Interactions From Real Users in the Wild", "year": 2026, "date": "2026-04-22", "url": "https://doi.org/10.48550/arxiv.2604.20779", "authors": "Joachim Baumann et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E117", "text": "While vibe coding promises rapid prototyping, it often suffers from architectural drift, limited traceability, and reduced maintainability.", "title": "Shift-Up: A Framework for Software Engineering Guardrails in AI-native Software Development -- Initial Findings", "year": 2026, "date": "2026-04-22", "url": "https://doi.org/10.48550/arxiv.2604.20436", "authors": "Petrus Lipsanen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E118", "text": "Historically, most do not have the technical knowledge to address these problems, but the recent emergence of \"vibe coding\" presents a transformative opportunity.", "title": "Vibe coding for clinicians: democratising bespoke software development for digital health innovation", "year": 2026, "date": "2026-04-24", "url": "https://doi.org/10.48550/arxiv.2604.22604", "authors": "Ariel Yuhan Ong et al.", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S1"}, {"id": "E119", "text": "The emergence of large language models has enabled vibe coding, a natural language approach to programming in which users describe intent and AI generates or revises code, potentially broadening access to programming while preserving meaningful learning outcomes.", "title": "Code for All: Educational Applications of the \"Vibe Coding\" Hackathon in Programming Education across All Skill Levels", "year": 2026, "date": "2026-04-24", "url": "https://doi.org/10.48550/arxiv.2604.22747", "authors": "Ashley J. Chen et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E120", "text": "ACM TechBrief: AI-Assisted Software Development, or Vibe Coding: Benefits and Risks of AI-Driven Software Development", "title": "ACM TechBrief: AI-Assisted Software Development, or Vibe Coding: Benefits and Risks of AI-Driven Software Development", "year": 2026, "date": "2026-04-28", "url": "https://doi.org/10.1145/3807518", "authors": "Simson Garfinkel et al.", "fromTitle": true, "field": "Computer Science", "inSet": 1, "sense": "S1"}, {"id": "E121", "text": "Recent advances in artificial intelligence have enabled vibe coding, in which clinicians express intent in natural language, and artificial intelligence generates executable code, allowing the development of no-/low-code, clinician-driven software.", "title": "Breast Reconstruction Morphology Evaluation Tool: Vibe Coding Empowers Clinicians as Creators", "year": 2026, "date": "2026-05-01", "url": "https://doi.org/10.1097/gox.0000000000007691", "authors": "Yuki Otsuki et al.", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S1"}, {"id": "E122", "text": "Molecular Vibe Coding, a paradigm where chemists interact with LLMs to generate executable programs for molecular tasks, has emerged as a flexible alternative to chemical agents with predefined tools, enabling chemists to express arbitrarily complex, customized workflows.", "title": "MolViBench: Evaluating LLMs on Molecular Vibe Coding", "year": 2026, "date": "2026-05-04", "url": "https://doi.org/10.48550/arxiv.2605.02351", "authors": "Jiatong Li et al.", "fromTitle": false, "field": "Pharmacology, Toxicology and Pharmaceutics", "inSet": 0, "sense": "S1"}, {"id": "E123", "text": "In the briefest sense, we can consider context engineering to be like a search platform, prompt engineering like a structured search strategy, and vibe coding like a search engine input.", "title": "Information Specialist Roles in the Era of Large Language Models: Prompting Continued Professional Development", "year": 2026, "date": "2026-05-11", "url": "https://doi.org/10.1177/18911803261449731", "authors": "Hannah O’Keefe et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E124", "text": "Agentic Agile-V: From Vibe Coding to Verified Engineering in Software and Hardware Development", "title": "Agentic Agile-V: From Vibe Coding to Verified Engineering in Software and Hardware Development", "year": 2026, "date": "2026-05-19", "url": "https://doi.org/10.48550/arxiv.2605.20456", "authors": "Christopher Koch", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E125", "text": "This study examines an AI-mediated, game-making course grounded in the emerging “vibe coding” paradigm, where 24 novice PSTs iteratively constructed programs through natural language prompting.", "title": "From Prompt to Play: Examining Computational Thinking Through Vibe Coding in Game Making for Pre-Service Teacher Education", "year": 2026, "date": "2026-05-21", "url": "https://doi.org/10.3390/mti10050057", "authors": "Νικόλαος Πέλλας", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E126", "text": "“Vibe coding”—where users describe applications in natural language and AI agents autonomously handle all implementation—has rapidly emerged as a mainstream development paradigm.", "title": "ViBench: A Benchmark on Vibe Coding", "year": 2026, "date": "2026-05-22", "url": "https://doi.org/10.1145/3786335.3813162", "authors": "Peter Yong Zhong et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E127", "text": "Agent 4: Teamwork and Collaboration for Vibe-Coding", "title": "Agent 4: Teamwork and Collaboration for Vibe-Coding", "year": 2026, "date": "2026-05-22", "url": "https://doi.org/10.1145/3786335.3813211", "authors": "Peter Yong Zhong et al.", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E128", "text": "The adoption of Generative AI (GenAI) in software development is currently dominated by the discussion of “vibe coding,” in which developers describe the desired functionality in natural language and let large language models generate the corresponding code with minimal review.", "title": "Extending AI-Assisted Software Development Beyond Vibe Coding", "year": 2026, "date": "2026-05-22", "url": "https://doi.org/10.1007/978-3-032-27096-2_11", "authors": "Siniša Nešković et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E129", "text": "AI code generation tools have expanded software creation beyond professional developers, giving rise to vibe coding, a practice in which users generate software via natural-language prompts, evaluate outputs primarily by execution.", "title": "From Prompting to Verification: How Experience Shapes Vibe Coding Practices", "year": 2026, "date": "2026-05-23", "url": "https://doi.org/10.48550/arxiv.2605.24521", "authors": "Ahmed Fawzy et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E130", "text": "We evaluate 40 LLM-coded agents (by a wide range of state-of-the-art LLMs under multiple prompting methodologies, including vibe coding) against 17 human-coded agents developed before the advent of LLMs.", "title": "Can Vibe Coding Beat Graduate CS Students? An LLM vs. Human Coding Tournament on Market-driven Strategic Planning", "year": 2026, "date": "2026-05-24", "url": "https://doi.org/10.65109/seot8410", "authors": "Panayiotis Danassis et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E131", "text": "All six SFMs were built by a domain expert with no programming experience using vibe coding - natural-language-directed AI coding agents - with numerical claims independently verified by an orthogonal AI auditor.", "title": "Vibe Coding Specificity Foundation Models", "year": 2026, "date": "2026-06-04", "url": "https://doi.org/10.64898/2026.06.04.730134", "authors": "Sai T. Reddy", "fromTitle": false, "field": "Pharmacology, Toxicology and Pharmaceutics", "inSet": 0, "sense": "S1"}, {"id": "E132", "text": "The analysis further identifies a shift from instruction-based to intent-based development, influenced by emerging trends such as agentic-AI and “vibe coding”.", "title": "The democratization of software engineering: evolution, definition, and the future of low-code and no-code platforms", "year": 2026, "date": "2026-06-08", "url": "https://doi.org/10.1007/s11301-026-00603-2", "authors": "Adrian Abendroth", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E133", "text": "Large language models generate code from natural language prompts, enabling \"vibe coding,\" which allows non-programmers to develop computational solutions.", "title": "A Guiding Framework for K-12 Teachers in Creating AI-powered Learning Technologies through Vibe Coding", "year": 2026, "date": "2026-06-09", "url": "https://doi.org/10.48550/arxiv.2607.05406", "authors": "Yukyeong Song et al.", "fromTitle": false, "field": "Social Sciences", "inSet": 0, "sense": "S1"}, {"id": "E134", "text": "In software engineering, vibe-coding -a conversational paradigm for iteratively co-developing solutions with AI-has shown both productivity gains and risks of cognitive offloading.", "title": "Let the vibe be with you: A paradigm shift in statistics education?", "year": 2026, "date": "2026-06-12", "url": "https://doi.org/10.1007/s11135-026-02898-5", "authors": "Fernando Marmolejo‐Ramos et al.", "fromTitle": false, "field": "Mathematics", "inSet": 0, "sense": "S1"}, {"id": "E135", "text": "Generative artificial intelligence (genAI) enables educators to build custom learning tools, but the feasibility and impact of educator-driven, AI-assisted development (“vibe coding”) in medical education remain unclear.", "title": "Harnessing “Vibe Coding” to Rapidly Develop Tailored Educational Apps: A Generative AI-Driven ECG Interpretation Tool in Medical Education", "year": 2026, "date": "2026-06-16", "url": "https://doi.org/10.3390/ai7060223", "authors": "Ibrahim Al Janabi et al.", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S1"}, {"id": "E136", "text": "Unlike the prevailing fraction-of-tasks-solved metric, this matches real vibe-coding where sessions run dozens or hundreds of turns.", "title": "StaminaBench: Stress-Testing Coding Agents over 100 Interaction Turns", "year": 2026, "date": "2026-06-17", "url": "https://doi.org/10.48550/arxiv.2606.19613", "authors": "Vlad Sobal et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E137", "text": "Generative AI is reshaping product design practices through “vibe coding”, where product team members express intent in natural language and AI translates it into functional prototypes and code.", "title": "Vibe Coding in Product Teams: Reconfiguring AI-Assisted Workflows, Prototyping, and Collaboration", "year": 2026, "date": "2026-06-19", "url": "https://doi.org/10.1145/3808045.3808062", "authors": "Jie Li et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S1"}, {"id": "E138", "text": "Vibe coding -- accepting LLM-generated source from natural-language intent with minimal review -- is fast and may be adequate for low-criticality consumer software.", "title": "Formal-Method-Guided Vibe Coding: Closing the Verification Loop on AI-Generated Safety-Critical Software Through Model-Driven Engineering", "year": 2026, "date": "2026-06-21", "url": "https://doi.org/10.48550/arxiv.2606.22413", "authors": "Ran Wei et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E139", "text": "Recent advances in large language models (LLMs) have enabled vibe coding, an emerging software development paradigm in which users create applications primarily through natural-language interactions with AI agents.", "title": "Understanding the (In)Security of Vibe-Coded Applications", "year": 2026, "date": "2026-06-22", "url": "https://doi.org/10.48550/arxiv.2606.23130", "authors": "Junquan Deng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E140", "text": "Unpacking Vibe Coding: Help-Seeking Processes in Student-AI Interactions While Programming", "title": "Unpacking Vibe Coding: Help-Seeking Processes in Student-AI Interactions While Programming", "year": 2026, "date": "2026-06-26", "url": "https://doi.org/10.1007/978-3-032-29763-1_35", "authors": "Daiana Rinja et al.", "fromTitle": true, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E141", "text": "Large language models (LLMs) are reshaping software engineering by enabling vibe coding—building software primarily through prompts rather than writing code.", "title": "Building Software by Rolling the Dice: A Qualitative Study of Vibe Coding", "year": 2026, "date": "2026-06-30", "url": "https://doi.org/10.1145/3797105", "authors": "Yi-Hung Chou et al.", "fromTitle": false, "field": "Computer Science", "inSet": 4, "sense": "S1"}, {"id": "E142", "text": "In February 2025, as we were delivering an upper-level undergraduate course on Software Engineering in our university, the term vibe coding emerged and quickly became popularized, referring to a practice in which developers describe a project or task in a prompt to an AI model that then generates code artifacts automatically.", "title": "From Specifications to Implementation in the Gen-AI Era: Lessons from a Project-Based Software Engineering Course", "year": 2026, "date": "2026-06-30", "url": "https://doi.org/10.1145/3797092", "authors": "Yingying Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E143", "text": "Vibe coding is a software development approach that intensively leverages Large Language Models (LLMs), where developers act as directors and validators rather than direct code writers.", "title": "Vibe Coding dengan Paradigma Baru Pengembangan Perangkat Lunak Berbasis Kecerdasan Buatan dan Implikasinya terhadap Produktivitas dan Kualitas Kode", "year": 2026, "date": "2026-07-01", "url": "https://doi.org/10.55606/jitek.v6i2.11168", "authors": "Joko Yuwono et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E144", "text": "AI-assisted software development approaches, such as vibe coding, enable rapid code generation but lack the governance and reliability required for sustaining engineering in enterprise software.", "title": "ATeam: Governance-Aware LLM-Assisted Software Sustaining Engineering for Enterprise Systems", "year": 2026, "date": "2026-07-01", "url": "https://doi.org/10.1109/icecet65726.2026.11633274", "authors": "Salvatore Vella et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E145", "text": "EmbodiedGen V2 addresses this gap through a unified sim-ready representation that connects cross-simulator assets, interaction affordances, task-driven worlds, large-scale multi-room scenes, and stateful Vibe Coding into a generative, editable, and reusable simulation pipeline.", "title": "EmbodiedGen V2: An Agentic, Simulation-Ready 3D World Engine for Embodied AI", "year": 2026, "date": "2026-07-08", "url": "https://doi.org/10.48550/arxiv.2607.07459", "authors": "Xinjie Wang et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E146", "text": "O relato conclui com uma análise do fenômeno do vibe coding como horizonte que radicaliza a tensão original, reforçando o argumento de que a formação do raciocínio computacional permanece indispensável porque é ela que confere ao desenvolvedor agência sobre as ferramentas que o cercam.", "title": "Ensinar algoritmos na era da inteligência artificial generativa: um relato de experiência docente no ensino superior tecnológico", "year": 2026, "date": "2026-07-09", "url": "https://doi.org/10.5281/zenodo.21285769", "authors": "William Corrêa Mendes et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E147", "text": "Popularly described as \"vibe coding,\" this informal practice refers to building applications, interfaces, automations, or prototypes by describing desired outcomes conversationally and revising outputs until they function as intended.", "title": "Vibe coding in nursing education: From user to creator", "year": 2026, "date": "2026-07-14", "url": "https://doi.org/10.1016/j.nedt.2026.107278", "authors": "Rezwana Rahman", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S1"}, {"id": "E148", "text": "Two paradigms have emerged: vibe coding, an intuition-driven approach accepting AI artifacts via observed behavior, and Specification-Driven Development (SDD), which uses structured specifications as the authoritative source of truth.", "title": "Specification-Driven Development as the Foundation of AI-Native Enterprise Software Engineering", "year": 2026, "date": "2026-07-18", "url": "https://doi.org/10.48550/arxiv.2607.16680", "authors": "Mamdouh Alenezi", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S2"}, {"id": "E149", "text": "The recent emergence of vibe-coding workflows is changing what coding agents are expected to do.", "title": "ICAE-Bench: Evaluating Coding Agents as Interactive Project Builders", "year": 2026, "date": "2026-07-23", "url": "https://doi.org/10.48550/arxiv.2607.21217", "authors": "Zhongyuan Peng et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E150", "text": "Background: Vibe coding-generating software through natural-language prompts to large language models without reviewing the underlying code-has moved rapidly from consumer technology into peer-reviewed clinical applications.", "title": "The VIBE-HI framework: a conceptual model for evaluating vibe coding appropriateness, quality, and safety in health informatics", "year": 2026, "date": "2026-07-23", "url": "https://doi.org/10.3389/frai.2026.1882814", "authors": "Ahmed Alqheedan et al.", "fromTitle": false, "field": "Medicine", "inSet": 0, "sense": "S2"}, {"id": "E151", "text": "In vibe coding, people describe software in natural language and delegate implementation to AI agents.", "title": "Agentic Commerce World: An Auditable and Verifiable Environment for Vibe Commerce", "year": 2026, "date": "2026-08-03", "url": "https://doi.org/10.48550/arxiv.2608.02441", "authors": "Shicheng Fan et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E152", "text": "Vibe Coding is a generative AI–based programming approach that may support novice learners who lack confidence in their programming abilities, particularly given the cognitive demands of traditional coding.", "title": "The impact of vibe coding on students’ programming self-efficacy and attitudes toward artificial intelligence", "year": 2026, "date": "2026-08-21", "url": "https://doi.org/10.1038/s41598-026-67799-x", "authors": "Emrah Emirtekin et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E153", "text": "Context: Software engineering is moving from AI-assisted practices like vibe coding, in which assistants accelerate individual developers, towards Agentic Software Engineering (ASE), in which autonomous agents are delegated goal-level tasks.", "title": "Spec-Driven Development for Agentic Software Engineering: Harnessing Human-Agent Teamwork", "year": 2026, "date": "2026-08-31", "url": "https://doi.org/10.48550/arxiv.2609.00252", "authors": "Jessica Diaz et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E154", "text": "Generative AI enables rapid “vibe coding\" and agentic software engineering, where natural language prompts yield working software systems.", "title": "Lost in Code Generation: Reimagining the Role of Software Models in AI-driven Software Engineering", "year": 2026, "date": "2026-09-11", "url": "https://doi.org/10.1145/3822455.3838778", "authors": "Jürgen Cito et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E155", "text": "However, most vibe-coding systems focus on completing small tasks and incremental code changes, leaving persistent, continuous software development largely unexplored.", "title": "TheBotCompany: Self-Organizing Multi-agent Systems for Continuous Software Development", "year": 2026, "date": "2026-10-07", "url": "https://doi.org/10.1145/3832783.3834358", "authors": "Wenhan Lyu et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E156", "text": "Objective This exploratory study aims to investigate how humans and CLLMs can collaborate as peers through vibe coding, an approach that integrates principles from prompt engineering, agile design, and human-AI co-creation to enhance collaboration.", "title": "Vibe Coding: An experiment with test-driven development", "year": 2026, "date": "2026-10-09", "url": "https://doi.org/10.1007/s10664-026-10950-z", "authors": "Moritz Mock et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S3"}, {"id": "E157", "text": "A user study demonstrates a change in people’s behavior and cognitive strategies when rules are at the forefront of vibe coding.", "title": "Zoro: Active Controls to Support Rule Following in Vibe Coding", "year": 2026, "date": "2026-10-31", "url": "https://doi.org/10.1145/3830398.3830629", "authors": "Jenny Ma et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}, {"id": "E158", "text": "While large language models (LLMs) have accelerated traditional software development through intent-driven “vibe coding”, prototyping intelligent Extended Reality (XR) experiences remains a major challenge.", "title": "Vibe Coding XR: Accelerating AI + XR Prototyping with XR Blocks and Gemini", "year": 2026, "date": "2026-11-14", "url": "https://doi.org/10.1145/3822517.3848668", "authors": "Ruofei Du et al.", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S1"}], "total": 906, "model": "claude-opus-5-5", "generated": "2026-11-17", "lang": "en", "meaning": "", "focus": "This timeline follows 'vibe coding' as the practice of building software by prompting large language models or AI agents in natural language, rather than writing code by hand.", "otherSenses": [], "senses": [{"key": "S1", "label": "Conversational AI programming", "definition": "Developing software by describing intent in natural language to LLMs or coding agents that generate and refine the code.", "related": true}, {"key": "S2", "label": "Minimal-review vibe coding", "definition": "A narrower reading: accepting AI-generated code and judging it by observed behavior, without reading or understanding the code.", "related": true}, {"key": "S3", "label": "Pedagogical/design framework", "definition": "Vibe coding recast as a named teaching approach or clinician-led design framework for building educational tools with AI.", "related": true}, {"key": "S4", "label": "Emotion/intuition-driven coding", "definition": "Programming in which users convey qualitative 'vibes', feelings or tone, along with intent, and AI turns them into code.", "related": true}, {"key": "S5", "label": "Vibe-X analogues", "definition": "Coinages modeled on vibe coding for other fields, such as vibe-hacking, vibe science, vibe researching, vibe caring, vibe AIGC and vibe-governance.", "related": true}], "evidenceCount": 158, "eras": [{"start": 2025, "end": 2025, "label": "Coinage and first definitions", "meaning": "A newly named practice of programming by conversing with LLMs, defined in early reviews and quickly tried in education, medicine and prototyping.", "evidence": [{"id": "E42", "text": "Vibe coding, a term coined by Andrej Karpathy in February 2025, has quickly become a compelling and controversial natural language programming paradigm in AI-assisted software development.", "title": "Good Vibrations? A Qualitative Study of Co-Creation, Communication, Flow, and Trust in Vibe Coding", "year": 2025, "date": "2025-09-15", "url": "https://doi.org/10.48550/arxiv.2509.12491", "authors": "Veronica Pimenova et al.", "fromTitle": false, "field": "Computer Science", "inSet": 10, "sense": "S1"}, {"id": "E31", "text": "We examine \"vibe coding\": an emerging programming paradigm where developers primarily write code by interacting with code-generating large language models rather than writing code directly.", "title": "Vibe coding: programming through conversation with artificial intelligence", "year": 2025, "date": "2025-06-29", "url": "https://doi.org/10.48550/arxiv.2506.23253", "authors": "Advait Sarkar et al.", "fromTitle": false, "field": "Computer Science", "inSet": 23, "sense": "S1"}, {"id": "E26", "text": "Vibe coding-where high-level natural-language directives orchestrate end-to-end software creation-has emerged as a transformative paradigm in modern development.", "title": "A Review on Vibe Coding: Fundamentals, State-of-the-art, Challenges and Future Directions", "year": 2025, "date": "2025-05-09", "url": "https://doi.org/10.36227/techrxiv.174681482.27435614/v1", "authors": "Partha Pratim Ray", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S1"}, {"id": "E29", "text": "This review presents a comprehensive analysis of two emerging paradigms in AI-assisted software development: vibe coding and agentic coding.", "title": "Vibe Coding vs. Agentic Coding: Fundamentals and Practical Implications of Agentic AI", "year": 2025, "date": "2025-05-26", "url": "https://doi.org/10.48550/arxiv.2505.19443", "authors": "Ranjan Sapkota et al.", "fromTitle": false, "field": "Computer Science", "inSet": 22, "sense": "S1"}, {"id": "E36", "text": "The invention of Generative AI and Large Language Models has recently given rise to \"vibe coding\" as a new paradigm of software development in which developers use natural language to state their high-level intent rather than writing or even being aware of the computer code.", "title": "What is Vibe coding and when should you use it (or not)?", "year": 2025, "date": "2025-08-07", "url": "https://doi.org/10.36227/techrxiv.175459780.03758839/v1", "authors": "Marko Horvat", "fromTitle": false, "field": "Computer Science", "inSet": 5, "sense": "S2"}, {"id": "E24", "text": "To address these challenges, we introduce vibe coding, a novel AI-assisted, no-code development approach that enables educators to create interactive, customisable learning simulations without programming expertise.", "title": "From technology adopters to creators: Leveraging AI-assisted vibe coding to transform clinical teaching and learning", "year": 2025, "date": "2025-04-09", "url": "https://doi.org/10.1080/0142159x.2025.2488353", "authors": "Minyang Chow et al.", "fromTitle": false, "field": "Social Sciences", "inSet": 20, "sense": "S1"}, {"id": "E30", "text": "Vibe coding is a recent Generative AI innovation where a human operator provides conversational natural language description of a problem and an AI assistant writes the code to develop a solution.", "title": "Generative AI Vibe Coding for Prototyping Industrial Systems", "year": 2025, "date": "2025-06-20", "url": "https://doi.org/10.1109/isie62713.2025.11124737", "authors": "Daswin De Silva et al.", "fromTitle": false, "field": "Computer Science", "inSet": 3, "sense": "S1"}, {"id": "E49", "text": "This paper introduces vibe coding, an emerging AI-native programming paradigm in which a developer specifies high-level functional intent along with qualitative descriptors of the desired \"vibe\" (tone, style, or emotional resonance).", "title": "Vibe Coding: Toward an AI-Native Paradigm for Semantic and Intent-Driven Programming", "year": 2025, "date": "2025-10-09", "url": "https://doi.org/10.48550/arxiv.2510.17842", "authors": "Vinay Bamil", "fromTitle": false, "field": "Computer Science", "inSet": 0, "sense": "S4"}]}, {"start": 2026, "end": 2026, "label": "Mainstream practice under scrutiny", "meaning": "A mainstream, often agent-driven, minimal-review development mode that is benchmarked for security, criticized for its effects on quality and open source, and framed as a stage to move past toward agentic or specification-driven engineering.", "evidence": [{"id": "E97", "text": "Vibe coding is the practice where coders rely on AI code generation tools through intuition and trial-and-error without necessarily understanding the underlying code.", "title": "Vibe Coding in Practice: Motivations, Challenges, and a Future Outlook – a Grey Literature Review", "year": 2026, "date": "2026-04-12", "url": "https://doi.org/10.1145/3786583.3786866", "authors": "Ahmed Fawzy et al.", "fromTitle": false, "field": "Computer Science", "inSet": 14, "sense": "S2"}, {"id": "E116", "text": "We find that coding patterns are bimodal: in 41% of sessions, agents author virtually all committed code (\"vibe coding\"), while in 25%, humans write all code themselves.", "title": "SWE-chat: Coding Agent Interactions From Real Users in the Wild", "year": 2026, "date": "2026-04-22", "url": "https://doi.org/10.48550/arxiv.2604.20779", "authors": "Joachim Baumann et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E126", "text": "“Vibe coding”—where users describe applications in natural language and AI agents autonomously handle all implementation—has rapidly emerged as a mainstream development paradigm.", "title": "ViBench: A Benchmark on Vibe Coding", "year": 2026, "date": "2026-05-22", "url": "https://doi.org/10.1145/3786335.3813162", "authors": "Peter Yong Zhong et al.", "fromTitle": false, "field": "Computer Science", "inSet": 1, "sense": "S2"}, {"id": "E63", "text": "SecureVibeBench: Benchmarking Secure Vibe Coding of AI Agents via Reconstructing Vulnerability-Introducing Scenarios", "title": "SecureVibeBench: Benchmarking Secure Vibe Coding of AI Agents via Reconstructing Vulnerability-Introducing Scenarios", "year": 2026, "date": "2026-01-01", "url": "https://doi.
